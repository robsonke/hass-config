- id: '1684057104240'
  alias: Pool - Switch heating between silent and super silent
  description: Based on the target temperature and current temperature, move to silent
    or super silent mode.
  triggers:
  - trigger: state
    entity_id:
    - sensor.fairland_zwembad_wpu_temp_inlet
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - number.fairland_zwembad_wpu_target_temperature_heating
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.cheapest_16_hours_24h
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  conditions:
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  actions:
  - choose:
    - conditions:
      # Was the same arithmetic inline, via
      # `states.number.X.state | int(default=0) - states.sensor.Y.state | int(default=0)`.
      # Two problems: object access raises if an entity is missing, and int(default=0)
      # turns an unavailable source into 0 - the exact trap documented on
      # sensor.pool_heating_temperature_diff in pkg_pool.yaml, which already computes
      # this difference WITH an availability guard. Reusing it means an unavailable
      # source makes this condition false instead of silently reading as a 0 diff.
      - condition: numeric_state
        entity_id: sensor.pool_heating_temperature_diff
        above: 0
        alias: If we are about to get close to the target temperature
      sequence:
      - action: select.select_option
        metadata: {}
        data:
          option: Super Silence
        target:
          entity_id: select.fairland_zwembad_wpu_power_mode
    default:
    - action: select.select_option
      metadata: {}
      data:
        option: Silence
      target:
        entity_id: select.fairland_zwembad_wpu_power_mode
  mode: restart
- id: '1684057174715'
  alias: Pool - Alert when ph or redox values are not oke
  description: ''
  triggers:
  # No `for:` on the sensor trigger - it used to be all zeros, which reads as a
  # debounce but is a no-op. Alerting immediately is fine: the 16-hour cooldown
  # condition below is what stops this from repeating.
  - trigger: state
    entity_id:
    - sensor.eps_pool_ph_level
    - sensor.eps_pool_rx_level
  # Matches the pump condition below, so the automation re-evaluates exactly when
  # the settling window closes. A bare state trigger on the pump could never
  # satisfy that condition at the moment it fired, and relying on the next ph/rx
  # update to notice made alerting depend on how chatty those sensors happen to
  # be.
  - trigger: state
    entity_id: binary_sensor.pool_pump_active
    to: 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  # `for:` is the whole point here. On a cold start the ph/rx probes still hold
  # yesterday's reading - or read nonsense because there is no flow past them yet
  # - and they only settle once water has circulated. Without the window every
  # morning produced a false "waardes niet in orde" notification that had
  # corrected itself by the time it was read.
  - alias: Pump has been running for 30 minutes
    condition: state
    entity_id: binary_sensor.pool_pump_active
    state: 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  # There used to be a sibling branch alerting when the pump had been *off* for
  # 30 minutes. It was deliberately dropped: this automation is about water
  # chemistry, and a stopped pump is a different problem wanting a different
  # message.
  - alias: Chemistry or sensors not oke
    condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.eps_pool_ph_level
      above: 8.5
    - condition: numeric_state
      entity_id: sensor.eps_pool_ph_level
      below: 6
    - condition: numeric_state
      entity_id: sensor.eps_pool_rx_level
      above: 850
    - condition: numeric_state
      entity_id: sensor.eps_pool_rx_level
      below: 500
    - condition: state
      entity_id: sensor.eps_pool_ph_level
      state: unavailable
      for:
        hours: 0
        minutes: 30
        seconds: 0
    - condition: state
      entity_id: sensor.eps_pool_rx_level
      state: unavailable
      for:
        hours: 0
        minutes: 30
        seconds: 0
  - condition: template
    alias: Not alerted in the last 16 hours
    # `as_timestamp(..., 0)` supplies the default the old version lacked - with
    # no default it raises when last_triggered is None, which is the state after
    # this automation is renamed or recreated, and would then block it for good.
    # `this` instead of the hardcoded states.automation.pool_alert_... path so a
    # rename cannot silently detach the cooldown from its own automation.
    value_template: >
      {{ this is not defined
         or (as_timestamp(now())
             - as_timestamp(this.attributes.last_triggered, 0)) | int > 57600 }}
  actions:
  - action: persistent_notification.create
    data:
      notification_id: pool_alert_when_ph_or_redox_values_are_not_oke
      title: Zwembad waardes
      message: "\U0001F3CA De ph/orp waardes van het zwembad zijn niet in orde."
  mode: single
- id: '1684059527700'
  alias: Energy - Alert when one of the three phases is high
  description: Keep an eye on using too much power for too long
  triggers:
  - trigger: numeric_state
    entity_id: sensor.current_phase_1
    for:
      hours: 0
      minutes: 30
      seconds: 0
    above: 25
  - trigger: numeric_state
    entity_id: sensor.current_phase_2
    for:
      hours: 0
      minutes: 30
      seconds: 0
    above: 25
  - trigger: numeric_state
    entity_id: sensor.current_phase_3
    for:
      hours: 0
      minutes: 30
      seconds: 0
    above: 25
  conditions:
  - condition: template
    alias: Niet her-armeerd vanuit unavailable/unknown
    # Een numeric_state-trigger her-armeert na een HA-herstart of sensorblip: de
    # sensor gaat van unavailable naar zijn oude waarde, dat telt als overschrijding
    # en de melding gaat af zonder dat er iets veranderd is.
    value_template: >
      {{ trigger is not defined
         or trigger.from_state is not defined
         or trigger.from_state is none
         or trigger.from_state.state not in ['unknown', 'unavailable'] }}
  actions:
  - action: notify.all_phones
    data:
      message: ⚡ Een van de drie fases zit te lang boven de 25A.
      data:
        persistent: true
        tag: persistent
  mode: single
- id: '1684664004500'
  alias: Pool - Control the locking of the pool cover
  description: When one of us is at home or the guest mode is enabled, keep the deck
    unlocked. Otherwise locked.
  triggers:
  # to:/from: zijn nodig: zonder die filters vuurt een state-trigger ook op
  # attribuut-updates, en person-entities krijgen bij elke GPS-fix nieuwe
  # coordinaten/accuracy. Dat gaf 22 runs en 18 overbodige lock.unlock-calls in
  # vijf uur op een dek dat al open stond.
  - trigger: state
    entity_id:
    - person.rob
    - person.steffi
    to: home
  - trigger: state
    entity_id:
    - person.rob
    - person.steffi
    from: home
  - trigger: state
    entity_id:
    - input_boolean.guest_mode
  # armed_night stond wel in de condities maar niet in de triggers, dus scherp
  # zetten 's nachts vergrendelde het dek niet.
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: armed_night
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    from: armed_night
  conditions:
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'on'
        - condition: numeric_state
          entity_id: zone.home
          above: 0
        alias: Is somebody home or is the guest mode on and aren't we sleeping?
      - condition: not
        conditions:
        - condition: state
          entity_id: alarm_control_panel.alarmo
          state: armed_night
      sequence:
      - action: lock.unlock
        data: {}
        target:
          entity_id: lock.aquadeck_rol_dek
    default:
    - action: lock.lock
      data: {}
      target:
        entity_id: lock.aquadeck_rol_dek
  mode: single
