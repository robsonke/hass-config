- id: '1683057208426'
  alias: Vacuum - Alert Sjorsje offline
  description: Alert when Sjorsje is offline
  triggers:
  # Was a bare state trigger plus a `state: unavailable` condition — the
  # condition was evaluated at trigger time, so it only matched if the very
  # transition that woke it landed on unavailable, and any later flap was missed.
  # This never fired. Now the trigger itself waits for a sustained 10 minutes of
  # unavailable, which also filters brief Wi-Fi dropouts.
  - trigger: state
    entity_id:
    - vacuum.sjorsje
    to: unavailable
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: Sjorsje kwijt
      message: "\U0001F5D1 Sjorsje is onbereikbaar"
  mode: single
- id: '1684057104240'
  alias: Pool - Switch heating between silent and super silent
  description: Based on the target temperature and current temperature, move to silent
    or super silent mode.
  triggers:
  # The Fairland pool entities are regularly unavailable (the unit is powered
  # down out of season), which otherwise woke this automation with no usable
  # readings — see the "invalid number state: unavailable" errors in the log.
  - trigger: state
    entity_id:
    - sensor.fairland_zwembad_wpu_temp_inlet
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - number.fairland_zwembad_wpu_target_temperature_heating
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.cheapest_16_hours_24h
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  conditions:
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states.number.fairland_zwembad_wpu_target_temperature_heating.state
          | int(default=0) - states.sensor.fairland_zwembad_wpu_temp_inlet.state |
          int(default=0) > 0 }}'
        alias: If we are about to get close to the target temperature
      sequence:
      - action: select.select_option
        metadata: {}
        data:
          option: Super Silence
        target:
          entity_id: select.fairland_zwembad_wpu_power_mode
    default:
    - action: select.select_option
      metadata: {}
      data:
        option: Silence
      target:
        entity_id: select.fairland_zwembad_wpu_power_mode
  mode: restart
- id: '1684057174715'
  alias: Pool - Alert when ph or redox values are not oke
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.eps_pool_ph_level
    - sensor.eps_pool_rx_level
    - binary_sensor.pool_pump_active
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  # Alert when EITHER the pump has been off too long, OR the pump is running and
  # a reading is out of range / stale.
  # Previously a single top-level `pool_pump_active: on` condition sat AFTER this
  # OR-list, which contradicted the "pump off for 30 min" branch inside it and
  # made that branch unreachable. Also, `above` + `below` on ONE numeric_state
  # condition is an AND — the pH check required pH > 8.5 AND pH < 6, which is
  # impossible, so the pH branch could never alert either. Both fixed here.
  - condition: or
    conditions:
    # (a) the pump itself is the problem — must NOT require the pump to be on
    - alias: Pump has been off for more than 30 minutes
      condition: state
      entity_id: binary_sensor.pool_pump_active
      state: 'off'
      for:
        hours: 0
        minutes: 30
        seconds: 0
    # (b) chemistry / sensor problems — only meaningful while water circulates
    - alias: Chemistry or sensors not oke while the pump is running
      condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.pool_pump_active
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.eps_pool_ph_level
          above: 8.5
        - condition: numeric_state
          entity_id: sensor.eps_pool_ph_level
          below: 6
        - condition: numeric_state
          entity_id: sensor.eps_pool_rx_level
          above: 850
        - condition: numeric_state
          entity_id: sensor.eps_pool_rx_level
          below: 500
        - condition: state
          entity_id: sensor.eps_pool_ph_level
          state: unavailable
          for:
            hours: 0
            minutes: 30
            seconds: 0
        - condition: state
          entity_id: sensor.eps_pool_rx_level
          state: unavailable
          for:
            hours: 0
            minutes: 30
            seconds: 0
  - condition: template
    value_template: "{% if as_timestamp(now()) | int -\n as_timestamp(states.automation.pool_alert_when_ph_or_redox_values_are_not_oke.attributes.last_triggered)\n
      \     | int > 57600 %} true {% else %} false {% endif %}"
    alias: Only trigger this automation once per 16 hours max
  actions:
  - action: persistent_notification.create
    data:
      title: Zwembad waardes
      message: "\U0001F3CA De ph/orp waardes of flow van het zwembad zijn niet in
        orde."
  mode: single
