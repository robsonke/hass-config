- id: '1716736577091'
  alias: Frigate - AI camera description
  # Deliberately left DISABLED. Renamed from "... / Notification TEST" - it is a
  # complete ai_task feature, not scaffolding. The entity_id stays
  # automation.frigate_generative_ai_notification_test because the registry pins
  # entity_id to the automation id, which is also why disabling it survived the
  # rename. Enabling it will double up with "Alarm - Notify of person events on
  # camera" until the two are reconciled.
  description: ''
  triggers:
  - trigger: mqtt
    topic: frigate/events
    payload: new
    value_template: '{{ value_json.type }}'
  - trigger: mqtt
    topic: frigate/events
    payload: update
    value_template: '{{ value_json.type }}'
  conditions:
  - condition: template
    value_template: '{{ camera_entity != ''camera.evabed'' }}'
    alias: Skip Eva's camera
  - condition: template
    value_template: '{{ camera_entity != ''camera.noabed'' }}'
    alias: Skip Noa's camera
  - condition: template
    value_template: '{{ states(''switch.'' ~ camera_name ~ ''_detect'') == ''on''
      }}'
    alias: Is the detect switch on for that camera?
  - condition: or
    conditions:
    - condition: state
      entity_id: zone.home
      state: '0'
      alias: Are we all away?
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    alias: Are we away or is the night alarm active
  - condition: template
    value_template: >
      {{ this is not defined
         or (as_timestamp(now())
             - as_timestamp(this.attributes.last_triggered, 0)) | int > 20 }}
    alias: Only trigger once per 20 seconds
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  actions:
  - action: ai_task.generate_data
    metadata: {}
    data:
      task_name: frigate_camera_description
      instructions: Very briefly describe what you see in this image from my security
        camera. Your message needs to be short to fit in a phone notification. Don't
        describe stationary objects, plants or buildings. And please answer in Dutch.
      attachments:
        media_content_id: media-source://camera/{{ camera_entity }}
        media_content_type: image/jpeg
    response_variable: generated_content
  - action: input_text.set_value
    metadata: {}
    data:
      value: '{{ generated_content.data }}'
    target:
      entity_id: input_text.camera_analysis
  - action: persistent_notification.create
    data:
      notification_id: frigate_generative_ai_notification_test
      title: Camera
      message: '{{ generated_content.data }} ![image](/api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg)'
  - action: notify.mobile_app_iphone_rob
    data:
      message: ' {{ generated_content.data }} '
      data:
        image: /api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg
        tag: '{{trigger.payload_json["after"]["id"]}}'
        when: '{{trigger.payload_json["after"]["start_time"]|int}}'
        entity_id: '{{ camera_entity }}'
        data:
          url: /ccab4aaf_frigate/ingress
        push:
          category: camera
  variables:
    camera_entity: camera.{{trigger.payload_json["after"]["camera"] | replace("-","_")
      | lower}}
    camera_name: '{{trigger.payload_json["after"]["camera"] | replace("-","_") | lower}}'
  mode: single
