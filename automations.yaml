- id: '1716736577091'
  alias: Frigate / Generative AI / Notification TEST
  description: ''
  triggers:
  - trigger: mqtt
    topic: frigate/events
    payload: new
    value_template: '{{ value_json.type }}'
  - trigger: mqtt
    topic: frigate/events
    payload: update
    value_template: '{{ value_json.type }}'
  conditions:
  - condition: template
    value_template: '{{ camera_entity != ''camera.evabed'' }}'
    alias: Skip Eva's camera
  - condition: template
    value_template: '{{ camera_entity != ''camera.noabed'' }}'
    alias: Skip Noa's camera
  - condition: template
    value_template: '{{ states(''switch.'' ~ camera_name ~ ''_detect'') == ''on''
      }}'
    alias: Is the detect switch on for that camera?
  - condition: or
    conditions:
    - condition: state
      entity_id: zone.home
      state: '0'
      alias: Are we all away?
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    alias: Are we away or is the night alarm active
  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(states.automation.frigate_generative_ai_notification_test.attributes.last_triggered,
      0) | int > 20 }}'
    alias: Only trigger once per 20 seconds
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  actions:
  - action: ai_task.generate_data
    metadata: {}
    data:
      task_name: frigate_camera_description
      instructions: Very briefly describe what you see in this image from my security
        camera. Your message needs to be short to fit in a phone notification. Don't
        describe stationary objects, plants or buildings. And please answer in Dutch.
      attachments:
        media_content_id: media-source://camera/{{ camera_entity }}
        media_content_type: image/jpeg
    response_variable: generated_content
  - action: input_text.set_value
    metadata: {}
    data:
      value: '{{ generated_content.data }}'
    target:
      entity_id: input_text.camera_analysis
  - action: persistent_notification.create
    data:
      title: Camera
      message: '{{ generated_content.data }} ![image](http://192.168.0.40:8123/api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg)'
  - action: notify.mobile_app_iphone_rob
    data:
      message: ' {{ generated_content.data }} '
      data:
        image: http://192.168.0.40:8123/api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg
