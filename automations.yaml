- id: '1735328989280'
  alias: HVAC - Check and reset the target temp of heat pump
  description: Temporary automation, something overrules the target temperature and
    keeps us cold. Most likely a race condition.
  triggers:
  - trigger: state
    entity_id:
    - climate.warmtepomp
    attribute: temperature
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  # Was a template wrapped in literal apostrophes ('''{{ ... }}''') AND disabled,
  # so the automation ran UNCONDITIONALLY and posted a notification on every
  # target change. It also only ever compared against the WINTER target, while
  # the actions below pick winter/summer based on select.operation_mode — so the
  # guard is now mode-aware and matches what the actions actually do.
  - condition: template
    value_template: >
      {% set current = state_attr('climate.warmtepomp', 'temperature') | float(0) %}
      {% set wanted = (states('input_number.hvac_winter_target_temperature') | float(0))
                      if is_state('select.operation_mode', 'heating')
                      else (states('input_number.hvac_summer_target_temperature') | float(0)) %}
      {{ (current - wanted) | abs > 0.01 }}
  actions:
  - action: persistent_notification.create
    metadata: {}
    data:
      message: Target heatpump temp differs from settings, try resetting in one minute
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - choose:
    - conditions:
      - condition: state
        entity_id: select.operation_mode
        state: heating
      sequence:
      - action: climate.set_temperature
        data_template:
          temperature: '{{ states(''input_number.hvac_winter_target_temperature'')
            | float }}'
        target:
          entity_id: climate.warmtepomp
        alias: Heat - Set temperature to the winter target during the day
    - conditions:
      - condition: state
        entity_id: select.operation_mode
        state: cooling
      sequence:
      - action: climate.set_temperature
        data_template:
          temperature: '{{ states(''input_number.hvac_summer_target_temperature'')
            | float }}'
        target:
          entity_id: climate.warmtepomp
        alias: Cool - Set temperature to the summer target
    alias: Set the right target temperature, depending on season
  mode: single
- id: '1735414213615'
