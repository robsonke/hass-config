- id: '1659861088978'
  alias: Screens - Close screens zijraam on warm sunny days
  description: In case it's warm and sunny, close the screens in the morning but the
    one on the side a bit later
  triggers:
  # sun swings onto the west façade
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 200
  - trigger: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 1200
    for:
      minutes: 5
  - trigger: time_pattern
    minutes: /15
  conditions:
  # ZIJRAAM faces WEST → it only gets sun from mid-afternoon until the sun goes
  # behind the western obstacles, so it closes LATER than the south-facing
  # voorraam (azimuth 200 ≈ 14:45 in July, vs ~09:00 for the front).
  #
  # Azimuth threshold was 210 (≈15:15) but the sun already crept round the
  # reveal for the last half hour before that. The sun tracks ~19°/h here in
  # the afternoon, so 210 → 200 buys roughly 30 minutes.
  #
  # The elevation floor was 3° on the theory that the low, late sun is the worst
  # glare. In practice the sun is already behind the treeline/houses by ~6.5°,
  # so below that there is nothing to shade and the screen was staying down for
  # a good half hour of shade. Floor is now 7° — deliberately just ABOVE the
  # open automation's 6.5° trigger, so the two have a 0.5° deadband and cannot
  # close/open each other in a loop.
  - condition: state
    entity_id: cover.zijraam
    state: open
  # sun is on the west face
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 200
    below: 305
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 7
  - condition: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 1200
  - condition: numeric_state
    entity_id: sensor.today_maximum_temperature
    above: '20'
  - condition: state
    entity_id: sensor.rate_rain_piezo
    state: '0.0'
  - condition: state
    entity_id: input_boolean.enable_automatic_screens
    state: 'on'
  actions:
  - action: notify.all_phones
    data:
      message: ☀️ De screens aan de zijkant gaan dicht
      data:
        persistent: true
        tag: persistent
  - action: cover.close_cover
    data: {}
    target:
      entity_id: cover.zijraam
  mode: single
- id: '1659880318627'
  alias: Pool - Control the Pool Heatpump
  description: Turn on the pool heat pump and choose a run mode (normal/silent/super
    silent) based on need and energy pricing and outdoor temperature
  triggers:
  # not_to/not_from filters: both of these sensors drop to unavailable on every
  # integration reload (~9x/24h). Without the filter this automation woke up on
  # those transitions and picked the pump's power mode from garbage values.
  - trigger: state
    entity_id: sensor.today_maximum_temperature
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.pool_pump_active
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    entity_id: sensor.pool_heating_temperature_diff
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.cheapest_16_hours_24h
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    entity_id:
    - binary_sensor.pool_pump_active
    to:
    - 'on'
    from:
    - 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  - condition: state
    entity_id: binary_sensor.cheapest_16_hours_24h
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.today_maximum_temperature
    above: 15
  - condition: state
    entity_id: binary_sensor.pool_pump_active
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.cheapest_16_hours_24h
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.today_maximum_temperature
        above: 14
      - condition: state
        entity_id: binary_sensor.pool_pump_active
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.pool_heating_temperature_diff
        above: 1
      sequence:
      - action: switch.turn_on
        data: {}
        target:
          entity_id: switch.fairland_zwembad_wpu_aan_uit_schakelaar
      - choose:
        - conditions:
          - alias: If we are about to get close to the target temperature
            condition: numeric_state
            entity_id: sensor.pool_heating_temperature_diff
            above: 4
          sequence:
          - action: select.select_option
            metadata: {}
            data:
              option: Normal
            target:
              entity_id: select.fairland_zwembad_wpu_power_mode
        - conditions:
          - alias: If we are about to get closer to the target temperature
            condition: numeric_state
            entity_id: sensor.pool_heating_temperature_diff
            above: 2
          sequence:
          - action: select.select_option
            metadata: {}
            data:
              option: Silence
            target:
              entity_id: select.fairland_zwembad_wpu_power_mode
        default:
        - action: select.select_option
          metadata: {}
          data:
            option: Super Silence
          target:
            entity_id: select.fairland_zwembad_wpu_power_mode
    default:
    - action: switch.turn_off
      data: {}
      target:
        entity_id: switch.fairland_zwembad_wpu_aan_uit_schakelaar
  mode: single
  max_exceeded: silent
  trace:
    stored_traces: 50
- id: '1661977922126'
  alias: HVAC - Control Operation Mode downstairs
  description: 'Set the HVAC mode (heat/cool/off) for the heat pump. By default off,
    cooling when it is expected to be hot outside and also becoming hotter inside,
    heating when the indoor temperature is low and outside also getting cooler.

    This still doesn''t mean that the pump would start, it will still use its indoor
    sensors. And even when it does turn on, other automations might stop that, based
    on the heating and cooling input booleans.'
  triggers:
  # sensor.downstairs_temperature is a min_max sensor that flaps to unavailable
  # when one of its source sensors drops out; filter those transitions out.
  - trigger: state
    entity_id:
    - sensor.downstairs_temperature
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  condition: []
  actions:
  - choose:
    - conditions:
      # NOTE: this was a template comparing states() STRINGS, i.e. a
      # lexicographic compare — "9.5" < "20.0" is False, so heating was silently
      # skipped at single-digit temperatures. numeric_state compares numbers and
      # accepts an entity_id as the threshold.
      - alias: Confirm if the temperature is below the minimum allowed temperature
        condition: numeric_state
        entity_id: sensor.downstairs_temperature
        below: input_number.hvac_heating_limit
      - condition: numeric_state
        entity_id: sensor.today_maximum_temperature
        below: 18
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.warmtepomp
          attribute: hvac_action
          state: heating
        alias: Action should not be set to heating already
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.warmtepomp
        data:
          hvac_mode: heat
        alias: Set HVAC to heating
      - action: select.select_option
        data:
          option: heating
        target:
          entity_id: select.operation_mode
    - conditions:
      # Here above+below on one condition is CORRECT — it's a genuine range
      # (heating_limit < temp < cooling_limit), which is AND semantics.
      - alias: Confirm if the temperature is below the maximum and above the minimum
          allowed temperature
        condition: numeric_state
        entity_id: sensor.downstairs_temperature
        above: input_number.hvac_heating_limit
        below: input_number.hvac_cooling_limit
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.warmtepomp
          attribute: hvac_action
          state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.warmtepomp
        data:
          hvac_mode: 'off'
        alias: Turn HVAC off
    - conditions:
      - alias: Confirm if the temperature is above the maximum allowed temperature
        condition: numeric_state
        entity_id: sensor.downstairs_temperature
        above: input_number.hvac_cooling_limit
      - condition: numeric_state
        entity_id: sensor.today_maximum_temperature
        above: '24'
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.warmtepomp
          attribute: hvac_action
          state: cooling
        alias: Action should not be set to cooling already
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.warmtepomp
        data:
          hvac_mode: cool
        alias: Set HVAC to cooling
      - action: select.select_option
        data:
          option: cooling
        target:
          entity_id: select.operation_mode
  trace:
    stored_traces: 20
  # This fires ~100x/day (bare state trigger on sensor.downstairs_temperature),
  # so overlapping runs are normal and harmless. Declaring `single` explicitly
  # documents that, and max_exceeded: silent stops the
  # "HVAC - Control Operation Mode downstairs: Already running" warning spam.
  mode: single
  max_exceeded: silent
