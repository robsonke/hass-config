- id: '1736593579794'
  alias: DHW - Correct the target temperature when it goes loko
  description: Temporary automation, something overrules the target temperature and
    keeps us cold. Most likely a race condition.
  triggers:
  - trigger: state
    entity_id:
    - water_heater.domestic_hot_water_tank
    attribute: temperature
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  # Was a template wrapped in literal apostrophes ('''{{ ... }}'''), which
  # rendered "'True'" (quotes included) — cv.boolean rejects that, so the
  # condition was ALWAYS false and this automation never ran. Replaced with a
  # native numeric_state condition, which needs no template at all.
  - condition: numeric_state
    entity_id: water_heater.domestic_hot_water_tank
    attribute: temperature
    above: 46
  actions:
  - action: persistent_notification.create
    metadata: {}
    data:
      message: Target hot water temp above 46 degrees, try resetting in one minute
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - action: water_heater.set_temperature
