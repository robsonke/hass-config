- id: '1706294943705'
  alias: Music - Control sonos bedroom
  description: ''
  triggers:
  - value_template: "{{ \n  is_state_attr('event.hue_tap_switch_master_action', 'event_type',
      'press_release') \n  and \n  is_state_attr('event.hue_tap_switch_master_action',
      'button', 'button_4') \n}}\n"
    trigger: template
  - trigger: state
    entity_id:
    - sensor.hue_tap_switch_master_action_type
    to: rotate
  - trigger: state
    entity_id:
    - sensor.hue_tap_switch_master_action_type
    to: step
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ \n  is_state_attr('event.hue_tap_switch_master_action',
          'event_type', 'press_release') \n  and \n  is_state_attr('event.hue_tap_switch_master_action',
          'button', 'button_4') \n}}\n"
      sequence:
      - alias: If sonos plays, stop, otherwise play radio 2
        choose:
        - conditions:
          - condition: state
            entity_id: media_player.slaapkamer_sonos
            state: playing
            alias: Is sonos playing
          sequence:
          - action: media_player.media_stop
            target:
              entity_id: media_player.slaapkamer_sonos
            data: {}
            alias: Stop playing
        default:
        - alias: Reset the volume
          action: media_player.volume_set
          data:
            volume_level: 0.1
          entity_id: media_player.slaapkamer_sonos
        - alias: Play radio 2 on sonos
          action: media_player.play_media
          data:
            metadata:
              title: NPO Radio 2
              thumbnail: https://upload.wikimedia.org/wikipedia/commons/b/b3/NPO_Radio_2_logo.png
              media_class: music
            extra:
              thumb: https://upload.wikimedia.org/wikipedia/commons/b/b3/NPO_Radio_2_logo.png
              title: NPO Radio 2
            media:
              media_content_id: x-rincon-mp3radio://icecast.omroep.nl/radio2-bb-aac
              media_content_type: music
              metadata: {}
          target:
            entity_id: media_player.slaapkamer_sonos
    - conditions:
      - condition: and
        alias: Is sonos playing and did we turn the knob to the left
        conditions:
        - condition: state
          entity_id: sensor.hue_tap_switch_master_action_direction
          state: left
        - condition: state
          entity_id: media_player.slaapkamer_sonos
          state: playing
      sequence:
      # clamped to 0..1 — with mode: queued below, up to 10 steps can run in a
      # burst and an unclamped value would push volume_set out of range and error
      - action: media_player.volume_set
        target:
          entity_id: media_player.slaapkamer_sonos
        data:
          volume_level: >
            {{ [[(state_attr('media_player.slaapkamer_sonos', 'volume_level')
                  | float(0.1)) - 0.02, 0] | max, 1] | min }}
    - conditions:
      - condition: and
        alias: Is sonos playing and did we turn the knob to the right
        conditions:
        - condition: state
          entity_id: sensor.hue_tap_switch_master_action_direction
          state: right
        - condition: state
          entity_id: media_player.slaapkamer_sonos
          state: playing
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.slaapkamer_sonos
        data:
          volume_level: >
            {{ [[(state_attr('media_player.slaapkamer_sonos', 'volume_level')
                  | float(0.1)) + 0.02, 0] | max, 1] | min }}
  # queued (not `single`): the Hue tap dial emits a burst of rotate/step events
  # (recorder showed 10 in 7 seconds). With `single` every event after the first
  # was dropped, so the volume barely moved and the knob felt dead.
  mode: queued
  max: 10
