- id: '1715282105706'
  alias: Alarm - Interrupt the manual pause in case one of us comes home
  description: This is to avoid that the alarm switches back on after 2 hours and
    freaking us out
  triggers:
  - trigger: numeric_state
    entity_id:
    - zone.home
    above: 0
  # Was: a template asking whether "Alarm - Disable alarm manually" was still
  # running (state_attr(..., 'current') > 0), followed by automation.turn_off
  # (stop_actions) + automation.turn_on to kill its in-flight delay. That hack
  # left the automation switched OFF entirely if HA restarted between the two
  # calls. Cancelling a timer is a first-class operation with no such window.
  conditions:
  - condition: state
    entity_id: timer.alarm_pause
    state: active
    alias: Is the manual alarm pause still running?
  actions:
  # timer.cancel does NOT emit timer.finished, so the re-arm automation stays put
  - action: timer.cancel
    target:
      entity_id:
      - timer.alarm_pause
      - timer.alarm_pause_warning
  mode: single
