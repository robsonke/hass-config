- id: garden_lights_turn_on
  alias: Garden - Turn on garden lights
  description: When it's getting dark and at least after 4 PM, turn on lights in the
    garden
  triggers:
  - entity_id:
    - sensor.light_sensor_garden_illuminance
    below: 12
    trigger: numeric_state
  - at: 07:00
    trigger: time
  - entity_id: sun.sun
    attribute: elevation
    below: '-3'
    trigger: numeric_state
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: time
        after: '16:00'
      - condition: time
        before: '22:55'
      - condition: state
        entity_id: input_boolean.enable_automatic_garden_lights
        state: 'on'
      - condition: state
        entity_id: light.hue_lily_light_fence_1
        state: 'off'
    - alias: In the morning it should be dark enough and not just turned off by the
        other automation
      condition: and
      conditions:
      - condition: time
        after: 06:15
      - condition: time
        before: 08:55
      - condition: state
        entity_id: input_boolean.enable_automatic_garden_lights
        state: 'on'
      - condition: state
        entity_id: light.hue_lily_light_fence_1
        state: 'off'
      # Elke lantaarn telt. Dit stond op alleen lantaarn 1, en een state-
      # conditie faalt zodra die lamp unavailable is - één kapotte lantaarn
      # zette deze hele ochtendtak dus stil terwijl 2 en 3 gewoon brandden.
      - condition: or
        conditions:
        - condition: state
          entity_id: light.garden_lantern_light1
          state: 'on'
        - condition: state
          entity_id: light.garden_lantern_light2
          state: 'on'
        - condition: state
          entity_id: light.garden_lantern_light3
          state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.light_sensor_living_illuminance
          below: 8
        - condition: numeric_state
          entity_id: sun.sun
          attribute: elevation
          below: '-4'
  - condition: state
    entity_id: light.hue_lily_light_fence_1
    state: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  actions:
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id:
      - light.garden_light
  - action: light.turn_on
    data:
      color_temp_kelvin: 2200
    target:
      entity_id:
      - light.palm1_light
      - light.palm2_light
  - action: light.turn_on
    data:
      brightness_pct: 6
    target:
      entity_id: light.woodshed_light
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light1
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light2
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light3
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: light.turn_on
    data:
      brightness_pct: 17
    target:
      entity_id: light.veranda_light
  - action: light.turn_on
    data:
      brightness_pct: 40
    target:
      entity_id: light.lights_wall_shed
  - action: light.turn_on
    data:
      color_temp_kelvin: 2200
    target:
      entity_id: light.hue_lights_garden
  # Achter de seizoensknop: zie input_boolean.kerstverlichting.
  - if:
    - condition: state
      entity_id: input_boolean.kerstverlichting
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.kerst_buiten
      data: {}
  # Marks the start of an "automatisch aan door donker" period for the timeline
  # in the Verlichting tuin pop-up. Cleared by the morning off automation - note
  # the *evening* one only dims the lanterns back to 30%, so the dark stretch
  # runs through the night and must not clear this flag.
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.lights_garden_auto_dark
  mode: single
- id: garden_lights_turn_off
  alias: Garden - Turn off garden lights - morning
  description: Turn off lights in the garden in the morning
  triggers:
  - at: 09:00
    trigger: time
  - entity_id:
    - sensor.light_sensor_garden_illuminance
    above: 10
    for:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.enable_automatic_garden_lights
    state: 'on'
  - condition: template
    alias: Niet her-armeerd vanuit unavailable/unknown
    # De 09:00-tijdtrigger heeft geen from_state en glipt via de eerste
    # clausule ongemoeid door. Een numeric_state-trigger her-armeert na een HA-herstart of sensorblip: de
    # sensor gaat van unavailable naar zijn oude waarde, dat telt als overschrijding
    # en de melding gaat af zonder dat er iets veranderd is.
    value_template: >
      {{ trigger is not defined
         or trigger.from_state is not defined
         or trigger.from_state is none
         or trigger.from_state.state not in ['unknown', 'unavailable'] }}
  actions:
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.veranda_light
      - light.hue_lights_garden
      - light.woodshed_light
      - light.palm1_light
      - light.palm2_light
      - light.lights_wall_shed
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.garden_lantern_light1
      - light.garden_lantern_light2
      - light.garden_lantern_light3
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.garden_light
  # Apart en achter de seizoensknop: zie input_boolean.kerstverlichting.
  - if:
    - condition: state
      entity_id: input_boolean.kerstverlichting
      state: 'on'
    then:
    - action: light.turn_off
      data: {}
      target:
        entity_id:
        - light.kerst_buiten
  # End of the garden dark stretch - it is light enough again.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lights_garden_auto_dark
  mode: single
- id: lights_turn_off_bedtime_manual
  alias: Sleep - Switch to night mode manually
  description: Go to bed switch, turn off all we don't need during the night. Lights,
    music, tv, etc. And turn on the alarm
  triggers:
  - entity_id:
    - alarm_control_panel.alarmo
    from: disarmed
    to: armed_night
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: '21:00:00'
    - condition: time
      before: 05:00
  actions:
  - parallel:
    - action: script.sleep_well
      data: {}
    - sequence:
      - action: light.turn_on
        data:
          brightness_pct: 30
        target:
          entity_id: light.dimmer_hall
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: light.turn_off
        target:
          entity_id: light.dimmer_hall
        data: {}
      alias: Turn on hall light shortly
  # Als if/then, niet als kale conditie in de actielijst: die kapte de hele rest af.
  # De automation mag vanaf 21:00 draaien, dus wie tussen 21:00 en 22:55 naar bed
  # ging kreeg de input_boolean hieronder nooit uitgezet en bleef de timeline
  # "automatisch aan door donker" tonen. after > before laat het venster over
  # middernacht wrappen; dat is hetzelfde bereik als de vorige or-constructie.
  - alias: Turn off the couch and corner light too if it's after 11 pm
    if:
    - condition: time
      after: '22:55:00'
      before: 05:00:00
    then:
    - action: light.turn_off
      target:
        entity_id:
        - light.socket1_light_corner
        - light.socket2_light_couch
      data: {}
  # We went to bed - end of the downstairs dark stretch for the pop-up timeline.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lights_downstairs_auto_dark
  mode: single
- id: lights_turn_off_bedtime_auto
  alias: Lights - Turn off lights automatically - bedtime
  description: Turn off main lights when we're not home or already went to bed
  triggers:
  - trigger: time
    at: '23:03:00'
  - trigger: state
    entity_id: zone.home
    to: '0'
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: light.socket2_light_couch
      state: 'on'
    - condition: time
      after: '23:03'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: zone.home
      state: '0'
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: script.sleep_well
    data: {}
  - action: light.turn_off
    target:
      entity_id:
      - light.socket1_light_corner
      - light.socket2_light_couch
  # Bedtime - end of the downstairs dark stretch for the pop-up timeline.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lights_downstairs_auto_dark
  mode: single
- id: closet_light_turn_on
  alias: Lights - Turn on lights when closet door opens
  triggers:
  - trigger: state
    entity_id: binary_sensor.door_hallcloset_openclose_contact
    from: 'off'
    to: 'on'
  actions:
  - action: light.turn_on
    data: {}
    target:
      entity_id: light.hallcloset_light
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.door_hallcloset_openclose_contact
      from: 'on'
      to: 'off'
    timeout: 00:15:00
    continue_on_timeout: true
  - action: light.turn_off
    data: {}
    target:
      entity_id: light.hallcloset_light
  mode: restart
- id: lights_kitchen_turn_on_when_awake_morning
  alias: Lights - Morning routine disarm alarm and turn on kitchen lights
  triggers:
  - entity_id: binary_sensor.hallwaydoor_sensor_contact
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: 04:00
    before: '11:00:00'
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state: armed_night
    for:
      hours: 0
      minutes: 10
      seconds: 0
  actions:
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  - choose:
    - conditions:
      - condition: time
        after: 06:00
      - condition: numeric_state
        entity_id: zone.home
        above: '0'
      sequence:
      - action: media_player.media_play
        data: {}
        target:
          entity_id: media_player.eetkamer
  - condition: or
    alias: Dark enough - by light sensor, or by sun elevation if that is dead
    conditions:
    - condition: numeric_state
      entity_id: sensor.light_sensor_living_illuminance
      below: '60'
    - condition: and
      note: >-
        Fallback for when the living room light sensor goes offline. That
        sensor crosses 60 lux at about +8.5 deg elevation.
      conditions:
      - condition: state
        entity_id: sensor.light_sensor_living_illuminance
        state:
        - unavailable
        - unknown
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 9
  - action: light.turn_on
    data:
      brightness_pct: 40
    target:
      entity_id:
      - light.kitchendesk_light
      - light.diningtable_light
  # Achter de seizoensknop: zie input_boolean.kerstverlichting.
  - if:
    - condition: state
      entity_id: input_boolean.kerstverlichting
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.kerst_binnen
  mode: single
