    state: open
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 90
    below: 250
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 15
  - condition: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 2000
  - condition: numeric_state
    entity_id: sensor.solarradiation
    above: 350
  - condition: numeric_state
    entity_id: sensor.today_maximum_temperature
    above: '20'
  - condition: time
    after: 08:00:00
  - condition: state
