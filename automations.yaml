- id: '1625051357630'
  alias: Presence - Disable detection because we are both home
  description: Deactivate Frigate object detection
  triggers:
  - trigger: state
    for: 0:00:15
    entity_id:
    - person.rob
    - person.steffi
    to: home
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: person.rob
      state: home
    - condition: state
      entity_id: person.steffi
      state: home
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.zijkant_detect
      - switch.terras_detect
      - switch.veranda_detect
      - switch.zwembad_detect
  # De slaapkamerdetectie hangt aan de alarmstand, niet aan presence. Stonden deze
  # twee ook in de lijst hierboven, dan zette een GPS-blip 's nachts (iemand van
  # unknown terug op home) de kinderdetectie uit onder armed_night - en de
  # tegenhanger (:991) zet hem niet terug, want die triggert alleen op de overgang
  # disarmed -> armed_night. Spiegelt hoe :991 diezelfde twee switches aanzet.
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: armed_night
    then:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.evabed_detect
        - switch.noabed_detect
  mode: single
- id: '1625773685228'
  alias: Alarm - Disable alarm manually
  description: Disarms the alarm and pauses it for 2 hours - timer.alarm_pause re-arms
    it afterwards. Two ways in - the IKEA shortcut button, and a recognised iPhone
    appearing on the wifi via iphonedetect (~5-13s after the phone joins). The iPhone
    trigger deliberately uses from not_home, because after a restart the tracker goes
    from unknown to home and that would otherwise disarm the alarm on every restart.
    Add a phone by listing its tracker in the second trigger plus the phone_names map.
    Our OWN phones are deliberately NOT triggers - "Alarm - Disarm automatically when
    one of us comes home" already handles us, without starting the 2 hour pause. Were
    rob or steffi listed here, coming home would re-arm the house to away two hours
    later while we are inside; the pause-interrupt automation only cancels that when
    zone.home crosses 0 -> 1, so it survives when the other one is already home. This
    trigger is for guests who need the alarm off for a visit. They stay in phone_names
    so the spoken name still resolves if ever re-added.
  triggers:
  - trigger: state
    entity_id:
    - event.switch_alarm_activity_action
    not_from:
    - unknown
    - unavailable
    not_to:
    - unavailable
    - unknown
    id: button
  - trigger: state
    entity_id:
    - device_tracker.iphonedetect_elly
    - device_tracker.iphonedetect_piet
    from: not_home
    to: home
    id: iphone
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
  - variables:
      phone_names:
        device_tracker.iphonedetect_rob: Rob
        device_tracker.iphonedetect_steffi: Steffi
        device_tracker.iphonedetect_elly: Elly
        device_tracker.iphonedetect_piet: Piet
      phone_name: '{{ phone_names.get(trigger.entity_id, ''iemand'') }}'
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.alarmo
    data:
      code: automation
  - choose:
    - conditions:
      - condition: trigger
        id: iphone
      sequence:
      - action: script.sonos_say
        data:
          sonos_entity: media_player.eetkamer
          volume: 20
          message: De telefoon van {{ phone_name }} is gedetecteerd. Het alarm is voor
            2 uur uitgezet.
      - action: notify.all_phones
        data:
          title: 🏠 Bezoek thuis
          message: '{{ phone_name }} is binnen. Het alarm staat 2 uur uit.'
          data:
            persistent: true
            tag: alarm-guest-arrival
    default:
    - action: script.sonos_say
      data:
        sonos_entity: media_player.living_room
        volume: 30
        message: Het alarm is voor 2 uur uitgezet.
  - action: timer.start
    target:
      entity_id: timer.alarm_pause_warning
  - action: timer.start
    target:
      entity_id: timer.alarm_pause
  mode: restart
- id: alarm_manual_pause_warning
  alias: Alarm - Manual pause almost over
  description: Spoken warning 5 minutes before the manual alarm pause expires
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_pause_warning
  conditions: []
  actions:
  - action: script.sonos_say
    data:
      sonos_entity: media_player.living_room
      volume: 30
      message: Let op, het alarm wordt over 5 minuten weer geactiveerd.
  mode: single
- id: alarm_manual_pause_rearm
  alias: Alarm - Re-arm after the manual pause
  description: The 2 hour manual alarm pause expired, arm the house again
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_pause
  conditions: []
  actions:
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.alarmo
  - action: notify.all_phones
    data:
      message: De tijd is om, het alarm wordt weer geactiveerd.
      data:
        persistent: true
        tag: persistent
  - action: script.sonos_say
    data:
      sonos_entity: media_player.living_room
      volume: 30
      message: Let op, het alarm is weer geactiveerd. Druk op de knop om het weer
        uit te zetten.
  mode: single
