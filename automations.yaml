- id: '1718380304677'
  alias: Energy - Disable solar panels in case of negative pricing
  description: Avoid paying for delivering energy but also limit the impact on the
    power grid in case there is no need
  triggers:
  # Was a bare state trigger on the price sensor: ~113 runs/day (a new price
  # every 15 min), while the actions only ever matter at the zero-crossing.
  # numeric_state fires only on the crossing itself -> ~2 runs/day.
  - trigger: numeric_state
    entity_id: sensor.current_price_electricity
    below: 0
  - trigger: numeric_state
    entity_id: sensor.current_price_electricity
    above: 0
  condition: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.current_price_electricity
        below: 0
      - condition: state
        entity_id: number.solaredge_active_power_limit
        state: '100'
      sequence:
      # This action was missing: the branch only ever posted the notification,
      # so the panels kept producing at negative prices AND the re-enable
      # branch below (which requires state '0') could never fire either.
      - action: number.set_value
        metadata: {}
        data:
          value: '0'
        target:
          entity_id: number.solaredge_active_power_limit
        alias: Disable the solar panels
      - action: persistent_notification.create
        data:
          title: Zonnepanelen
          message: "\U0001F31E De zonnepanelen zijn uitgezet vanwege een stroomprijs
            van {{ states('sensor.current_price_electricity') }} cent."
    - conditions:
      - condition: numeric_state
        entity_id: sensor.current_price_electricity
        above: 0
      - condition: state
        entity_id: number.solaredge_active_power_limit
        state: '0'
      sequence:
      - action: number.set_value
        metadata: {}
        data:
          value: '100'
        target:
          entity_id: number.solaredge_active_power_limit
        alias: Enable the solar panels
      - action: persistent_notification.create
        data:
          title: Zonnepanelen
          message: "\U0001F31E De zonnepanelen zijn weer aangezet vanwege een stroomprijs
            van {{ states('sensor.current_price_electricity') }} cent."
  mode: single
