- id: '1621189950296'
  alias: Presence - Enable detection because one of us left or in night mode
  description: Activate Frigate object detection
  triggers:
  # Single trigger replacing an overlapping pair (`state to: '1' for 15s` plus
  # `numeric_state below: '2'`). On a 2->1 change BOTH used to fire, running this
  # twice. `below: 2` alone still covers the 2->0 case (both of us leaving at
  # once), which the `to: '1'` trigger missed, and the 15s debounce now applies to
  # that case too. It no longer fires on 0->1 (one of us returning) — harmless,
  # because detection is already on in that state and
  # "Presence - Disable detection because we are both home" is what turns it off.
  - trigger: numeric_state
    entity_id: zone.home
    below: 2
    for:
      hours: 0
      minutes: 0
