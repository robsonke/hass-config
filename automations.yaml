      mp3_url: http://192.168.0.40:8123/local/sounds/doorbell2.mp3
- id: garden_lights_turn_on
  alias: Garden - Turn on garden lights
  description: When it's getting dark and at least after 4 PM, turn on lights in the
    garden
  triggers:
  - entity_id:
    - sensor.light_sensor_garden_illuminance
    below: 8
    trigger: numeric_state
  - at: 07:00
    trigger: time
  - entity_id: sun.sun
    attribute: elevation
    below: '-3'
    trigger: numeric_state
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: time
        after: '16:00'
      - condition: time
        before: '22:55'
      - condition: state
        entity_id: input_boolean.enable_automatic_garden_lights
        state: 'on'
      - condition: state
        entity_id: light.hue_lily_light_fence_1
        state: 'off'
    - alias: In the morning it should be dark enough and not just turned off by the
        other automation
      condition: and
      conditions:
      - condition: time
        after: 06:15
      - condition: time
        before: 08:55
      - condition: state
        entity_id: input_boolean.enable_automatic_garden_lights
        state: 'on'
      - condition: state
        entity_id: light.hue_lily_light_fence_1
        state: 'off'
      - condition: state
        entity_id: light.garden_lantern_light1
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.light_sensor_living_illuminance
          below: 8
        - condition: numeric_state
          entity_id: sun.sun
          attribute: elevation
          below: '-4'
  - condition: state
    entity_id: light.hue_lily_light_fence_1
    state: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  actions:
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id:
      - light.garden_light
  - action: light.turn_on
    data:
      color_temp_kelvin: 2200
    target:
      entity_id:
      - light.palm1_light
      - light.palm2_light
  - action: light.turn_on
    data:
      brightness_pct: 6
    target:
      entity_id: light.woodshed_light
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light1
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light2
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light3
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: light.turn_on
    data:
      brightness_pct: 17
    target:
      entity_id: light.veranda_light
  - action: light.turn_on
    data:
      brightness_pct: 40
    target:
      entity_id: light.lights_wall_shed
  - action: light.turn_on
    data:
      color_temp_kelvin: 2200
    target:
      entity_id: light.hue_lights_garden
  - action: light.turn_on
    target:
      entity_id:
      - light.kerst_buiten
    data: {}
  mode: single
- id: garden_lights_turn_off
  alias: Garden - Turn off garden lights - morning
  description: Turn off lights in the garden in the morning
  triggers:
  - at: 09:00
    trigger: time
  - entity_id:
    - sensor.light_sensor_garden_illuminance
    above: 10
    for:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.enable_automatic_garden_lights
    state: 'on'
  actions:
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.veranda_light
      - light.hue_lights_garden
      - light.woodshed_light
      - light.palm1_light
      - light.palm2_light
      - light.lights_wall_shed
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.garden_lantern_light1
      - light.garden_lantern_light2
      - light.garden_lantern_light3
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.garden_light
      - light.kerst_buiten
  mode: single
- id: lights_turn_off_bedtime_manual
  alias: Sleep - Switch to night mode manually
  description: Go to bed switch, turn off all we don't need during the night. Lights,
    music, tv, etc. And turn on the alarm
  triggers:
  - entity_id:
    - alarm_control_panel.alarmo
    from: disarmed
    to: armed_night
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: '21:00:00'
    - condition: time
      before: 05:00
  actions:
  - parallel:
    - action: script.sleep_well
      data: {}
    - sequence:
      - action: light.turn_on
        data:
          brightness_pct: 30
        target:
          entity_id: light.dimmer_hall
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: light.turn_off
        target:
          entity_id: light.dimmer_hall
        data: {}
      alias: Turn on hall light shortly
  - alias: Turn off the couch and corner light too if it's after 11 pm
    condition: or
    conditions:
    - condition: time
      after: '22:55:00'
    - condition: time
      after: 00:00:00
      before: 05:00:00
  - action: light.turn_off
    target:
      entity_id:
      - light.socket1_light_corner
      - light.socket2_light_couch
    data: {}
  mode: single
- id: lights_turn_off_bedtime_auto
  alias: Lights - Turn off lights automatically - bedtime
  description: Turn off main lights when we're not home or already went to bed
  triggers:
  - trigger: time
    at: '23:03:00'
  - trigger: state
    entity_id: zone.home
    to: '0'
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: light.socket2_light_couch
      state: 'on'
    - condition: time
      after: '23:03'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: zone.home
      state: '0'
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: script.sleep_well
    data: {}
  - action: light.turn_off
    target:
      entity_id:
      - light.socket1_light_corner
      - light.socket2_light_couch
  mode: single
- id: closet_light_turn_on
  alias: Lights - Turn on lights when closet door opens
  triggers:
  - trigger: state
    entity_id: binary_sensor.door_hallcloset_openclose_contact
    from: 'off'
    to: 'on'
  actions:
  - action: light.turn_on
    data: {}
    target:
      entity_id: light.hallcloset_light
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.door_hallcloset_openclose_contact
      from: 'on'
      to: 'off'
    timeout: 00:15:00
    continue_on_timeout: true
  - action: light.turn_off
    data: {}
    target:
      entity_id: light.hallcloset_light
  # restart (not the default `single`): this run parks in wait_for_trigger for up
  # to 15 minutes. With `single`, opening the closet again while a previous run
  # was still finishing was DROPPED, leaving the light off with the door open.
  mode: restart
- id: lights_kitchen_turn_on_when_awake_morning
  alias: Lights - Morning routine disarm alarm and turn on kitchen lights
  triggers:
  - entity_id: binary_sensor.hallwaydoor_sensor_contact
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: 04:00
    before: '11:00:00'
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state: armed_night
    for:
      hours: 0
      minutes: 10
      seconds: 0
  actions:
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  - choose:
    - conditions:
      - condition: time
        after: 06:00
      - condition: numeric_state
        entity_id: zone.home
        above: '0'
      sequence:
      - action: media_player.media_play
        data: {}
        target:
          entity_id: media_player.eetkamer
  - condition: numeric_state
    entity_id: sensor.light_sensor_living_illuminance
    below: '60'
  - action: light.turn_on
    data:
      brightness_pct: 40
    target:
      entity_id:
      - light.kitchendesk_light
      - light.diningtable_light
  - action: light.turn_on
    target:
      entity_id:
      - light.kerst_binnen
  mode: single
- alias: System - Let's Encrypt Renewal
  id: system_lets_encrypt
  description: Restart the lets encrypt addon, this should renew the certificate
  triggers:
    trigger: time
    at: 01:15:00
  actions:
  - action: hassio.addon_restart
    data:
      addon: core_letsencrypt
- id: presence_detection_message_speakers
  alias: Presence - Inform that one of us comes home
  description: Shout through speakers that somebody is arriving when the other one
    is home
  triggers:
  - trigger: state
    for:
      seconds: 15
    entity_id:
    - person.rob
    - person.steffi
    to: home
  # The `or: person.rob home / person.steffi home` condition that used to sit
  # here was always true: the trigger above already requires one of those two to
  # have been 'home' for 15s, so it could never be false. Removed as a no-op.
  conditions:
  - condition: state
    state: 'off'
    entity_id: input_boolean.guest_mode
  actions:
  - action: script.sonos_say
    data_template:
      sonos_entity: media_player.eetkamer
      volume: 30
      message: Wakker worden, {{ state_attr(trigger.entity_id, 'friendly_name') }}
        komt er aan!
  - delay: '2'
  mode: single
- id: presence_frigate_object_detection
  alias: Alarm - Notify of person events on camera
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: or
    conditions:
    - condition: state
