- id: '1625773685228'
  alias: Alarm - Disable alarm manually
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - event.switch_alarm_activity_action
    not_from:
    - unknown
    - unavailable
    not_to:
    - unavailable
    - unknown
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.alarmo
    data:
      code: automation
  - action: script.sonos_say
    data:
      sonos_entity: media_player.living_room
      volume: 30
      message: Het alarm is voor 2 uur uitgezet.
  # The 1h55m + 5m `delay:` chain that used to live here is now two restore:true
  # timers (see packages/pkg_alarm.yaml). An in-flight `delay:` does NOT survive an
  # HA restart, so a restart during the pause meant the alarm was silently never
  # re-armed. The spoken warning and the re-arm are now separate automations
  # driven by timer.finished.
  - action: timer.start
    target:
      entity_id: timer.alarm_pause_warning
  - action: timer.start
    target:
      entity_id: timer.alarm_pause
  # restart: pressing the button again simply restarts the pause
  mode: restart
- id: alarm_manual_pause_warning
  alias: Alarm - Manual pause almost over
  description: Spoken warning 5 minutes before the manual alarm pause expires
  triggers:
  # the timer.finished EVENT — not `state to: idle`, which would also fire when the
  # timer is cancelled (i.e. when one of us comes home)
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_pause_warning
  conditions: []
  actions:
  - action: script.sonos_say
    data:
      sonos_entity: media_player.living_room
      volume: 30
      message: Let op, het alarm wordt over 5 minuten weer geactiveerd.
  mode: single
- id: alarm_manual_pause_rearm
