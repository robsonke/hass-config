- id: '1644162797655'
  alias: Heating - Control heating bedroom
  description: Turn on between 10h and 19h only when the temperature is too low and
    the windows are closed
  triggers:
  - trigger: homeassistant
    event: start
  # Poll relaxed /10 -> /30 (144 -> 48 runs/day). That is only safe because the
  # inputs this automation actually decides on now have triggers of their own:
  # the bedroom temperature (below/above 19, matching the condition threshold)
  # and the cheapest-hours sensor that gates the price condition. Previously the
  # /10 poll was the ONLY thing that noticed a temperature change, so simply
  # slowing it down would have left the heater in the wrong state for up to
  # half an hour. The poll now just backstops the 10:00/22:00 window edges.
  - trigger: time_pattern
    minutes: /30
  - trigger: numeric_state
    entity_id: sensor.climate_sensor_masterbedroom_temperature
    below: 19
    for:
      minutes: 2
  - trigger: numeric_state
    entity_id: sensor.climate_sensor_masterbedroom_temperature
    above: 19
    for:
      minutes: 2
  - trigger: state
    entity_id:
    - binary_sensor.cheapest_16_hours_24h
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  # sensor.energy_price_level flaps to unavailable ~8x/24h on integration
  # reloads; without this each flap was an extra spurious run.
  - trigger: state
    entity_id:
    - sensor.energy_price_level
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.window_masterbed_1_openclose_contact
    - binary_sensor.window_masterbed_2_openclose_contact
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: time
        after: '10:00'
        before: '22:00:00'
      - condition: numeric_state
        entity_id: sensor.climate_sensor_masterbedroom_temperature
        below: 19
      - condition: state
        entity_id: binary_sensor.window_masterbed_1_openclose_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.window_masterbed_2_openclose_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.cheapest_16_hours_24h
        state: 'on'
        alias: The price should be not too high
      sequence:
      - action: select.select_option
        target:
          entity_id: select.eurom_alutherm_capacity
        data:
          option: Auto
      - action: climate.set_temperature
        data:
          hvac_mode: heat
          temperature: 18
        target:
          entity_id: climate.eurom_alutherm_baseboard_heater
    default:
    - action: select.select_option
      target:
        entity_id: select.eurom_alutherm_capacity
      data:
        option: 'Off'
  trace:
    stored_traces: 50
  mode: queued
  max: 4
