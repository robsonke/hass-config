- id: '1706294943705'
  alias: Music - Control sonos bedroom
  description: ''
  triggers:
  # State trigger on the event entity rather than a template trigger on its
  # attributes. A template trigger fires only on a false->true transition, and
  # pressing button_4 twice in a row leaves both attributes unchanged - the second
  # press re-rendered `true` with no transition and so did nothing. The event
  # entity's state is a timestamp that changes on every press, so this fires each
  # time; the choose branch below filters to the button we care about, and the
  # outer choose has no `default:`, so the extra firings are inert.
  - trigger: state
    entity_id: event.hue_tap_switch_master_action
  - trigger: state
    entity_id:
    - sensor.hue_tap_switch_master_action_type
    to: rotate
  - trigger: state
    entity_id:
    - sensor.hue_tap_switch_master_action_type
    to: step
  conditions: []
  actions:
  - choose:
    - conditions:
      # `condition: state` supports `attribute:`, so this needs no template at all.
      # A conditions list is implicitly AND.
      - condition: state
        entity_id: event.hue_tap_switch_master_action
        attribute: event_type
        state: press_release
      - condition: state
        entity_id: event.hue_tap_switch_master_action
        attribute: button
        state: button_4
      sequence:
      - alias: If sonos plays, stop, otherwise play radio 2
        choose:
        - conditions:
          - condition: state
            entity_id: media_player.slaapkamer_sonos
            state: playing
            alias: Is sonos playing
          sequence:
          - action: media_player.media_stop
            target:
              entity_id: media_player.slaapkamer_sonos
            data: {}
            alias: Stop playing
        default:
        - alias: Reset the volume
          action: media_player.volume_set
          data:
            volume_level: 0.1
          entity_id: media_player.slaapkamer_sonos
        - alias: Play radio 2 on sonos
          action: media_player.play_media
          data:
            metadata:
              title: NPO Radio 2
              thumbnail: https://upload.wikimedia.org/wikipedia/commons/b/b3/NPO_Radio_2_logo.png
              media_class: music
            extra:
              thumb: https://upload.wikimedia.org/wikipedia/commons/b/b3/NPO_Radio_2_logo.png
              title: NPO Radio 2
            media:
              media_content_id: x-rincon-mp3radio://icecast.omroep.nl/radio2-bb-aac
              media_content_type: music
              metadata: {}
          target:
            entity_id: media_player.slaapkamer_sonos
    - conditions:
      - condition: and
        alias: Is sonos playing and did we turn the knob to the left
        conditions:
        - condition: state
          entity_id: sensor.hue_tap_switch_master_action_direction
          state: left
        - condition: state
          entity_id: media_player.slaapkamer_sonos
          state: playing
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.slaapkamer_sonos
        data:
          volume_level: "{{ [[(state_attr('media_player.slaapkamer_sonos', 'volume_level')\n
            \     | float(0.1)) - 0.02, 0] | max, 1] | min }}\n"
    - conditions:
      - condition: and
        alias: Is sonos playing and did we turn the knob to the right
        conditions:
        - condition: state
          entity_id: sensor.hue_tap_switch_master_action_direction
          state: right
        - condition: state
          entity_id: media_player.slaapkamer_sonos
          state: playing
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.slaapkamer_sonos
        data:
          volume_level: "{{ [[(state_attr('media_player.slaapkamer_sonos', 'volume_level')\n
            \     | float(0.1)) + 0.02, 0] | max, 1] | min }}\n"
  mode: queued
  max: 10
