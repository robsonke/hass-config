- id: '1644692915726'
  alias: Garden - Turn off garden lights - evening
  description: Turn off lights in the garden in the evening but keep a few on on low
    brightness. Turn off when we go to bed, guest mode is off or otherwise at 23:00.
  triggers:
  # The 5-minute grace period used to be a `delay:` as the first action. An
  # in-flight delay is lost on an HA restart, which left the garden lit all
  # night, and `mode: single` meant a second trigger inside that window was
  # dropped. Expressing the grace in the triggers themselves removes the long
  # delay entirely - there is now nothing in flight to lose.
  - at: '23:05'
    trigger: time
  - at: 01:05
    trigger: time
  - entity_id:
    - alarm_control_panel.alarmo
    to: armed_night
    for: 00:05:00
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.enable_automatic_garden_lights
    state: 'on'
  - condition: or
    conditions:
    - condition: time
      after: '22:59:00'
    - condition: time
      after: 00:00:00
      before: 02:00:00
  - condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
    - condition: time
      after: 00:00:00
      before: 02:00:00
  actions:
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.veranda_light
      - light.lights_wall_shed
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.woodshed_light
      - light.palm1_light
      - light.palm2_light
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_on
    data:
      brightness_pct: 30
    target:
      entity_id:
      - light.garden_lantern_light1
      - light.garden_lantern_light2
      - light.garden_lantern_light3
      - light.garden_light
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.hue_lights_garden
  # Apart en achter de seizoensknop: zie input_boolean.kerstverlichting.
  - if:
    - condition: state
      entity_id: input_boolean.kerstverlichting
      state: 'on'
    then:
    - action: light.turn_off
      data: {}
      target:
        entity_id:
        - light.kerst_buiten
  mode: restart
