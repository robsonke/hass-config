- id: '1618070798660'
  alias: Battery - Low battery level detection & notification for all battery sensors
  description: Low battery level detection & notification for all battery sensors
  use_blueprint:
    path: sbyx/low-battery-level-detection-notification-for-all-battery-sensors.yaml
    input:
      time: '10:00:00'
      actions:
      - action: notify.mobile_app_iphone_rob
        data:
          message: "\U0001F50B Low battery warning for {{sensors|replace(\"_\",\"
            \")}}"
          data:
            persistent: true
            tag: persistent
      - action: persistent_notification.create
        metadata: {}
        data:
          title: Battery low
          message: "\U0001F50B Low battery warning for {{sensors|replace(\"_\",\"
            \")}}"
- id: alarm_auto_arm_when_away
  alias: Alarm - Auto arm since we're away and all is closed
  description: We didn't enable the Guest mode and we both left, arm the house
  # `state to: '0'` (was `numeric_state below: '1'` — the only one of the seven
  # zone.home-based "we left" automations that differed). Equivalent in practice,
  # but consistent with the rest and it also fires on an unknown -> 0 transition,
  # which numeric_state cannot evaluate.
  #
  # The `for: 3 min` is load-bearing: HA cancels a pending `for:` if zone.home
  # goes back above 0, so walking back in within 3 minutes means the alarm never
  # arms. Do not convert this into a `delay:` inside a merged automation.
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    for:
      hours: 0
      minutes: 3
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
    # ORDERING NOTE: on a Thursday 12:00-18:30 departure, "Alarm - Enable guest
    # mode when nanny or cleaner home" also fires on zone.home -> 0, but with no
    # `for:`, so it sets guest_mode on within a second and DISARMS. This guard is
    # what stops the two fighting 3 minutes later. Keep this condition, and keep
    # that automation's trigger un-delayed, or the house would arm on the cleaner.
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - data:
      message: ⏰ We zijn beiden weg, het alarm wordt geactiveerd
      data:
        persistent: true
        tag: persistent
    action: notify.all_phones
  - target:
      entity_id: alarm_control_panel.alarmo
    data: {}
    action: alarm_control_panel.alarm_arm_away
  mode: single
- id: alarm_auto_disarm_when_arriving
  alias: Alarm - Disarm automatically when one of us comes home
  description: Automatically disarm when we come home
  triggers:
  - entity_id:
    - person.rob
    - person.steffi
    to: home
    for: 0:00:30
    trigger: state
  # device_tracker.ix3_location — was `device_tracker.ix3`, which does not
  # exist, so arriving by car never fired this; it only ran once a phone's
  # person entity flipped ~30s later.
  - entity_id: device_tracker.ix3_location
    to: home
    from: not_home
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: armed_away
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: armed_home
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: pending
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: triggered
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: arming
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: notify.all_phones
    data:
      message: ⏰ Een van ons komt thuis, het alarm wordt gedeactiveerd.
      data:
        persistent: true
        tag: persistent
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  mode: single
- id: alarm_triggered_alert
  alias: Alarm - Triggered BEEP BEEP BEEP
  description: Now we are in trouble, the alarm is triggered and we have not disarmed
    it. A lot of noise and lights will be activated.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: triggered
  actions:
  - action: notify.all_phones
    data:
      message: "\U0001F6A8\U0001F6A8 ALARM! Het alarm gaat af en is te laat gedeactiveerd!
        \U0001F6A8\U0001F6A8"
      data:
        persistent: true
        tag: persistent
        push:
          sound: alarm.caf
          critical: 1
          volume: 1
          interruption-level: critical
        actions:
        # Points at the Bubble dashboard's camera hub pop-up (opened by the
        # #cameras hash). Previously /lovelace/4 — a view on the old
        # main-dashboard, which is no longer where the cameras live.
        - action: URI
          title: Bekijk cams
          uri: /lovelace-bubble/overzicht#cameras
        # NOTE: a second "Alarm uit" button (action: SILENCE_ALARM) used to sit
        # here. Its handler automation ("Alarm - Silence alarm by notification")
        # had been switched off since 2022, so the button did nothing when
        # tapped. Both the button and that handler are now gone -- no dead
        # control on a critical alert, and no dead handler behind it.
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alarm_active
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: triggered
      - condition: template
        value_template: '{{ repeat.index <= 20 }}'
      sequence:
      - data:
          sonos_entity: media_player.eetkamer
          volume: 30
          message: Je bent gezien en wordt nu gefilmd!
        action: script.sonos_say
      - action: script.sonos_play_sound
        data:
          mp3_url: http://192.168.0.40:8123/local/sounds/alarm2.mp3
          volume: 40
          sonos_entity: media_player.living_room
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.alarm_active
  mode: single
- id: alarm_pending_trigger
  alias: Alarm - Pending
  description: Warn the person that walked in about the armed alarm, goal is to disarm
    asap
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: pending
  actions:
  - data:
      sonos_entity: media_player.eetkamer
      volume: 20
      message: Je bent gezien, deactiveer het alarm binnen 2 minuten!
    action: script.sonos_say
  - data:
      title: Alarm actief
      content:
        type: custom:alarmo-card
        entity: alarm_control_panel.alarmo
    action: browser_mod.popup
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: pending
      - condition: template
        value_template: '{{ repeat.index <= 10 }}'
      sequence:
      - data:
          mp3_url: http://192.168.0.40:8123/local/sounds/pending_alarm.mp3
          volume: 40
          sonos_entity: media_player.living_room
        action: script.sonos_play_sound
  mode: single
- id: alarm_disarm_correctly
  alias: Alarm - Disarmed
  description: Send a message that the alarm is properly disarmed and inform the person
    over speakers
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    from:
    - triggered
    - pending
    to: disarmed
  actions:
  - action: notify.all_phones
    data:
      message: '✅ ALARM: Het alarm is uitgezet.'
      data:
        persistent: true
        tag: persistent
  - action: script.sonos_say
    data:
      sonos_entity: media_player.eetkamer
      volume: 20
      message: Het alarm is uitgeschakeld
  mode: single
- id: alarm_auto_disarm_when_guest_mode
  alias: Alarm - Disarm automatically when guest mode is enabled
  description: When we enable guest mode (e.g. remotely while away), make sure the
    alarm is disarmed so guests can enter
  triggers:
  - trigger: state
    entity_id: input_boolean.guest_mode
    from: 'off'
    to: 'on'
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
  - action: notify.all_phones
    data:
      message: ⏰ Gastmodus is geactiveerd, het alarm wordt gedeactiveerd.
      data:
        persistent: true
        tag: persistent
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  mode: single
- id: reset_lights_automation
  alias: Lights - Reset lights automation
  description: When we have disabled all automatic lighting, we reset this in the
    early morning to make sure we're back to normal the next day
  triggers:
  - trigger: time
    at: 05:00:00
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'off'
    - condition: state
      entity_id: input_boolean.enable_automatic_garden_lights
      state: 'off'
    - condition: state
      entity_id: input_boolean.enable_automatic_screens
      state: 'off'
  actions:
  - action: input_boolean.turn_on
    entity_id: input_boolean.enable_automatic_lights
  - action: input_boolean.turn_on
    entity_id: input_boolean.enable_automatic_garden_lights
  - action: input_boolean.turn_on
    entity_id: input_boolean.enable_automatic_screens
- id: groundfloor_lights_on_when_dark_away
  alias: Lights - Turn on lights when dark - away
  description: Switch standard lights on when it's after 2 PM and light level too
    low
  triggers:
  # `for: 5 min` to match the "- home" twin below. Without it this fired on every
  # dusk flicker across the 30-lux threshold (the illuminance sensor changes
  # ~5800x/48h), so the lights could switch on during a brief cloud shadow.
  - trigger: numeric_state
    entity_id: sensor.light_sensor_living_illuminance
    below: '30'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: light.socket2_light_couch
      state: 'off'
    - condition: time
      after: '14:00'
      before: '22:30'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: zone.home
      state: '0'
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: script.lights_on_away
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  mode: single
- id: groundfloor_lights_on_when_dark_home
  alias: Lights - Turn on lights when dark - home
  description: Switch standard lights on when it's after 2 PM and light level too
    low
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.light_sensor_living_illuminance
    below: '30'
    for:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: '10:00'
      before: '22:30'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: binary_sensor.people_home_and_awake
      state: 'on'
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state: disarmed
  actions:
  - action: script.lights_on_home
    data: {}
  - delay: '1'
  mode: single
- id: calendar_trash_alert
  alias: Calendar - Afval Calendar Alert
  description: Send messages when a trash bin should be put outside
  triggers:
  - entity_id: sensor.gft_days_until_collection
    trigger: state
    to: '1'
    for:
      hours: 20
      minutes: 0
      seconds: 0
  - entity_id: sensor.rest_days_until_collection
    trigger: state
    to: '1'
    for:
      hours: 20
      minutes: 0
      seconds: 0
  # Was `to: '0'` for 16h — days_until_collection hits 0 ON collection day, so
  # this reminded you at ~16:00 that day, after the bin had been emptied.
  # Now matches GFT/REST: counter becomes 1 (collection tomorrow), +20h => a
  # reminder at ~20:00 the evening before.
  - entity_id: sensor.paper_days_until_collection
    trigger: state
    to: '1'
    for:
      hours: 20
      minutes: 0
      seconds: 0
  actions:
  - action: notify.all_phones
    data_template:
      message: "\U0001F4C5  Opletten {{ state_attr(trigger.entity_id, 'friendly_name')
        }}!"
      data:
        persistent: true
        tag: persistent
- id: doorbell_ring_notification
  alias: Doorbell - Notification Doorbell Ring
  description: Say ding dong through the speakers when doorbell rings
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.langeweide_doorbell_visitor
