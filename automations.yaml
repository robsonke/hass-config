      data:
        persistent: true
        image: http://192.168.0.40:8123/api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg
        tag: '{{trigger.payload_json["after"]["id"]}}'
        when: '{{trigger.payload_json["after"]["start_time"]|int}}'
        entity_id: camera.{{trigger.payload_json["after"]["camera"]}}
  mode: single
# Garden "alarm": a person on a perimeter camera while the alarm is armed floods
# the whole garden with light. Restored after being dropped in the automation
# audit, but rebuilt rather than reinstated verbatim:
#   * device_id alarm conditions → plain entity_id state conditions
#   * four `or:` camera string comparisons → one `in` test
#   * lights only (garden_light + veranda_light) → the whole `light.lights_garden`
#     group, i.e. all 15 garden lights
#   * the critical push is NOT repeated here — "Alarm - Notify of person events
#     on camera" above already notifies on the identical trigger/conditions, so
#     duplicating it would double-alert on every detection.
# The "lights are currently off" guard matters: without it a detection during a
# manually-lit evening would switch the garden off again when the delay expires.
- id: '1628796760216'
  alias: Alarm - Turn on lights when person events on camera
  description: Alle tuinlichten aan bij een persoon op een buitencamera terwijl het
    alarm staat
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  - condition: template
    value_template: '{{ trigger.payload_json[''type''] == ''new'' }}'
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''person'' }}'
  - condition: template
    value_template: >
      {{ trigger.payload_json['after']['camera'] in
         ['zijkant', 'terras', 'veranda', 'bijkeuken'] }}
  # only worth doing after dark
  - condition: numeric_state
    entity_id: sensor.light_sensor_garden_illuminance
    below: 10
  - condition: state
    entity_id: light.lights_garden
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.lights_garden
  - delay: '00:02:00'
  - action: light.turn_off
    target:
      entity_id: light.lights_garden
  mode: single
