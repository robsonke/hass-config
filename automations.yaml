- id: '1639680674230'
  alias: iOS - Good night
  description: Good night action from app or watch
  triggers:
  - trigger: event
    event_type: ios.action_fired
    event_data:
      actionName: good_night
  conditions:
  - condition: time
    after: '21:00'
    before: 05:00
  actions:
  - parallel:
    - action: script.sleep_well
      data: {}
    - action: alarm_control_panel.alarm_arm_night
      target:
        entity_id: alarm_control_panel.alarmo
      data: {}
    - sequence:
      - action: light.turn_on
        data:
          brightness_pct: 30
        target:
          entity_id: light.dimmer_hall
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: light.turn_off
        target:
          entity_id: light.dimmer_hall
        data: {}
      alias: Turn on hall light shortly
  # Als if/then, niet als kale conditie: die kapte de rest van de actielijst af.
  # Dubbel raak hier - de conditie was after 22:55 ZONDER before, dus het venster
  # liep maar tot middernacht, terwijl de automation zelf tot 05:00 mag draaien.
  # Good night om 00:30 liet de lampen aan en de input_boolean hieronder open.
  # before: 05:00 laat het venster over middernacht wrappen, gelijk aan de
  # buitenste conditie van deze automation.
  - alias: Turn off the couch and corner light too if it's after 11 pm
    if:
    - condition: time
      after: '22:55:00'
      before: 05:00:00
    then:
    - action: light.turn_off
      target:
        entity_id:
        - light.socket1_light_corner
        - light.socket2_light_couch
      data: {}
  # Good night pressed - end of the downstairs dark stretch for the timeline.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lights_downstairs_auto_dark
  mode: single
