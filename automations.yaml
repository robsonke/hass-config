      message: "Alarm kan niet geactiveerd worden omdat: {% for entity_id in trigger.event.data.sensors
        %}\n  - {{ state_attr(entity_id, 'friendly_name') }} staat {{ states(entity_id)
        }}\n{% endfor %}\n"
