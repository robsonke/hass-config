- id: shed_switch_sync
  alias: Lights - Keep both shed lights in sync
  description: If one of the two switches changes state, the other follows, but only
    if they are not already in the same state. This is to avoid loops and to allow
    manual override of one of the switches without breaking the automation.
  triggers:
  - trigger: state
    entity_id:
    - switch.shed_switch_1
    - switch.shed_switch_2
    to:
    - 'on'
    - 'off'
  variables:
    other_switch: "{% if trigger.entity_id == 'switch.shed_switch_1' %}\n  switch.shed_switch_2\n{%
      else %}\n  switch.shed_switch_1\n{% endif %}\n"
  conditions:
  - condition: template
    value_template: '{{ states(other_switch) != trigger.to_state.state }}'
  actions:
  - action: switch.turn_{{ trigger.to_state.state }}
    target:
      entity_id: '{{ other_switch }}'
  # queued (not `single`): when both switches change at nearly the same moment,
  # `single` dropped the second event and the pair could end up out of sync.
  # The `states(other_switch) != trigger.to_state.state` condition above still
  # prevents a feedback loop, because the follower's own state change then
  # evaluates to false.
  mode: queued
  max: 2
- id: evabed_sound_detection_armed_night
  alias: Eva Bed Sound Detection - Avond/Nacht
  description: Detecteert nood-geluiden (huilen, gillen, schreeuwen, hoesten) via
    Frigate's audio classificatie tussen 19:30 en 07:00. Stuurt direct een melding
    en escaleert naar een kritieke melding als het geluid binnen 2 minuten nog 2x
    terugkomt.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.evabed_crying_sound
    - binary_sensor.evabed_scream_sound
    - binary_sensor.evabed_yell_sound
    - binary_sensor.evabed_cough_sound
    to: 'on'
  - trigger: numeric_state
    entity_id: sensor.evabed_sound_level
    above: sensor.evabed_sound_level_alert_threshold
    for: '00:00:10'
  conditions:
  - condition: time
    after: '19:30:00'
    before: '07:00:00'
  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(states.automation.eva_bed_sound_detection_avond_nacht.attributes.last_triggered,
      0) | int > 300 }}'
  actions:
  - variables:
      sound_labels:
        binary_sensor.evabed_crying_sound: huilen
        binary_sensor.evabed_scream_sound: gillen
        binary_sensor.evabed_yell_sound: schreeuwen
        binary_sensor.evabed_cough_sound: hoesten
        sensor.evabed_sound_level: ongewoon hard geluid
      sound_label: '{{ sound_labels.get(trigger.entity_id, ''geluid'') }}'
  - action: camera.snapshot
    target:
      entity_id: camera.evabed
    data:
      filename: /config/www/messages/evabed_sound.jpg
  - action: notify.all_phones
    data:
      title: "\U0001F50A Geluid bij Eva"
      message: Eva maakt geluid ({{ sound_label }})
      data:
        persistent: true
        tag: eva-sound
        image: http://192.168.0.40:8123/local/messages/evabed_sound.jpg?t={{ now().timestamp()
          }}
  - repeat:
      count: 2
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.evabed_crying_sound
          - binary_sensor.evabed_scream_sound
          - binary_sensor.evabed_yell_sound
          - binary_sensor.evabed_cough_sound
          to: 'on'
        - trigger: numeric_state
          entity_id: sensor.evabed_sound_level
          above: sensor.evabed_sound_level_alert_threshold
          for: '00:00:10'
        timeout: 00:02:00
      - if:
        - condition: template
          value_template: '{{ wait.trigger is none }}'
        then:
        - stop: Geluid hield niet aan - geen escalatie nodig
  - action: camera.snapshot
    target:
      entity_id: camera.evabed
    data:
      filename: /config/www/messages/evabed_sound.jpg
  - action: notify.all_phones
    data:
      title: ⚠️ Aanhoudend geluid bij Eva
      message: Eva maakt al even geluid, ga even kijken!
      data:
        persistent: true
        tag: eva-sound
        image: http://192.168.0.40:8123/local/messages/evabed_sound.jpg?t={{ now().timestamp()
          }}
        push:
          sound:
            name: default
            critical: 1
            volume: 1
          interruption-level: critical
  mode: single
- id: doorbell_camera_popup
  alias: Deurbel - Popup camera bij bellen of persoon
  description: >
    Toont de voordeurcamera in een popup (browser_mod) zodra er wordt aangebeld
    of een persoon wordt gedetecteerd. Gebruikt persoon-detectie i.p.v. ruwe
    beweging om te voorkomen dat de popup bij elke auto/voorbijganger opent.
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.langeweide_doorbell_visitor
        - binary_sensor.langeweide_doorbell_person
      from: 'off'
      to: 'on'
  conditions: []
  actions:
    # Wake the wall tablet first: screen on + Fully Kiosk to the foreground so
    # browser_mod is connected when the popup fires (otherwise it can miss the
    # sleeping tablet and land on another browser holding the same browser id).
    - action: switch.turn_on
      target:
        entity_id: switch.tab_a9_van_rob_screen
    - action: button.press
      target:
        entity_id: button.tab_a9_van_rob_bring_to_foreground
    - delay: '00:00:02'
    - action: browser_mod.popup
      data:
        # target the wall tablet by its registered browser_mod id
        # (the tablet's own Browser ID is still 028; laptop is now laptop-firefox)
        browser_id:
          - browser_mod_028aaaa1_36a40792
        title: >
          {{ 'Er wordt aangebeld' if is_state('binary_sensor.langeweide_doorbell_visitor', 'on') else 'Beweging bij de voordeur' }}
        size: wide
        timeout: 45000
        dismissable: true
        content:
          type: picture-entity
          entity: camera.langeweide_doorbell_clear
          camera_view: live
          show_name: false
          show_state: false
  mode: restart
