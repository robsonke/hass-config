- id: presence_frigate_object_detection
  alias: Alarm - Notify of person events on camera
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''person'' }}'
  - condition: template
    alias: Not alerted in the last 2 minutes
    # `this` in plaats van het hardcoded states.automation.<alias>-pad: dat pad is
    # afgeleid van de alias terwijl het automation-id presence_frigate_object_detection
    # is, dus een rename koppelt de cooldown stil los en blokkeert hem voorgoed.
    # Zelfde vorm als de pool-alert verderop.
    value_template: >
      {{ this is not defined
         or (as_timestamp(now())
             - as_timestamp(this.attributes.last_triggered, 0)) | int > 120 }}
  - condition: template
    value_template: "{{ trigger.payload_json['after']['camera'] in\n   ['zijkant',
      'terras', 'veranda', 'bijkeuken'] }}\n"
  actions:
  - action: notify.all_phones
    data:
      message: Er is een {{trigger.payload_json["after"]["label"]}} gedetecteerd op
        de {{ trigger.payload_json["after"]["camera"] }} camera
      data:
        persistent: true
        image: /api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg
        tag: '{{trigger.payload_json["after"]["id"]}}'
        when: '{{trigger.payload_json["after"]["start_time"]|int}}'
        entity_id: camera.{{trigger.payload_json["after"]["camera"]}}
