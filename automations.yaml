- id: '1659861088978'
  alias: Screens - Close screens zijraam on warm sunny days
  description: In case it's warm and sunny, close the screens in the morning but the
    one on the side a bit later. Sunshine is gated on the local pyranometer
    (sensor.solarradiation above 350 W/m2), not on OpenWeatherMap cloud coverage -
    that value is a coarse hourly forecast and went 12 - 27 - 100 - 57 percent on
    30 Jul while the pyranometer read 430 W/m2 and PV was doing 4.3 kW, so the
    screens stayed open on a plainly sunny morning. 350 sits between the overcast
    mornings measured here (112-294) and the clear ones (381-787).
  triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 200
  - trigger: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 2000
    for:
      minutes: 5
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: cover.zijraam
    state: open
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 200
    below: 305
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 7
  - condition: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 2000
  - condition: numeric_state
    entity_id: sensor.solarradiation
    above: 350
  - condition: numeric_state
    entity_id: sensor.today_maximum_temperature
    above: '20'
  - condition: state
    entity_id: binary_sensor.rain_detected
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.hourly_rain_piezo
    below: 0.1
  - condition: state
    entity_id: input_boolean.enable_automatic_screens
    state: 'on'
  actions:
  - action: notify.all_phones
    data:
      message: ☀️ De screens aan de zijkant gaan dicht
      data:
        persistent: true
        tag: persistent
  - action: cover.close_cover
    data: {}
    target:
      entity_id: cover.zijraam
  mode: single
- id: '1659880318627'
  alias: Pool - Control the Pool Heatpump
  description: Turn on the pool heat pump and choose a run mode (normal/silent/super
    silent) based on need and energy pricing and outdoor temperature
  triggers:
  - trigger: state
    entity_id: sensor.today_maximum_temperature
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.pool_pump_active
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    entity_id: sensor.pool_heating_temperature_diff
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - binary_sensor.cheapest_16_hours_24h
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    entity_id:
    - binary_sensor.pool_pump_active
    to:
    - 'on'
    from:
    - 'off'
  conditions:
  # Alleen de masterschakelaar hoort hier. De prijs-, temperatuur- en pompconditie
  # stonden hier ook, en blokkeerden daarmee de default:-tak die de WP uitzet -
  # juist op de momenten dat dat moet (goedkoop uur voorbij, circulatiepomp uit,
  # te koud). Ze staan al in de aan-tak hieronder.
  - condition: state
    entity_id: input_boolean.enable_pool_automations
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.cheapest_16_hours_24h
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.today_maximum_temperature
        # Was 14, maar de (nu verwijderde) top-level conditie eiste 15, dus 15 was
        # de effectieve drempel. Hier gelijkgetrokken zodat het aan-gedrag niet wijzigt.
        above: 15
      - condition: state
        entity_id: binary_sensor.pool_pump_active
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.pool_heating_temperature_diff
        above: 1
      sequence:
      - action: switch.turn_on
        data: {}
        target:
          entity_id: switch.fairland_zwembad_wpu_aan_uit_schakelaar
      - choose:
        - conditions:
          - alias: If we are about to get close to the target temperature
            condition: numeric_state
            entity_id: sensor.pool_heating_temperature_diff
            above: 4
          sequence:
          - action: select.select_option
            metadata: {}
            data:
              option: Normal
            target:
              entity_id: select.fairland_zwembad_wpu_power_mode
        - conditions:
          - alias: If we are about to get closer to the target temperature
            condition: numeric_state
            entity_id: sensor.pool_heating_temperature_diff
            above: 2
          sequence:
          - action: select.select_option
            metadata: {}
            data:
              option: Silence
            target:
              entity_id: select.fairland_zwembad_wpu_power_mode
        default:
        - action: select.select_option
          metadata: {}
          data:
            option: Super Silence
          target:
            entity_id: select.fairland_zwembad_wpu_power_mode
    default:
    - action: switch.turn_off
      data: {}
      target:
        entity_id: switch.fairland_zwembad_wpu_aan_uit_schakelaar
  mode: single
  max_exceeded: silent
  trace:
    stored_traces: 50
- id: '1661977922126'
  alias: HVAC - Control Operation Mode downstairs
  description: 'Set the HVAC mode (heat/cool/off) for the heat pump. By default off,
    cooling when it is expected to be hot outside and also becoming hotter inside,
    heating when the indoor temperature is low and outside also getting cooler.

    This still doesn''t mean that the pump would start, it will still use its indoor
    sensors. And even when it does turn on, other automations might stop that, based
    on the heating and cooling input booleans.'
  triggers:
  - trigger: state
    entity_id:
    - sensor.downstairs_temperature
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  actions:
  - choose:
    - conditions:
      - alias: Confirm if the temperature is below the minimum allowed temperature
        condition: numeric_state
        entity_id: sensor.downstairs_temperature
        below: input_number.hvac_heating_limit
      - condition: numeric_state
        entity_id: sensor.today_maximum_temperature
        below: 18
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.warmtepomp
          attribute: hvac_action
          state: heating
        alias: Action should not be set to heating already
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.warmtepomp
        data:
          hvac_mode: heat
        alias: Set HVAC to heating
      - action: select.select_option
        data:
          option: heating
        target:
          entity_id: select.operation_mode
    - conditions:
      - alias: Confirm if the temperature is below the maximum and above the minimum
          allowed temperature
        condition: numeric_state
        entity_id: sensor.downstairs_temperature
        above: input_number.hvac_heating_limit
        below: input_number.hvac_cooling_limit
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.warmtepomp
          attribute: hvac_action
          state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.warmtepomp
        data:
          hvac_mode: 'off'
        alias: Turn HVAC off
    - conditions:
      - alias: Confirm if the temperature is above the maximum allowed temperature
        condition: numeric_state
        entity_id: sensor.downstairs_temperature
        above: input_number.hvac_cooling_limit
      - condition: numeric_state
        entity_id: sensor.today_maximum_temperature
        above: '24'
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.warmtepomp
          attribute: hvac_action
          state: cooling
        alias: Action should not be set to cooling already
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.warmtepomp
        data:
          hvac_mode: cool
        alias: Set HVAC to cooling
      - action: select.select_option
        data:
          option: cooling
        target:
          entity_id: select.operation_mode
  trace:
    stored_traces: 20
  mode: single
  max_exceeded: silent
