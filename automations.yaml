- id: '1736593579794'
  alias: DHW - Correct the target temperature when it goes loko
  description: >-
    Workaround: something overrules the DHW target temperature and leaves us with
    cold water - the root cause was never diagnosed. Keep it until it is.

    Herschreven 2026-09-17. Was: alles boven een hardgecodeerde 46 graden
    terugzetten naar 45. Die drempel botst met de zonnesturing, die bewust naar
    52 opwarmt, en zou elke opwarmbeurt binnen een minuut terugdraaien. Vergelijkt nu
    tegen sensor.dhw_target_setpoint - het setpoint dat het vat volgens de
    sturing hoort te hebben. Dat is strikt breder dan het origineel, want het
    vangt ook een te LAAG overgenomen setpoint.

    De is_number-guard is nodig omdat sensor.dhw_target_setpoint unavailable
    wordt als de tanksensor wegvalt; dan valt er niets te vergelijken en mag er
    zeker niets geschreven worden.
  triggers:
  - trigger: template
    value_template: >-
      {{ states('sensor.dhw_target_setpoint') | is_number
         and (state_attr('water_heater.domestic_hot_water_tank',
                         'temperature') | float(-1)
              != states('sensor.dhw_target_setpoint') | float) }}
    for:
      minutes: 5
  conditions: []
  actions:
  - action: persistent_notification.create
    metadata: {}
    data:
      notification_id: dhw_target_temp_corrected
      title: Warmwater temperatuur
      message: >-
        Tapwater-setpoint stond op {{
        state_attr('water_heater.domestic_hot_water_tank', 'temperature') }} in
        plaats van {{ states('sensor.dhw_target_setpoint') }}. Teruggezet.
  - action: water_heater.set_temperature
    metadata: {}
    data:
      temperature: "{{ states('sensor.dhw_target_setpoint') | float }}"
    target:
      entity_id: water_heater.domestic_hot_water_tank
  mode: restart
- id: '1766775549186'
  alias: Motion Lights - Control shed lights
  description: Turn on the light in the shed once entering and turn off after a while
  use_blueprint:
    path: robsonke/motion-illuminance-dimmable-nightmode.yaml
    input:
      motion_entity:
      - binary_sensor.hue_motion_sensor_shed_occupancy
      - binary_sensor.motion_sensor_shed_occupancy
      lux_entity: sensor.hue_motion_sensor_shed_illuminance
      lux_level: 600
      dim_time: 30
      no_motion_wait_day: 600
      day_brightness: 100
      light_target:
        entity_id:
        - light.shed_light_back
        - light.shed_light_front
      night_time_start_helper: '21:00:00'
      night_time_end_helper: 07:00:00
      night_brightness: 100
      no_motion_wait_night: 300
      # Sleep-venster uitgezet (zoals bij hal en douche/closet). Zonder deze twee
      # gelden de blueprint-defaults 23:30-06:00 en draait de automation daar
      # helemaal niet - terwijl de night_*-instellingen hierboven juist voor die
      # uren bedoeld zijn. In de schuur slaapt niemand.
      sleep_time_start_helper: '23:59:59'
      sleep_time_end_helper: 00:00:01
- id: shed_switch_sync
  alias: Lights - Keep both shed lights in sync
  description: If one of the two switches changes state, the other follows, but only
    if they are not already in the same state. This is to avoid loops and to allow
    manual override of one of the switches without breaking the automation.
  triggers:
  - trigger: state
    entity_id:
    - switch.shed_switch_1
    - switch.shed_switch_2
    to:
    - 'on'
    - 'off'
  variables:
    other_switch: "{% if trigger.entity_id == 'switch.shed_switch_1' %}\n  switch.shed_switch_2\n{%
      else %}\n  switch.shed_switch_1\n{% endif %}\n"
  conditions:
  - condition: template
    value_template: '{{ states(other_switch) != trigger.to_state.state }}'
  actions:
  - action: switch.turn_{{ trigger.to_state.state }}
    target:
      entity_id: '{{ other_switch }}'
  mode: queued
  max: 2
- id: evabed_sound_detection_armed_night
  alias: Eva Bed Sound Detection - Avond/Nacht
  description: Detecteert nood-geluiden (huilen, gillen, schreeuwen, hoesten) via
    Frigate's audio classificatie 's avonds en 's nachts. Actief vanaf 21:00; dat
    stond op 19:30, maar de slaaproutine loopt vaak nog door na dat tijdstip en dan
    ging de melding af terwijl wij nog naast haar bed stonden. Gemeten over vijf
    avonden (9-13 sep 2026) eindigde de routine tussen 19:25 en 20:04, dus 21:00
    geeft bijna een uur marge. Prijs is een blinde periode 19:30-21:00, precies het
    moment dat wij wakker beneden zitten. Loopt de routine ooit structureel door na
    21:00, gebruik dan binary_sensor.eva_slaapkamer_person als gate - die stond
    's nachts 10 uur onafgebroken uit (2 blips van 5 sec) terwijl hij tijdens de
    routine 40+ keer wisselde. Motion is daarvoor onbruikbaar met ~98 wisselingen per
    nacht met alleen Eva in de kamer. Na middernacht alleen zolang het alarm nog
    aan staat, dus zodra het nachtalarm 's ochtends uit gaat stoppen de meldingen
    (in plaats van door te lopen tot 07:00). Bewust "niet disarmed" en niet alleen
    armed_night, zodat armed_away/armed_home - wij weg, oppas in huis - de
    monitoring wel aan houdt. Stuurt direct een melding en escaleert naar een
    kritieke melding als het geluid binnen 2 minuten nog 2x terugkomt.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.evabed_crying_sound
    - binary_sensor.evabed_scream_sound
    - binary_sensor.evabed_yell_sound
    - binary_sensor.evabed_cough_sound
    to: 'on'
  - trigger: numeric_state
    entity_id: sensor.evabed_sound_level
    above: sensor.evabed_sound_level_alert_threshold
    for: 00:00:30
    id: level
  conditions:
  - condition: template
    alias: Geluidsniveau niet her-armeerd vanuit unavailable/unknown
    # Bewust alleen op de numeric_state-tak (trigger.id level): dit is
    # kinderbewaking, dus een echte melding onderdrukken is erger dan een valse.
    # De binary_sensor-triggers hierboven blijven volledig ongemoeid.
    value_template: >
      {{ trigger is not defined
         or trigger.id != 'level'
         or trigger.from_state is not defined
         or trigger.from_state is none
         or trigger.from_state.state not in ['unknown', 'unavailable'] }}
  - condition: time
    after: '21:00:00'
    before: '07:00:00'
  - condition: or
    conditions:
    - condition: time
      after: '21:00:00'
      before: '23:59:59'
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: disarmed
  - condition: template
    value_template: '{{ this is not defined or (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered,
      0)) | int > 300 }}'
  actions:
  - variables:
      sound_labels:
        binary_sensor.evabed_crying_sound: huilen
        binary_sensor.evabed_scream_sound: gillen
        binary_sensor.evabed_yell_sound: schreeuwen
        binary_sensor.evabed_cough_sound: hoesten
        sensor.evabed_sound_level: ongewoon hard geluid
      sound_label: '{{ sound_labels.get(trigger.entity_id, ''geluid'') }}'
      snap1: evabed_{{ range(1000,9999)|random }}{{ range(1000,9999)|random }}{{ range(1000,9999)|random }}{{ range(1000,9999)|random }}.jpg
      snap2: evabed_{{ range(1000,9999)|random }}{{ range(1000,9999)|random }}{{ range(1000,9999)|random }}{{ range(1000,9999)|random }}.jpg
  - action: shell_command.prune_message_snapshots
  - action: camera.snapshot
    target:
      entity_id: camera.evabed
    data:
      filename: /config/www/messages/{{ snap1 }}
  - action: notify.all_phones
    data:
      title: "\U0001F50A Geluid bij Eva"
      message: Eva maakt geluid ({{ sound_label }})
      data:
        persistent: true
        tag: eva-sound
        image: /local/messages/{{ snap1 }}
  - repeat:
      count: 2
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.evabed_crying_sound
          - binary_sensor.evabed_scream_sound
          - binary_sensor.evabed_yell_sound
          - binary_sensor.evabed_cough_sound
          to: 'on'
        - trigger: numeric_state
          entity_id: sensor.evabed_sound_level
          above: sensor.evabed_sound_level_alert_threshold
          for: 00:00:10
        timeout: 00:02:00
      - if:
        - condition: template
          value_template: '{{ wait.trigger is none }}'
        then:
        - stop: Geluid hield niet aan - geen escalatie nodig
  - action: camera.snapshot
    target:
      entity_id: camera.evabed
    data:
      filename: /config/www/messages/{{ snap2 }}
  - action: notify.all_phones
    data:
      title: ⚠️ Aanhoudend geluid bij Eva
      message: Eva maakt al even geluid, ga even kijken!
      data:
        persistent: true
        tag: eva-sound
        image: /local/messages/{{ snap2 }}
        push:
          sound:
            name: default
            critical: 1
            volume: 1
          interruption-level: critical
  mode: single
- id: doorbell_camera_popup
  alias: Deurbel - Popup camera bij bellen of persoon
  description: 'Toont de voordeurcamera in een popup (browser_mod) zodra er wordt
    aangebeld of een persoon wordt gedetecteerd. Gebruikt persoon-detectie i.p.v.
    ruwe beweging om te voorkomen dat de popup bij elke auto/voorbijganger opent.

    '
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.langeweide_doorbell_visitor
    - binary_sensor.langeweide_doorbell_person
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.tab_a9_van_rob_screen
  - action: button.press
    target:
      entity_id: button.tab_a9_van_rob_bring_to_foreground
  - delay: 00:00:02
  - action: browser_mod.popup
    data:
      browser_id:
      - browser_mod_028aaaa1_36a40792
      title: '{{ ''Er wordt aangebeld'' if is_state(''binary_sensor.langeweide_doorbell_visitor'',
        ''on'') else ''Beweging bij de voordeur'' }}

        '
      size: wide
      timeout: 45000
      dismissable: true
      content:
        type: picture-entity
        entity: camera.langeweide_doorbell_clear
        camera_view: live
        show_name: false
        show_state: false
  mode: restart
- id: pool_light_program_next
  alias: Zwembad - Volgend lichtprogramma
  description: 'Roteert input_select.pool_light_program_options en stuurt het bijbehorende
    PSxx-commando naar de PLP-REM-350. De input_button was er al maar werd door niets
    opgepakt.

    Bewust expliciet PSxx in plaats van het PsU-commando van de controller: HA bezit
    de programmalijst, dus een programma direct adresseren houdt HA en de controller
    gelijk, terwijl een cursor in de controller nergens teruggemeld wordt.

    '
  triggers:
  - trigger: state
    entity_id: input_button.pool_light_program_next
    not_to:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: input_select.select_next
    target:
      entity_id: input_select.pool_light_program_options
    data:
      cycle: true
  - action: esphome.s3_pool_lights_send_uart_command
    data:
      command: PS{{ states('input_select.pool_light_program_options')[:2] }}
  mode: single
- id: pool_light_program_previous
  alias: Zwembad - Vorig lichtprogramma
  description: 'Spiegelbeeld van "Zwembad - Volgend lichtprogramma"; zie die automation
    voor de reden dat hier PSxx wordt gestuurd en niet PsD.

    '
  triggers:
  - trigger: state
    entity_id: input_button.pool_light_program_previous
    not_to:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: input_select.select_previous
    target:
      entity_id: input_select.pool_light_program_options
    data:
      cycle: true
  - action: esphome.s3_pool_lights_send_uart_command
    data:
      command: PS{{ states('input_select.pool_light_program_options')[:2] }}
  mode: single
- id: '1789600000001'
  alias: DHW - Plan het opwarmvenster
  description: >-
    Bepaalt een keer per etmaal wanneer het tapwatervat opgewarmd wordt: rond de
    zonnepiek als Solcast genoeg belooft, anders in het goedkoopste prijsblok
    voor 16:00. Draait om 00:15, nadat Nordpool raw_today is doorgerold en de
    Solcast-dagprognose beschikbaar is.

    Bewust niet op live teruglevering sturen: zodra de pomp opwarmt trekt hij
    ~1,5 kW, verdwijnt het overschot en klapt de conditie om. Dat pendelt. Een
    vat van 200 liter is een trage buffer waar een opwarmbeurt uren op duurt -
    die plan je vooruit.
  triggers:
  - trigger: time
    at: 00:15:00
  conditions:
  - condition: state
    entity_id: input_boolean.dhw_solar_scheduling
    state: 'on'
  actions:
  - variables:
      solar_ok: >-
        {{ states('sensor.solcast_pv_forecast_forecast_today') | float(0)
           >= states('input_number.dhw_solar_threshold') | float(8) }}
      planned: >-
        {% if solar_ok and has_value('sensor.solcast_pv_forecast_peak_time_today') %}
          {% set peak = (states('sensor.solcast_pv_forecast_peak_time_today')
                         | as_datetime | as_local) - timedelta(minutes=45) %}
          {{ ([([peak, today_at('10:30')] | max), today_at('15:00')]
              | min).strftime('%H:%M:%S') }}
        {% elif has_value('sensor.dhw_cheapest_charge_start') %}
          {{ states('sensor.dhw_cheapest_charge_start') }}
        {% else %}
          {{ states('input_datetime.dhw_charge_start') }}
        {% endif %}
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.dhw_charge_start
    data:
      time: '{{ planned | trim }}'
  mode: single
- id: '1789600000002'
  alias: DHW - Pas het setpoint toe
  description: >-
    Schrijft sensor.dhw_target_setpoint naar de warmtepomp zodra die verandert.
    Bewust dom: alle beslislogica zit in die sensor, zodat er precies een plek
    is waar het gedrag te lezen en na te rekenen valt.

    Schrijft naar de LOKALE daikin_altherma-entity, niet naar de Onecta-cloud:
    die heeft een limiet van 200 API-calls per dag.

    De is_number-guard vangt een unavailable tanktemperatuur af. De sensor wordt
    dan zelf unavailable, en een state-trigger vuurt ook op die overgang - er mag
    dan geen opdracht uitgaan.
  triggers:
  - trigger: state
    entity_id:
    - sensor.dhw_target_setpoint
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: "{{ states('sensor.dhw_target_setpoint') | is_number }}"
  actions:
  - action: water_heater.set_temperature
    target:
      entity_id: water_heater.domestic_hot_water_tank
    data:
      temperature: "{{ states('sensor.dhw_target_setpoint') | float }}"
  mode: restart
- id: '1789600000003'
  alias: DHW - Waarschuw bij koud vat
  description: >-
    Het vat hoort nooit lang onder 36 graden te staan: zelfs in de afkoelfase
    verwarmt de Daikin uit zichzelf bij op ongeveer 4 K onder het setpoint van
    40. Blijft hij toch 45 minuten koud, dan verwarmt de unit niet bij en is er
    iets stuk. Alleen melden, niet ingrijpen - ingrijpen zou het echte probleem
    maskeren.

    De from_state-guard is nodig omdat
    sensor.domestichotwatertank_tank_temperature aantoonbaar naar unavailable
    flikkert (8, 9 en 14 september 2026). Een blip of een herstart zet een
    numeric_state-trigger opnieuw scherp, waarna een ongewijzigde waarde alsnog
    vuurt. De platform-check staat er eerst omdat trigger.from_state
    LoggingUndefined is voor niet-state-triggers.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.domestichotwatertank_tank_temperature
    below: 36
    for:
      minutes: 45
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.platform != 'numeric_state'
         or (trigger.from_state is not none
             and trigger.from_state.state | is_number) }}
  actions:
  - action: persistent_notification.create
    metadata: {}
    data:
      notification_id: dhw_tank_cold
      title: Tapwatervat blijft koud
      message: >-
        Het tapwatervat staat al 45 minuten onder 36 graden ({{
        states('sensor.domestichotwatertank_tank_temperature') }} °C). De
        warmtepomp verwarmt niet bij. Controleer de unit.
  mode: single
