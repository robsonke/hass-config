  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(states.automation.alarm_notify_of_person_events_on_camera.attributes.last_triggered,
      0) | int > 120 }}'
  # Perimeter cameras only (indoor cams must not notify). Was four separate
  # `condition: template` string comparisons inside an `or:`; one `in` test is
  # equivalent and adding a camera is now a one-word edit.
  - condition: template
