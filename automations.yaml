- id: '1635279877594'
  alias: Lights - Turn on lights when dark - arriving
  description: When we come home after sunset, a few lights are on, so turn on more
    lights
  triggers:
  - trigger: state
    entity_id:
    - person.rob
    - person.steffi
    to: home
    for: 0:00:30
  - trigger: state
    entity_id: device_tracker.ix3_location
    from: not_home
    to: home
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: light.livingfront_light
      state: 'off'
    - condition: or
      alias: Dark enough - by light sensor, or by sun elevation if that is dead
      conditions:
      - condition: numeric_state
        entity_id: sensor.light_sensor_living_illuminance
        below: '30'
      - condition: and
        note: >-
          Fallback for when the living room light sensor goes offline. That
          sensor crosses 30 lux at about +4.4 deg elevation.
        conditions:
        - condition: state
          entity_id: sensor.light_sensor_living_illuminance
          state:
          - unavailable
          - unknown
        - condition: numeric_state
          entity_id: sun.sun
          attribute: elevation
          below: 5
  actions:
  - action: script.lights_on_home
    data: {}
  mode: single
- id: '1635280472840'
  alias: Lights - Turn off lights when dark - leaving
  description: We leave the house in when dark, turn off a few lights
  triggers:
  - trigger: state
    entity_id:
    - zone.home
    to: '0'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
    - condition: or
      conditions:
      - condition: state
        entity_id: light.livingfront_light
        state: 'on'
      - condition: state
        entity_id: light.kitchendesk_light
        state: 'on'
      - condition: state
        entity_id: light.diningtable_light
        state: 'on'
    # "when dark" stond wel in de naam maar nergens in de logica; de check
    # hierboven is een proxy die faalt als er overdag toevallig een lamp aan is.
    # Dan ging de weg-verlichting om 14:00 aan en bleef die hangen: "Turn off
    # lights when lighter" triggert op numeric_state above 60, en die vuurt
    # alleen bij een overgang - is het al 200 lux, dan komt er geen. Zelfde
    # or-blok en kalibratie als "dark - arriving", die dezelfde sensor gebruikt.
    - condition: or
      alias: Dark enough - by light sensor, or by sun elevation if that is dead
      conditions:
      - condition: numeric_state
        entity_id: sensor.light_sensor_living_illuminance
        below: '30'
      - condition: and
        note: >-
          Fallback for when the living room light sensor goes offline. That
          sensor crosses 30 lux at about +4.4 deg elevation.
        conditions:
        - condition: state
          entity_id: sensor.light_sensor_living_illuminance
          state:
          - unavailable
          - unknown
        - condition: numeric_state
          entity_id: sun.sun
          attribute: elevation
          below: 5
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchendesk_light
      - light.diningtable_light
      - light.livingfront_light
      - light.office_light
    data: {}
  - action: light.turn_on
    target:
      entity_id:
      - light.livingback_light
      - light.kitchen_light
      - light.dining_light
      - light.eva_corridor_light
      - light.socket2_light_couch
      - light.socket1_light_corner
    data:
      brightness_pct: 30
  mode: single
- id: '1635280845679'
  alias: Lights - Turn off lights when lighter
  description: Turn off lights in the morning or during the day after a darker period
  triggers:
  - trigger: numeric_state
    entity_id: sensor.light_sensor_living_illuminance
    above: '60'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: illuminance
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 9
    id: sun_fallback
    note: >-
      Fallback for when the living room light sensor goes offline. Calibrated
      against its own history: it crosses 60 lux at about +8.5 deg elevation,
      morning and evening alike. Only honoured while that sensor is actually
      unavailable - see the guard condition below.
  conditions:
  - condition: or
    alias: Light sensor said bright, or it died and the sun stands in
    conditions:
    - condition: trigger
      id: illuminance
    - condition: state
      entity_id: sensor.light_sensor_living_illuminance
      state:
      - unavailable
      - unknown
  - condition: and
    conditions:
    - condition: time
      after: 05:00
      before: '22:30'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: or
      conditions:
      - condition: state
        entity_id: light.socket1_light_corner
        state: 'on'
      - condition: state
        entity_id: light.kitchendesk_light
        state: 'on'
  actions:
  - action: script.lights_down_stairs_off
    data: {}
  mode: single
- id: '1635281191811'
  alias: Music - Turn off music when we left
  description: We didn't enable the Guest mode and we both left, stop the music
  triggers:
  - trigger: state
    entity_id:
    - zone.home
    to: '0'
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: media_player.media_pause
    target:
      entity_id:
      - media_player.eetkamer
      - media_player.office
      - media_player.living_room
      # The Shed speaker. Three names for one box (RINCON_347E5C5077FE01400):
      # the music hub calls it "Shed" via its Music Assistant entity
      # media_player.office_ma_sonos, the garden pop-up calls it "Tuin", and the
      # native Sonos entity below is named "Speakers Overkapping Sonos".
      # Targeting the native Sonos one matches the three entries above and
      # pauses it whichever way playback was started, since Music Assistant
      # streams through this same player.
      - media_player.overkapping_overkapping_sonos_speakers_overkapping_sonos
    data: {}
  mode: single
