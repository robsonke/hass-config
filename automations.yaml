- id: '1618070798660'
  alias: Battery - Low battery level detection & notification for all battery sensors
  description: Low battery level detection & notification for all battery sensors
  use_blueprint:
    path: sbyx/low-battery-level-detection-notification-for-all-battery-sensors.yaml
    input:
      time: '10:00:00'
      actions:
      - action: notify.mobile_app_iphone_rob
        data:
          message: "\U0001F50B Low battery warning for {{sensors|replace(\"_\",\"
            \")}}"
          data:
            persistent: true
            tag: persistent
      - action: persistent_notification.create
        metadata: {}
        data:
          title: Battery low
          message: "\U0001F50B Low battery warning for {{sensors|replace(\"_\",\"
            \")}}"
- id: alarm_auto_arm_when_away
  alias: Alarm - Auto arm since we're away and all is closed
  description: We didn't enable the Guest mode and we both left, arm the house
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    for:
      hours: 0
      minutes: 3
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - data:
      message: ⏰ We zijn beiden weg, het alarm wordt geactiveerd
      data:
        persistent: true
        tag: persistent
    action: notify.all_phones
  - target:
      entity_id: alarm_control_panel.alarmo
    data: {}
    action: alarm_control_panel.alarm_arm_away
  mode: single
- id: alarm_auto_disarm_when_arriving
  alias: Alarm - Disarm automatically when one of us comes home
  description: Automatically disarm when we come home
  triggers:
  - entity_id:
    - person.rob
    - person.steffi
    to: home
    for: 0:00:30
    trigger: state
  - entity_id: device_tracker.ix3_location
    to: home
    from: not_home
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: armed_away
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: armed_home
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: pending
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: triggered
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: arming
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: notify.all_phones
    data:
      message: ⏰ Een van ons komt thuis, het alarm wordt gedeactiveerd.
      data:
        persistent: true
        tag: persistent
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  mode: single
- id: alarm_triggered_alert
  alias: Alarm - Triggered BEEP BEEP BEEP
  description: Now we are in trouble, the alarm is triggered and we have not disarmed
    it. A lot of noise and lights will be activated.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: triggered
  actions:
  - action: notify.all_phones
    data:
      message: "\U0001F6A8\U0001F6A8 ALARM! Het alarm gaat af en is te laat gedeactiveerd!
        \U0001F6A8\U0001F6A8"
      data:
        persistent: true
        tag: persistent
        push:
          sound: alarm.caf
          critical: 1
          volume: 1
          interruption-level: critical
        actions:
        - action: URI
          title: Bekijk cams
          uri: /lovelace-bubble/overzicht#cameras
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alarm_active
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: triggered
      - condition: template
        value_template: '{{ repeat.index <= 20 }}'
      sequence:
      - data:
          sonos_entity: media_player.eetkamer
          volume: 30
          message: Je bent gezien en wordt nu gefilmd!
        action: script.sonos_say
      - action: script.sonos_play_sound
        data:
          mp3_url: http://192.168.0.40:8123/local/sounds/alarm2.mp3
          volume: 40
          sonos_entity: media_player.living_room
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.alarm_active
  mode: single
- id: alarm_pending_trigger
  alias: Alarm - Pending
  description: Warn the person that walked in about the armed alarm, goal is to disarm
    asap
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: pending
  actions:
  - data:
      sonos_entity: media_player.eetkamer
      volume: 20
      message: Je bent gezien, deactiveer het alarm binnen 2 minuten!
    action: script.sonos_say
  - data:
      title: Alarm actief
      content:
        type: custom:alarmo-card
        entity: alarm_control_panel.alarmo
    action: browser_mod.popup
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: pending
      - condition: template
        value_template: '{{ repeat.index <= 10 }}'
      sequence:
      - data:
          mp3_url: http://192.168.0.40:8123/local/sounds/pending_alarm.mp3
          volume: 40
          sonos_entity: media_player.living_room
        action: script.sonos_play_sound
  mode: single
- id: alarm_disarm_correctly
  alias: Alarm - Disarmed
  description: Send a message that the alarm is properly disarmed and inform the person
    over speakers
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    from:
    - triggered
    - pending
    to: disarmed
  actions:
  - action: notify.all_phones
    data:
      message: '✅ ALARM: Het alarm is uitgezet.'
      data:
        persistent: true
        tag: persistent
  - action: script.sonos_say
    data:
      sonos_entity: media_player.eetkamer
      volume: 20
      message: Het alarm is uitgeschakeld
  mode: single
- id: alarm_auto_disarm_when_guest_mode
  alias: Alarm - Disarm automatically when guest mode is enabled
  description: When we enable guest mode (e.g. remotely while away), make sure the
    alarm is disarmed so guests can enter
  triggers:
  - trigger: state
    entity_id: input_boolean.guest_mode
    from: 'off'
    to: 'on'
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
  - action: notify.all_phones
    data:
      message: ⏰ Gastmodus is geactiveerd, het alarm wordt gedeactiveerd.
      data:
        persistent: true
        tag: persistent
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  mode: single
- id: reset_lights_automation
  alias: Lights - Reset lights automation
  description: When we have disabled all automatic lighting, we reset this in the
    early morning to make sure we're back to normal the next day
  triggers:
  - trigger: time
    at: 05:00:00
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'off'
    - condition: state
      entity_id: input_boolean.enable_automatic_garden_lights
      state: 'off'
    - condition: state
      entity_id: input_boolean.enable_automatic_screens
      state: 'off'
  actions:
  - action: input_boolean.turn_on
    entity_id: input_boolean.enable_automatic_lights
  - action: input_boolean.turn_on
    entity_id: input_boolean.enable_automatic_garden_lights
  - action: input_boolean.turn_on
    entity_id: input_boolean.enable_automatic_screens
- id: groundfloor_lights_on_when_dark_away
  alias: Lights - Turn on lights when dark - away
  description: Switch standard lights on when it's after 2 PM and light level too
    low
  triggers:
  - trigger: numeric_state
    entity_id: sensor.light_sensor_living_illuminance
    below: '30'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: light.socket2_light_couch
      state: 'off'
    - condition: time
      after: '14:00'
      before: '22:30'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: zone.home
      state: '0'
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: script.lights_on_away
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  mode: single
- id: groundfloor_lights_on_when_dark_home
  alias: Lights - Turn on lights when dark - home
  description: Switch standard lights on when it's after 2 PM and light level too
    low
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.light_sensor_living_illuminance
    below: '30'
    for:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: '10:00'
      before: '22:30'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: binary_sensor.people_home_and_awake
      state: 'on'
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state: disarmed
  actions:
  - action: script.lights_on_home
    data: {}
  - delay: '1'
  mode: single
- id: calendar_trash_alert
  alias: Calendar - Afval Calendar Alert
  description: Send messages when a trash bin should be put outside
  triggers:
  - entity_id: sensor.gft_days_until_collection
    trigger: state
    to: '1'
    for:
      hours: 20
      minutes: 0
      seconds: 0
  - entity_id: sensor.rest_days_until_collection
    trigger: state
    to: '1'
    for:
      hours: 20
      minutes: 0
      seconds: 0
  - entity_id: sensor.paper_days_until_collection
    trigger: state
    to: '1'
    for:
      hours: 20
      minutes: 0
      seconds: 0
  actions:
  - action: notify.all_phones
    data_template:
      message: "\U0001F4C5  Opletten {{ state_attr(trigger.entity_id, 'friendly_name')
        }}!"
      data:
        persistent: true
        tag: persistent
- id: doorbell_ring_notification
  alias: Doorbell - Notification Doorbell Ring
  description: Say ding dong through the speakers when doorbell rings
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.langeweide_doorbell_visitor
    from: 'off'
    to: 'on'
  actions:
  - parallel:
    - action: script.sonos_play_sound
      data:
        volume: 30
        sonos_entity: media_player.eetkamer
        mp3_url: http://192.168.0.40:8123/local/sounds/doorbell2.mp3
    - action: script.sonos_play_sound
      data:
        volume: 30
        sonos_entity: media_player.woonkamer_ma_sonos
        mp3_url: http://192.168.0.40:8123/local/sounds/doorbell2.mp3
  - condition: time
    after: 06:00:00
    before: '22:00:00'
  - action: script.sonos_play_sound
    data:
      volume: 20
      sonos_entity: media_player.slaapkamer_sonos
      mp3_url: http://192.168.0.40:8123/local/sounds/doorbell2.mp3
- id: garden_lights_turn_on
  alias: Garden - Turn on garden lights
  description: When it's getting dark and at least after 4 PM, turn on lights in the
    garden
  triggers:
  - entity_id:
    - sensor.light_sensor_garden_illuminance
    below: 12
    trigger: numeric_state
  - at: 07:00
    trigger: time
  - entity_id: sun.sun
    attribute: elevation
    below: '-3'
    trigger: numeric_state
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: time
        after: '16:00'
      - condition: time
        before: '22:55'
      - condition: state
        entity_id: input_boolean.enable_automatic_garden_lights
        state: 'on'
      - condition: state
        entity_id: light.hue_lily_light_fence_1
        state: 'off'
    - alias: In the morning it should be dark enough and not just turned off by the
        other automation
      condition: and
      conditions:
      - condition: time
        after: 06:15
      - condition: time
        before: 08:55
      - condition: state
        entity_id: input_boolean.enable_automatic_garden_lights
        state: 'on'
      - condition: state
        entity_id: light.hue_lily_light_fence_1
        state: 'off'
      - condition: state
        entity_id: light.garden_lantern_light1
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.light_sensor_living_illuminance
          below: 8
        - condition: numeric_state
          entity_id: sun.sun
          attribute: elevation
          below: '-4'
  - condition: state
    entity_id: light.hue_lily_light_fence_1
    state: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  actions:
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id:
      - light.garden_light
  - action: light.turn_on
    data:
      color_temp_kelvin: 2200
    target:
      entity_id:
      - light.palm1_light
      - light.palm2_light
  - action: light.turn_on
    data:
      brightness_pct: 6
    target:
      entity_id: light.woodshed_light
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light1
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light2
  - action: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id: light.garden_lantern_light3
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: light.turn_on
    data:
      brightness_pct: 17
    target:
      entity_id: light.veranda_light
  - action: light.turn_on
    data:
      brightness_pct: 40
    target:
      entity_id: light.lights_wall_shed
  - action: light.turn_on
    data:
      color_temp_kelvin: 2200
    target:
      entity_id: light.hue_lights_garden
  - action: light.turn_on
    target:
      entity_id:
      - light.kerst_buiten
    data: {}
  mode: single
- id: garden_lights_turn_off
  alias: Garden - Turn off garden lights - morning
  description: Turn off lights in the garden in the morning
  triggers:
  - at: 09:00
    trigger: time
  - entity_id:
    - sensor.light_sensor_garden_illuminance
    above: 10
    for:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.enable_automatic_garden_lights
    state: 'on'
  actions:
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.veranda_light
      - light.hue_lights_garden
      - light.woodshed_light
      - light.palm1_light
      - light.palm2_light
      - light.lights_wall_shed
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.garden_lantern_light1
      - light.garden_lantern_light2
      - light.garden_lantern_light3
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: light.turn_off
    data: {}
    target:
      entity_id:
      - light.garden_light
      - light.kerst_buiten
  mode: single
- id: lights_turn_off_bedtime_manual
  alias: Sleep - Switch to night mode manually
  description: Go to bed switch, turn off all we don't need during the night. Lights,
    music, tv, etc. And turn on the alarm
  triggers:
  - entity_id:
    - alarm_control_panel.alarmo
    from: disarmed
    to: armed_night
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: '21:00:00'
    - condition: time
      before: 05:00
  actions:
  - parallel:
    - action: script.sleep_well
      data: {}
    - sequence:
      - action: light.turn_on
        data:
          brightness_pct: 30
        target:
          entity_id: light.dimmer_hall
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: light.turn_off
        target:
          entity_id: light.dimmer_hall
        data: {}
      alias: Turn on hall light shortly
  - alias: Turn off the couch and corner light too if it's after 11 pm
    condition: or
    conditions:
    - condition: time
      after: '22:55:00'
    - condition: time
      after: 00:00:00
      before: 05:00:00
  - action: light.turn_off
    target:
      entity_id:
      - light.socket1_light_corner
      - light.socket2_light_couch
    data: {}
  mode: single
- id: lights_turn_off_bedtime_auto
  alias: Lights - Turn off lights automatically - bedtime
  description: Turn off main lights when we're not home or already went to bed
  triggers:
  - trigger: time
    at: '23:03:00'
  - trigger: state
    entity_id: zone.home
    to: '0'
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: light.socket2_light_couch
      state: 'on'
    - condition: time
      after: '23:03'
    - condition: state
      entity_id: input_boolean.enable_automatic_lights
      state: 'on'
    - condition: state
      entity_id: zone.home
      state: '0'
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
  actions:
  - action: script.sleep_well
    data: {}
  - action: light.turn_off
    target:
      entity_id:
      - light.socket1_light_corner
      - light.socket2_light_couch
  mode: single
- id: closet_light_turn_on
  alias: Lights - Turn on lights when closet door opens
  triggers:
  - trigger: state
    entity_id: binary_sensor.door_hallcloset_openclose_contact
    from: 'off'
    to: 'on'
  actions:
  - action: light.turn_on
    data: {}
    target:
      entity_id: light.hallcloset_light
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.door_hallcloset_openclose_contact
      from: 'on'
      to: 'off'
    timeout: 00:15:00
    continue_on_timeout: true
  - action: light.turn_off
    data: {}
    target:
      entity_id: light.hallcloset_light
  mode: restart
- id: lights_kitchen_turn_on_when_awake_morning
  alias: Lights - Morning routine disarm alarm and turn on kitchen lights
  triggers:
  - entity_id: binary_sensor.hallwaydoor_sensor_contact
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: 04:00
    before: '11:00:00'
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state: armed_night
    for:
      hours: 0
      minutes: 10
      seconds: 0
  actions:
  - action: alarm_control_panel.alarm_disarm
    data:
      code: automation
    target:
      entity_id: alarm_control_panel.alarmo
  - choose:
    - conditions:
      - condition: time
        after: 06:00
      - condition: numeric_state
        entity_id: zone.home
        above: '0'
      sequence:
      - action: media_player.media_play
        data: {}
        target:
          entity_id: media_player.eetkamer
  - condition: numeric_state
    entity_id: sensor.light_sensor_living_illuminance
    below: '60'
  - action: light.turn_on
    data:
      brightness_pct: 40
    target:
      entity_id:
      - light.kitchendesk_light
      - light.diningtable_light
  - action: light.turn_on
    target:
      entity_id:
      - light.kerst_binnen
  mode: single
- alias: System - Let's Encrypt Renewal
  id: system_lets_encrypt
  description: Restart the lets encrypt addon, this should renew the certificate
  triggers:
    trigger: time
    at: 01:15:00
  actions:
  - action: hassio.addon_restart
    data:
      addon: core_letsencrypt
- id: presence_detection_message_speakers
  alias: Presence - Inform that one of us comes home
  description: Shout through speakers that somebody is arriving when the other one
    is home
  triggers:
  - trigger: state
    for:
      seconds: 15
    entity_id:
    - person.rob
    - person.steffi
    to: home
  conditions:
  - condition: state
    state: 'off'
    entity_id: input_boolean.guest_mode
  actions:
  - action: script.sonos_say
    data_template:
      sonos_entity: media_player.eetkamer
      volume: 30
      message: Wakker worden, {{ state_attr(trigger.entity_id, 'friendly_name') }}
        komt er aan!
  - delay: '2'
  mode: single
- id: presence_frigate_object_detection
  alias: Alarm - Notify of person events on camera
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''person'' }}'
  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(states.automation.alarm_notify_of_person_events_on_camera.attributes.last_triggered,
      0) | int > 120 }}'
  - condition: template
    value_template: "{{ trigger.payload_json['after']['camera'] in\n   ['zijkant',
      'terras', 'veranda', 'bijkeuken'] }}\n"
  actions:
  - action: notify.all_phones
    data:
      message: Er is een {{trigger.payload_json["after"]["label"]}} gedetecteerd op
        de {{ trigger.payload_json["after"]["camera"] }} camera
      data:
        persistent: true
        image: http://192.168.0.40:8123/api/frigate/notifications/{{trigger.payload_json["after"]["id"]}}/thumbnail.jpg
        tag: '{{trigger.payload_json["after"]["id"]}}'
        when: '{{trigger.payload_json["after"]["start_time"]|int}}'
        entity_id: camera.{{trigger.payload_json["after"]["camera"]}}
  mode: single
- id: '1628796760216'
  alias: Alarm - Turn on lights when person events on camera
  description: Alle tuinlichten aan bij een persoon op een buitencamera terwijl het
    alarm staat
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  - condition: template
    value_template: '{{ trigger.payload_json[''type''] == ''new'' }}'
  - condition: template
    value_template: '{{ trigger.payload_json[''after''][''label''] == ''person'' }}'
  - condition: template
    value_template: "{{ trigger.payload_json['after']['camera'] in\n   ['zijkant',
      'terras', 'veranda', 'bijkeuken'] }}\n"
  - condition: numeric_state
    entity_id: sensor.light_sensor_garden_illuminance
    below: 10
  - condition: state
    entity_id: light.lights_garden
    state: 'off'
  actions:
  - action: light.turn_on
