- id: '1663353341942'
  alias: System - Alert in case of heavy water usage in one day
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id: sensor.water_daily
    above: 5
  conditions:
  # De conditie die hier stond (numeric_state above 5) dupliceerde de trigger exact
  # en kon dus nooit falen - dode code. Vervangen door de guard die wel iets doet.
  - condition: template
    alias: Niet her-armeerd vanuit unavailable/unknown
    # Een numeric_state-trigger her-armeert na een HA-herstart of sensorblip: de
    # sensor gaat van unavailable naar zijn oude waarde, dat telt als overschrijding
    # en de melding gaat af zonder dat er iets veranderd is.
    value_template: >
      {{ trigger is not defined
         or trigger.from_state is not defined
         or trigger.from_state is none
         or trigger.from_state.state not in ['unknown', 'unavailable'] }}
  actions:
  - action: persistent_notification.create
    data:
      notification_id: system_alert_in_case_of_heavy_water_usage_in_one_day
      title: Water verbruik
      message: "\U0001F4A6 Let op, we hebben vandaag al meer dan 5 kuub water verbruikt!"
  mode: single
- id: '1663403485592'
  alias: HVAC - Set default temperature
  description: This sets the temperature based on the heating or cooling mode. We
    also reset the target temperature every night, in case somebody overruled it.
    Overall, heatpumps better have some kind of default minimum, so we never go below
    18 degrees
  triggers:
  - trigger: state
    entity_id:
    - input_number.hvac_winter_target_temperature
    - input_number.hvac_summer_target_temperature
  - trigger: time
    at: 02:00:00
  conditions:
  # The two `| float` calls in the branches below have no default, so an
  # unavailable helper would raise. Guarding here means the automation does
  # nothing in that case rather than pushing a wrong setpoint at the heat pump -
  # doing nothing is the safe failure for heating.
  - alias: Both target-temperature helpers have a value
    condition: template
    value_template: >
      {{ has_value('input_number.hvac_winter_target_temperature')
         and has_value('input_number.hvac_summer_target_temperature') }}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: select.operation_mode
        state: heating
      sequence:
      - action: climate.set_temperature
        data:
          temperature: '{{ states(''input_number.hvac_winter_target_temperature'')
            | float }}'
        target:
          entity_id: climate.warmtepomp
        alias: Heat - Set temperature to the winter target during the day
    - conditions:
      - condition: state
        entity_id: select.operation_mode
        state: cooling
      sequence:
      - action: climate.set_temperature
        data:
          temperature: '{{ states(''input_number.hvac_summer_target_temperature'')
            | float }}'
        target:
          entity_id: climate.warmtepomp
        alias: Cool - Set temperature to the summer target
    alias: Set the right target temperature, depending on season
  trace:
    stored_traces: 20
  mode: single
- id: '1663405385606'
  alias: HVAC - Control the heatpump
  description: This controls whether the heatpump should be turned on or not. Based
    on pricing or potential PV over capacity (later). So far, using the price works
    oke, the higher the price, the more need there is for power, so the less we do.
  triggers:
  - trigger: state
    entity_id:
    - sensor.energy_price_level
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - input_boolean.heating_downstairs
    - input_boolean.cooling_downstairs
  - trigger: state
    entity_id:
    - climate.warmtepomp
    not_to:
    - unavailable
    - unknown
    not_from:
    - unavailable
    - unknown
  conditions:
  - condition: state
    entity_id: input_boolean.enable_automatic_hvac
    state: 'on'
    alias: Only dis/enable the heappump when the automation is active
  actions:
  - alias: Turn on when needed and the price is oke, otherwise default off
    choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.cheapest_16_hours_24h
          state: 'on'
          alias: Is this one of the cheapest hours of the day
        - condition: numeric_state
          entity_id: sensor.energy_price_level
          attribute: percentage
          below: 91
          alias: Or in case the price is low, probably giving the same result
        alias: Check if the price is oke
      - alias: Only when we are in heating or cooling mode
        condition: not
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: climate.warmtepomp
            attribute: hvac_action
            state: 'off'
          - condition: state
            entity_id: climate.warmtepomp
            attribute: hvac_action
            state: idle
          alias: The heatpump is either off or idle
      - condition: or
        alias: And only when the generic thermostat said we need to heat or cool
        conditions:
        - condition: state
          entity_id: input_boolean.cooling_downstairs
          state: 'on'
        - condition: state
          entity_id: input_boolean.heating_downstairs
          state: 'on'
      sequence:
      - action: switch.turn_on
        data: {}
        target:
          entity_id: switch.climate_control
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: switch.climate_control
          state: 'off'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.energy_price_level
          attribute: percentage
          above: 115
          alias: Or in case the price is too high
        - condition: and
          alias: And only when the generic thermostat said we do not need to heat
            and cool
          conditions:
          - condition: state
            entity_id: input_boolean.cooling_downstairs
            state: 'off'
          - condition: state
            entity_id: input_boolean.heating_downstairs
            state: 'off'
      sequence:
      - action: switch.turn_off
        data: {}
        target:
          entity_id: switch.climate_control
    # Bewust geen default:-tak. Tussen 91% en 115% met warmte-/koelvraag blijft de
    # huidige stand staan (dode band). Een default die uitschakelt maakte de
    # 115%-drempel betekenisloos: bij vraag en prijs 100% viel hij hierdoorheen
    # en ging de pomp toch uit. Alle echte uit-redenen staan in de tak hierboven.
  trace:
    stored_traces: 20
  mode: single
  max_exceeded: silent
