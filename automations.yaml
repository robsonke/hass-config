- id: '1623609811213'
  alias: Screens - Close screens voorraam on warm sunny days
  description: In case it's warm and sunny, close the screens in the morning but the
    one on the side a bit later
  triggers:
  # sun swings onto the south façade (azimuth 0=N, 90=E, 180=S, 270=W).
  # 90 = due east = the moment a south-facing façade starts getting direct sun,
  # so this closes as early as the geometry allows (~08:20 in July).
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 90
  - trigger: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 1500
    for:
      minutes: 5
  - trigger: time_pattern
    minutes: /15
  conditions:
  # VOORRAAM faces SOUTH → it gets sun from mid-morning through mid-afternoon.
  # Orientation is driven by the sun's real azimuth/elevation (season-aware,
  # so no seasonal re-tuning), and "is it actually sunny" by real PV output
  # (solaredge_dc_power) rather than OpenWeatherMap's unreliable cloud %.
  # Threshold 1500 W (lower than the side screen) so it closes earlier.
  - condition: state
    entity_id: cover.voorraam
    state: open
  # sun is on the south face
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 90
    below: 250
  # high enough to actually strike the glass
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 15
  - condition: numeric_state
    entity_id: sensor.solaredge_dc_power
    above: 1500
  - condition: numeric_state
    entity_id: sensor.today_maximum_temperature
    above: '20'
  # comfort floor only — the azimuth/elevation conditions do the real work
  - condition: time
    after: 08:00:00
  - condition: state
    entity_id: sensor.rate_rain_piezo
    state: '0.0'
  - condition: state
    entity_id: input_boolean.enable_automatic_screens
    state: 'on'
  actions:
  - action: notify.all_phones
    data:
      message: ☀️ De screens aan de voorkant gaan dicht
      data:
        persistent: true
        tag: persistent
  - action: cover.close_cover
    target:
      entity_id: cover.voorraam
    data: {}
  trace:
    stored_traces: 20
  mode: single
- id: '1623609934943'
  alias: Screens - Open screen voorraam
  description: Open the screen by the end of the day or when the sun is gone or when
    it's too windy
  triggers:
  # VOORRAAM faces SOUTH, so once the sun swings past ~west-southwest it no
  # longer hits this window → open it in the early evening (in July that's
  # ~18:00) instead of waiting for sunset. 253 leaves a 3° deadband above the
  # close range (…below 250) so the two automations can never fight.
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 253
  # sun genuinely gone (clouded over) — deadband vs close (> 1500 W)
  - trigger: numeric_state
    entity_id: sensor.solaredge_dc_power
    below: 800
    for:
      minutes: 15
  - trigger: sun
    event: sunset
  - trigger: numeric_state
    entity_id: sensor.rate_rain_piezo
    for:
      hours: 0
      minutes: 0
      seconds: 10
    above: '0'
    below: '1000'
  conditions:
  - condition: state
    entity_id: cover.voorraam
    state: closed
  - condition: state
    entity_id: input_boolean.enable_automatic_screens
    state: 'on'
  actions:
  - action: notify.all_phones
    data:
      message: ☀️ De screen aan de voorkant gaat open
      data:
        persistent: true
        tag: persistent
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.voorraam
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.voorraam
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.voorraam
  mode: single
- id: '1623610181205'
  alias: Screens - Open screen zijraam
  description: Open the screen by the end of the day or when the sun is gone or it's
    too windy
  triggers:
  # ZIJRAAM faces WEST, so it keeps its screen down until the sun is actually
  # gone — later than the south-facing voorraam (which opens ~18:00).
  - trigger: sun
    event: sunset
    id: sunset
  # Opens when the sun drops behind the western treeline/houses — which happens
  # at roughly 6.5° of COMPUTED elevation here, not at 0°. Measured: elevation
  # 2.01° at 21:24 with sunset (−0.833°) at 21:42 → ~9°/h, so the ~30 minutes of
  # "no sun" observed at 2° puts the real obstruction at ~6.5°.
  # Keep this BELOW the close automation's elevation floor (7°) so the two
  # cannot fight over the same degree.
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 6.5
    id: sundown
  - trigger: numeric_state
    entity_id: sensor.solaredge_dc_power
    below: 800
    for:
      minutes: 15
    id: clouded
  - trigger: numeric_state
    entity_id: sensor.rate_rain_piezo
    for:
      hours: 0
      minutes: 0
      seconds: 10
    above: '0'
    below: '1000'
    id: rain
  conditions:
  - condition: state
    entity_id: cover.zijraam
    state: closed
  - condition: state
    entity_id: input_boolean.enable_automatic_screens
    state: 'on'
  # On a clear evening PV output falls below 800 W well before sunset simply
  # because the sun is getting low — and a low western sun is peak glare for
  # this window. So the "clouded over" trigger may only open the screen while
  # the sun is still high (>10°), where low output really does mean cloud.
  # sunset / sundown / rain always open it.
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: trigger
        id: clouded
    - condition: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: 10
  actions:
  - action: notify.all_phones
    data:
      message: ☀️ De screen aan de zijkant gaat open
      data:
        persistent: true
        tag: persistent
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.zijraam
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.zijraam
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.zijraam
  mode: single
