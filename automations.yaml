      message: De tijd is om, het alarm wordt weer geactiveerd.
      data:
        persistent: true
        tag: persistent
  - action: script.sonos_say
    data:
      sonos_entity: media_player.living_room
      volume: 30
      message: Let op, het alarm is weer geactiveerd. Druk op de knop om het weer
        uit te zetten.
  mode: single
