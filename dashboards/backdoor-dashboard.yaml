# Wall Display dashboard (url_path: dashboard-backdoor) for the back door. Small screen, so
# big touch targets and a single column. Clock/machine tiles render only while DISARMED; once
# armed/arming/pending/triggered only the alarm numpad shows (code_arm_required: false).
title: Bijkeuken
views:
  - title: Bijkeuken
    path: home
    cards:
      # Time + weather (only while disarmed). Was custom:clock-weather-card, which HACS
      # uninstalled and broke the panel, then a plain markdown card. Now uses the two local
      # Bubble modules below (bubble_card/modules/), so nothing external can remove them again.
      - type: conditional
        conditions:
          - entity: alarm_control_panel.alarmo
            state: disarmed
        card:
          # Two Bubble modules stacked: weather_forecast (background_only) paints the animated
          # sky; bubble_calendar_enhanced (time_only_full) draws the exact clock via its own
          # setInterval. Date/weather stay in CSS, the only way to render Dutch (language: en).
          type: custom:bubble-card
          card_type: button
          button_type: state
          entity: weather.weather_langeweide_ecowitt
          name: ''
          card_layout: large
          tap_action: { action: none }
          button_action:
            tap_action: { action: none }
          modules:
            - weather_forecast
            - bubble_calendar_enhanced
          weather_forecast:
            card_layout: background_only
            hide_icon_background: true
            disable_animations: false
            disable_dynamic_background: false
          bubble_calendar_enhanced:
            card_layout: time_only_full
            align: center
            time_size: 60px
            background: none
          styles: |
            /* Card height: the calendar module positions its time absolutely, so it
               contributes no height of its own. This is the dial to turn. */
            .bubble-container, .bubble-button-container {
              min-height: 0 !important;
              height: 165px !important;
            }
            .bubble-name { display: none !important; }
            /* Dutch date + temperature + condition, bottom-centred under the clock.
               Hand-mapped Dutch (backend is a C locale, frontend is en). Middot via
               fromCharCode: Bubble eats the character after a comma inside a CSS
               content value. */
            .bubble-state {
              display: block;
              text-align: center;
              font-size: 15px !important;
              font-weight: 500;
              opacity: 0.9;
            }
          state_content: >-
            {%- set dn = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'] -%}
            {%- set mn = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'] -%}
            {%- set w = {'sunny':'zonnig','clear-night':'heldere nacht','partlycloudy':'half bewolkt','cloudy':'bewolkt','rainy':'regen','pouring':'stortregen','lightning':'onweer','lightning-rainy':'onweer en regen','snowy':'sneeuw','snowy-rainy':'natte sneeuw','fog':'nevel','windy':'wind','windy-variant':'wind','hail':'hagel','exceptional':'bijzonder'} -%}
            {%- set t = state_attr('weather.weather_langeweide_ecowitt','temperature') | float(-99999) -%}
            {%- set s = states('weather.weather_langeweide_ecowitt') -%}
            {{ dn[now().weekday()] ~ ' ' ~ now().day ~ ' ' ~ mn[now().month - 1] ~ ' · ' ~ ('--' if t == -99999 else (t | round | int) ~ '°C') ~ ' · ' ~ w.get(s, s) }}

      # ── alarm — always visible (numpad appears once armed) ────
      - type: custom:alarmo-card
        entity: alarm_control_panel.alarmo
        name: ''
        # code_arm_required is false, so with the keypad not force-pinned the
        # card natively shows the numpad only when there's a code to enter —
        # i.e. when armed (to disarm). Disarmed = arm buttons only.
        keep_keypad_visible: false
        use_clear_icon: false
        button_scale_actions: 1
        button_scale_keypad: 1
        states:
          armed_away:
            hide: false
            button_label: Afwezig
            state_label: Ingeschakeld
          armed_home:
            hide: true
          armed_night:
            hide: false
            button_label: Nacht
            state_label: Ingeschakeld
          disarmed:
            hide: false
            button_label: Uitschakelen
            state_label: Uit
        show_messages: true
        show_ready_indicator: true
        show_bypassed_sensors: true
        card_mod:
          style: |
            .header {
              padding: 10px 10px !important;
              display: inline-flex !important;
            }
            .state {
              font-size: 16px !important;
              font-weight: bold;
            }
            #cornerMenu {
              display: none !important;
            }
            div#armActions {
              display: inline-flex !important;
            }

      # ── machines (only while disarmed) ─────────────────────
      - type: conditional
        conditions:
          - entity: alarm_control_panel.alarmo
            state: disarmed
        card:
          type: horizontal-stack
          cards:
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: switch.wasmachine
              name: Wassen
              icon: mdi:washing-machine
              card_layout: large
              button_action:
                tap_action: { action: toggle }
                hold_action: { action: more-info }
              styles: |
                .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.16)' : 'rgba(255,255,255,0.05)'; })()} !important; }
                .bubble-icon-container { background-color: ${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.24)' : 'rgba(255,255,255,0.08)'; })()} !important; }
                .bubble-state { font-size: 13px !important; font-weight: 500; color: ${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return (on && p>=5) ? '#9ed9bd' : '#8f8e9e'; })()} !important; }
              state_content: >-
                {%- set on = is_state('switch.wasmachine','on') -%}
                {%- set p = states('sensor.wasmachine_switch_device_power') | float(0) -%}
                {{ 'uit' if not on else (('draait · ' ~ (p | round | int) ~ ' W') if p >= 5 else 'stil') }}
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: switch.shelly_plug_droger_relay
              name: Drogen
              icon: mdi:tumble-dryer
              card_layout: large
              button_action:
                tap_action: { action: toggle }
                hold_action: { action: more-info }
              styles: |
                .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.16)' : 'rgba(255,255,255,0.05)'; })()} !important; }
                .bubble-icon-container { background-color: ${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.24)' : 'rgba(255,255,255,0.08)'; })()} !important; }
                .bubble-state { font-size: 13px !important; font-weight: 500; color: ${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return (on && p>=5) ? '#9ed9bd' : '#8f8e9e'; })()} !important; }
              state_content: >-
                {%- set on = is_state('switch.shelly_plug_droger_relay','on') -%}
                {%- set p = states('sensor.shelly_plug_droger_power') | float(0) -%}
                {{ 'uit' if not on else (('draait · ' ~ (p | round | int) ~ ' W') if p >= 5 else 'stil') }}
