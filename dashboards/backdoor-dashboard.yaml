# YAML dashboard for the Shelly Wall Display by the back door (Bijkeuken).
# url_path: dashboard-backdoor  (registered in configuration.yaml)
# Small ~480x480 touchscreen → big touch targets, single compact column.
#
# Focus-on-disarm: the clock header and the machine tiles are wrapped in
# `conditional` cards that only render while the alarm is DISARMED. As soon
# as it's armed/arming/pending/triggered, they disappear and the alarm card
# (now showing the numpad, since code_arm_required is false) is the only
# thing on screen — all focus on keying in the disarm code.
title: Bijkeuken
views:
  - title: Bijkeuken
    path: home
    cards:
      # ── tijd + weer (alleen als alarm uit staat) ──────────────────
      # History, so nobody re-treads it: this was custom:clock-weather-card, which
      # was uninstalled from HACS and left a "Configuration error" panel on the wall
      # display (gone from www/community, from lovelace_resources AND from
      # frontend.extra_module_url). It then became a markdown card, which worked but
      # read like a text file. Now it uses the two Bubble modules below, which live
      # in bubble_card/modules/ - local files, so nothing can uninstall them from
      # under this dashboard again.
      - type: conditional
        conditions:
          - entity: alarm_control_panel.alarmo
            state: disarmed
        card:
          # Two Bubble modules stacked on one button card:
          #
          #  weather_forecast (Bubble Weather v1.2.0) in `background_only` paints the
          #    animated sky - clouds that drift with the actual wind speed, rain/snow
          #    particles, night mode - and drops its forecast grid.
          #  bubble_calendar_enhanced in `time_only_full` draws the clock on top,
          #    with `background: none` so it does not paint over that sky.
          #
          # Why the clock comes from the module and the date/weather line from CSS:
          # calendar_enhanced runs its own setInterval, so the time is always exact,
          # whereas a JS-in-styles clock only re-renders when Bubble re-renders and
          # could sit on a stale minute. The date and temperature change at most
          # daily/every few minutes, so for those the styles route is fine - and it
          # is the only way to get DUTCH, since the module formats via the frontend
          # locale and this instance runs language: en (that is what produced
          # "Thursday 13 August" before).
          #
          # `time_only_full` deliberately omits the module's own date for the same
          # reason. Reverting to the plain markdown version is one git revert away.
          type: custom:bubble-card
          card_type: button
          button_type: state
          entity: weather.weather_langeweide_ecowitt
          name: ''
          show_state: true
          card_layout: large
          tap_action: { action: none }
          button_action:
            tap_action: { action: none }
          modules:
            - weather_forecast
            - bubble_calendar_enhanced
          weather_forecast:
            card_layout: background_only
            hide_icon_background: true
            disable_animations: false
            disable_dynamic_background: false
          bubble_calendar_enhanced:
            card_layout: time_only_full
            align: center
            time_size: 60px
            background: none
          styles: |
            /* Card height: the calendar module positions its time absolutely, so it
               contributes no height of its own. This is the dial to turn. */
            .bubble-container, .bubble-button-container {
              min-height: 0 !important;
              height: 165px !important;
            }
            .bubble-name { display: none !important; }
            /* Dutch date + temperature + condition, bottom-centred under the clock.
               Hand-mapped Dutch (backend is a C locale, frontend is en). Middot via
               fromCharCode: Bubble eats the character after a comma inside a CSS
               content value. */
            .bubble-state { font-size: 0 !important; }
            .bubble-state::after {
              display: block;
              text-align: center;
              font-size: 15px !important;
              font-weight: 500;
              opacity: 0.9;
              content: "${(() => {
                const e = 'weather.weather_langeweide_ecowitt';
                const s = hass.states[e];
                const dn = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
                const mn = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
                const w = { sunny: 'zonnig', 'clear-night': 'heldere nacht', partlycloudy: 'half bewolkt', cloudy: 'bewolkt', rainy: 'regen', pouring: 'stortregen', lightning: 'onweer', 'lightning-rainy': 'onweer en regen', snowy: 'sneeuw', 'snowy-rainy': 'natte sneeuw', fog: 'nevel', windy: 'wind', 'windy-variant': 'wind', hail: 'hagel', exceptional: 'bijzonder' };
                const d = new Date();
                const dot = String.fromCharCode(32,183,32);
                const t = parseFloat(s?.attributes?.temperature);
                const temp = isNaN(t) ? '--' : Math.round(t) + '°C';
                return dn[d.getDay()] + ' ' + d.getDate() + ' ' + mn[d.getMonth()] + dot + temp + dot + (w[s?.state] || s?.state || '');
              })()}";
            }

      # ── alarm — altijd zichtbaar (numpad verschijnt zodra aan) ────
      - type: custom:alarmo-card
        entity: alarm_control_panel.alarmo
        name: ''
        # code_arm_required is false, so with the keypad not force-pinned the
        # card natively shows the numpad only when there's a code to enter —
        # i.e. when armed (to disarm). Disarmed = arm buttons only.
        keep_keypad_visible: false
        use_clear_icon: false
        button_scale_actions: 1
        button_scale_keypad: 1
        states:
          armed_away:
            hide: false
            button_label: Afwezig
            state_label: Ingeschakeld
          armed_home:
            hide: true
          armed_night:
            hide: false
            button_label: Nacht
            state_label: Ingeschakeld
          disarmed:
            hide: false
            button_label: Uitschakelen
            state_label: Uit
        show_messages: true
        show_ready_indicator: true
        show_bypassed_sensors: true
        card_mod:
          style: |
            .header {
              padding: 10px 10px !important;
              display: inline-flex !important;
            }
            .state {
              font-size: 16px !important;
              font-weight: bold;
            }
            #cornerMenu {
              display: none !important;
            }
            div#armActions {
              display: inline-flex !important;
            }

      # ── machines (alleen als alarm uit staat) ─────────────────────
      - type: conditional
        conditions:
          - entity: alarm_control_panel.alarmo
            state: disarmed
        card:
          type: horizontal-stack
          cards:
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: switch.wasmachine
              name: Wassen
              icon: mdi:washing-machine
              card_layout: large
              button_action:
                tap_action: { action: toggle }
                hold_action: { action: more-info }
              styles: |
                .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.16)' : 'rgba(255,255,255,0.05)'; })()} !important; }
                .bubble-icon-container { background-color: ${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.24)' : 'rgba(255,255,255,0.08)'; })()} !important; }
                .bubble-state { font-size: 0 !important; }
                .bubble-state::after { font-size: 13px !important; font-weight: 500; color: ${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return (on && p>=5) ? '#9ed9bd' : '#8f8e9e'; })()} !important; content: "${(() => { const on=hass.states['switch.wasmachine']?.state==='on'; const p=parseFloat(hass.states['sensor.wasmachine_switch_device_power']?.state)||0; return !on ? 'uit' : (p>=5 ? 'draait · '+Math.round(p)+' W' : 'stil'); })()}"; }
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: switch.shelly_plug_droger_relay
              name: Drogen
              icon: mdi:tumble-dryer
              card_layout: large
              button_action:
                tap_action: { action: toggle }
                hold_action: { action: more-info }
              styles: |
                .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.16)' : 'rgba(255,255,255,0.05)'; })()} !important; }
                .bubble-icon-container { background-color: ${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return (on && p>=5) ? 'rgba(45,170,115,0.24)' : 'rgba(255,255,255,0.08)'; })()} !important; }
                .bubble-state { font-size: 0 !important; }
                .bubble-state::after { font-size: 13px !important; font-weight: 500; color: ${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return (on && p>=5) ? '#9ed9bd' : '#8f8e9e'; })()} !important; content: "${(() => { const on=hass.states['switch.shelly_plug_droger_relay']?.state==='on'; const p=parseFloat(hass.states['sensor.shelly_plug_droger_power']?.state)||0; return !on ? 'uit' : (p>=5 ? 'draait · '+Math.round(p)+' W' : 'stil'); })()}"; }
