            offset: -100
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options: { columns: full, rows: 1 }
          - type: custom:bubble-card
            card_type: separator
            name: Boven
            icon: mdi:bed-double
            modules: [bubble_compact_rows]
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: light.lights_upstairs
            name: Verlichting
            tap_action: { action: navigate, navigation_path: '#verlichting-boven' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#verlichting-boven' }
            modules: [bubble_neon_icon_only]
            styles: |
              .bubble-button-background {
                opacity: 1 !important;
                background-color: ${(state === 'on' ? 'rgba(255, 190, 90, 0.28)' : 'transparent')} !important;
              }
              /* show how many member lights are on (like the windows count) */
              .bubble-state {
                font-size: 14px !important;
              }
            state_content: >-
              {%- set on = expand('light.lights_upstairs') | selectattr('state','eq','on') | list | count -%}
              {{ 'Alles uit' if on == 0 else on ~ ' aan' }}
            grid_options: { columns: 6, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: climate.eurom_alutherm_baseboard_heater
            name: Klimaat
            icon: mdi:thermostat
            tap_action: { action: navigate, navigation_path: '#klimaat-boven' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#klimaat-boven' }
            modules: [bubble_neon_icon_only]
            state_content: >-
              {%- set t = states('sensor.climate_sensor_masterbedroom_temperature') | float(-99999) -%}
              {{ (('%.1f' | format(t)) ~ ' °C') if t != -99999 else '—' }}
            styles: |
              /* show the master-bedroom room temperature (the heater has none) */
              .bubble-state {
                font-size: 14px !important;
              }
            grid_options: { columns: 6, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: media_player.music_upstairs
            name: Muziek
            icon: mdi:music
            show_entity_picture: true      # album art when playing
            sub_button:
              - icon: mdi:play-pause
                tap_action:
                  action: perform-action
                  perform_action: script.sonos_active_control
                  data:
                    group: media_player.music_upstairs
                    command: play_pause
            tap_action: { action: navigate, navigation_path: '#muziek-boven' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#muziek-boven' }
            modules: [bubble_neon_icon_only]
            state_content: >-
              {%- set members = expand('media_player.music_upstairs') -%}
              {%- set playing = members | selectattr('state','eq','playing') | list -%}
              {%- set paused = members | selectattr('state','eq','paused') | list -%}
              {%- if playing | count == 1 -%}{{ playing[0].name | replace('Speakers ','') | replace(' Sonos','') }}
              {%- elif playing | count > 1 -%}Speelt in {{ playing | count }} kamers
              {%- elif paused | count == 1 -%}{{ paused[0].name | replace('Speakers ','') | replace(' Sonos','') }} · pauze
              {%- elif paused | count > 1 -%}Gepauzeerd
              {%- else -%}Uit
              {%- endif -%}
            styles: |
              .bubble-button-background {
                opacity: 1 !important;
                background-color: ${(state === 'playing' ? 'rgba(130, 100, 225, 0.42)' : 'transparent')} !important;
              }
              /* The media_player group platform reports a bare "on" whenever its
                 members disagree - all-identical members give that state, any
                 other mix with a non-off member (paused counts) collapses to
                 "on". Two speakers paused plus two idle therefore read as "On"
                 while nothing is playing, and a single-member group reads the
                 raw "Idle". There is no "mixed" state to show, so derive a real
                 one from the members. Label comes from state_content (server-side
                 Jinja), so the old comma-avoidance rule for CSS content values
                 no longer applies. */
              .bubble-state {
                font-size: 14px !important;
                font-weight: 500;
                /* a long room name must not be chopped mid-word against the
                   sub-button: shrink below min-content and end on an ellipsis */
                display: block !important;
                min-width: 0 !important;
                max-width: 100% !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                white-space: nowrap !important;
              }
              /* Album art van het eerste spelende groepslid, in Jinja.
                 Reden: JS kan alleen een waarde in een vaste CSS-regel schuiven,
                 geen hele selector weglaten - vandaar de lege accolades in de
                 oude versie als er niets speelde. Jinja laat het blok gewoon weg.
                 Volgorde komt uit attributes.entity_id en NIET uit expand():
                 die sorteert anders en koos een ander lid. */
              {% set members = state_attr('media_player.music_upstairs','entity_id') or [] %}
              {% set ns = namespace(active=none) %}
              {% for m in members if ns.active is none %}{% if is_state(m,'playing') %}{% set ns.active = m %}{% endif %}{% endfor %}
              {% set pic = state_attr(ns.active,'entity_picture') if ns.active else none %}
              {% if pic %}
              .bubble-entity-picture {
                display: block !important;
                background-image: url("{{ pic }}") !important;
                background-size: cover !important;
                background-position: center !important;
              }
              {% endif %}
            grid_options: { columns: 6, rows: 2 }
