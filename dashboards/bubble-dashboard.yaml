# Shared decluttering-card templates (sonos_popup, light_button, …) so popups
# opened from this dashboard can resolve them — same file the main dashboard uses.
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  # ============================================================================
  #  Langeweide — Bubble Card dashboard (HA native "sections" view). Paste under
  #  views: in the dashboard's Raw configuration editor.
  #  Modules: weather_forecast, bubble_calendar_enhanced, bubble_badges, and local
  #  bubble_neon_icon_only (per-card icon accent only, unlike upstream Bubble Neon's whole-tile glow).
  # ============================================================================

  - title: Overzicht
    path: overzicht
    type: sections
    theme: Material You
    # dark scrim over the wallpaper so the neon accents pop (raise the 0.62
    # alpha toward 1 for even darker, lower it toward 0 to show more wallpaper)
    background: "linear-gradient(rgba(8, 6, 16, 0.62), rgba(8, 6, 16, 0.62)), url('/local/bubble_background.jpg') center / cover no-repeat"
    max_columns: 3          # mockup is a 3-column design; also fixes the header
                            # grid at 36 cols (3×12) so tile widths are deterministic
    dense_section_placement: true
    # NB: reclaiming the toolbar's space when the header is hidden is handled
    # natively by wallpanel (hide_toolbar + keep_toolbar_space: false), which
    # zeroes #view's padding-top. A card_mod padding trick does NOT work here
    # because the Material You theme pins --header-height: 64px permanently.
    sections:

      # ───────────────────────── HEADER: weer · agenda · status ──────────────
      - type: grid
        column_span: 3
        cards:
          # navbar scroll target for the "Huis" route — MOBILE ONLY
          - type: custom:anchor-card
            anchor_id: top
            timeout: 200
            offset: -50
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options: { columns: full, rows: 1 }
          # Bubble Weather (Square layout with forecast)
          # Responsive pair, same approach as the agenda below: full 5-day
          # forecast on tablet/desktop, a shorter 3-day one on phones.
          - type: custom:bubble-card
            card_type: button
            card_layout: large            # enables the module's square forecast-grid layout
            button_type: state            # shows current condition text under "Weer"
            entity: &weer_entity weather.weather_langeweide_ecowitt
            name: Weer
            tap_action: &weer_tap { action: navigate, navigation_path: '#weer' }
            button_action:
              tap_action: *weer_tap
            weather_forecast:
              type: daily
              max_days: 5
              min_day_width: 60
              disable_dynamic_background: false
              disable_animations: false
              # Bubble Weather v1.2.0: drops the grey chip behind the weather icon
              # so the module's own animated sky is uninterrupted. The icon itself
              # stays - only its background plate goes.
              hide_icon_background: true
            modules: &weer_modules
              - weather_forecast          # own animated background + weather icon; no neon override
            # Native sub-button for current temp (top-right on large layout), replacing a CSS
            # ".bubble-state::after" hack. Native keeps the localised condition text and needs
            # no comma-escaping, since show_attribute handles formatting and units itself.
            sub_button: &weer_sub
              - entity: *weer_entity
                icon: mdi:thermometer
                show_attribute: true
                attribute: temperature
                show_state: false
                show_name: false
                show_background: false
              # Live rain intensity, shown only while binary_sensor.rain_detected is on — that
              # entity is the single source of truth for "raining" (pkg_weather.yaml) and its
              # 2-minute delay_off stops the chip flickering between shower bursts.
              - entity: sensor.rate_rain_piezo
                icon: mdi:weather-pouring
                show_state: true
                show_name: false
                show_background: true
                visibility:
                  - condition: state
                    entity: binary_sensor.rain_detected
                    state: 'on'
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            grid_options: { columns: 12, rows: 4 }
          # MOBILE ONLY — shorter weather card: 3 forecast days instead of 5 and
          # one grid row less. Narrower min_day_width so 3 days still fill the
          # width on a phone rather than leaving a gap.
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: *weer_entity
            name: Weer
            tap_action: *weer_tap
            button_action:
              tap_action: *weer_tap
            weather_forecast:
              type: daily
              max_days: 4
              min_day_width: 44
              disable_dynamic_background: false
              disable_animations: false
              hide_icon_background: true
              # `scale` shrinks the whole forecast block at once - icon size, font,
              # row/column gaps all derive from --bc-wx-scale. That buys a 4th day
              # back on a phone without making the card taller, which is what the
              # earlier max_days: 3 was working around by simply showing less.
              scale: 0.85
            modules: *weer_modules
            sub_button: *weer_sub
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options: { columns: 12, rows: 3 }

          # Bubble Calendar Enhanced (agenda + live clock/date): full 4-row agenda on
          # tablet/desktop, compact 2-row on phones (shared values via YAML anchors). Visibility
          # works here via HA's card wrapper — unlike in a pop-up's child cards, where Bubble ignores it.
          - type: custom:bubble-card
            card_type: calendar
            rows: 4
            # tap opens the full agenda popup (#agenda); tapping an event too
            tap_action: &agenda_tap { action: navigate, navigation_path: '#agenda' }
            button_action:
              tap_action: *agenda_tap
            event_action:
              tap_action: *agenda_tap
            sub_button:
              main: []
              bottom: []
            entities: &agenda_entities
              - entity: calendar.joep
                color: "#4C7160"
              - entity: calendar.rob
                color: "#E9CF15"
            days: 7
            limit: 6
            modules: &agenda_modules
              - bubble_calendar_enhanced   # layout: time+date bottom, Dusk Bokeh
              - bubble_neon_icon_only
            bubble_calendar_enhanced:
              background: &agenda_bg 'radial-gradient(ellipse at 80% 15%, rgba(148,108,215,0.28) 0%, transparent 65%), radial-gradient(ellipse at 10% 85%, rgba(82,158,192,0.22) 0%, transparent 68%), radial-gradient(ellipse at 50% 50%, rgba(170,88,158,0.15) 0%, transparent 60%), #4d3a6e'
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            grid_options: { columns: 12, rows: 4 }
          # MOBILE ONLY — minimal agenda: 1 event row, 2 events, 2 grid rows (was 2/3/3).
          # Height comes purely from rows/limit/grid_options.rows (compact_mode only affects
          # sub-buttons). days: 7 keeps showing the next two events, not just today's.
          - type: custom:bubble-card
            card_type: calendar
            rows: 1
            tap_action: *agenda_tap
            button_action:
              tap_action: *agenda_tap
            event_action:
              tap_action: *agenda_tap
            sub_button:
              main: []
              bottom: []
            entities: *agenda_entities
            days: 7
            limit: 2
            modules: *agenda_modules
            bubble_calendar_enhanced:
              background: *agenda_bg
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options: { columns: 12, rows: 2 }

          # ── Right column (mockup's 3rd header column) ──────────────────────
          # ONE nested grid so it's a deterministic compact panel the same
          # height as Weer/Agenda: Alarm | Gasten on row 1, then the 2×2
          # presence grid (Rob|Steffi / Eva|Noa) below. columns:2 → 3 rows.
          - type: grid
            columns: 1
            square: false
            # Presence panel (mockup's 3rd column): lighter glass background,
            # rounded, subtle border + shadow, inner padding. Top row =
            # Alarm | Gasten (fill) + a small Settings icon button; then the
            # 2×2 people grid (Rob|Steffi / Eva|Noa).
            card_mod:
              style: |
                :host {
                  background: rgba(255, 255, 255, 0.05);
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  border-radius: 24px;
                  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
                  padding: 12px;
                  box-sizing: border-box;
                }
                /* on phones: keep the glass panel but span the full width, so the
                   buttons inside just divide the space (same width as the
                   weather/agenda cards and the sections below) */
                @media (max-width: 767px) {
                  :host { grid-column: 1 / -1 !important; }
                }
            cards:
              # top row: Alarm + Gasten fill, Settings pinned small on the right
              # (grid-template-columns is more reliable than flex here)
              - type: grid
                columns: 3
                square: false
                card_mod:
                  style: |
                    /* Alarm krijgt meer ruimte dan Gasten: de alarmtegel draagt een
                       statuslabel ("Inschakelen", "Afwezig") plus de maan-subknop,
                       Gasten alleen een icoon + korte naam. Breedte is bewust geen
                       fr-ratio maar calc(50% - 4px): dat is exact een kolom van het
                       2-koloms personenraster eronder (halve breedte min de halve
                       gap van 8px), zodat Alarm precies uitlijnt met Rob. Gasten en
                       de 56px Settings-knop delen de andere helft. */
                    #root { grid-template-columns: calc(50% - 4px) 1fr 56px !important; gap: 8px !important; }
                cards:
                  # button_type was `name`, which shows no state at all, and the neon
                  # module colours by entity keyword (/alarm|lock/ -> hue 130), so the
                  # tile was permanently green whether the house was armed or not.
                  # Now: state text + state colour (red armed, amber night, green off,
                  # blue while arming). Labels match the #alarm pop-up header.
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: alarm_control_panel.alarmo
                    name: Alarm
                    # Static on purpose: the icon field accepts no template (JS or Jinja) — either
                    # renders an empty icon. No entity-icon fallback either: Alarmo's icon attribute
                    # is fixed at mdi:shield-off even when armed, so state stays in colour + label.
                    icon: mdi:shield-home
                    tap_action: { action: navigate, navigation_path: '#alarm' }
                    button_action:
                      tap_action: { action: navigate, navigation_path: '#alarm' }
                    sub_button:
                      # Arm night. Always visible - hiding it while armed only removed
                      # a control that is still useful (going straight from away to
                      # night). It is a BUTTON, not a status icon; the tile colour and
                      # label say what the alarm is actually doing.
                      - icon: mdi:weather-night
                        tap_action:
                          action: perform-action
                          perform_action: alarm_control_panel.alarm_arm_night
                          target:
                            entity_id: alarm_control_panel.alarmo
                    modules: [bubble_neon_icon_only]
                    state_content: >-
                      {{ {'disarmed':'Uit','armed_away':'Afwezig','armed_home':'Thuis','armed_night':'Nacht','armed_vacation':'Vakantie','arming':'Inschakelen','pending':'Aftellen','triggered':'ALARM'}.get(states('alarm_control_panel.alarmo'), states('alarm_control_panel.alarmo')) }}
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      /* Doubled class beats the neon module's rule on the same element
                         without depending on stylesheet injection order. */
                      .bubble-button-container.bubble-button-container {
                        ${(() => { const st = hass.states['alarm_control_panel.alarmo']?.state; const h = st === 'disarmed' ? 145 : st === 'armed_night' ? 45 : st === 'arming' ? 210 : 2; return 'background-image: radial-gradient(140% 120% at 8% -10%, hsl(' + h + ' 92% 60% / 0.34), transparent 55%) !important; border: 1px solid hsl(' + h + ' 88% 62% / 0.78) !important;'; })()}
                      }
                      .bubble-main-icon-container.bubble-main-icon-container {
                        ${(() => { const st = hass.states['alarm_control_panel.alarmo']?.state; const h = st === 'disarmed' ? 145 : st === 'armed_night' ? 45 : st === 'arming' ? 210 : 2; return 'background: linear-gradient(135deg, hsl(' + h + ' 70% 55%), hsl(' + (h + 18) + ' 68% 58%)) !important; box-shadow: 0 0 18px hsl(' + h + ' 85% 58% / 0.40) !important;'; })()}
                      }
                      /* The moon is the arm-night BUTTON, not a status icon, and a
                         bright moon next to "Afwezig" reads as "we are in night mode".
                         So: muted while it is merely an action you could take, lit
                         amber only when night mode is actually active. */
                      .bubble-sub-button {
                        ${(() => { const night = hass.states['alarm_control_panel.alarmo']?.state === 'armed_night'; return night ? 'background-color: hsl(45 85% 55% / 0.85) !important; opacity: 1 !important;' : 'background-color: rgba(255,255,255,0.10) !important; opacity: 0.5 !important;'; })()}
                      }
                      .bubble-state {
                        font-size: 13px !important; font-weight: 500;
                        color: ${(() => { const st = hass.states['alarm_control_panel.alarmo']?.state; if (st === 'disarmed') return '#9ed9bd'; if (st === 'armed_night') return '#f0cf8f'; if (st === 'arming') return '#82bbf0'; return '#f09a99'; })()} !important;
                      }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: input_boolean.guest_mode
                    name: Gasten
                    icon: mdi:account-multiple-plus
                    tap_action:
                      action: toggle
                    button_action:
                      tap_action:
                        action: toggle
                    bubble_badges:
                      badges:
                        - name: Gastenmodus actief
                          target: main_icon
                          dot: true
                          color: red
                          condition:
                            - condition: state
                              entity_id: input_boolean.guest_mode
                              state: "on"
                    modules: [bubble_badges, bubble_neon_icon_only]
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      /* enabled = full magenta; disabled (guest mode off) = greyed + dimmed */
                      .bubble-main-icon-container {
                        filter: grayscale(${state === 'on' ? 0 : 1}) !important;
                        opacity: ${state === 'on' ? 1 : 0.4} !important;
                      }
                      .bubble-name, .bubble-state {
                        opacity: ${state === 'on' ? 1 : 0.6} !important;
                      }
                  # small icon-only Settings button → opens the system popup.
                  # Plain grey icon (no neon glow); red count badge when there
                  # are unavailable entities.
                  - type: custom:bubble-card
                    card_type: button
                    entity: sensor.unavailable_entities
                    icon: mdi:cog
                    show_name: false
                    show_state: false
                    tap_action: { action: navigate, navigation_path: '#systeem' }
                    button_action:
                      tap_action: { action: navigate, navigation_path: '#systeem' }
                    bubble_badges:
                      badges:
                        - name: Unavailable entities
                          target: main_icon
                          entity: sensor.unavailable_entities
                          # bare number: the sensor's unit_of_measurement is
                          # "entities", and without raw_state the module renders
                          # hass.formatEntityState() -> "3 entities".
                          raw_state: true
                          color: red
                          condition:
                            - condition: numeric_state
                              entity_id: sensor.unavailable_entities
                              above: 0
                    modules: [bubble_badges]
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      .bubble-icon-container { background: rgba(255, 255, 255, 0.10) !important; }
                      .bubble-main-icon { color: var(--secondary-text-color, #9aa3b2) !important; opacity: 1 !important; }
              # 2×2 people grid
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: person.rob
                    name: Rob
                    show_entity_picture: true
                    tap_action: { action: navigate, navigation_path: '#person-rob' }
                    button_action:
                      tap_action: { action: navigate, navigation_path: '#person-rob' }
                    icon_tap_action: { action: navigate, navigation_path: '#person-rob' }
                    # Running this week (utility_meter, resets Monday). Tapping
                    # the km opens the Strava pop-up rather than Rob's, so the
                    # number is a shortcut in its own right.
                    sub_button:
                      - entity: sensor.strava_run_week
                        icon: mdi:run
                        show_state: true
                        show_name: false
                        show_background: true
                        tap_action: { action: navigate, navigation_path: '#sport' }
                    bubble_badges:
                      badges:
                        - name: Thuis
                          target: main_icon
                          icon: mdi:home
                          color: green
                          condition:
                            - condition: state
                              entity_id: person.rob
                              state: "home"
                        - name: Werk
                          target: main_icon
                          icon: mdi:briefcase
                          color: blue
                          condition:
                            - condition: state
                              entity_id: person.rob
                              state: "Maxxton"
                    modules:
                      - bubble_badges   # thuis + werk badge on the main icon
                      - bubble_neon_icon_only
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      /* disabled look when not home (like Gasten) */
                      .bubble-entity-picture, .bubble-main-icon-container {
                        filter: grayscale(${state === 'home' ? 0 : 1}) !important;
                        opacity: ${state === 'home' ? 1 : 0.4} !important;
                      }
                      .bubble-name, .bubble-state {
                        opacity: ${state === 'home' ? 1 : 0.6} !important;
                      }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: person.steffi
                    name: Steffi
                    show_entity_picture: true
                    tap_action: { action: navigate, navigation_path: '#person-steffi' }
                    button_action:
                      tap_action: { action: navigate, navigation_path: '#person-steffi' }
                    icon_tap_action: { action: navigate, navigation_path: '#person-steffi' }
                    # Running this week, same as Rob's tile — tapping the km opens
                    # her Strava pop-up rather than her person pop-up.
                    sub_button:
                      - entity: sensor.strava_run_week_steffi
                        icon: mdi:run
                        show_state: true
                        show_name: false
                        show_background: true
                        tap_action: { action: navigate, navigation_path: '#sport-steffi' }
                    bubble_badges:
                      badges:
                        - name: Thuis
                          target: main_icon
                          icon: mdi:home
                          color: green
                          condition:
                            - condition: state
                              entity_id: person.steffi
                              state: "home"
                        - name: Werk
                          target: main_icon
                          icon: mdi:briefcase
                          color: blue
                          condition:
                            - condition: state
                              entity_id: person.steffi
                              state: "CJG"
                    modules: [bubble_badges, bubble_neon_icon_only]
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      /* disabled look when not home (like Gasten) */
                      .bubble-entity-picture, .bubble-main-icon-container {
                        filter: grayscale(${state === 'home' ? 0 : 1}) !important;
                        opacity: ${state === 'home' ? 1 : 0.4} !important;
                      }
                      .bubble-name, .bubble-state {
                        opacity: ${state === 'home' ? 1 : 0.6} !important;
                      }
                  # Entity is the bedroom light, not the non-functional bed-presence sensor: warm
                  # tile + room temp subtitle. Eva: dimmer_eva_bedroom in "Eva Slaapkamer" (downstairs)
                  # — NOT the old "Eva boven" area. Noa: dimmer_noa; her climate sensor's area id is 'eva'.
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: light.dimmer_eva_bedroom
                    name: Eva
                    show_entity_picture: true
                    tap_action: { action: navigate, navigation_path: '#person-eva' }
                    button_action:
                      tap_action: { action: navigate, navigation_path: '#person-eva' }
                    icon_tap_action: { action: navigate, navigation_path: '#person-eva' }
                    modules: [bubble_neon_icon_only]
                    state_content: >-
                      {%- set t = states('sensor.climate_sensor_evadownstairs_temperature') | float(-99999) -%}
                      {{ (((t | round(1)) | string | regex_replace('\.0$','')) ~ '°C') if t != -99999 else '—' }}
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      .bubble-entity-picture {
                        display: block !important;
                        background-image: url('${hass.states['camera.evabed']?.attributes?.entity_picture}') !important;
                        background-size: cover !important;
                      }
                      .bubble-main-icon { display: none !important; }
                      /* Doubled class beats the neon module's own rule on the
                         same element without relying on injection order. */
                      .bubble-button-container.bubble-button-container {
                        ${state === 'on' ? 'background-image: radial-gradient(140% 120% at 8% -10%, hsl(45 95% 62% / 0.40), transparent 55%) !important; border: 1px solid hsl(45 90% 62% / 0.80) !important;' : ''}
                      }
                      .bubble-state {
                        font-size: 13px !important; font-weight: 500;
                        color: ${state === 'on' ? '#f0c85a' : '#9b9aac'} !important;
                      }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: light.dimmer_noa
                    name: Noa
                    show_entity_picture: true
                    tap_action: { action: navigate, navigation_path: '#person-noa' }
                    button_action:
                      tap_action: { action: navigate, navigation_path: '#person-noa' }
                    icon_tap_action: { action: navigate, navigation_path: '#person-noa' }
                    modules: [bubble_neon_icon_only]
                    state_content: >-
                      {%- set t = states('sensor.climate_sensor_noa_temperature') | float(-99999) -%}
                      {{ (((t | round(1)) | string | regex_replace('\.0$','')) ~ '°C') if t != -99999 else '—' }}
                    styles: |
                      .bubble-container, .bubble-button-container { min-height: 0 !important; height: 56px !important; }
                      .bubble-entity-picture {
                        display: block !important;
                        background-image: url('${hass.states['camera.noabed']?.attributes?.entity_picture}') !important;
                        background-size: cover !important;
                      }
                      .bubble-main-icon { display: none !important; }
                      .bubble-button-container.bubble-button-container {
                        ${state === 'on' ? 'background-image: radial-gradient(140% 120% at 8% -10%, hsl(45 95% 62% / 0.40), transparent 55%) !important; border: 1px solid hsl(45 90% 62% / 0.80) !important;' : ''}
                      }
                      .bubble-state {
                        font-size: 13px !important; font-weight: 500;
                        color: ${state === 'on' ? '#f0c85a' : '#9b9aac'} !important;
                      }
            grid_options: { columns: 12, rows: 4 }

          # ── Status chip strip: child order matters — placement below is by index (Bak,
          # Papier | gap | Stookwijzer, Updates, Muziek, Picnic). Width comes from
          # grid-template-columns in the card_mod style below, not the children's grid_options.
          - type: grid
            columns: 6
            square: false
            card_mod:
              style: |
                /* mobile: row 1 = Bak | Papier (half each), row 2 = the icon chips */
                #root { grid-template-columns: repeat(6, 1fr) !important; gap: 6px !important; }
                #root > *:nth-child(1) { grid-column: 1 / 4 !important; grid-row: 1 !important; }
                #root > *:nth-child(2) { grid-column: 4 / 7 !important; grid-row: 1 !important; }
                #root > *:nth-child(3) { grid-column: 1 !important; grid-row: 2 !important; }
                #root > *:nth-child(4) { grid-column: 2 !important; grid-row: 2 !important; }
                #root > *:nth-child(5) { grid-column: 3 !important; grid-row: 2 !important; }
                #root > *:nth-child(6) { grid-column: 4 / 7 !important; grid-row: 2 !important; }
                /* desktop: everything back on one row */
                @media (min-width: 768px) {
                  #root { grid-template-columns: 160px 160px 1fr 64px 64px 64px 160px !important; }
                  #root > *:nth-child(1) { grid-column: 1 !important; grid-row: 1 !important; }
                  #root > *:nth-child(2) { grid-column: 2 !important; grid-row: 1 !important; }
                  #root > *:nth-child(3) { grid-column: 4 !important; grid-row: 1 !important; }
                  #root > *:nth-child(4) { grid-column: 5 !important; grid-row: 1 !important; }
                  #root > *:nth-child(5) { grid-column: 6 !important; grid-row: 1 !important; }
                  #root > *:nth-child(6) { grid-column: 7 !important; grid-row: 1 !important; }
                }
            grid_options: { columns: 36, rows: auto }
            cards:
            # Two informative chips instead of three dot-only ones: GFT/Restafval alternate on
            # Tuesdays (chip says which is next), Papier is monthly. Plain button_type: state,
            # since pkg_garbage.yaml sensors already hold the finished Dutch string — no JS needed.
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.next_bin_gft_or_rest
              name: Kliko
              icon: mdi:trash-can
              tap_action: { action: navigate, navigation_path: '#afval' }
              button_action:
                tap_action: { action: navigate, navigation_path: '#afval' }
              bubble_badges:
                badges:
                  # Urgency dot for the last 48 hours: orange the day before,
                  # green on collection day itself. Driven off the sensor's `days`
                  # attribute, so it needs no second entity.
                  - name: Morgen
                    target: main_icon
                    dot: true
                    color: orange
                    condition:
                      - condition: template
                        value_template: "{{ state_attr('sensor.next_bin_gft_or_rest','days') | int(999) == 1 }}"
                  - name: Vandaag
                    target: main_icon
                    dot: true
                    color: green
                    condition:
                      - condition: template
                        value_template: "{{ state_attr('sensor.next_bin_gft_or_rest','days') | int(999) == 0 }}"
              modules: [bubble_badges]
              styles: |
                :host { --bubble-border-radius: 20px; --bubble-icon-border-radius: 30%; }
                /* green when GFT is next, grey when it is restafval */
                .bubble-button-container {
                  background-image: radial-gradient(140% 120% at 8% -10%, color-mix(in srgb, ${hass.states['sensor.next_bin_gft_or_rest']?.attributes?.bin === 'gft' ? 'green' : 'grey'} 26%, transparent), transparent 55%) !important;
                  border: 1px solid color-mix(in srgb, ${hass.states['sensor.next_bin_gft_or_rest']?.attributes?.bin === 'gft' ? 'green' : 'grey'} 55%, transparent) !important;
                }
                .bubble-icon-container {
                  background: ${hass.states['sensor.next_bin_gft_or_rest']?.attributes?.bin === 'gft' ? 'green' : 'grey'} !important;
                }
              grid_options: { columns: 6, rows: 1 }
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.next_paper_collection
              name: Papier
              icon: mdi:newspaper-variant-outline
              tap_action: { action: navigate, navigation_path: '#afval' }
              button_action:
                tap_action: { action: navigate, navigation_path: '#afval' }
              bubble_badges:
                badges:
                  # Urgency dot for the last 48 hours: orange the day before,
                  # green on collection day itself. Driven off the sensor's `days`
                  # attribute, so it needs no second entity.
                  - name: Morgen
                    target: main_icon
                    dot: true
                    color: orange
                    condition:
                      - condition: template
                        value_template: "{{ state_attr('sensor.next_paper_collection','days') | int(999) == 1 }}"
                  - name: Vandaag
                    target: main_icon
                    dot: true
                    color: green
                    condition:
                      - condition: template
                        value_template: "{{ state_attr('sensor.next_paper_collection','days') | int(999) == 0 }}"
              modules: [bubble_badges]
              styles: |
                :host { --bubble-border-radius: 20px; --bubble-icon-border-radius: 30%; }
                .bubble-button-container {
                  background-image: radial-gradient(140% 120% at 8% -10%, color-mix(in srgb, #3182b7 26%, transparent), transparent 55%) !important;
                  border: 1px solid color-mix(in srgb, #3182b7 55%, transparent) !important;
                }
                .bubble-icon-container { background: #3182b7 !important; }
              grid_options: { columns: 6, rows: 1 }
            - type: custom:bubble-card
              card_type: button
              button_type: name
              entity: sensor.stookwijzer
              name: Stookwijzer
              icon: mdi:fire
              tap_action: { action: navigate, navigation_path: '#stookwijzer' }
              button_action:
                tap_action: { action: navigate, navigation_path: '#stookwijzer' }
              bubble_badges:
                badges:
                  # red dot = code_red (do not burn)
                  - name: Alert
                    target: main_icon
                    dot: true
                    color: red
                    condition:
                      - condition: state
                        entity_id: sensor.stookwijzer
                        state: code_red
                  # green dot = other codes (burning allowed)
                  - name: OK
                    target: main_icon
                    dot: true
                    color: green
                    condition:
                      - condition: state
                        entity_id: sensor.stookwijzer
                        state:
                          - code_yellow
                          - code_orange
              modules:
                - bubble_badges   # rood/groen stip-status op het icoon
                - bubble_neon_icon_only
              # Icon-only at EVERY width (was mobile-only): these are now narrow
              # 2-column chips, so there is no room for a label.
              styles: |
                .bubble-name-container { display: none !important; }
                .bubble-button-card, .bubble-button { justify-content: center !important; }
              # NOTE: grid_options is ignored inside a `grid` card — the chip
              # width comes from the parent's card_mod grid-template-columns.
              grid_options: { columns: 6, rows: 1 }
            - type: custom:bubble-card
              card_type: button
              button_type: name
              entity: sensor.all_updates
              name: Updates
              icon: mdi:package-up
              tap_action: { action: navigate, navigation_path: '#updates' }
              button_action:
                tap_action: { action: navigate, navigation_path: '#updates' }
              bubble_badges:
                badges:
                  - name: Update count
                    target: main_icon
                    entity: sensor.all_updates
                    raw_state: true          # show just the number ("3"), not "3 Update(s)"
                    color: red
                    condition:
                      - condition: numeric_state
                        entity_id: sensor.all_updates
                        above: 0
              modules:
                - bubble_badges   # badge = update count on the icon
                - bubble_neon_icon_only
              # Icon-only at EVERY width (was mobile-only): these are now narrow
              # 2-column chips, so there is no room for a label.
              styles: |
                .bubble-name-container { display: none !important; }
                .bubble-button-card, .bubble-button { justify-content: center !important; }
              # NOTE: grid_options is ignored inside a `grid` card — the chip
              # width comes from the parent's card_mod grid-template-columns.
              grid_options: { columns: 6, rows: 1 }
            - type: custom:bubble-card
              card_type: button
              button_type: name
              entity: media_player.woonkamer_ma_sonos
              name: Muziek
              icon: mdi:music
              tap_action: { action: navigate, navigation_path: '#muziek' }
              button_action:
                tap_action: { action: navigate, navigation_path: '#muziek' }
              bubble_badges:
                badges:
                  # green dot = music is playing somewhere
                  - name: Speelt
                    target: main_icon
                    dot: true
                    color: green
                    condition:
                      - condition: template
                        value_template: >
                          {{ ['media_player.woonkamer_ma_sonos','media_player.eetkamer_ma_sonos','media_player.office_ma_sonos','media_player.unnamed_room_3','media_player.unnamed_room','media_player.tv_speaker_ma_sonos','media_player.sonos_roam_2'] | select('is_state','playing') | list | count > 0 }}
              modules:
                - bubble_badges
                - bubble_neon_icon_only
              # Icon-only at EVERY width (was mobile-only): these are now narrow
              # 2-column chips, so there is no room for a label.
              styles: |
                .bubble-name-container { display: none !important; }
                .bubble-button-card, .bubble-button { justify-content: center !important; }
              # NOTE: grid_options is ignored inside a `grid` card — the chip
              # width comes from the parent's card_mod grid-template-columns.
              grid_options: { columns: 6, rows: 1 }
            - type: custom:bubble-card
              card_type: button
              button_type: state
              entity: sensor.picnic_cart_items_count
              name: Picnic
              icon: mdi:cart
              tap_action: { action: navigate, navigation_path: '#picnic' }
              button_action:
                tap_action: { action: navigate, navigation_path: '#picnic' }
              # One badge at a time (mutually exclusive): green = delivery today, same colour
              # language as the waste chips. An empty cart on a delivery day is normal once the
              # order is out — that is expected, not a bug.
              bubble_badges:
                badges:
                  - name: Mandje, bezorging vandaag
                    target: main_icon
                    entity: sensor.picnic_cart_items_count
                    color: green
                    condition:
                      - condition: numeric_state
                        entity_id: sensor.picnic_cart_items_count
                        above: 0
                      - condition: template
                        value_template: >
                          {% set s = states('sensor.picnic_expected_start_of_next_delivery') %}
                          {{ s not in ['unknown','unavailable','none',''] and as_local(as_datetime(s)).date() == now().date() }}
                  - name: Mandje
                    target: main_icon
                    entity: sensor.picnic_cart_items_count
                    color: red
                    condition:
                      - condition: numeric_state
                        entity_id: sensor.picnic_cart_items_count
                        above: 0
                      - condition: template
                        value_template: >
                          {% set s = states('sensor.picnic_expected_start_of_next_delivery') %}
                          {{ not (s not in ['unknown','unavailable','none',''] and as_local(as_datetime(s)).date() == now().date()) }}
                  - name: Bezorging vandaag, leeg mandje
                    target: main_icon
                    dot: true
                    color: green
                    condition:
                      - condition: numeric_state
                        entity_id: sensor.picnic_cart_items_count
                        below: 1
                      - condition: template
                        value_template: >
                          {% set s = states('sensor.picnic_expected_start_of_next_delivery') %}
                          {{ s not in ['unknown','unavailable','none',''] and as_local(as_datetime(s)).date() == now().date() }}
              modules:
                - bubble_badges   # badge = aantal items in het mandje
                - bubble_neon_icon_only
              state_content: >-
                {%- set s = states('sensor.picnic_expected_start_of_next_delivery') -%}
                {%- if s in ['unknown','unavailable',''] -%}Geen bezorging
                {%- else -%}
                {%- set d = s | as_datetime -%}
                {%- if d is none -%}Geen bezorging
                {%- else -%}
                {%- set dl = d | as_local -%}
                {%- set dagen = ['ma','di','wo','do','vr','za','zo'] -%}
                {{ ('vandaag' if dl.date() == now().date() else dagen[dl.weekday()]) ~ ' ' ~ dl.strftime('%H:%M') }}
                {%- endif -%}{%- endif -%}
              styles: |
                /* subtitle = when the next Picnic delivery slot starts */
                .bubble-state {
                  font-size: 12px !important;
                }
                @media (max-width: 767px) {
                  .bubble-name-container { display: none !important; }
                  .bubble-button-card, .bubble-button { justify-content: center !important; }
                }
              grid_options: { columns: 6, rows: 1 }
          # ── Bubble Card native pop-ups (each in its own popups/bpp_*.yaml) ──
          #    (widths set per-file via width_desktop; mobile = full-width)
          - !include popups/bpp_afval.yaml           # #afval  ← 3 trash chips
          - !include popups/bpp_doors_downstairs.yaml # #deuren-beneden ← Deuren (Beneden)
          - !include popups/bpp_doors_upstairs.yaml  # #ramen-boven ← Ramen (Boven)
          - !include popups/bpp_doors_garden.yaml    # #deuren-tuin ← Deuren (Tuin)
          - !include popups/bpp_covers.yaml          # #screens ← Screens
          - !include popups/bpp_energy_water.yaml    # #water ← Water
          - !include popups/bpp_person_rob.yaml      # #person-rob ← Rob
          - !include popups/bpp_strava.yaml          # #sport ← Strava (via Rob's popup)
          - !include popups/bpp_strava_steffi.yaml   # #sport-steffi ← Strava (via Steffi's popup)
          - !include popups/bpp_person_steffi.yaml   # #person-steffi ← Steffi
          - !include popups/bpp_person_eva.yaml      # #person-eva ← Eva
          - !include popups/bpp_person_noa.yaml      # #person-noa ← Noa
          - !include popups/bpp_music_downstairs.yaml  # #muziek-beneden
          - !include popups/bpp_music_upstairs.yaml  # #muziek-boven
          - !include popups/bpp_music_garden.yaml  # #muziek-tuin
          - !include popups/bpp_music_hub.yaml  # #muziek ← Muziekhub (chip)
          - !include popups/bpp_cats.yaml  # #katten ← Boris&Puk
          - !include popups/bpp_vacuum.yaml  # #sjorsje ← Sjorsje
          - !include popups/bpp_light_downstairs.yaml  # #verlichting-beneden
          - !include popups/bpp_energy_heating.yaml # #klimaat-beneden
          - !include popups/bpp_light_upstairs.yaml # #verlichting-boven
          - !include popups/bpp_climate_upstairs.yaml  # #klimaat-boven
          - !include popups/bpp_energy_usage.yaml   # #energie
          - !include popups/bpp_energy_dhw.yaml     # #warm-water
          - !include popups/bpp_pool_garden.yaml    # #zwembad
          - !include popups/bpp_light_garden.yaml   # #verlichting-tuin
          - !include popups/bpp_bbq_garden.yaml     # #bbq
          - !include popups/bpp_mower.yaml          # #grasmaaier
          - !include popups/bpp_irrigation_garden.yaml  # #beregening
          - !include popups/bpp_car_ix3.yaml        # #auto
          - !include popups/bpp_alarm.yaml          # #alarm
          - !include popups/bpp_cameras.yaml        # #cameras ← Camera hub
          - !include popups/bpp_system.yaml  # #systeem
          - !include popups/bpp_stookalert.yaml  # #stookwijzer
          - !include popups/bpp_update.yaml  # #updates
          - !include popups/bpp_picnic.yaml         # #picnic
          - !include popups/bpp_weather.yaml  # #weer
          - !include popups/bpp_calendar.yaml  # #agenda ← header calendar
      # ───────────────────────────── BENEDEN ─────────────────────────────────
      - type: grid
        cards:
          # navbar scroll target — MOBILE ONLY. Removed from the DOM on
          # desktop/tablet (visibility) so it adds no height and the section
          # column stays exactly as tall as Energie's (plain-separator) column.
          - type: custom:anchor-card
            anchor_id: downstairs-anchor
            timeout: 200
            offset: -100
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options: { columns: full, rows: 1 }
          - type: custom:bubble-card
            card_type: separator
            name: Beneden
            icon: mdi:sofa
            modules: [bubble_compact_rows]
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: light.lights_downstairs
            name: Verlichting
            tap_action: { action: navigate, navigation_path: '#verlichting-beneden' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#verlichting-beneden' }
            modules: [bubble_neon_icon_only]
            styles: |
              .bubble-button-background {
                opacity: 1 !important;
                background-color: ${(state === 'on' ? 'rgba(255, 190, 90, 0.28)' : 'transparent')} !important;
              }
              /* show how many member lights are on (like the windows count) */
              .bubble-state {
                font-size: 14px !important;
              }
            state_content: >-
              {%- set on = expand('light.lights_downstairs') | selectattr('state','eq','on') | list | count -%}
              {{ 'Alles uit' if on == 0 else on ~ ' aan' }}
            grid_options: { columns: 6, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: sensor.indoor_temperature   # heat pump indoor readout
            name: Klimaat
            icon: mdi:heat-pump
            tap_action: { action: navigate, navigation_path: '#klimaat-beneden' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#klimaat-beneden' }
            modules: [bubble_neon_icon_only]
            # Neon's hue matcher would paint this red year-round (sees "indoor_temp" in the entity
            # id), but the Altherma cools too — colour instead follows climate.warmtepomp's
            # hvac_action. Icon glyph can't follow state either: icon: takes no template, JS or Jinja.
            styles: |
              .bubble-main-icon-container.bubble-main-icon-container {
                ${(() => {
                  const a = hass.states['climate.warmtepomp']?.attributes?.hvac_action;
                  if (a === 'cooling') return 'background: linear-gradient(135deg, hsl(205 85% 55%), hsl(190 80% 58%)) !important; box-shadow: 0 0 18px hsl(205 85% 58% / 0.45) !important;';
                  if (a === 'heating') return 'background: linear-gradient(135deg, hsl(6 80% 55%), hsl(28 80% 58%)) !important; box-shadow: 0 0 18px hsl(12 85% 58% / 0.45) !important;';
                  return 'background: rgba(255,255,255,0.14) !important; box-shadow: none !important;';
                })()}
              }
              .bubble-button-container.bubble-button-container {
                ${(() => {
                  const a = hass.states['climate.warmtepomp']?.attributes?.hvac_action;
                  const hue = a === 'cooling' ? 205 : a === 'heating' ? 12 : null;
                  if (hue === null) return '';
                  return 'background-image: radial-gradient(140% 120% at 8% -10%, hsl(' + hue + ' 90% 60% / 0.26), transparent 55%) !important; border: 1px solid hsl(' + hue + ' 85% 62% / 0.60) !important;';
                })()}
              }
            grid_options: { columns: 6, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: media_player.music_downstairs
            name: Muziek
            icon: mdi:music
            show_entity_picture: true      # album art when playing
            sub_button:
              - icon: mdi:play-pause
                tap_action:
                  action: perform-action
                  perform_action: script.sonos_active_control
                  data:
                    group: media_player.music_downstairs
                    command: play_pause
            tap_action: { action: navigate, navigation_path: '#muziek-beneden' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#muziek-beneden' }
            modules: [bubble_neon_icon_only]
            state_content: >-
              {%- set members = expand('media_player.music_downstairs') -%}
              {%- set playing = members | selectattr('state','eq','playing') | list -%}
              {%- set paused = members | selectattr('state','eq','paused') | list -%}
              {%- if playing | count == 1 -%}{{ playing[0].name | replace('Speakers ','') | replace(' Sonos','') }}
              {%- elif playing | count > 1 -%}Speelt in {{ playing | count }} kamers
              {%- elif paused | count == 1 -%}{{ paused[0].name | replace('Speakers ','') | replace(' Sonos','') }} · pauze
              {%- elif paused | count > 1 -%}Gepauzeerd
              {%- else -%}Uit
              {%- endif -%}
            styles: |
              .bubble-button-background {
                opacity: 1 !important;
                background-color: ${(state === 'playing' ? 'rgba(130, 100, 225, 0.42)' : 'transparent')} !important;
              }
              /* The media_player group platform reports a bare "on" whenever its
                 members disagree - all-identical members give that state, any
                 other mix with a non-off member (paused counts) collapses to
                 "on". Two speakers paused plus two idle therefore read as "On"
                 while nothing is playing, and a single-member group reads the
                 raw "Idle". There is no "mixed" state to show, so derive a real
                 one from the members. Label comes from state_content (server-side
                 Jinja), so the old comma-avoidance rule for CSS content values
                 no longer applies. */
              .bubble-state {
                font-size: 14px !important;
                font-weight: 500;
                /* a long room name must not be chopped mid-word against the
                   sub-button: shrink below min-content and end on an ellipsis */
                display: block !important;
                min-width: 0 !important;
                max-width: 100% !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                white-space: nowrap !important;
              }
              /* Album art van het eerste spelende groepslid, in Jinja.
                 Reden: JS kan alleen een waarde in een vaste CSS-regel schuiven,
                 geen hele selector weglaten - vandaar de lege accolades in de
                 oude versie als er niets speelde. Jinja laat het blok gewoon weg.
                 Volgorde komt uit attributes.entity_id en NIET uit expand():
                 die sorteert anders en koos een ander lid. */
              {% set members = state_attr('media_player.music_downstairs','entity_id') or [] %}
              {% set ns = namespace(active=none) %}
              {% for m in members if ns.active is none %}{% if is_state(m,'playing') %}{% set ns.active = m %}{% endif %}{% endfor %}
              {% set pic = state_attr(ns.active,'entity_picture') if ns.active else none %}
              {% if pic %}
              .bubble-entity-picture {
                display: block !important;
                background-image: url("{{ pic }}") !important;
                background-size: cover !important;
                background-position: center !important;
              }
              {% endif %}
            grid_options: { columns: 6, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: binary_sensor.doors_and_windows_downstairs
            name: Deuren
            icon: mdi:door
            tap_action: { action: navigate, navigation_path: '#deuren-beneden' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#deuren-beneden' }
            modules: [bubble_neon_icon_only]
            # subtitle shows a count instead of Open/Closed (no negative red)
            state_content: >-
              {%- set m = expand('binary_sensor.doors_and_windows_downstairs') -%}
              {%- set o = m | selectattr('state','eq','on') | list | count -%}
              {{ 'Alles dicht' if o == 0 else o ~ ' open · ' ~ (m | count - o) ~ ' dicht' }}
            styles: |
              .bubble-state {
                font-size: 14px !important;
              }
            grid_options: { columns: 6, rows: 2 }

      # ────────────────────────────── BOVEN ──────────────────────────────────
      - type: grid
        cards:
          # navbar scroll target — MOBILE ONLY (see Beneden note)
          - type: custom:anchor-card
            anchor_id: upstairs-anchor
