                show_state: true
                show_icon: false
                show_name: false
                show_background: true
            bubble_badges:
              badges:
                # Two mutually-exclusive badges replace rather than stack: orange plug = plugged
                # in, not charging; blue flash = charging; none = unplugged. Reads the Easee
                # charger only — BMW cardata lags badly (stuck disconnected at 4.35 kW); Tibber ix3 is always unknown.
                - name: Plugged in
                  target: main_icon
                  icon: mdi:ev-plug-type2
                  color: orange
                  condition:
                    - condition: template
                      value_template: >
                        {{ is_state('binary_sensor.easee_sonke_plug', 'on')
                           and not is_state('sensor.easee_sonke_status', 'charging') }}
                - name: Charging
                  target: main_icon
                  icon: mdi:flash
                  color: blue
                  condition:
                    - condition: state
                      entity_id: sensor.easee_sonke_status
                      state: charging
            modules:
              - bubble_badges
              - bubble_neon_icon_only
            styles: |
              /* light up green while the car is charging */
              .bubble-button-background {
                opacity: 1 !important;
                background-color: ${(hass.states['sensor.easee_sonke_status']?.state === 'charging' ? 'rgba(70, 200, 120, 0.35)' : 'transparent')} !important;
              }
              .bubble-button-card-container { position: relative !important; }
              /* charge-bar track */
              .bubble-button-card-container::after {
                content: '';
                position: absolute;
                left: 20px; right: 20px; bottom: 12px;
                height: 6px; border-radius: 999px;
                background: rgba(255, 255, 255, 0.14);
                pointer-events: none;
              }
              /* charge-bar fill — width = state of charge % */
              .bubble-button-card-container::before {
                content: '';
                position: absolute;
                left: 20px; bottom: 12px; z-index: 1;
                height: 6px; border-radius: 999px;
                width: calc((100% - 40px) * ${(parseFloat(hass.states['sensor.state_of_charge_predicted_on_bmw_side']?.state) || 0) / 100});
                background: linear-gradient(90deg, #63e6e2, #46c7c3);
                box-shadow: 0 0 10px rgba(99, 230, 226, 0.45);
                pointer-events: none;
              }
            grid_options: { columns: 12, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: cover.covers_downstairs
            name: Screens
            icon: mdi:blinds
            tap_action: { action: navigate, navigation_path: '#screens' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#screens' }
            modules: [bubble_neon_icon_only]
            styles: |
              /* subtitle = per-screen position + a flag when automation is off */
              .bubble-state {
                font-size: 14px !important;
              }
            state_content: >-
              {%- set pv = state_attr('cover.voorraam','current_position') -%}
              {%- set pz = state_attr('cover.zijraam','current_position') -%}
              {%- set auto = is_state('input_boolean.enable_automatic_screens','on') -%}
              {{ 'Voor ' ~ ('?' if pv is none else ('dicht' if pv == 0 else ('open' if pv == 100 else (pv ~ '%')))) ~ ' · Zij ' ~ ('?' if pz is none else ('dicht' if pz == 0 else ('open' if pz == 100 else (pz ~ '%')))) ~ ('' if auto else ' · handmatig') }}
            grid_options: { columns: 6, rows: 2 }
          - type: custom:bubble-card
            card_type: button
            card_layout: large
            button_type: state
            entity: vacuum.sjorsje
            name: Sjorsje
            icon: mdi:robot-vacuum
            tap_action: { action: navigate, navigation_path: '#sjorsje' }
            button_action:
              tap_action: { action: navigate, navigation_path: '#sjorsje' }
            sub_button:
              - entity: sensor.sjorsje_battery_level
                show_state: true
                show_icon: false
                show_name: false
                show_background: true
            bubble_badges:
              badges:
                # red dot on the icon when there's a problem (full bin or error)
                - name: Probleem
                  target: main_icon
                  dot: true
                  color: red
                  condition:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: binary_sensor.sjorsje_bin_full
                          state: "on"
                        - condition: state
                          entity_id: vacuum.sjorsje
                          state: error
            modules:
              - bubble_badges   # problem dot
              - bubble_neon_icon_only
            grid_options: { columns: 6, rows: 2 }

      # BOTTOM NAV (navbar-card) — MOBILE ONLY, hidden above 767px. Desktop/tablet uses
      # scrolling plus the Settings button in the presence panel instead. Scroll routes jump
      # to the anchor-card targets above, at /lovelace-bubble/overzicht.
      - type: grid
        column_span: 3
        visibility:
          - condition: screen
            media_query: "(max-width: 767px)"
        cards:
          - type: custom:navbar-card
            desktop:
              position: bottom
            routes:
              - icon: mdi:arrow-up-bold-box-outline
                icon_selected: mdi:arrow-up-bold-box
                url: /lovelace-bubble/overzicht?anchor=top
                label: Huis
                selected: |
                  [[[
                    const matchesPath = window.location.pathname == "/lovelace-bubble/overzicht";
                    const hasAnchor = window.location.search.includes("anchor=top");
                    return matchesPath && hasAnchor;
                  ]]]
              - icon: mdi:sofa-outline
                icon_selected: mdi:sofa
                url: /lovelace-bubble/overzicht?anchor=downstairs-anchor
                label: Beneden
                selected: |
                  [[[
                    const matchesPath = window.location.pathname == "/lovelace-bubble/overzicht";
                    const hasAnchor = window.location.search.includes("anchor=downstairs-anchor");
                    return matchesPath && hasAnchor;
                  ]]]
              - icon: mdi:bed-double-outline
                icon_selected: mdi:bed-double
                url: /lovelace-bubble/overzicht?anchor=upstairs-anchor
                label: Boven
                selected: |
                  [[[
                    const matchesPath = window.location.pathname == "/lovelace-bubble/overzicht";
                    const hasAnchor = window.location.search.includes("anchor=upstairs-anchor");
                    return matchesPath && hasAnchor;
                  ]]]
              # Settings lives in the presence panel now, so it's dropped here.
              - icon: mdi:fire
                icon_selected: mdi:fire
                url: null
                tap_action:
                  { action: navigate, navigation_path: '#stookwijzer' }
                label: Stookwijzer
            grid_options: { columns: full, rows: 1 }
