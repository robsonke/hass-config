# Bubble Card native pop-up (hash #muziek-beneden) — Sonos tile (Beneden). Tabs switch between
# Eetkamer/Office/Woonkamer via input_select + a conditional card (sonos-card can't switch its
# own active player). Eetkamer is the pinned fallback branch; Office/Woonkamer skip grouping.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 760px
hash: '#muziek-beneden'
# auto-closes after 2 min without interaction; every tap/click resets the timer
auto_close: 120000
name: Sonos - Beneden
icon: mdi:music
# header shows which speakers in this zone are playing (green) or "Niets aan het spelen"
entity: media_player.eetkamer
state_content: >-
  {%- set n = expand(['media_player.eetkamer','media_player.living_room','media_player.eva_eva','media_player.office','media_player.overkapping_overkapping_sonos_speakers_overkapping_sonos','media_player.sonos_roam','media_player.macbook']) | selectattr('state','eq','playing')
     | map(attribute='name') | map('regex_replace','^Speakers ','')
     | map('regex_replace',' Speaker$','') | list -%}
  {{ n | join(' · ') if n else 'Niets aan het spelen' }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const P=['media_player.eetkamer','media_player.living_room','media_player.eva_eva','media_player.office','media_player.overkapping_overkapping_sonos_speakers_overkapping_sonos','media_player.sonos_roam','media_player.macbook']; return P.some(p=>hass.states[p]?.state==='playing') ? 'rgba(45,170,115,0.14)' : 'rgba(255,255,255,0.04)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const P=['media_player.eetkamer','media_player.living_room','media_player.eva_eva','media_player.office','media_player.overkapping_overkapping_sonos_speakers_overkapping_sonos','media_player.sonos_roam','media_player.macbook']; return P.some(p=>hass.states[p]?.state==='playing') ? 'rgba(45,170,115,0.20)' : 'rgba(255,255,255,0.07)'; })()} !important; }
  .bubble-state { font-size: 13px !important; font-weight: 500; color: ${(() => { const P=['media_player.eetkamer','media_player.living_room','media_player.eva_eva','media_player.office','media_player.overkapping_overkapping_sonos_speakers_overkapping_sonos','media_player.sonos_roam','media_player.macbook']; return P.some(p=>hass.states[p]?.state==='playing') ? '#9ed9bd' : '#8f8e9e'; })()} !important; }
cards:
  # ── Tabs: which speaker is open below. Sub-buttons, not separate button-cards: a
  # button-card with button_type: state turns the icon into its own tap target that opens
  # the media_player's more-info dialog — a popup on top of the popup.
  - type: custom:bubble-card
    card_type: separator
    sub_button:
      - name: Eetkamer
        icon: mdi:silverware-fork-knife
        show_background: true
        tap_action: { action: perform-action, perform_action: input_select.select_option, target: { entity_id: input_select.sonos_beneden_player }, data: { option: Eetkamer } }
      - name: Office
        icon: mdi:laptop
        show_background: true
        tap_action: { action: perform-action, perform_action: input_select.select_option, target: { entity_id: input_select.sonos_beneden_player }, data: { option: Office } }
      - name: Woonkamer
        icon: mdi:sofa
        show_background: true
        tap_action: { action: perform-action, perform_action: input_select.select_option, target: { entity_id: input_select.sonos_beneden_player }, data: { option: Woonkamer } }
    styles: |
      .bubble-line { opacity: 0.35 !important; }
      /* stip rechtsboven de tab zolang die speaker zelf speelt; zelfde groen
         als de header. z-index 3 zodat hij boven de needs-outline ::after ligt */
      .bubble-sub-button-1::before, .bubble-sub-button-2::before, .bubble-sub-button-3::before { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; z-index: 3; pointer-events: none; }
      /* Bij drie tabs werd de per-tab ternary onleesbaar, dus worden de regels
         nu gegenereerd. Volgorde van TABS = volgorde van de sub-buttons hierboven
         (bubble-sub-button-N is 1-based). Eetkamer is de actieve tab zodra de
         helper iets anders dan Office/Woonkamer is - zelfde fallback als de
         conditional cards eronder. */
      ${(() => { const sel = hass.states['input_select.sonos_beneden_player']?.state; const TABS = [['Eetkamer','media_player.eetkamer'],['Office','media_player.office'],['Woonkamer','media_player.living_room']]; return TABS.map((t, i) => { const on = t[0] === 'Eetkamer' ? (sel !== 'Office' && sel !== 'Woonkamer') : (sel === t[0]); const playing = hass.states[t[1]]?.state === 'playing'; const sb = '.bubble-sub-button-' + (i + 1); return sb + ' { opacity: 1 !important; background-color: ' + (on ? 'rgba(55,138,221,0.28)' : 'rgba(255,255,255,0.06)') + ' !important; border: 1px solid ' + (on ? 'rgba(55,138,221,0.65)' : 'transparent') + ' !important; color: ' + (on ? '#d7e7f7' : '#9aa1a8') + ' !important; } ' + sb + '::before { background-color: ' + (playing ? '#2daa73' : 'transparent') + '; }'; }).join(' '); })()}
  # ── Eetkamer: the full card (including grouping + groups) ────
  - type: conditional
    conditions:
      # state_not on BOTH other options: this is the fallback branch, so anything with no
      # explicit branch of its own (unavailable, unknown, a not-yet-reloaded helper) lands
      # here on Eetkamer instead of on an empty pop-up.
      - condition: state
        entity: input_select.sonos_beneden_player
        state_not: Office
      - condition: state
        entity: input_select.sonos_beneden_player
        state_not: Woonkamer
    card:
      type: custom:decluttering-card
      template: sonos_popup
      variables:
        - main_player: media_player.eetkamer
        - entities:
            - media_player.eetkamer
            - media_player.living_room
            - media_player.eva_eva
            - media_player.office
            - media_player.overkapping_overkapping_sonos_speakers_overkapping_sonos
            - media_player.sonos_roam
            - media_player.macbook
        - groups:
            - name: Woon + Eet
              entities:
                - player: media_player.eetkamer
                - player: media_player.living_room
            - name: Beneden
              media: ''
              entities:
                - player: media_player.eetkamer
                - player: media_player.office
                - player: media_player.living_room
                - player: media_player.macbook
        - sections:
            - player
            - volumes
            - media browser
            - grouping
            - groups
            - queue
        # the tab is the single source of truth: always open on eetkamer, never
        # on a remembered or currently-playing speaker
        - pin_player: true
        - vol_threshold: 40
        - vol_max: 40
  # ── Office: only this speaker (player · volume · favourites · queue) ──
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.sonos_beneden_player
        state: Office
    card:
      type: custom:decluttering-card
      template: sonos_popup
      variables:
        - main_player: media_player.office
        - entities:
            - media_player.office
        - groups: []
        - sections:
            - player
            - volumes
            - media browser
            - queue
        # pinned to office: never read or write the shared session storage, so
        # switching back to Eetkamer keeps working
        - pin_player: true
        - vol_threshold: 40
        - vol_max: 40
  # ── Woonkamer: only this speaker (player · volume · favourites · queue) ──
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.sonos_beneden_player
        state: Woonkamer
    card:
      type: custom:decluttering-card
      template: sonos_popup
      variables:
        - main_player: media_player.living_room
        - entities:
            - media_player.living_room
        - groups: []
        - sections:
            - player
            - volumes
            - media browser
            - queue
        # pinned to woonkamer: never read or write the shared session storage, so
        # switching back to Eetkamer keeps working
        - pin_player: true
        - vol_threshold: 40
        - vol_max: 40
