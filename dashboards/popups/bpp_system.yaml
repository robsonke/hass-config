# Bubble Card native pop-up (hash #systeem) — System & settings.
# Modernized to the state-card grid pattern (separators + bubble tiles),
# functional cards (bar-card, uptime-card, auto-entities) kept intact.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 820px
hash: '#systeem'
# auto-closes after 1 min without interaction; every tap/click resets the timer
auto_close: 60000
name: Systeem
icon: mdi:cog
# header = HA version
entity: sensor.hass_version_installed
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: rgba(45,170,115,0.13) !important; }
  .bubble-icon-container { background-color: rgba(45,170,115,0.20) !important; }
  .bubble-state { font-size: 14px !important; font-weight: 500; color: #9ed9bd !important; }
state_content: >-
  {{ 'Home Assistant ' ~ (states('sensor.hass_version_installed') if states('sensor.hass_version_installed') not in ['unknown','unavailable',''] else '—') }}
cards:
  # ── status ────────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Home Assistant
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.uptime
        name: Uptime
        icon: mdi:timer-outline
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          /* sensor.uptime is a timestamp, so HA rendered it as
             "26 July 2026 at 20:53" — far too long for the ~97px state area, and
             Bubble marquee-scrolled it. Show elapsed time instead, which is what
             an uptime tile is for. Comma-free by necessity: Bubble eats the
             character after a comma inside a CSS 'content' value. */
          .bubble-state { font-size: 13px !important; font-weight: 500; }
        state_content: >-
          {%- set u = states('sensor.uptime') | as_datetime -%}
          {%- if u is none -%}—
          {%- else -%}
          {%- set sec = (now() - u).total_seconds() | int -%}
          {%- set d = (sec // 86400) | int -%}
          {%- set h = ((sec % 86400) // 3600) | int -%}
          {%- set m = ((sec % 3600) // 60) | int -%}
          {%- if d > 0 -%}{{ d }}d {{ h }}u
          {%- elif h > 0 -%}{{ h }}u {{ m }}m
          {%- else -%}{{ m }}m
          {%- endif -%}
          {%- endif -%}
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.database_size
        name: Database
        icon: mdi:database
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.unavailable_entities
        name: Entities offline
        icon: mdi:alert-circle
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.unavailable_entities']?.state); return (isFinite(v) && v > 0) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.unavailable_entities']?.state); return (isFinite(v) && v > 0) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
        state_content: >-
          {{ states('sensor.unavailable_entities') if states('sensor.unavailable_entities') not in ['unknown','unavailable',''] else '—' }}
      # System-wide count (sensor.all_unavailable_entities), unlike the tile above which only
      # counts group.monitored_entities. Whole domains sit at "unknown" by design until first
      # use, so a non-zero total is normal here — a threshold colour would always be red.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.all_unavailable_entities
        name: Totaal offline
        icon: mdi:counter
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #9bb6c8 !important; }
        state_content: >-
          {{ states('sensor.all_unavailable_entities') if states('sensor.all_unavailable_entities') not in ['unknown','unavailable',''] else '—' }}
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: binary_sensor.important_addons
        name: Add-ons offline
        icon: mdi:puzzle
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['binary_sensor.important_addons']?.attributes?.count); return (isFinite(v) && v > 0) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['binary_sensor.important_addons']?.attributes?.count); return (isFinite(v) && v > 0) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
        state_content: >-
          {{ state_attr('binary_sensor.important_addons','count') if state_attr('binary_sensor.important_addons','count') is not none else 0 }}
  # ── belasting ─────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Belasting
  - type: custom:bar-card
    width: 55%
    height: 2em
    decimal: 0
    unit_of_measurement: '%'
    positions:
      icon: outside
      indicator: 'off'
      name: outside
    severity:
      - color: '#6d2525'
        from: 85
        to: 999
    entity_row: true
    entities:
      - entity: sensor.processor_use
        name: CPU
        icon: mdi:chip
      - entity: sensor.memory_use_percent
        icon: mdi:memory
        name: Geheugen
      - entity: sensor.disk_use_percent
        icon: mdi:server
        name: Schijf
  # ── offline entities ──────────────────────────────────────────────
  # Separator only when a monitored entity is actually offline (auto-entities
  # already hides itself; this hides the lingering header). Uses a native
  # `conditional` card — Bubble Card does NOT honour HA's `visibility:` on the
  # child cards of a pop-up, which made this header hidden ALWAYS.
  - type: conditional
    conditions:
      - condition: numeric_state
        entity: sensor.unavailable_entities
        above: 0
    card:
      type: custom:bubble-card
      card_type: separator
      name: Belangrijke entities offline
  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
    filter:
      include:
        - group: group.monitored_entities
          state: 'unavailable'
        - group: group.monitored_entities
          state: 'unknown'
        - group: group.monitored_entities
          state: 'none'
    sort:
      method: name
  # ── internet ──────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Internet
  - type: custom:uptime-card
    entity: binary_sensor.internet_ping
    icon: mdi:raspberry-pi
    name: Internet status
    icon_adaptive_color: true
    title_adaptive_color: true
    status_adaptive_color: true
    hours_to_show: 24
    alignment:
      status: spaced
      header: center
    show:
      footer: false
  # ── automatische acties ───────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Automatische acties
  - type: grid
    columns: 2
    square: false
    # An odd tile count in a 2-column grid leaves the last row half-empty. The last tile
    # (Kerstverlichting) gets the full width instead, so the row looks intentional.
    card_mod:
      style: |
        #root > *:last-child { grid-column: 1 / -1 !important; }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.enable_automatic_lights
        name: Verlichting
        icon: mdi:lightbulb-auto
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.enable_automatic_garden_lights
        name: Tuinverlichting
        icon: mdi:outdoor-lamp
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.enable_automatic_screens
        name: Screens
        icon: mdi:blinds-horizontal
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.enable_automatic_hvac
        name: Klimaat
        icon: mdi:hvac
        card_layout: large
      # Seasonal switch: gates every action on light.kerst_binnen / light.kerst_buiten in
      # automations.yaml and scripts.yaml. Off outside December, so those groups (sockets,
      # then unavailable) aren't driven year-round. See packages/pkg_lights.yaml.
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.kerstverlichting
        name: Kerstverlichting
        icon: mdi:pine-tree
        card_layout: large
  # ── camera detectie ───────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Camera detectie
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.evabed_detect
        name: Eva slaapkamer
        icon: mdi:cctv
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.noabed_detect
        name: Noa slaapkamer
        icon: mdi:cctv
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.bijkeuken_detect
        name: Bijkeuken
        icon: mdi:cctv
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.zijkant_detect
        name: Zijkant
        icon: mdi:cctv
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.terras_detect
        name: Terras
        icon: mdi:cctv
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.doorbell_detect
        name: Deurbel
        icon: mdi:doorbell-video
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.veranda_detect
        name: Veranda
        icon: mdi:cctv
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.zwembad_detect
        name: Zwembad
        icon: mdi:cctv
        card_layout: large
  # ── onderhoud ─────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Onderhoud
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Dashboard hard refresh
    icon: mdi:restart
    card_layout: large
    tap_action:
      action: perform-action
      perform_action: script.reload_frontend
    styles: |
      .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
