# Bubble Card native pop-up (hash #klimaat-beneden) — Klimaat tile (Beneden).
# Bubble climate card (warmtepomp) + Verwarmen/Koelen toggles + settings expander + graphs.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 1000px
hash: '#klimaat-beneden'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Koeling en verwarming beneden
icon: mdi:thermostat
# header = beneden temp + heatpump action (warm = verwarmt, blauw = koelt, dim = uit)
entity: sensor.downstairs_temperature
state_content: >-
  {%- set t = states('sensor.downstairs_temperature') | float(-99999) -%}
  {%- set tt = ((('%.1f' | format(t)) | replace('.', ',')) ~ '°C') if t != -99999 else '—' -%}
  {%- set a = state_attr('climate.warmtepomp','hvac_action') -%}
  {{ 'Beneden ' ~ tt ~ (' · verwarmt' if a == 'heating' else (' · koelt' if a == 'cooling' else '')) }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const a = hass.states['climate.warmtepomp']?.attributes?.hvac_action; return a === 'heating' ? 'rgba(240,195,95,0.13)' : a === 'cooling' ? 'rgba(55,138,221,0.14)' : 'rgba(255,255,255,0.04)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const a = hass.states['climate.warmtepomp']?.attributes?.hvac_action; return a === 'heating' ? 'rgba(240,195,95,0.20)' : a === 'cooling' ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'; })()} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${(() => { const a = hass.states['climate.warmtepomp']?.attributes?.hvac_action; return a === 'heating' ? '#f0cf8f' : a === 'cooling' ? '#82bbf0' : '#9ed9bd'; })()} !important;
  }
cards:
  # ── warmtepomp thermostaat ────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Warmtepomp
  - type: custom:bubble-card
    card_type: climate
    entity: climate.warmtepomp
    name: Warmtepomp
    hold_action: { action: more-info }
  # ── modus (verwarmen warm, koelen blauw) ──────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Modus
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.heating_downstairs
        name: Verwarmen
        icon: mdi:fire
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: "{{ 'aan' if is_state('input_boolean.heating_downstairs','on') else 'uit' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.cooling_downstairs
        name: Koelen
        icon: mdi:snowflake
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: "{{ 'aan' if is_state('input_boolean.cooling_downstairs','on') else 'uit' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#7db8ec' : '#8f8e9e'} !important; }
  # ── sturing: what the offset plan is doing, and the switch that lets it write ──────────
  - type: custom:bubble-card
    card_type: separator
    name: Sturing watertemperatuur
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.hvac_offset_control
        name: Offset schrijven
        icon: mdi:sine-wave
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: "{{ 'aan' if is_state('input_boolean.hvac_offset_control','on') else 'uit (droogloop)' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
      # Target now versus what the Daikin actually holds; a gap here is the write not landing.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.hvac_offset_target
        name: Offset nu
        icon: mdi:thermometer-water
        card_layout: large
        hold_action: { action: more-info }
        state_content: >-
          {%- set t = states('sensor.hvac_offset_target') | int(0) -%}
          {%- set a = state_attr('climate.leaving_water_offset','temperature') -%}
          {{ '%+d' % t }} K · {{ state_attr('sensor.hvac_offset_target','reason') }}{{ (' · Daikin ' ~ ('%+d' % (a | int(0)))) if a is not none else '' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseInt(state); return v > 0 ? 'rgba(240,195,95,0.14)' : v < 0 ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; }
  # Collapsed by default: the header card already shows the current block; the full day is
  # for when you want to know why.
  - type: custom:expander-card
    title: Plan vandaag
    cards:
      - type: markdown
        content: >-
          {% set b = state_attr('sensor.hvac_offset_plan','blocks') or [] %}
          {% if b | count == 0 %}Geen plan — Nordpool of Solcast ontbreekt.{% endif %}
          {% for x in b if x.base != 0 %}**{{ x.start }}** {{ '%+d' % x.base }} K · {{ x.reason }}{{ (' · ' ~ ('%.2f' | format(x.price)) | replace('.', ',') ~ ' €') if x.price is not none else '' }}{{ (' · ' ~ x.pv ~ ' kW') if x.pv > 0 else '' }}<br>
          {% endfor %}
  # ── instellingen (behouden) ───────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Instellingen
  - type: custom:expander-card
    title: Settings
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.climate_control
          - entity: select.operation_mode
          - entity: sensor.downstairs_temperature
          - type: divider
          - entity: input_number.hvac_winter_target_temperature
            name: Streeftemperatuur winter
          - entity: input_number.hvac_summer_target_temperature
            name: Streeftemperatuur zomer
          - type: divider
          - entity: schedule.hvac_schedule
          - entity: input_boolean.enable_automatic_hvac
          - type: divider
          - entity: input_number.hvac_band_low
            name: Comfortband onder
          - entity: input_number.hvac_band_high
            name: Comfortband boven
          - entity: input_number.hvac_offset_neutral
            name: Offset neutraal
          - entity: input_number.hvac_solar_surplus_threshold
            name: Zonoverschot drempel
          - entity: input_datetime.hvac_warm_window_start
            name: Warm venster start
          - entity: input_datetime.hvac_warm_window_end
            name: Warm venster eind
          - entity: input_number.hvac_price_spread_min
            name: Minimale prijsspreiding
          - entity: sensor.electricity_price_7d_mean
            name: Prijsniveau 7 dagen
          - type: divider
          - entity: binary_sensor.heating_season
            name: Stookseizoen
          - entity: sensor.outdoor_temperature_3d_mean
            name: Buiten 3-daags gemiddelde
          - type: divider
          - entity: sensor.altherma_power_true
            name: Altherma verbruik huidig
          - entity: sensor.altherma_heatpump_daily
            name: Altherma verbruik vandaag
          - entity: sensor.altherma_scop_space_daily
            name: SCOP verwarming vandaag
          - entity: sensor.altherma_cop_dhw_daily
            name: COP tapwater vandaag
          - entity: sensor.altherma_buh_hours_daily
            name: Backup-heater uren vandaag
  # ── verloop ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Verloop
  - type: statistics-graph
    title: Temperatuur (24 uur)
    period: hour
    days_to_show: 1
    stat_types: mean
    chart_type: line
    entities:
      - entity: sensor.climate_sensor_living_temperature
        name: Woonkamer
      - entity: sensor.climate_sensor_office_temperature
        name: Kantoor
      - entity: sensor.climate_sensor_kitchen_temperature
        name: Keuken
      - entity: sensor.eva_slaapkamer_ikea_climate_sensor_eva_temperature
        name: Slaapkamer Eva
      - entity: sensor.indoor_temperature
        name: Thermostaat
      - entity: sensor.downstairs_temperature
        name: Gemiddeld
  - type: history-graph
    title: Bedrijfsmodus (24 uur)
    hours_to_show: 24
    refresh_interval: 30
    entities:
      - sensor.altherma_operation_mode
