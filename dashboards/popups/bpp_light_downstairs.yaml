  # ── tijdlijn: "Automatisch aan" is the input_boolean the darkness automations set/clear —
  # it marks only automatic stretches, not a manual switch-on (that only shows on "Alle
  # lampen"). Lux line is the trigger sensor (< 30); history is capped by purge_keep_days (10).
  - type: custom:bubble-card
    card_type: separator
    name: Tijdlijn
  - type: history-graph
    title: Automatisch aan door donker (4 dagen)
    hours_to_show: 96
    entities:
      - entity: input_boolean.lights_downstairs_auto_dark
        name: Automatisch aan
      - entity: light.lights_downstairs
        name: Alle lampen beneden
