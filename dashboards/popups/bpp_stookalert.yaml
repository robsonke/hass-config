# Bubble Card native pop-up (hash #stookwijzer) — migrated from pp_footer_stookalert.yaml (browser_mod).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 680px
hash: '#stookwijzer'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Stookwijzer
icon: mdi:fire
cards:
  - type: vertical-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        entity: sensor.stookwijzer
        show_name: true
        show_state: true
        styles: |-
          .bubble-button-background {
            opacity: 1 !important;
            background-color: ${(state === 'code_red' ? '#e74c3c' : state === 'code_orange' ? '#ff9409' : 'green')} !important;
          }
        name: Huidig advies
      - type: custom:bubble-card
        card_type: separator
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.stookwijzer_advies_1
        scrolling_effect: true
        state_content: >-
          {%- set t = state_attr('sensor.stookwijzer_advies_1','time') -%}
          {%- set d = t | as_datetime if t is not none else none -%}
          {{ (d | as_local).strftime('%H:%M') if d is not none else '—' }}
        name: Advies periode 1
        sub_button:
          - show_icon: true
            show_background: false
            state_background: false
            icon: "{{ 'mdi:lock' if state_attr('sensor.stookwijzer_advies_1','definitive') else '' }}"
        styles: |
          .bubble-button-background {
            opacity: 1 !important;
            background-color: ${(state === 'code_red' ? '#e74c3c' : state === 'code_orange' ? '#ff9409' : 'green')} !important;
          }
        show_name: false
