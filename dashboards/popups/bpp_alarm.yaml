# Bubble Card native pop-up (hash #alarm) — Alarmo + voordeurslot + camera's + deurbel.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 820px
hash: '#alarm'
# sluit automatisch na 2 min zonder interactie; elke tap/klik reset de timer
auto_close: 120000
name: Alarm
icon: mdi:shield-home
# header = alarmstatus (groen uit, amber ingeschakeld, rood alarm/aftellen) + duur
entity: alarm_control_panel.alarmo
# Text comes from state_content (server-side Jinja); colour stays JS. Same clamped
# age buckets as the door cards - the old JS was missing the 60-minute and 24-hour clamps.
state_content: >-
  {%- set st = states['alarm_control_panel.alarmo'] -%}
  {%- if st is none -%}—
  {%- else -%}
  {%- set lbl = {'disarmed':'Uitgeschakeld','armed_away':'Afwezig','armed_home':'Thuis','armed_night':'Nacht','armed_vacation':'Vakantie','arming':'Inschakelen…','pending':'Aftellen…','triggered':'ALARM!'} -%}
  {%- set s = (now() - st.last_changed).total_seconds() -%}
  {%- if s < 60 -%}{%- set d = 'net' -%}
  {%- elif s < 3600 -%}{%- set m = (s/60)|round|int -%}{%- set d = '1 uur' if m >= 60 else m ~ ' min' -%}
  {%- elif s < 86400 -%}{%- set h = (s/3600)|round|int -%}{%- set d = '1 dag' if h >= 24 else h ~ ' uur' -%}
  {%- else -%}{%- set dy = (s/86400)|round|int -%}{%- set d = dy ~ (' dag' if dy == 1 else ' dagen') -%}
  {%- endif -%}
  {{ lbl.get(st.state, st.state) ~ ' · ' ~ d }}
  {%- endif -%}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const st = hass.states['alarm_control_panel.alarmo']?.state; if (st === 'disarmed') return 'rgba(45,170,115,0.14)'; if (st === 'pending' || st === 'triggered') return 'rgba(226,75,74,0.18)'; if (st === 'arming') return 'rgba(55,138,221,0.16)'; return 'rgba(240,195,95,0.14)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const st = hass.states['alarm_control_panel.alarmo']?.state; if (st === 'disarmed') return 'rgba(45,170,115,0.20)'; if (st === 'pending' || st === 'triggered') return 'rgba(226,75,74,0.24)'; if (st === 'arming') return 'rgba(55,138,221,0.22)'; return 'rgba(240,195,95,0.20)'; })()} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${(() => { const st = hass.states['alarm_control_panel.alarmo']?.state; if (st === 'disarmed') return '#9ed9bd'; if (st === 'pending' || st === 'triggered') return '#ec8a89'; if (st === 'arming') return '#82bbf0'; return '#f0cf8f'; })()} !important;
  }
cards:
  # ── bediening ─────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Bediening
  - type: custom:alarmo-card
    entity: alarm_control_panel.alarmo
  # Pre-arm check. Counts exactly the ten sensors Alarmo monitors: the downstairs group plus the
  # three upstairs windows it watches. Master bedroom windows, interior doors and the garden are
  # deliberately not monitored, so they must not make this card say the house is not ready.
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Klaar om in te schakelen
    icon: mdi:shield-check
    card_layout: large
    tap_action: { action: none }
    state_content: >-
      {%- set bewaakt = expand('binary_sensor.doors_and_windows_downstairs')
           + expand(['binary_sensor.window_noaroom_openclose_contact',
                     'binary_sensor.window_eva_openclose_contact',
                     'binary_sensor.window_guestroom_openclose_contact']) -%}
      {%- set n = bewaakt | selectattr('state','eq','on') | list | count -%}
      {{ (n ~ ' open — nog niet dicht') if n > 0 else 'Alles dicht — klaar' }}
    styles: |
      .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const n = [...(hass.states['binary_sensor.doors_and_windows_downstairs']?.attributes?.entity_id || []), 'binary_sensor.window_noaroom_openclose_contact', 'binary_sensor.window_eva_openclose_contact', 'binary_sensor.window_guestroom_openclose_contact'].filter(e => hass.states[e]?.state === 'on').length; return n > 0 ? 'rgba(240,195,95,0.14)' : 'rgba(45,170,115,0.13)'; })()} !important; }
      .bubble-icon-container { background-color: ${(() => { const n = [...(hass.states['binary_sensor.doors_and_windows_downstairs']?.attributes?.entity_id || []), 'binary_sensor.window_noaroom_openclose_contact', 'binary_sensor.window_eva_openclose_contact', 'binary_sensor.window_guestroom_openclose_contact'].filter(e => hass.states[e]?.state === 'on').length; return n > 0 ? 'rgba(240,195,95,0.20)' : 'rgba(45,170,115,0.20)'; })()} !important; }
      .bubble-name {
        font-size: 13.5px !important; font-weight: 500;
        color: ${(() => { const n = [...(hass.states['binary_sensor.doors_and_windows_downstairs']?.attributes?.entity_id || []), 'binary_sensor.window_noaroom_openclose_contact', 'binary_sensor.window_eva_openclose_contact', 'binary_sensor.window_guestroom_openclose_contact'].filter(e => hass.states[e]?.state === 'on').length; return n > 0 ? '#f0cf8f' : '#9ed9bd'; })()} !important;
      }
  # ── voordeur ──────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Voordeur
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: lock.nuki_voordeur_slot_lock
    name: Voordeurslot
    icon: mdi:lock
    card_layout: large
    tap_action: { action: toggle }
    hold_action: { action: more-info }
    state_content: >-
      {{ {'locked':'Vergrendeld','unlocked':'Ontgrendeld'}.get(states('lock.nuki_voordeur_slot_lock'), states('lock.nuki_voordeur_slot_lock')) }}
    styles: |
      .bubble-button-background { opacity: 1 !important; background-color: ${state === 'locked' ? 'rgba(45,170,115,0.13)' : 'rgba(226,75,74,0.16)'} !important; }
      .bubble-icon-container { background-color: ${state === 'locked' ? 'rgba(45,170,115,0.20)' : 'rgba(226,75,74,0.22)'} !important; }
      .bubble-state { font-size: 12.5px !important; color: ${state === 'locked' ? '#9ed9bd' : '#ec8a89'} !important; }
  - type: tile
    entity: input_text.camera_analysis
    show_entity_picture: false
    name: Laatste gebeurtenis
    icon: mdi:camera
    hide_state: false
    vertical: false
    state_content:
      - state
      - last-changed
    tap_action:
      action: url
      url_path: /ccab4aaf_frigate/ingress
  # ── camera's (alerts) ─────────────────────────────────────────────
  # rood = Frigate review-alert actief; tik opent de camera
  - type: custom:bubble-card
    card_type: separator
    name: Camera's
  - type: grid
    columns: 3
    square: false
    # 3-up fits the wide desktop pop-up, but on a phone each tile's label area
    # collapses to ~37px and Bubble marquee-scrolls the name back and forth.
    # 2-up on mobile gives the labels room; a trailing odd tile takes its own row.
    card_mod:
      style: |
        @media (max-width: 767px) {
          #root { grid-template-columns: 1fr 1fr !important; }
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: camera.doorbell
        name: Deurbel
        icon: mdi:cctv
        card_layout: large
        button_action:
          tap_action: { action: navigate, navigation_path: '#cameras' }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${hass.states['sensor.deurbel_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.18)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${hass.states['sensor.deurbel_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: camera.zijkant
        name: Zijkant
        icon: mdi:cctv
        card_layout: large
        button_action:
          tap_action: { action: navigate, navigation_path: '#cameras' }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${hass.states['sensor.zijkant_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.18)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${hass.states['sensor.zijkant_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: camera.terras
        name: Terras
        icon: mdi:cctv
        card_layout: large
        button_action:
          tap_action: { action: navigate, navigation_path: '#cameras' }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${hass.states['sensor.terras_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.18)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${hass.states['sensor.terras_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: camera.veranda
        name: Veranda
        icon: mdi:cctv
        card_layout: large
        button_action:
          tap_action: { action: navigate, navigation_path: '#cameras' }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${hass.states['sensor.veranda_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.18)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${hass.states['sensor.veranda_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: camera.bijkeuken
        name: Bijkeuken
        icon: mdi:cctv
        card_layout: large
        button_action:
          tap_action: { action: navigate, navigation_path: '#cameras' }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${hass.states['sensor.bijkeuken_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.18)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${hass.states['sensor.bijkeuken_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: camera.zwembad
        name: Zwembad
        icon: mdi:cctv
        card_layout: large
        button_action:
          tap_action: { action: navigate, navigation_path: '#cameras' }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${hass.states['sensor.zwembad_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.18)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${hass.states['sensor.zwembad_review_status']?.state === 'ALERT' ? 'rgba(226,75,74,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Alle camera's (live)
    icon: mdi:cctv
    card_layout: large
    button_action:
      tap_action: { action: navigate, navigation_path: '#cameras' }
    styles: |
      .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
      .bubble-icon-container { background-color: rgba(55,138,221,0.22) !important; }
  # ── deurbel-detecties vandaag ─────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Deurbel vandaag
  - type: grid
    columns: 3
    square: false
    # 3-up fits the wide desktop pop-up, but on a phone each tile's label area
    # collapses to ~37px and Bubble marquee-scrolls the name back and forth.
    # 2-up on mobile gives the labels room; a trailing odd tile takes its own row.
    card_mod:
      style: |
        @media (max-width: 767px) {
          #root { grid-template-columns: 1fr 1fr !important; }
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.doorbell_person_count
        name: Personen
        icon: mdi:account
        card_layout: large
        tap_action: { action: more-info }
        state_content: "{{ states('sensor.doorbell_person_count') | int(0) }}×"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: >-
          {%- set ns = namespace(c=0) -%}
          {%- for k in ['postnl','dhl','dpd','gls'] -%}
          {%- set ns.c = ns.c + (states('sensor.doorbell_' ~ k ~ '_count') | int(0)) -%}
          {%- endfor -%}
          Pakketten {{ ns.c }}×
        icon: mdi:package-variant-closed
        card_layout: large
        tap_action: { action: none }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-name { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.doorbell_car_count
        name: Auto's
        icon: mdi:car
        card_layout: large
        tap_action: { action: more-info }
        state_content: "{{ states('sensor.doorbell_car_count') | int(0) }}×"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
  # ── recent geopend ────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Recent geopende deuren en ramen
  - type: custom:auto-entities
    card:
      type: entities
    show_empty: false
    unique: entity
    filter:
      include:
        - domain: binary_sensor
          attributes:
            device_class: door
          options:
            secondary_info: last-changed
        - domain: binary_sensor
          attributes:
            device_class: window
          options:
            secondary_info: last-changed
      exclude:
        - entity_id: binary_sensor.doors_and_windows_upstairs
    sort:
      method: last_changed
      count: 5
      reverse: true
  # ── geschiedenis ──────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Geschiedenis
  - type: entities
    show_header_toggle: false
    entities:
      - type: attribute
        entity: alarm_control_panel.alarmo
        attribute: last_triggered
        name: Laatst geactiveerd
        icon: mdi:history
      - type: attribute
        entity: alarm_control_panel.alarmo
        attribute: changed_by
        name: Laatst gewijzigd door
        icon: mdi:account-clock
