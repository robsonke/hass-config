# Bubble Card native pop-up (hash #klimaat-boven) — Klimaat tile (Boven).
# Bubble climate card + warm toggle cards for aux heating + humidifier + graph.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 1000px
hash: '#klimaat-boven'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Slaapkamers klimaat
icon: mdi:thermostat
# header = master-bedroom temp (always-available sensor) + warm when any heat source is on
entity: sensor.climate_sensor_masterbedroom_temperature
state_content: >-
  {%- set t = states('sensor.climate_sensor_masterbedroom_temperature') | float(-99999) -%}
  {%- set tt = ((('%.1f' | format(t)) | replace('.', ',')) ~ '°C') if t != -99999 else '—' -%}
  {%- set heat = ((expand(['switch.infrarood_eva','switch.infrarood_noa','switch.shelly_plug_badkamer_verwarming_relay','switch.shelly_plug_douche_verwarming_relay']) | selectattr('state','eq','on') | list | count) > 0) or is_state('climate.eurom_alutherm_baseboard_heater','heat') -%}
  {{ 'Slaapkamer ' ~ tt ~ (' · verwarmt' if heat else '') }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(['switch.infrarood_eva','switch.infrarood_noa','switch.shelly_plug_badkamer_verwarming_relay','switch.shelly_plug_douche_verwarming_relay'].some(e => hass.states[e]?.state === 'on') || hass.states['climate.eurom_alutherm_baseboard_heater']?.state === 'heat') ? 'rgba(240,195,95,0.13)' : 'rgba(255,255,255,0.04)'} !important; }
  .bubble-icon-container { background-color: ${(['switch.infrarood_eva','switch.infrarood_noa','switch.shelly_plug_badkamer_verwarming_relay','switch.shelly_plug_douche_verwarming_relay'].some(e => hass.states[e]?.state === 'on') || hass.states['climate.eurom_alutherm_baseboard_heater']?.state === 'heat') ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${(['switch.infrarood_eva','switch.infrarood_noa','switch.shelly_plug_badkamer_verwarming_relay','switch.shelly_plug_douche_verwarming_relay'].some(e => hass.states[e]?.state === 'on') || hass.states['climate.eurom_alutherm_baseboard_heater']?.state === 'heat') ? '#f0cf8f' : '#9ed9bd'} !important;
  }
cards:
  # ── thermostaat ───────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Slaapkamer kachel
  - type: custom:bubble-card
    card_type: climate
    entity: climate.eurom_alutherm_baseboard_heater
    name: Kachel
    hold_action: { action: more-info }
  # ── aux heating (warm toggle, power draw when on) ─────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Bijverwarming
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.infrarood_eva
        name: Infrarood Eva
        icon: mdi:radiator
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: >-
          {%- if not is_state('switch.infrarood_eva','on') -%}uit
          {%- else -%}
          {%- set n = states('sensor.infrarood_eva_power') | float(-99999) -%}
          {{ ((n | round | int) ~ ' W') if n != -99999 else 'aan' }}
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.infrarood_noa
        name: Infrarood Noa
        icon: mdi:radiator
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: >-
          {%- if not is_state('switch.infrarood_noa','on') -%}uit
          {%- else -%}
          {%- set n = states('sensor.infrarood_noa_switch_power') | float(-99999) -%}
          {{ ((n | round | int) ~ ' W') if n != -99999 else 'aan' }}
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.shelly_plug_badkamer_verwarming_relay
        name: Badkamer
        icon: mdi:heating-coil
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: >-
          {%- if not is_state('switch.shelly_plug_badkamer_verwarming_relay','on') -%}uit
          {%- else -%}
          {%- set n = states('sensor.shelly_plug_badkamer_verwarming_power') | float(-99999) -%}
          {{ ((n | round | int) ~ ' W') if n != -99999 else 'aan' }}
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.shelly_plug_douche_verwarming_relay
        name: Douche
        icon: mdi:heating-coil
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: >-
          {%- if not is_state('switch.shelly_plug_douche_verwarming_relay','on') -%}uit
          {%- else -%}
          {%- set n = states('sensor.shelly_plug_douche_verwarming_power') | float(-99999) -%}
          {{ ((n | round | int) ~ ' W') if n != -99999 else 'aan' }}
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
  # ── luchtontvochtiger ─────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Luchtontvochtiger
  # card_type: climate drives a humidifier too; available_modes is the humidifier
  # equivalent of hvac_modes, so the four modes need not be hardcoded. min/max come
  # from the entity (35-85) and are humidity here, not temperature.
  - type: custom:bubble-card
    card_type: climate
    entity: humidifier.master_bedroom
    name: Luchtontvochtiger
    icon: mdi:air-humidifier
    state_color: true
    sub_button:
      - name: Modus
        select_attribute: available_modes
        show_arrow: false
        state_background: false
  # ── temperatuurverloop ────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Temperatuur (24 uur)
  - type: statistics-graph
    period: hour
    days_to_show: 1
    stat_types: mean
    chart_type: line
    entities:
      - entity: sensor.climate_sensor_masterbedroom_temperature
        name: Master
      - entity: sensor.climate_sensor_eva_temperature
        name: Eva
      - entity: sensor.climate_sensor_noa_temperature
        name: Noa
      - entity: sensor.climate_sensor_guestroom_temperature
        name: Loge
