# Bubble Card native pop-up (#person-eva) — Eva (bedroom camera + bed).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 900px
hash: '#person-eva'
# auto-closes after 2 min without interaction; every tap/click resets the timer
auto_close: 120000
name: Eva
icon: mdi:bed
# header = room light (warm = on) + temp/humidity; was bed-presence detection, but that
# proved unreliable. Eva sleeps DOWNSTAIRS: area "Eva Slaapkamer" (dimmer_eva_bedroom/bathroom,
# eva_corridor_light, climate_sensor_evadownstairs). "Eva boven" (dimmer_eva) is her OLD room.
entity: light.dimmer_eva_bedroom
state_content: >-
  {%- set t = states('sensor.climate_sensor_evadownstairs_temperature') | float(-999) -%}
  {%- set h = states('sensor.climate_sensor_evadownstairs_humidity') | float(-999) -%}
  {{ 'Licht aan' if is_state('light.dimmer_eva_bedroom','on') else 'Licht uit' }} · {{ (((t | round(1)) | string | regex_replace('\.0$','')) ~ '°C') if t != -999 else '—' }} · {{ ((h | round | int) ~ '%') if h != -999 else '—' }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,190,70,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
  .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,190,70,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${state === 'on' ? '#f0c85a' : '#9b9aac'} !important;
  }
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Camera
  - type: custom:advanced-camera-card
    dimensions:
      aspect_ratio_mode: unconstrained
    view:
      default: live
    menu:
      buttons:
        frigate:
          enabled: false
        timeline:
          enabled: true
        clips:
          enabled: true
        recordings:
          enabled: true
        snapshots:
          enabled: false
        camera_ui:
          enabled: true
        fullscreen:
          enabled: true
        media_player:
          enabled: false
      style: overlay
      position: top
    cameras:
      - camera_entity: camera.evabed
    timeline:
      window_seconds: 3600
      events_media_type: all
      show_recordings: true
      controls:
        thumbnails:
          mode: below
    media_viewer:
      controls:
        thumbnails:
          mode: below
        next_previous:
          style: chevrons
  # ── kamer (licht + klimaat) — all three lights from her "Eva Slaapkamer" area: bedroom,
  # bathroom and the hallway outside. 2 columns — a 3-column grid squeezes labels into a
  # scrolling marquee on mobile.
  - type: custom:bubble-card
    card_type: separator
    name: Kamer
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.dimmer_eva_bedroom
    name: Licht
    icon: mdi:lightbulb
    card_layout: large
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.dimmer_eva_bathroom
        name: Badkamer
        icon: mdi:shower
        card_layout: large
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.eva_corridor_light
        name: Gang
        icon: mdi:door-sliding
        card_layout: large
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.climate_sensor_evadownstairs_temperature
        name: Temperatuur
        icon: mdi:thermometer
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.climate_sensor_evadownstairs_humidity
        name: Vocht
        icon: mdi:water-percent
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
  # ── muziek (Sonos) ────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Muziek
  - type: custom:decluttering-card
    template: sonos_popup
    variables:
      - main_player: media_player.eva_eva
      - entities:
          - media_player.eva_eva
      - groups: []
      - vol_threshold: 20
      - vol_max: 20
      - sections:
          - player
          - volumes
          - media browser
          - grouping
          - groups
