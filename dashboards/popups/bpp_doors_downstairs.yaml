# Bubble Card native pop-up (hash #deuren-beneden) — Deuren tile (Beneden).
# State-card grid pattern.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 760px
hash: '#deuren-beneden'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Deuren en ramen beneden
icon: mdi:door
# summary in the header: group sensor drives the state line, overridden to
# the computed "N open · M dicht" count (blue = iets open, green = alles dicht).
entity: binary_sensor.doors_and_windows_downstairs
# Text comes from state_content (server-side Jinja); colour stays JS.
state_content: >-
  {%- set m = expand('binary_sensor.doors_and_windows_downstairs') -%}
  {%- set o = m | selectattr('state','eq','on') | list | count -%}
  {{ 'Alles dicht' if o == 0 else o ~ ' open · ' ~ (m | count - o) ~ ' dicht' }}
styles: |
  /* Kop telt de buitenschil-groep, niet alle kaarten eronder. De drie
     binnendeuren hebben wel een eigen kaart maar zeggen niets over of het huis
     dicht is, en Alarmo bewaakt ze niet. */
  .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(45,170,115,0.13)'} !important; }
  .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(45,170,115,0.20)'} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${state === 'on' ? '#82bbf0' : '#9ed9bd'} !important;
  }
cards:
  # ── section: Buitendeuren ─────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Buitendeuren
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: binary_sensor.frontdoor_openclose_contact
        name: Voordeur
        card_layout: large
        tap_action: { action: more-info }
        button_action:
          tap_action: { action: more-info }
        state_content: >-
          {%- set st = states['binary_sensor.frontdoor_openclose_contact'] -%}
          {%- if st is none -%}—
          {%- else -%}
          {%- set s = (now() - st.last_changed).total_seconds() -%}
          {%- if s < 60 -%}{%- set d = 'net' -%}
          {%- elif s < 3600 -%}{%- set m = (s/60)|round|int -%}{%- set d = '1 uur' if m >= 60 else m ~ ' min' -%}
          {%- elif s < 86400 -%}{%- set h = (s/3600)|round|int -%}{%- set d = '1 dag' if h >= 24 else h ~ ' uur' -%}
          {%- else -%}{%- set dy = (s/86400)|round|int -%}{%- set d = dy ~ (' dag' if dy == 1 else ' dagen') -%}
          {%- endif -%}
          {{ ('open' if st.state == 'on' else 'dicht') ~ ' · ' ~ d }}
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(45,170,115,0.13)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(45,170,115,0.20)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#7db8ec' : '#8fbda6'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: binary_sensor.backdoor_sensor_contact
