# Bubble Card native pop-up (hash #auto) — BMW iX3 (status, charging, location).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 920px
hash: '#auto'
# auto-closes after 1 min without interaction; every tap/click resets the timer
auto_close: 60000
name: BMW iX3
icon: mdi:car-electric
# header = battery % + range (green = charging, amber = plugged in, blue = disconnected)
entity: sensor.ix3_50_xdrive_battery_ev_state_of_charge
state_content: >-
  {%- set soc = states('sensor.ix3_50_xdrive_battery_ev_state_of_charge') | float(-99999) -%}
  {%- set r = states('sensor.ix3_50_xdrive_range_ev_remaining_range') | float(-99999) -%}
  {%- set cs = states('sensor.easee_sonke_status') -%}
  {{ (((soc | round | int) ~ '%') if soc != -99999 else '—') ~ ((' · ' ~ (r | round | int) ~ ' km') if r != -99999 else '') ~ (' · laadt' if cs == 'charging' else '') }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const cs = hass.states['sensor.easee_sonke_status']?.state; const conn = hass.states['binary_sensor.easee_sonke_plug']?.state; if (cs === 'charging') return 'rgba(45,170,115,0.14)'; if (conn === 'on') return 'rgba(240,195,95,0.13)'; return 'rgba(55,138,221,0.14)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const cs = hass.states['sensor.easee_sonke_status']?.state; const conn = hass.states['binary_sensor.easee_sonke_plug']?.state; if (cs === 'charging') return 'rgba(45,170,115,0.20)'; if (conn === 'on') return 'rgba(240,195,95,0.20)'; return 'rgba(55,138,221,0.22)'; })()} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${(() => { const cs = hass.states['sensor.easee_sonke_status']?.state; const conn = hass.states['binary_sensor.easee_sonke_plug']?.state; if (cs === 'charging') return '#9ed9bd'; if (conn === 'on') return '#f0cf8f'; return '#82bbf0'; })()} !important;
  }
cards:
  # ── auto ── the vehicle's own card replaces this section: real image, SOC+range bar,
  # and a smarter door/lock/window/charging row (red only when parked, locked and open).
  # show_buttons stays off (its labels are hardcoded English); those two readouts stay as Bubble tiles below.
  - type: custom:bubble-card
    card_type: separator
    name: Auto
  - type: custom:bmw-cardata-vehicle-card
    device_id: 51e59ab8c8190b9963d5e5bf49ffb6db
    show_title: false
    show_indicators: true
    show_range: true
    show_image: true
    show_map: true
    map_height: 320
    show_buttons: false
    soc_source: soc
    uix:
      style: |
        /* BMW ships the vehicle image as 1000x600 with the car in a narrow band
           and wide transparent margins. The card sets width:100%, so at this
           pop-up's 920px the margins scale too and the image block becomes
           511px tall - most of it empty. Capping it takes the card from 870px
           to 568px and lets the whole section fit without scrolling.
           object-fit must flip to contain, or the cap crops the car instead. */
        .image img { max-height: 230px !important; object-fit: contain !important; }
        /* The VIN subtitle survives show_title: false. The pop-up header already
           says "BMW iX3", so it is only noise. Drop this line to get it back, or
           set license_plate on the card to show the plate here instead. */
        .vin { display: none !important; }
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_vehicle_mileage
        name: Kilometerstand
        icon: mdi:counter
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_battery_ev_battery_health_state_soce
        name: Accugezondheid
        icon: mdi:battery-heart-variant
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
  # Plug + charging power, only while the cable is in the Easee (BMW cardata lags on plug state).
  # `conditional` rather than Bubble's own visibility: on a pop-up child card
  # Bubble does not honour visibility (learned the hard way in bpp_system.yaml).
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.easee_sonke_plug
        state: 'on'
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.ix3_50_xdrive_charging_port_plug_lock_state
          name: Laadstekker
          icon: mdi:ev-plug-type2
          card_layout: large
          tap_action: { action: more-info }
          styles: |
            .bubble-button-background { opacity: 1 !important; background-color: rgba(240,195,95,0.14) !important; }
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.ix3_50_xdrive_battery_ev_charging_power
          name: Laadvermogen
          icon: mdi:flash
          card_layout: large
          tap_action: { action: more-info }
          styles: |
            .bubble-button-background { opacity: 1 !important; background-color: ${(() => { return hass.states['sensor.easee_sonke_status']?.state === 'charging' ? 'rgba(45,170,115,0.16)' : 'rgba(255,255,255,0.05)'; })()} !important; }
  # ── laadhistorie ──────────────────────────────────────────────────
  # Two views on purpose. The bar chart answers "how much per day" and is built
  # from LONG-TERM statistics, so it keeps growing past recorder's 10-day
  # purge_keep_days. The history graph answers "at what time of day, and at what
  # power" and can only ever reach back those 10 days.
  - type: custom:bubble-card
    card_type: separator
    name: Laadhistorie
  - type: statistics-graph
    title: Geladen per dag
    chart_type: bar
    period: day
    days_to_show: 30
    stat_types:
      - change
    entities:
      - entity: sensor.easee_sonke_lifetime_energy
        name: kWh
  - type: history-graph
    title: Wanneer geladen (4 dagen)
    hours_to_show: 96
    entities:
      - entity: binary_sensor.easee_sonke_charging
        name: Laadt
  # ── bandenspanning ────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Bandenspanning
  - type: grid
    columns: 4
    square: false
    uix:
      style: |
        /* 4 columns squeezes "Achter L" into a scrolling marquee on a phone.
           Same fix as the six 3-column grids in the other pop-ups. */
        @media (max-width: 767px) {
          #root { grid-template-columns: 1fr 1fr !important; }
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_tire_pressure_front_left
        name: Voor L
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.ix3_50_xdrive_tire_pressure_front_left') | float(-99999) -%}
          {{ ((('%.1f' | format(v / 100)) | replace('.', ',')) ~ ' bar') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_front_left']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_front_left']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_tire_pressure_front_right
        name: Voor R
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.ix3_50_xdrive_tire_pressure_front_right') | float(-99999) -%}
          {{ ((('%.1f' | format(v / 100)) | replace('.', ',')) ~ ' bar') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_front_right']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_front_right']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_tire_pressure_rear_left
        name: Achter L
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.ix3_50_xdrive_tire_pressure_rear_left') | float(-99999) -%}
          {{ ((('%.1f' | format(v / 100)) | replace('.', ',')) ~ ' bar') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_rear_left']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_rear_left']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_tire_pressure_rear_right
        name: Achter R
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.ix3_50_xdrive_tire_pressure_rear_right') | float(-99999) -%}
          {{ ((('%.1f' | format(v / 100)) | replace('.', ',')) ~ ' bar') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_rear_right']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_50_xdrive_tire_pressure_rear_right']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
  # ── klimaat ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Klimaat
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_preconditioning_comfort_state
        name: Voorverwarmen
        icon: mdi:car-defrost-front
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {{ 'Inactief' if states('sensor.ix3_50_xdrive_preconditioning_comfort_state')
             in ['unknown','unavailable','','NOT_ACTIVE'] else 'Actief' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const s = hass.states['sensor.ix3_50_xdrive_preconditioning_comfort_state']?.state; return (s && !['NOT_ACTIVE','unknown','unavailable'].includes(s)) ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'; })()} !important; }
          .bubble-icon-container { background-color: ${(() => { const s = hass.states['sensor.ix3_50_xdrive_preconditioning_comfort_state']?.state; return (s && !['NOT_ACTIVE','unknown','unavailable'].includes(s)) ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${(() => { const s = hass.states['sensor.ix3_50_xdrive_preconditioning_comfort_state']?.state; return (s && !['NOT_ACTIVE','unknown','unavailable'].includes(s)) ? '#82bbf0' : '#8f8e9e'; })()} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_50_xdrive_preconditioning_direct_target_temperature
        name: Doeltemperatuur
        icon: mdi:thermometer
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.04) !important; }
  # ── laden ─────────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laden
  - type: custom:charger-card
    entity: sensor.easee_sonke_status
    compact_view: false
    show_name: true
    show_leds: true
    show_status: true
    show_collapsibles: true
    brand: easee
    chargerImage: Anthracite
    customCardTheme: theme_transp_white
    details:
      name:
        entity_id: sensor.easee_sonke_status
        attribute: name
      location:
        entity_id: sensor.easee_sonke_status
        attribute: site_name
      status:
        entity_id: sensor.easee_sonke_status
      smartcharging:
        entity_id: switch.easee_sonke_smart_charging
      group1:
        - entity_id: sensor.easee_sonke_dynamic_charger_limit
          text: dyn_charger_limit
          service: easee.set_charger_dynamic_limit
          service_data:
            charger_id: CHARGERID
            current: '#SERVICEVAL#'
        - entity_id: sensor.easee_sonke_dynamic_circuit_limit
          text: dyn_circuit_limit
          service: easee.set_charger_circuit_dynamic_limit
          service_data:
            charger_id: CHARGERID
            currentP1: '#SERVICEVAL#'
      group2:
        - entity_id: binary_sensor.easee_sonke_online
          text: online
        - entity_id: sensor.easee_sonke_voltage
          text: voltage
          unit_show: true
        - entity_id: sensor.easee_sonke_power
          text: power
          unit_show: true
        - entity_id: sensor.easee_sonke_current
          text: charger_current
          unit_show: true
        - entity_id: sensor.easee_sonke_circuit_current
          text: circuit_current
          unit_show: true
        - entity_id: sensor.easee_sonke_session_energy
          text: session_energy
          unit_show: true
        - entity_id: sensor.easee_sonke_lifetime_energy
          text: lifetime_energy
          unit_show: true
      group3:
        - entity_id: switch.easee_sonke_is_enabled
          text: enabled
        - entity_id: switch.easee_sonke_enable_idle_current
          text: idle_current
        - entity_id: binary_sensor.easee_sonke_cable_locked
          text: cable_locked
        - entity_id: switch.easee_sonke_cable_locked_permanently
          text: perm_cable_locked
        - entity_id: switch.easee_sonke_smart_charging
          text: smart_charging
        - entity_id: sensor.easee_sonke_cost_per_kwh
          text: cost_per_kwh
        - entity_id: binary_sensor.easee_sonke_update_available
          text: update_available
      stats:
        default:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: switch.easee_sonke_cable_locked_permanently
            text: cable_locked
        disconnected:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: switch.easee_sonke_cable_locked_permanently
            text: cable_locked
          - entity_id: calculated
            text: used_limit
            unit: A
            unit_show: true
            calc_function: min
            calc_entities:
              - entity_id: sensor.easee_sonke_dynamic_charger_limit
              - entity_id: sensor.easee_sonke_dynamic_circuit_limit
              - entity_id: sensor.easee_sonke_max_charger_limit
              - entity_id: sensor.easee_sonke_max_circuit_limit
              - entity_id: sensor.easee_sonke_offline_circuit_limit
        awaiting_start:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: switch.easee_sonke_smart_charging
            text: smart_charging
          - entity_id: calculated
            text: used_limit
            unit: A
            unit_show: true
            calc_function: min
            calc_entities:
              - entity_id: sensor.easee_sonke_dynamic_charger_limit
              - entity_id: sensor.easee_sonke_dynamic_circuit_limit
              - entity_id: sensor.easee_sonke_max_charger_limit
              - entity_id: sensor.easee_sonke_max_circuit_limit
              - entity_id: sensor.easee_sonke_offline_circuit_limit
        charging:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: sensor.easee_sonke_circuit_current
            text: circuit_current
            unit_show: true
          - entity_id: sensor.easee_sonke_output_limit
            text: output_limit
            unit_show: true
          - entity_id: sensor.easee_sonke_current
            text: current
            unit_show: true
          - entity_id: sensor.easee_sonke_power
            text: power
            unit_show: true
        completed:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: calculated
            text: used_limit
            unit: A
            unit_show: true
            calc_function: min
            calc_entities:
              - entity_id: sensor.easee_sonke_dynamic_charger_limit
              - entity_id: sensor.easee_sonke_dynamic_circuit_limit
              - entity_id: sensor.easee_sonke_max_charger_limit
              - entity_id: sensor.easee_sonke_max_circuit_limit
              - entity_id: sensor.easee_sonke_offline_circuit_limit
  # ── laaddetails ───────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laaddetails
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.bmw_ix3_target_state_of_charge
        name: Doel laadniveau
        icon: mdi:battery-charging-100
      - entity: sensor.ix3_50_xdrive_battery_ev_predicted_state_of_charge
        name: Voorspeld laadniveau
        icon: mdi:battery-clock
      - entity: sensor.ix3_50_xdrive_energy_to_full
        name: Energie tot vol
        icon: mdi:lightning-bolt
      - entity: sensor.ix3_50_xdrive_battery_ev_charging_current_limit
        name: Laadstroomlimiet
        icon: mdi:current-ac
  # ── ritten & accu ─────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Ritten & accu
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.ix3_50_xdrive_trip_eco_pro_mode_share
        name: ECO PRO laatste rit
        icon: mdi:leaf
      - entity: sensor.ix3_50_xdrive_trip_battery_charge_level_at_end_of_trip
        name: Laadniveau na laatste rit
        icon: mdi:battery-arrow-down
      - entity: sensor.ix3_50_xdrive_battery_hv_max_size
        name: Accucapaciteit
        icon: mdi:car-battery
      - entity: sensor.ix3_50_xdrive_vehicle_auxiliary_power
        name: Verbruik boordsystemen
        icon: mdi:flash-outline
