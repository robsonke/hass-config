# Bubble Card native pop-up (hash #auto) — BMW iX3 (status, laden, locatie).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 920px
hash: '#auto'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: BMW iX3
icon: mdi:car-electric
# header = accu % + bereik (groen = laadt, amber = ingeplugd, blauw = losgekoppeld)
entity: sensor.state_of_charge_last_known
show_state: true
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const cs = hass.states['sensor.charging_status']?.state; const conn = hass.states['sensor.ix3_charging_connector_status']?.state; if (cs === 'CHARGING') return 'rgba(45,170,115,0.14)'; if (conn && conn !== 'DISCONNECTED') return 'rgba(240,195,95,0.13)'; return 'rgba(55,138,221,0.14)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const cs = hass.states['sensor.charging_status']?.state; const conn = hass.states['sensor.ix3_charging_connector_status']?.state; if (cs === 'CHARGING') return 'rgba(45,170,115,0.20)'; if (conn && conn !== 'DISCONNECTED') return 'rgba(240,195,95,0.20)'; return 'rgba(55,138,221,0.22)'; })()} !important; }
  .bubble-state { font-size: 0 !important; }
  .bubble-state::after {
    font-size: 14px !important; font-weight: 500;
    color: ${(() => { const cs = hass.states['sensor.charging_status']?.state; const conn = hass.states['sensor.ix3_charging_connector_status']?.state; if (cs === 'CHARGING') return '#9ed9bd'; if (conn && conn !== 'DISCONNECTED') return '#f0cf8f'; return '#82bbf0'; })()} !important;
    content: "${(() => { const soc = hass.states['sensor.state_of_charge_last_known']?.state; const r = parseFloat(hass.states['sensor.ix3_remaining_electric_range_km']?.state); const cs = hass.states['sensor.charging_status']?.state; let o = (soc != null ? soc : '—') + '%'; if (isFinite(r)) o += ' · ' + Math.round(r) + ' km'; if (cs === 'CHARGING') o += ' · laadt'; return o; })()}";
  }
cards:
  # ── auto ──────────────────────────────────────────────────────────
  # The integration ships its own Lovelace card (registered automatically, no
  # HACS frontend install) and it covers this whole section: the real vehicle
  # image from image.ix3_vehicle_image instead of a static png, an SOC bar with
  # range instead of the bar-card gauges, and a door/lock/window/charging
  # indicator row instead of four hand-styled tiles. Its indicators are also
  # smarter than what they replace: windows and tailgate only go red when the
  # car is parked AND locked with the item open, so an open window while
  # driving no longer reads as a fault.
  # show_buttons is off on purpose - the card's quick-info labels are hardcoded
  # English (there is no language option in 5.2.5) and this pop-up is Dutch, so
  # the two readouts it would add that nothing else covers stay as Bubble tiles
  # below.
  - type: custom:bubble-card
    card_type: separator
    name: Auto
  - type: custom:bmw-cardata-vehicle-card
    device_id: a09120c7c1960fda394d75e3d82b70d8
    show_title: false
    show_indicators: true
    show_range: true
    show_image: true
    show_map: true
    map_height: 160
    show_buttons: false
    soc_source: soc
    card_mod:
      style: |
        /* BMW ships the vehicle image as 1000x600 with the car in a narrow band
           and wide transparent margins. The card sets width:100%, so at this
           pop-up's 920px the margins scale too and the image block becomes
           511px tall - most of it empty. Capping it takes the card from 870px
           to 568px and lets the whole section fit without scrolling.
           object-fit must flip to contain, or the cap crops the car instead. */
        .image img { max-height: 230px !important; object-fit: contain !important; }
        /* The VIN subtitle survives show_title: false. The pop-up header already
           says "BMW iX3", so it is only noise. Drop this line to get it back, or
           set license_plate on the card to show the plate here instead. */
        .vin { display: none !important; }
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_mileage
        name: Kilometerstand
        icon: mdi:counter
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_next_inspection_date_short
        name: Onderhoud
        icon: mdi:wrench-clock
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
  # Plug + remaining charge time, only while the cable is actually connected.
  # `conditional` rather than Bubble's own visibility: on a pop-up child card
  # Bubble does not honour visibility (learned the hard way in bpp_system.yaml).
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.ix3_charging_connector_status
        state_not: 'DISCONNECTED'
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.ix3_charging_connector_status
          name: Laadstekker
          icon: mdi:ev-plug-type2
          card_layout: large
          tap_action: { action: more-info }
          styles: |
            .bubble-button-background { opacity: 1 !important; background-color: rgba(240,195,95,0.14) !important; }
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.ix3_calculated_remaining_charging_time
          name: Nog te laden
          icon: mdi:timer-sand
          card_layout: large
          tap_action: { action: more-info }
          styles: |
            .bubble-button-background { opacity: 1 !important; background-color: ${(() => { return hass.states['sensor.charging_status']?.state === 'CHARGING' ? 'rgba(45,170,115,0.16)' : 'rgba(255,255,255,0.05)'; })()} !important; }
  # ── laadhistorie ──────────────────────────────────────────────────
  # Two views on purpose. The bar chart answers "how much per day" and is built
  # from LONG-TERM statistics, so it keeps growing past recorder's 10-day
  # purge_keep_days. The history graph answers "at what time of day, and at what
  # power" and can only ever reach back those 10 days.
  - type: custom:bubble-card
    card_type: separator
    name: Laadhistorie
  - type: statistics-graph
    title: Geladen per dag
    chart_type: bar
    period: day
    days_to_show: 30
    stat_types:
      - change
    entities:
      - entity: sensor.easee_sonke_lifetime_energy
        name: kWh
  - type: history-graph
    title: Wanneer geladen (4 dagen)
    hours_to_show: 96
    entities:
      - entity: binary_sensor.easee_sonke_charging
        name: Laadt
  # ── bandenspanning ────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Bandenspanning
  - type: grid
    columns: 4
    square: false
    card_mod:
      style: |
        /* 4 columns squeezes "Achter L" into a scrolling marquee on a phone.
           Same fix as the six 3-column grids in the other pop-ups. */
        @media (max-width: 767px) {
          #root { grid-template-columns: 1fr 1fr !important; }
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_measured_tire_pressure_front_left
        name: Voor L
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_front_left']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_front_left']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; content: "${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_front_left']?.state); return isFinite(v) ? (v/100).toFixed(1).replace('.', ',') + ' bar' : '—'; })()}"; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_measured_tire_pressure_front_right
        name: Voor R
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_front_right']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_front_right']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; content: "${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_front_right']?.state); return isFinite(v) ? (v/100).toFixed(1).replace('.', ',') + ' bar' : '—'; })()}"; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_measured_tire_pressure_rear_left
        name: Achter L
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_rear_left']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_rear_left']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; content: "${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_rear_left']?.state); return isFinite(v) ? (v/100).toFixed(1).replace('.', ',') + ' bar' : '—'; })()}"; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_measured_tire_pressure_rear_right
        name: Achter R
        icon: mdi:tire
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_rear_right']?.state); return (isFinite(v) && v < 200) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12.5px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_rear_right']?.state); return (isFinite(v) && v < 200) ? '#ec8a89' : '#9ed9bd'; })()} !important; content: "${(() => { const v = parseFloat(hass.states['sensor.ix3_measured_tire_pressure_rear_right']?.state); return isFinite(v) ? (v/100).toFixed(1).replace('.', ',') + ' bar' : '—'; })()}"; }
  # ── klimaat ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Klimaat
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: binary_sensor.ix3_air_conditioning_active
        name: Airco
        icon: mdi:air-conditioner
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12.5px !important; color: ${state === 'on' ? '#82bbf0' : '#8f8e9e'} !important; content: "${state === 'on' ? 'Aan' : 'Uit'}"; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.ix3_preconditioning_status_air_conditioning
        name: Voorverwarmen
        icon: mdi:car-defrost-front
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const s = hass.states['sensor.ix3_preconditioning_status_air_conditioning']?.state; return (s && s !== 'INACTIVE') ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'; })()} !important; }
          .bubble-icon-container { background-color: ${(() => { const s = hass.states['sensor.ix3_preconditioning_status_air_conditioning']?.state; return (s && s !== 'INACTIVE') ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'; })()} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12.5px !important; color: ${(() => { const s = hass.states['sensor.ix3_preconditioning_status_air_conditioning']?.state; return (s && s !== 'INACTIVE') ? '#82bbf0' : '#8f8e9e'; })()} !important; content: "${(() => { const s = hass.states['sensor.ix3_preconditioning_status_air_conditioning']?.state; const r = parseFloat(hass.states['sensor.ix3_remaining_duration_preconditioning']?.state); if (!s || s === 'INACTIVE') return 'Inactief'; return (isFinite(r) && r > 0) ? ('nog ' + Math.round(r) + ' min') : 'Actief'; })()}"; }
  # ── laden ─────────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laden
  - type: custom:charger-card
    entity: sensor.easee_sonke_status
    compact_view: false
    show_name: true
    show_leds: true
    show_status: true
    show_collapsibles: true
    brand: easee
    chargerImage: Anthracite
    customCardTheme: theme_transp_white
    details:
      name:
        entity_id: sensor.easee_sonke_status
        attribute: name
      location:
        entity_id: sensor.easee_sonke_status
        attribute: site_name
      status:
        entity_id: sensor.easee_sonke_status
      smartcharging:
        entity_id: switch.easee_sonke_smart_charging
      group1:
        - entity_id: sensor.easee_sonke_dynamic_charger_limit
          text: dyn_charger_limit
          service: easee.set_charger_dynamic_limit
          service_data:
            charger_id: CHARGERID
            current: '#SERVICEVAL#'
        - entity_id: sensor.easee_sonke_dynamic_circuit_limit
          text: dyn_circuit_limit
          service: easee.set_charger_circuit_dynamic_limit
          service_data:
            charger_id: CHARGERID
            currentP1: '#SERVICEVAL#'
      group2:
        - entity_id: binary_sensor.easee_sonke_online
          text: online
        - entity_id: sensor.easee_sonke_voltage
          text: voltage
          unit_show: true
        - entity_id: sensor.easee_sonke_power
          text: power
          unit_show: true
        - entity_id: sensor.easee_sonke_current
          text: charger_current
          unit_show: true
        - entity_id: sensor.easee_sonke_circuit_current
          text: circuit_current
          unit_show: true
        - entity_id: sensor.easee_sonke_session_energy
          text: session_energy
          unit_show: true
        - entity_id: sensor.easee_sonke_lifetime_energy
          text: lifetime_energy
          unit_show: true
      group3:
        - entity_id: switch.easee_sonke_is_enabled
          text: enabled
        - entity_id: switch.easee_sonke_enable_idle_current
          text: idle_current
        - entity_id: binary_sensor.easee_sonke_cable_locked
          text: cable_locked
        - entity_id: switch.easee_sonke_cable_locked_permanently
          text: perm_cable_locked
        - entity_id: switch.easee_sonke_smart_charging
          text: smart_charging
        - entity_id: sensor.easee_sonke_cost_per_kwh
          text: cost_per_kwh
        - entity_id: binary_sensor.easee_sonke_update_available
          text: update_available
      stats:
        default:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: switch.easee_sonke_cable_locked_permanently
            text: cable_locked
        disconnected:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: switch.easee_sonke_cable_locked_permanently
            text: cable_locked
          - entity_id: calculated
            text: used_limit
            unit: A
            unit_show: true
            calc_function: min
            calc_entities:
              - entity_id: sensor.easee_sonke_dynamic_charger_limit
              - entity_id: sensor.easee_sonke_dynamic_circuit_limit
              - entity_id: sensor.easee_sonke_max_charger_limit
              - entity_id: sensor.easee_sonke_max_circuit_limit
              - entity_id: sensor.easee_sonke_offline_circuit_limit
        awaiting_start:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: switch.easee_sonke_smart_charging
            text: smart_charging
          - entity_id: calculated
            text: used_limit
            unit: A
            unit_show: true
            calc_function: min
            calc_entities:
              - entity_id: sensor.easee_sonke_dynamic_charger_limit
              - entity_id: sensor.easee_sonke_dynamic_circuit_limit
              - entity_id: sensor.easee_sonke_max_charger_limit
              - entity_id: sensor.easee_sonke_max_circuit_limit
              - entity_id: sensor.easee_sonke_offline_circuit_limit
        charging:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: sensor.easee_sonke_circuit_current
            text: circuit_current
            unit_show: true
          - entity_id: sensor.easee_sonke_output_limit
            text: output_limit
            unit_show: true
          - entity_id: sensor.easee_sonke_current
            text: current
            unit_show: true
          - entity_id: sensor.easee_sonke_power
            text: power
            unit_show: true
        completed:
          - entity_id: sensor.easee_sonke_session_energy
            text: session_energy
            unit_show: true
          - entity_id: calculated
            text: used_limit
            unit: A
            unit_show: true
            calc_function: min
            calc_entities:
              - entity_id: sensor.easee_sonke_dynamic_charger_limit
              - entity_id: sensor.easee_sonke_dynamic_circuit_limit
              - entity_id: sensor.easee_sonke_max_charger_limit
              - entity_id: sensor.easee_sonke_max_circuit_limit
              - entity_id: sensor.easee_sonke_offline_circuit_limit
  # ── laaddetails ───────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laaddetails
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.bmw_ix3_target_state_of_charge
        name: Doel laadniveau
        icon: mdi:battery-charging-100
      - entity: sensor.ix3_battery_ev_predicted_state_of_charge
        name: Voorspeld laadniveau
        icon: mdi:battery-clock
      - entity: sensor.ix3_energy_required_complete_residual_charge
        name: Energie tot vol
        icon: mdi:lightning-bolt
  # ── ritten & efficiëntie ──────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Ritten & efficiëntie
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.ix3_average_electrical_consumption
        name: Gem. verbruik
        icon: mdi:lightning-bolt-outline
      - entity: sensor.ix3_average_speed
        name: Gem. snelheid
        icon: mdi:speedometer
      - entity: sensor.ix3_electric_portion_last_journey
        name: Elektrisch laatste rit
        icon: mdi:leaf
      - entity: sensor.ix3_trip_average_distance_per_week
        name: Gem. per week
        icon: mdi:calendar-week
