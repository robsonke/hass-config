# Bubble Card native pop-up (hash #ramen-boven) — Ramen tile (Boven).
# State-card grid pattern.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 760px
hash: '#ramen-boven'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Deuren en ramen boven
icon: mdi:window-closed-variant
# summary lives in the pop-up header: entity drives the header state line,
# which we override to the computed "N open · M dicht" count.
entity: binary_sensor.doors_and_windows_upstairs
# Text comes from state_content (server-side Jinja); colour stays JS.
state_content: >-
  {%- set m = expand('binary_sensor.doors_and_windows_upstairs') -%}
  {%- set o = m | selectattr('state','eq','on') | list | count -%}
  {{ 'Alles dicht' if o == 0 else o ~ ' open · ' ~ (m | count - o) ~ ' dicht' }}
styles: |
  /* calm the header's default on-state (blue) to the same soft tint as the cards */
  .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(45,170,115,0.13)'} !important; }
  .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(45,170,115,0.20)'} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${state === 'on' ? '#82bbf0' : '#9ed9bd'} !important;
  }
cards:
  # ── section: Master bedroom ───────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Master bedroom
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: binary_sensor.window_masterbed_1_openclose_contact
        name: Raam 1
        card_layout: large
        tap_action: { action: more-info }
        button_action:
          tap_action: { action: more-info }
        state_content: >-
          {%- set st = states['binary_sensor.window_masterbed_1_openclose_contact'] -%}
          {%- if st is none -%}—
          {%- else -%}
          {%- from 'duration_nl.jinja' import sinds -%}{%- set d = sinds(st.last_changed) -%}
          {{ ('open' if st.state == 'on' else 'dicht') ~ ' · ' ~ d }}
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(45,170,115,0.13)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(45,170,115,0.20)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#7db8ec' : '#8fbda6'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: binary_sensor.window_masterbedroom_2_contact
        name: Raam 2
        card_layout: large
