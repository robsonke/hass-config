# Bubble Card native pop-up (hash #water) — Water tile (Energie & water).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 920px
hash: '#water'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Waterverbruik
icon: mdi:water
# header = huidige doorstroming (blauw = er stroomt water, groen = geen)
entity: sensor.watermeter_water_usage
state_content: >-
  {%- set v = states('sensor.watermeter_water_usage') | float(-99999) -%}
  {%- set d = states('sensor.water_daily') | float(-99999) -%}
  {%- set o = ('—' if v == -99999 else (((('%.1f' | format(v)) | replace('.', ',')) ~ ' L/min') if v > 0.1 else 'Geen doorstroming')) -%}
  {{ o ~ ((' · ' ~ (('%.2f' | format(d)) | replace('.', ',')) ~ ' m³ vandaag') if d != -99999 else '') }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.watermeter_water_usage']?.state); return (isFinite(v) && v > 0.1) ? 'rgba(55,138,221,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const v = parseFloat(hass.states['sensor.watermeter_water_usage']?.state); return (isFinite(v) && v > 0.1) ? 'rgba(55,138,221,0.22)' : 'rgba(45,170,115,0.20)'; })()} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${(() => { const v = parseFloat(hass.states['sensor.watermeter_water_usage']?.state); return (isFinite(v) && v > 0.1) ? '#82bbf0' : '#9ed9bd'; })()} !important;
  }
cards:
  # ── verbruik ──────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Verbruik
  - type: grid
    columns: 3
    square: false
    # 3-up fits the wide desktop pop-up, but on a phone each tile's label area
    # collapses to ~37px and Bubble marquee-scrolls the name back and forth.
    # 2-up on mobile gives the labels room; a trailing odd tile takes its own row.
    card_mod:
      style: |
        @media (max-width: 767px) {
          #root { grid-template-columns: 1fr 1fr !important; }
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.water_daily
        name: Vandaag
        icon: mdi:calendar-today
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.water_daily') | float(-99999) -%}
          {{ ((('%.2f' | format(v)) | replace('.', ',')) ~ ' m³') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.water_monthly
        name: Deze maand
        icon: mdi:calendar-month
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.water_monthly') | float(-99999) -%}
          {{ ((('%.1f' | format(v)) | replace('.', ',')) ~ ' m³') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.water_yearly
        name: Dit jaar
        icon: mdi:calendar-blank
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.water_yearly') | float(-99999) -%}
          {{ ((('%.1f' | format(v)) | replace('.', ',')) ~ ' m³') if v != -99999 else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
  # ── verloop ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Verloop
  - type: energy-water-graph
