  # ── Zoeken (speelt beste match op de gekozen kamer) ────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Zoeken
  - type: entities
    show_header_toggle: false
    entities:
      - entity: input_text.music_hub_search
        name: Zoekterm
        icon: mdi:magnify
  - type: grid
    columns: 3
    square: false
    # 3-up fits the wide desktop pop-up, but on a phone each tile's label area
    # collapses to ~37px and Bubble marquee-scrolls the name back and forth.
    # 2-up on mobile gives the labels room; a trailing odd tile takes its own row.
    card_mod:
      style: |
        @media (max-width: 767px) {
          #root { grid-template-columns: 1fr 1fr !important; }
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Nummer
        icon: mdi:music-note
        card_layout: large
        button_action:
          tap_action: { action: perform-action, perform_action: script.music_hub_search_play, data: { media_type: track } }
        styles: |
