# Bubble Card native pop-up (hash #muziek) — Muziekhub.
# Central Music Assistant hub: pick a room, then play presets / search / group.
# Backed by helpers + scripts in packages/pkg_music.yaml. Playback targets the
# room selected in input_select.music_hub_room (the "Kamers" grid sets it).
# Style JS uses only hass.states[...] (the proven-safe Bubble scope here).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 720px
hash: '#muziek'
name: Muziekhub
icon: mdi:music-circle
# header = how many rooms are playing right now
entity: input_select.music_hub_room
show_state: true
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const P=['media_player.woonkamer_ma_sonos','media_player.eetkamer_ma_sonos','media_player.office_ma_sonos','media_player.unnamed_room_3','media_player.unnamed_room','media_player.tv_speaker_ma_sonos','media_player.sonos_roam_2']; return P.some(p=>hass.states[p]?.state==='playing') ? 'rgba(45,170,115,0.14)' : 'rgba(255,255,255,0.04)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const P=['media_player.woonkamer_ma_sonos','media_player.eetkamer_ma_sonos','media_player.office_ma_sonos','media_player.unnamed_room_3','media_player.unnamed_room','media_player.tv_speaker_ma_sonos','media_player.sonos_roam_2']; return P.some(p=>hass.states[p]?.state==='playing') ? 'rgba(45,170,115,0.20)' : 'rgba(255,255,255,0.07)'; })()} !important; }
  .bubble-state { font-size: 0 !important; }
  .bubble-state::after {
    font-size: 13px !important; font-weight: 500; color: #b9c0c7 !important;
    content: "${(() => { const P=['media_player.woonkamer_ma_sonos','media_player.eetkamer_ma_sonos','media_player.office_ma_sonos','media_player.unnamed_room_3','media_player.unnamed_room','media_player.tv_speaker_ma_sonos','media_player.sonos_roam_2']; const n=P.filter(p=>hass.states[p]?.state==='playing').length; return n===0 ? 'Niets aan het spelen' : (n+(n===1?' kamer speelt':' kamers spelen')); })()}";
  }
cards:
