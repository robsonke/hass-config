        card_type: button
        button_type: state
        entity: media_player.woonkamer_ma_sonos
        name: Woonkamer
        icon: mdi:sofa
        card_layout: large
        button_action:
          tap_action: { action: perform-action, perform_action: input_select.select_option, target: { entity_id: input_select.music_hub_room }, data: { option: Woonkamer } }
          hold_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const sel=hass.states['input_select.music_hub_room']?.state==='Woonkamer'; const playing=hass.states['media_player.woonkamer_ma_sonos']?.state==='playing'; return sel ? 'rgba(55,138,221,0.22)' : (playing ? 'rgba(45,170,115,0.13)' : 'rgba(255,255,255,0.04)'); })()} !important; }
          .bubble-button-container { border: ${hass.states['input_select.music_hub_room']?.state==='Woonkamer' ? '1px solid rgba(55,138,221,0.6)' : '1px solid transparent'} !important; }
          .bubble-icon-container { background-color: ${hass.states['media_player.woonkamer_ma_sonos']?.state==='playing' ? 'rgba(45,170,115,0.22)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after { font-size: 12px !important; color: #9aa1a8 !important; content: "${(() => { const s=hass.states['media_player.woonkamer_ma_sonos']; if(!s) return '—'; if(s.state==='paused') return 'gepauzeerd'; if(['idle','off','unavailable','standby'].includes(s.state)) return 'stil'; const t=(s.attributes.media_title||'').replace(/,/g,' '); return t ? (t.length>24 ? t.slice(0,23)+'…' : t) : 'speelt'; })()}"; }
