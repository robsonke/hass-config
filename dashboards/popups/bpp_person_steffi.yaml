# Bubble Card native pop-up (#person-steffi) — Steffi presence.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 1000px
hash: '#person-steffi'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Steffi
icon: mdi:account
# header = aanwezigheid (groen thuis, blauw op werk/zone, dim onderweg) + duur
entity: person.steffi
state_content: >-
  {%- set st = states['person.steffi'] -%}
  {%- if st is none -%}—
  {%- else -%}
  {%- set s = (now() - st.last_changed).total_seconds() -%}
  {%- if s < 60 -%}{%- set d = 'net' -%}
  {%- elif s < 3600 -%}{%- set m = (s/60)|round|int -%}{%- set d = '1 uur' if m >= 60 else m ~ ' min' -%}
  {%- elif s < 86400 -%}{%- set h = (s/3600)|round|int -%}{%- set d = '1 dag' if h >= 24 else h ~ ' uur' -%}
  {%- else -%}{%- set dy = (s/86400)|round|int -%}{%- set d = dy ~ (' dag' if dy == 1 else ' dagen') -%}
  {%- endif -%}
  {{ {'home':'Thuis','not_home':'Onderweg'}.get(st.state, st.state) ~ ' · ' ~ d }}
  {%- endif -%}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const s = hass.states['person.steffi']?.state; return s === 'home' ? 'rgba(45,170,115,0.14)' : (s === 'not_home') ? 'rgba(255,255,255,0.04)' : 'rgba(55,138,221,0.16)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const s = hass.states['person.steffi']?.state; return s === 'home' ? 'rgba(45,170,115,0.20)' : (s === 'not_home') ? 'rgba(255,255,255,0.07)' : 'rgba(55,138,221,0.22)'; })()} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${(() => { const s = hass.states['person.steffi']?.state; return s === 'home' ? '#9ed9bd' : (s === 'not_home') ? '#9b9aac' : '#82bbf0'; })()} !important;
  }
cards:
  # ── bed (Auping) ──────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Bed
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-cover-card
        entity: cover.bed_steffi
        show_tilt_position_control: false
        show_buttons_control: true
        tap_action: { action: none }
        hold_action: { action: none }
        double_tap_action: { action: none }
        secondary_info: none
        fill_container: false
        layout: horizontal
      - type: custom:mod-card
        style:
          hui-grid-card$: "div#root {\n  display: grid;\n  grid-template-columns: min-content max-content;\n}\n"
          hui-grid-card$ mushroom-entity-card$: "ha-card {\n  border: unset;\n  background: unset;\n  --icon-primary-color: var(--primary-text-color);\n  --grip-card-gap: 0;\n}\n"
        card:
          type: grid
          square: false
          columns: 2
          cards:
            - type: custom:mushroom-entity-card
              entity: cover.bed_steffi
              name: Lezen
              primary_info: none
              secondary_info: none
              icon: mdi:book-alphabet
              tap_action:
                action: call-service
                service: rest_command.auping_bed
                data: { cbu: 2, motor_1_action: 0, motor_1_time: 0, motor_2_action: 1, motor_2_time: 14000, motor_3_action: 0, motor_3_time: 0 }
            - type: custom:mushroom-entity-card
              entity: cover.bed_steffi
              name: TV kijken
              primary_info: none
              secondary_info: none
              icon: mdi:television-classic
              tap_action:
                action: call-service
                service: rest_command.auping_bed
                data: { cbu: 2, motor_1_action: 0, motor_1_time: 0, motor_2_action: 1, motor_2_time: 17000, motor_3_action: 0, motor_3_time: 0 }
  # ── sport ─────────────────────────────────────────────────────────
  # Opens her Strava pop-up (#sport-steffi). State line shows this week's km plus
  # the last activity title, so the button is informative before you even tap it.
  - type: custom:bubble-card
    card_type: separator
    name: Sport
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.strava_run_week_steffi
    name: Strava
    icon: mdi:run-fast
    card_layout: large
    tap_action: { action: navigate, navigation_path: '#sport-steffi' }
    button_action:
      tap_action: { action: navigate, navigation_path: '#sport-steffi' }
    state_content: >-
      {%- set w = states('sensor.strava_run_week_steffi') | float(-1) -%}
      {%- set a = states('sensor.strava_steffi_berks_run') -%}
      {{ ('—' if w < 0 else '%.1f' | format(w)) ~ ' km deze week' ~ ((' · ' ~ a) if a not in ['unknown','unavailable',''] else '') }}
    styles: |
      .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.14) !important; }
      .bubble-icon-container { background-color: rgba(252,82,0,0.22) !important; }
      .bubble-state {
        font-size: 13px !important; font-weight: 500; color: #ff8a5c !important;
      }
  # ── kaart ─────────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Kaart
  - type: map
    default_zoom: 16
    dark_mode: true
    hours_to_show: 12
    entities:
      - person.steffi
    card_mod:
      style:
        .: "#root {\n  height: 22em;\n  padding-bottom: 0 !important;\n}\nha-icon-button {\n  color: var(--primary-color);\n  zoom: 140%;\n  margin-left: -0.2em;\n}\nha-card {\n  border-radius: 22px;\n  transition: none;\n  height: 22em !important;\n}\n"
        ha-map$: "#map {\n  background-color: #191919 !important;\n}\n.leaflet-control-attribution {\n  display: none;\n}\n.leaflet-bar a {\n  background-color: rgba(115, 123, 124, 0.2) !important;\n  color: #9da0a2 !important;\n  backdrop-filter: blur(0.25em);\n  zoom: 140%;\n}\n.leaflet-pane.leaflet-tile-pane {\n  filter: invert(0.95) grayscale(0.95) contrast(95%);\n}"
  # ── verloop ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Verloop
  - type: history-graph
    title: Apparaten (12 uur)
    hours_to_show: 12
    entities:
      - device_tracker.iphone_steffi
      - device_tracker.icloud_iphone_steffi
      - device_tracker.iphonedetect_steffi
  # ── aanwezigheid ──────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Aanwezigheid
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: device_tracker.iphonedetect_steffi
        name: Router
        icon: mdi:wifi
        card_layout: large
        tap_action: { action: more-info }
        state_content: "{{ 'thuis' if is_state('device_tracker.iphonedetect_steffi','home') else 'weg' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'home' ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'home' ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'home' ? '#7db8ec' : '#8f8e9e'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: device_tracker.icloud_iphone_steffi
        name: iCloud
        icon: mdi:apple
        card_layout: large
        tap_action: { action: more-info }
        state_content: "{{ 'thuis' if is_state('device_tracker.icloud_iphone_steffi','home') else 'weg' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'home' ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'home' ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'home' ? '#7db8ec' : '#8f8e9e'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: device_tracker.iphone_steffi
        name: GPS
        icon: mdi:cellphone
        card_layout: large
        tap_action: { action: more-info }
        state_content: "{{ 'thuis' if is_state('device_tracker.iphone_steffi','home') else 'weg' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'home' ? 'rgba(55,138,221,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'home' ? 'rgba(55,138,221,0.22)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'home' ? '#7db8ec' : '#8f8e9e'} !important; }
