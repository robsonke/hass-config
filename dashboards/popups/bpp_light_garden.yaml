  # ── tijdlijn: "Automatisch aan" is set by the garden darkness automation, cleared by the
  # morning-off one — it deliberately stays on all night (evening automation only dims
  # lanterns to 30%). Lux line is the trigger sensor (< 12); history capped by purge_keep_days (10).
  - type: custom:bubble-card
    card_type: separator
    name: Tijdlijn
  - type: history-graph
    title: Automatisch aan door donker (4 dagen)
    hours_to_show: 96
    entities:
      - entity: input_boolean.lights_garden_auto_dark
        name: Automatisch aan
      - entity: light.lights_garden
