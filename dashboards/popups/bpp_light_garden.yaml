# Bubble Card native pop-up (hash #verlichting-tuin) — Verlichting light sliders.
# Light slider cards (drag = brightness, tap = toggle, colour = light's own rgb);
# on/off-only lights are plain toggle cards. See the popup-modernization spec.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 1000px
hash: '#verlichting-tuin'
# auto-closes after 1 min without interaction; every tap/click resets the timer
auto_close: 60000
name: Tuin verlichting
icon: mdi:lightbulb-group
entity: light.lights_garden
# These rules used to read a hardcoded 19-entity array (four copies that drifted from the
# light group in pkg_lights.yaml, once showing "1 on" while four lights were lit). Now the
# member list comes from the group itself, like the tile — one place to maintain.
state_content: >-
  {%- set m = expand('light.lights_garden') -%}
  {%- set o = m | selectattr('state','eq','on') | list | count -%}
  {{ 'Alles uit' if o == 0 else o ~ ' aan · ' ~ (m | count - o) ~ ' uit' }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(hass.states['light.lights_garden']?.attributes?.entity_id || []).some(e => hass.states[e]?.state === 'on') ? 'rgba(240,195,95,0.13)' : 'rgba(255,255,255,0.04)'} !important; }
  .bubble-icon-container { background-color: ${(hass.states['light.lights_garden']?.attributes?.entity_id || []).some(e => hass.states[e]?.state === 'on') ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
  .bubble-state { font-size: 14px !important; font-weight: 500; color: ${(hass.states['light.lights_garden']?.attributes?.entity_id || []).some(e => hass.states[e]?.state === 'on') ? '#f0cf8f' : '#9b9aac'} !important; }
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Overkapping
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.roofceiling_garden_light
        name: Spots
        card_layout: large
        slider_live_update: true
        tap_action: { action: toggle }
        double_tap_action: { action: more-info }
        hold_action: { action: more-info }
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.roofceiling_table_light
        name: Tafel
        card_layout: large
        slider_live_update: true
        tap_action: { action: toggle }
        double_tap_action: { action: more-info }
        hold_action: { action: more-info }
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.lights_wall_shed
        name: Wand
        card_layout: large
        slider_live_update: true
        tap_action: { action: toggle }
        double_tap_action: { action: more-info }
        hold_action: { action: more-info }
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.veranda_light
        name: Blokhut Spots
        card_layout: large
        slider_live_update: true
        tap_action: { action: toggle }
        double_tap_action: { action: more-info }
        hold_action: { action: more-info }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: light.shed_light_back
        name: Schuur Achter
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: "{{ 'aan' if is_state('light.shed_light_back','on') else 'uit' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
  - type: custom:bubble-card
    card_type: separator
    name: Tuin
  - type: grid
    columns: 2
