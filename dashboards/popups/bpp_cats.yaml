# Bubble Card native pop-up (hash #katten) — Boris&Puk tile (Tuin).
# Kattenluik-beweging, tellingen vandaag, sensor-diagnostiek, laatste spot.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 620px
hash: '#katten'
# sluit automatisch na 1 min zonder interactie; elke tap/klik reset de timer
auto_close: 60000
name: Boris en Puk
icon: mdi:cat
# header = kattenluik-beweging (blauw = beweging, groen = rustig) + duur
entity: binary_sensor.motion_sensor_cats_occupancy
state_content: >-
  {%- set st = states['binary_sensor.motion_sensor_cats_occupancy'] -%}
  {%- if st is none -%}—
  {%- else -%}
  {%- set s = (now() - st.last_changed).total_seconds() -%}
  {%- if s < 60 -%}{%- set d = 'net' -%}
  {%- elif s < 3600 -%}{%- set m = (s/60)|round|int -%}{%- set d = '1 uur' if m >= 60 else m ~ ' min' -%}
  {%- elif s < 86400 -%}{%- set h = (s/3600)|round|int -%}{%- set d = '1 dag' if h >= 24 else h ~ ' uur' -%}
  {%- else -%}{%- set dy = (s/86400)|round|int -%}{%- set d = dy ~ (' dag' if dy == 1 else ' dagen') -%}
  {%- endif -%}
  {{ ('Beweging' if st.state == 'on' else 'Rustig') ~ ' · ' ~ d }}
  {%- endif -%}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(55,138,221,0.16)' : 'rgba(45,170,115,0.13)'} !important; }
  .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(55,138,221,0.22)' : 'rgba(45,170,115,0.20)'} !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500;
    color: ${state === 'on' ? '#82bbf0' : '#9ed9bd'} !important;
  }
cards:
  # ── vandaag ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Vandaag
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.cat_door_today
        name: Door het luikje
        icon: mdi:door
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.cat_door_today') -%}
          {{ (v ~ '×') if v not in ['unknown','unavailable',''] else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.bijkeuken_cat_sightings_today
        name: Bijkeuken
        icon: mdi:cctv
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.bijkeuken_cat_sightings_today') -%}
          {{ (v ~ '×') if v not in ['unknown','unavailable',''] else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.14) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #82bbf0 !important; }
  # ── sensor ────────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Kattenluik-sensor
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.motion_sensor_cats_battery
        name: Batterij
        icon: mdi:battery
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.motion_sensor_cats_battery') -%}
          {{ (v ~ '%') if v not in ['unknown','unavailable',''] else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const v = parseFloat(hass.states['sensor.motion_sensor_cats_battery']?.state); return (isFinite(v) && v < 20) ? 'rgba(226,75,74,0.16)' : 'rgba(45,170,115,0.13)'; })()} !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: ${(() => { const v = parseFloat(hass.states['sensor.motion_sensor_cats_battery']?.state); return (isFinite(v) && v < 20) ? '#ec8a89' : '#9ed9bd'; })()} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.motion_sensor_cats_device_temperature
        name: Temperatuur
        icon: mdi:thermometer
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set v = states('sensor.motion_sensor_cats_device_temperature') -%}
          {{ (v ~ ' °C') if v not in ['unknown','unavailable',''] else '—' }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(45,170,115,0.13) !important; }
          .bubble-state { font-size: 13px !important; font-weight: 500; color: #9ed9bd !important; }
  # ── laatste spot ──────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laatste kat gezien
  - type: picture-entity
    entity: image.bijkeuken_cat
    show_name: false
    show_state: false
    camera_view: auto
    card_mod:
      style: |
        ha-card { border: none; }
