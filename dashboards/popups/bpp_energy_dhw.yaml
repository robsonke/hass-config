# Bubble Card native pop-up (hash #warm-water) — Warm water (Altherma DHW tank).
# Revised 2026-09-18: shifted focus from "how warm is the water" to "is the solar
# control doing its job". The key question is whether extra heating still happens
# between 17:00 and 06:00; the usage graph at the bottom answers that at a glance.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 900px
hash: '#warm-water'
# auto-closes after 1 min without interaction; every tap/click resets the timer
auto_close: 60000
name: Warm water
icon: mdi:water-boiler
# header = tank temperature + phase, coloured by phase
entity: water_heater.domestic_hot_water_tank
# Bubble Card 3.4.0: text comes from state_content (server-side Jinja), no longer
# a CSS ::after with font-size 0 on the real state. Colour stays JS.
state_content: >-
  {%- set t = state_attr('water_heater.domestic_hot_water_tank','current_temperature') -%}
  {%- set p = states('sensor.dhw_phase') -%}
  {%- set label = {'opwarmen':'warmt op','afkoelen':'koelt af','ochtend':'ochtendvangnet','uit':'sturing uit'}.get(p, p) -%}
  {{ (t | round(0) | int ~ '°C') if t is not none else '—' }}{{ ' · ' ~ label if label else '' }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const p = hass.states['sensor.dhw_phase']?.state; return p === 'opwarmen' ? 'rgba(240,195,95,0.13)' : p === 'afkoelen' ? 'rgba(55,138,221,0.14)' : p === 'ochtend' ? 'rgba(158,217,189,0.14)' : 'rgba(255,255,255,0.04)'; })()} !important; }
  .bubble-icon-container { background-color: ${(() => { const p = hass.states['sensor.dhw_phase']?.state; return p === 'opwarmen' ? 'rgba(240,195,95,0.20)' : p === 'afkoelen' ? 'rgba(55,138,221,0.22)' : p === 'ochtend' ? 'rgba(158,217,189,0.20)' : 'rgba(255,255,255,0.07)'; })()} !important; }
  .bubble-state { font-size: 14px !important; font-weight: 500; color: ${(() => { const p = hass.states['sensor.dhw_phase']?.state; return p === 'opwarmen' ? '#f0cf8f' : p === 'afkoelen' ? '#82bbf0' : p === 'ochtend' ? '#9ed9bd' : '#9b9aac'; })()} !important; }
cards:
  # ── sturing ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Sturing
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.dhw_solar_scheduling
        name: Zonnesturing
        icon: mdi:solar-power-variant
        card_layout: large
        tap_action: { action: toggle }
        hold_action: { action: more-info }
        state_content: "{{ 'aan' if is_state('input_boolean.dhw_solar_scheduling','on') else 'uit' }}"
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,195,95,0.14)' : 'rgba(255,255,255,0.04)'} !important; }
          .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,195,95,0.20)' : 'rgba(255,255,255,0.07)'} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${state === 'on' ? '#f0cf8f' : '#8f8e9e'} !important; }
      # Intended vs actual setpoint. If they diverge this turns red — the same signal
      # the watchdog automation monitors, and the best broken-signal there is.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.dhw_target_setpoint
        name: Setpoint
        icon: mdi:thermostat-box
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set w = states('sensor.dhw_target_setpoint') | float(-999) -%}
          {%- set a = state_attr('water_heater.domestic_hot_water_tank','temperature') | float(-999) -%}
          {%- if w == -999 or a == -999 -%}—
          {%- elif (w - a) | abs >= 0.5 -%}{{ a | round(0) | int }}° ipv {{ w | round(0) | int }}°
          {%- else -%}{{ w | round(0) | int }}° actief
          {%- endif -%}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(() => { const w = parseFloat(hass.states['sensor.dhw_target_setpoint']?.state); const a = parseFloat(hass.states['water_heater.domestic_hot_water_tank']?.attributes?.temperature); return (isFinite(w) && isFinite(a) && Math.abs(w - a) >= 0.5) ? 'rgba(221,86,86,0.16)' : 'rgba(255,255,255,0.04)'; })()} !important; }
          .bubble-icon-container { background-color: ${(() => { const w = parseFloat(hass.states['sensor.dhw_target_setpoint']?.state); const a = parseFloat(hass.states['water_heater.domestic_hot_water_tank']?.attributes?.temperature); return (isFinite(w) && isFinite(a) && Math.abs(w - a) >= 0.5) ? 'rgba(221,86,86,0.22)' : 'rgba(255,255,255,0.07)'; })()} !important; }
          .bubble-state { font-size: 12.5px !important; color: ${(() => { const w = parseFloat(hass.states['sensor.dhw_target_setpoint']?.state); const a = parseFloat(hass.states['water_heater.domestic_hot_water_tank']?.attributes?.temperature); return (isFinite(w) && isFinite(a) && Math.abs(w - a) >= 0.5) ? '#e88f8f' : '#8f8e9e'; })()} !important; }
  # 3.4.0 lets card_type: climate control water_heater too, so the native tile card is
  # no longer needed. min_temp/max_temp deliberately omitted: the card reads them from
  # the entity (currently 30-55), so a changed field setting on the unit takes effect automatically.
  - type: custom:bubble-card
    card_type: climate
    entity: water_heater.domestic_hot_water_tank
    name: Tapwater
    icon: mdi:water-boiler
    # state_color off: the water_heater on-colour is bright yellow and clashes with this
    # pop-up's muted tones. The phase colour is already in the header, so this would be redundant.
    state_color: false
    sub_button:
      - select_attribute: operation_list
        state_background: false
  # ── plan van vandaag ── why the heating window sits where it does — without the
  # forecast and price alternative next to it, a start time is just an arbitrary number.
  - type: custom:bubble-card
    card_type: separator
    name: Plan van vandaag
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.dhw_phase
        name: Fase
      - entity: input_datetime.dhw_charge_start
        name: Opwarmvenster start
      - entity: input_number.dhw_charge_duration
        name: Opwarmduur
      - type: divider
      - entity: sensor.solcast_pv_forecast_forecast_today
        name: Zonprognose vandaag
      - entity: input_number.dhw_solar_threshold
        name: Drempel voor zonnetak
      - entity: sensor.dhw_cheapest_charge_start
        name: Goedkoopste blok (alternatief)
  # ── temperatuur ── 24h, not 12h: at 12 you never see a full cycle, at 24 you see
  # the afternoon heat-up and the overnight cool-down in one view.
  - type: custom:bubble-card
    card_type: separator
    name: Temperatuur (24 uur)
  - type: custom:mini-graph-card
    entities:
      - entity: sensor.domestichotwatertank_tank_temperature
        name: Water
        color: '#e74c3c'
      - entity: sensor.dhw_target_setpoint
        name: Bedoeld
        color: '#f0cf8f'
      - entity: water_heater.domestic_hot_water_tank
        attribute: temperature
        name: Ingesteld
        color: white
    show:
      labels: true
    hour24: true
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
  # ── verbruik: the core metric. Peaks between 17:00-06:00 are nightly reheats, which the
  # spec wants at zero (baseline 8-17 Sep 2026: 20 total, 10 in that window). Uses the Shelly
  # meter, not sensor.altherma_power_usage (a derived current×voltage value off the P1P2 bus).
  - type: custom:bubble-card
    card_type: separator
    name: Verbruik warmtepomp (24 uur)
  - type: statistics-graph
    title: Vermogen per uur
    period: hour
    days_to_show: 1
    stat_types: mean
    chart_type: bar
    entities:
      - entity: sensor.shelly_warmtepomp_meter_total_active_power
        name: Warmtepomp
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.altherma_heatpump_daily
        name: Verbruik vandaag
      - entity: sensor.shelly_warmtepomp_meter_total_active_power
        name: Vermogen nu
  # ── instellingen ──────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Instellingen
  - type: custom:expander-card
    title: Setpoints en venster
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_number.dhw_setpoint_charge
            name: Opwarmen
          - entity: input_number.dhw_setpoint_coast
            name: Afkoelen
          - entity: input_number.dhw_setpoint_normal
            name: Normaal
          - type: divider
          - entity: input_number.dhw_solar_threshold
            name: Zonnedrempel
          - entity: input_number.dhw_charge_duration
            name: Opwarmduur
          - type: divider
          - entity: input_datetime.dhw_morning_start
            name: Ochtendvenster start
          - entity: input_datetime.dhw_morning_end
            name: Ochtendvenster eind
  # ── diagnose ──────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Diagnose
  - type: custom:expander-card
    title: Status en logboek
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.domestichotwatertank_is_in_error_state
            name: Storing
          - entity: sensor.domestichotwatertank_heatup_mode
            name: Opwarmmodus
          - entity: binary_sensor.domestichotwatertank_is_powerful_mode_active
            name: Powerful actief
          - entity: sensor.altherma_operation_mode
            name: Bedrijfsmodus
      - type: logbook
        entities:
          - water_heater.domestic_hot_water_tank
          - sensor.dhw_phase
          - input_boolean.dhw_solar_scheduling
        hours_to_show: 24
