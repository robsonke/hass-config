# Bubble Card native pop-up (#sport-steffi) — Strava voor Steffi.
# Opened from a button on her pop-up (#person-steffi) and from the km sub-button
# on her tile on the overview. Mirrors bpp_strava.yaml (Rob) but without the
# "Schoenen & fiets" and "Fietsen & records" sections: her account has no
# per-gear distance sensors, 69 km of rides in total and no swims, so those
# would be empty tiles. Her shoes show up as a row in "Laatste run" instead.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 900px
hash: '#sport-steffi'
name: Sport Steffi
icon: mdi:run-fast
# header = kilometers deze week (utility_meter, resets Monday) + laatste activiteit
entity: sensor.strava_run_week_steffi
show_state: true
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.14) !important; }
  .bubble-icon-container { background-color: rgba(252,82,0,0.22) !important; }
  .bubble-state { font-size: 0 !important; }
  .bubble-state::after {
    font-size: 14px !important; font-weight: 500; color: #ff8a5c !important;
    content: "${(() => { const w = hass.states['sensor.strava_run_week_steffi']?.state; const km = (w === undefined || isNaN(parseFloat(w))) ? '—' : parseFloat(w).toFixed(1); const act = hass.states['sensor.strava_steffi_berks_run']?.state; return km + ' km deze week' + (act ? String.fromCharCode(32,183,32) + act : ''); })()}";
  }
cards:
  # ── laatste run ───────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laatste run
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_run_distance
        name: Afstand
        icon: mdi:map-marker-distance
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.13) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_last_run_pace_steffi
        name: Tempo
        icon: mdi:speedometer
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.13) !important; }
          /* the sensor holds "6:28"; append the unit here so the template
             sensor stays a clean value */
          .bubble-state::after { content: " /km"; opacity: 0.7; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_last_run_duration_steffi
        name: Duur
        icon: mdi:timer-outline
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_run_average_heartrate
        name: Hartslag
        icon: mdi:heart-pulse
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(226,75,74,0.13) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_run_average_cadence
        name: Cadans
        icon: mdi:shoe-print
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_run_elevation_gain
        name: Hoogtemeters
        icon: mdi:elevation-rise
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_run_calories
        name: Calorieën
        icon: mdi:fire
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(233,167,21,0.13) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_run_kudos
        name: Kudos
        icon: mdi:thumb-up
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.13) !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after {
            font-size: 13px !important; font-weight: 500;
            content: "${(() => { const k = hass.states['sensor.strava_steffi_berks_run_kudos']?.state ?? '0'; const t = hass.states['sensor.strava_steffi_berks_run_trophies']?.state ?? '0'; return k + ' kudos' + (parseInt(t) > 0 ? String.fromCharCode(32,183,32) + t + ' trofee' : ''); })()}";
          }
  # gear + toestel van die run, als rij i.p.v. tegels
  - type: entities
    entities:
      - entity: sensor.strava_steffi_berks_run_date
        name: Datum
        icon: mdi:calendar
      - entity: sensor.strava_steffi_berks_run_gear_name
        name: Schoenen
        icon: mdi:shoe-sneaker
      - entity: sensor.strava_steffi_berks_run_device_info
        name: Gemeten met
        icon: mdi:watch

  # ── afstanden ─────────────────────────────────────────────────────
  # NB "4 weken" is Strava's own `recent` window, not a rolling month we compute.
  - type: custom:bubble-card
    card_type: separator
    name: Hardlopen — afstanden
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_run_week_steffi
        name: Deze week
        icon: mdi:calendar-week
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.16) !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after {
            font-size: 13px !important; font-weight: 500;
            content: "${(() => { const s = hass.states['sensor.strava_run_week_steffi']; const now = parseFloat(s?.state); const prev = parseFloat(s?.attributes?.last_period); const a = isNaN(now) ? '—' : now.toFixed(1) + ' km'; return a + (isNaN(prev) ? '' : String.fromCharCode(32,183,32) + 'vorige ' + prev.toFixed(1)); })()}";
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_run_month_steffi
        name: Deze maand
        icon: mdi:calendar-today
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.16) !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after {
            font-size: 13px !important; font-weight: 500;
            content: "${(() => { const s = hass.states['sensor.strava_run_month_steffi']; const now = parseFloat(s?.state); const prev = parseFloat(s?.attributes?.last_period); const a = isNaN(now) ? '—' : now.toFixed(1) + ' km'; return a + (isNaN(prev) ? '' : String.fromCharCode(32,183,32) + 'vorige ' + prev.toFixed(0)); })()}";
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_stats_recent_run_distance
        name: 4 weken
        icon: mdi:calendar-month
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after {
            font-size: 13px !important; font-weight: 500;
            content: "${(() => { const d = hass.states['sensor.strava_steffi_berks_stats_recent_run_distance']?.state; const c = hass.states['sensor.strava_steffi_berks_stats_recent_run_count']?.state; return (isNaN(parseFloat(d)) ? '—' : parseFloat(d).toFixed(0) + ' km') + (c ? String.fromCharCode(32,183,32) + c + 'x' : ''); })()}";
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_stats_ytd_run_distance
        name: Dit jaar
        icon: mdi:calendar-star
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after {
            font-size: 13px !important; font-weight: 500;
            content: "${(() => { const d = hass.states['sensor.strava_steffi_berks_stats_ytd_run_distance']?.state; const c = hass.states['sensor.strava_steffi_berks_stats_ytd_run_count']?.state; return (isNaN(parseFloat(d)) ? '—' : parseFloat(d).toFixed(0) + ' km') + (c ? String.fromCharCode(32,183,32) + c + 'x' : ''); })()}";
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_steffi_berks_stats_all_run_distance
        name: Totaal
        icon: mdi:infinity
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state { font-size: 0 !important; }
          .bubble-state::after {
            font-size: 13px !important; font-weight: 500;
            content: "${(() => { const d = hass.states['sensor.strava_steffi_berks_stats_all_run_distance']?.state; const c = hass.states['sensor.strava_steffi_berks_stats_all_run_count']?.state; return (isNaN(parseFloat(d)) ? '—' : parseFloat(d).toFixed(0) + ' km') + (c ? String.fromCharCode(32,183,32) + c + ' runs' : ''); })()}";
          }
      # sixth tile so the 2-column grid fills three clean rows
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_recent_run_average_steffi
        name: Gem. per run
        icon: mdi:chart-line
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
  # Progress bars for the two periods that reset. Maxima are personal targets,
  # not data — scaled off her own 4-week window (141 km / 4 = ~35 km per week),
  # so 50 and 200 rather than Rob's 80 and 300.
  - type: custom:bar-card
    width: 60%
    height: 2em
    decimal: 0
    unit_of_measurement: km
    positions: { icon: outside, indicator: 'off', name: outside }
    entity_row: true
    entities:
      - entity: sensor.strava_run_week_steffi
        name: Deze week
        icon: mdi:run
        max: 50
      - entity: sensor.strava_run_month_steffi
        name: Deze maand
        icon: mdi:calendar-today
        max: 200
  # Kilometers per week over time — see bpp_strava.yaml for why this is a
  # statistics-graph on the all-time total instead of an apexcharts card on
  # state history (recorder keeps only 10 days; long-term statistics never
  # get purged). Bars appear one per week from the day her account was added.
  - type: statistics-graph
    title: Kilometers per week
    chart_type: bar
    period: week
    days_to_show: 365
    stat_types:
      - change
    entities:
      - entity: sensor.strava_steffi_berks_stats_all_run_distance
        name: Hardlopen
