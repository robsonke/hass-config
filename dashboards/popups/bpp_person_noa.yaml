# Bubble Card native pop-up (#person-noa) — Noa (slaapkamer camera + bed).
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 900px
hash: '#person-noa'
name: Noa
icon: mdi:bed
# header = kamerlicht (warm = aan) + temperatuur en luchtvochtigheid.
# Was binary_sensor.noa_bed_presence, maar die detectie werkt niet betrouwbaar.
entity: light.dimmer_noa
show_state: true
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: ${state === 'on' ? 'rgba(240,190,70,0.16)' : 'rgba(255,255,255,0.04)'} !important; }
  .bubble-icon-container { background-color: ${state === 'on' ? 'rgba(240,190,70,0.24)' : 'rgba(255,255,255,0.07)'} !important; }
  .bubble-state { font-size: 0 !important; }
  .bubble-state::after {
    font-size: 14px !important; font-weight: 500;
    color: ${state === 'on' ? '#f0c85a' : '#9b9aac'} !important;
    content: "${(() => { const lit = hass.states['light.dimmer_noa']?.state === 'on' ? 'Licht aan' : 'Licht uit'; const t = hass.states['sensor.climate_sensor_noa_temperature']?.state; const h = hass.states['sensor.climate_sensor_noa_humidity']?.state; const temp = t ? (Math.round(t * 10) / 10) + '°C' : '—'; const hum = h ? Math.round(h) + '%' : '—'; return lit + ' · ' + temp + ' · ' + hum; })()}";
  }
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Camera
  - type: custom:advanced-camera-card
    dimensions:
      aspect_ratio_mode: unconstrained
    view:
      default: live
    menu:
      buttons:
        frigate:
          enabled: false
        timeline:
          enabled: true
        clips:
          enabled: true
        recordings:
          enabled: true
        snapshots:
          enabled: false
        camera_ui:
          enabled: true
        fullscreen:
          enabled: true
        media_player:
          enabled: false
      style: overlay
      position: top
    cameras:
      - camera_entity: camera.noabed
    timeline:
      window_seconds: 3600
      events_media_type: all
      show_recordings: true
      controls:
        thumbnails:
          mode: below
    media_viewer:
      controls:
        thumbnails:
          mode: below
        next_previous:
          style: chevrons
  # ── kamer (licht + klimaat) ───────────────────────────────────────
  # Licht en klimaatsensor komen uit light.lights_upstairs (pkg_lights.yaml) en
  # niet uit de area's - die spreken elkaar tegen. 2 kolommen, want een 3-koloms
  # grid knijpt de labels op mobiel dicht tot een scrollende marquee.
  - type: custom:bubble-card
    card_type: separator
    name: Kamer
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: light.dimmer_noa
    name: Licht
    icon: mdi:lightbulb
    card_layout: large
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.climate_sensor_noa_temperature
        name: Temperatuur
        icon: mdi:thermometer
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.climate_sensor_noa_humidity
        name: Vocht
        icon: mdi:water-percent
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
