# Bubble Card native pop-up (hash #weer) — weather in Kloetinge.
# Modernized from the old layout-card grid to stacked Bubble sections.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 900px
hash: '#weer'
# auto-closes after 2 min without interaction; every tap/click resets the timer
auto_close: 120000
name: Het weer in Kloetinge
icon: mdi:weather-partly-cloudy
# header = current temperature + (localised) condition
entity: weather.weather_langeweide_ecowitt
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: rgba(55,138,221,0.13) !important; }
  .bubble-icon-container { background-color: rgba(55,138,221,0.20) !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500; color: #82bbf0 !important;
  }
state_content: >-
  {%- set t = state_attr('weather.weather_langeweide_ecowitt','temperature') | float(-99999) -%}
  {%- set s = states('weather.weather_langeweide_ecowitt') -%}
  {%- set w = {'sunny':'zonnig','clear-night':'heldere nacht','partlycloudy':'half bewolkt','cloudy':'bewolkt','rainy':'regen','pouring':'stortregen','lightning':'onweer','lightning-rainy':'onweer en regen','snowy':'sneeuw','snowy-rainy':'natte sneeuw','fog':'nevel','windy':'wind','windy-variant':'wind','hail':'hagel','exceptional':'bijzonder'} -%}
  {{ (((t | round | int) ~ '°C') if t != -99999 else '—') ~ ((' · ' ~ w.get(s, s)) if s not in ['unknown','unavailable',''] else '') }}
cards:
  # ── nu & verwachting ──────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Nu & verwachting
  - type: custom:weather-card
    entity: weather.weather_langeweide_ecowitt
    current: true
    details: true
    forecast: true
    hourly_forecast: false
    number_of_forecasts: '5'
  # ── regen ─────────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Regen
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.rate_rain_piezo
        name: Nu
        icon: mdi:weather-pouring
      - entity: sensor.daily_rain_piezo
        name: Vandaag
        icon: mdi:calendar-today
      - entity: sensor.weekly_rain_piezo
        name: Deze week
        icon: mdi:calendar-week
      - entity: sensor.monthly_rain_piezo
        name: Deze maand
        icon: mdi:calendar-month
  # Was custom:buien-rain-forecast (gone from HACS); replaced with data already available:
  # Buienradar's next-hour sensors + the built-in hourly forecast card. weather.home (met.no)
  # supports hourly (features 3); weather.kloetinge is daily-only and would render empty.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.kloetinge_precipitation_forecast_total
        name: Komend uur
        icon: mdi:weather-pouring
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: ${(parseFloat(hass.states['sensor.kloetinge_precipitation_forecast_total']?.state) > 0) ? 'rgba(89,160,238,0.18)' : 'rgba(255,255,255,0.05)'} !important; }
          .bubble-icon-container { background-color: ${(parseFloat(hass.states['sensor.kloetinge_precipitation_forecast_total']?.state) > 0) ? 'rgba(89,160,238,0.26)' : 'rgba(255,255,255,0.08)'} !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.kloetinge_precipitation_forecast_average
        name: Intensiteit
        icon: mdi:speedometer
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
  - type: weather-forecast
    entity: weather.home
    forecast_type: hourly
    show_current: false
    show_forecast: true

  # ── buienradar ────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Buienradar
  - type: picture-glance
    entities: []
    camera_image: camera.buienradar
  # ── verloop ───────────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Temperatuur (24 uur)
  - type: history-graph
    hours_to_show: 24
    refresh_interval: 30
    entities:
      - sensor.temp
