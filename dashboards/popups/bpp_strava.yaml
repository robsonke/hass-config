# Bubble Card native pop-up (#sport) — Strava.
# Opened from a button on Rob's pop-up (#person-rob) and from the km sub-button
# on his tile on the overview.
type: custom:bubble-card
card_type: pop-up
buttons_position: left
popup_mode: centered
full_width_on_mobile: true
width_desktop: 900px
hash: '#sport'
# auto-closes after 1 min without interaction; every tap/click resets the timer
auto_close: 60000
name: Sport
icon: mdi:run-fast
# header = kilometers this week (utility_meter, resets Monday) + latest activity
entity: sensor.strava_run_week
state_content: >-
  {%- set w = states('sensor.strava_run_week') | float(-1) -%}
  {%- set a = states('sensor.strava_rob_sonke_run') -%}
  {{ ('—' if w < 0 else '%.1f' | format(w)) ~ ' km deze week' ~ ((' · ' ~ a) if a not in ['unknown','unavailable',''] else '') }}
styles: |
  .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.14) !important; }
  .bubble-icon-container { background-color: rgba(252,82,0,0.22) !important; }
  .bubble-state {
    font-size: 14px !important; font-weight: 500; color: #ff8a5c !important;
  }
cards:
  # ── laatste run ───────────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Laatste run
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_run_distance
        name: Afstand
        icon: mdi:map-marker-distance
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.13) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_last_run_pace
        name: Tempo
        icon: mdi:speedometer
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.13) !important; }
          /* the sensor holds "5:55"; append the unit here so the template
             sensor stays a clean value */
          .bubble-state::after { content: " /km"; opacity: 0.7; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_last_run_duration
        name: Duur
        icon: mdi:timer-outline
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_run_average_heartrate
        name: Hartslag
        icon: mdi:heart-pulse
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(226,75,74,0.13) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_run_average_cadence
        name: Cadans
        icon: mdi:shoe-print
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_run_elevation_gain
        name: Hoogtemeters
        icon: mdi:elevation-rise
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_run_calories
        name: Calorieën
        icon: mdi:fire
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(233,167,21,0.13) !important; }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_run_kudos
        name: Kudos
        icon: mdi:thumb-up
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set kv = states('sensor.strava_rob_sonke_run_kudos') | int(0) -%}
          {%- set tv = states('sensor.strava_rob_sonke_run_trophies') | int(0) -%}
          {{ kv ~ ' kudos' ~ ((' · ' ~ tv ~ ' trofee') if tv > 0 else '') }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.13) !important; }
          .bubble-state {
            font-size: 13px !important; font-weight: 500;
          }
  # gear + device for that run, as a row instead of tiles
  - type: entities
    entities:
      - entity: sensor.strava_rob_sonke_run_date
        name: Datum
        icon: mdi:calendar
      - entity: sensor.strava_rob_sonke_run_gear_name
        name: Schoenen
        icon: mdi:shoe-sneaker
      - entity: sensor.strava_rob_sonke_run_device_info
        name: Gemeten met
        icon: mdi:watch

  # ── afstanden ─────────────────────────────────────────────────────
  # NB "4 weken" is Strava's own `recent` window, not a rolling month we compute.
  - type: custom:bubble-card
    card_type: separator
    name: Hardlopen — afstanden
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_run_week
        name: Deze week
        icon: mdi:calendar-week
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set nv = states('sensor.strava_run_week') | float(-1) -%}
          {%- set pv = state_attr('sensor.strava_run_week','last_period') | float(-1) -%}
          {{ ('—' if nv < 0 else ('%.1f' | format(nv)) ~ ' km') ~ ('' if pv < 0 else ' · vorige ' ~ ('%.1f' | format(pv))) }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.16) !important; }
          .bubble-state {
            font-size: 13px !important; font-weight: 500;
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_run_month
        name: Deze maand
        icon: mdi:calendar-today
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set nv = states('sensor.strava_run_month') | float(-1) -%}
          {%- set pv = state_attr('sensor.strava_run_month','last_period') | float(-1) -%}
          {{ ('—' if nv < 0 else ('%.1f' | format(nv)) ~ ' km') ~ ('' if pv < 0 else ' · vorige ' ~ ('%.0f' | format(pv))) }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(252,82,0,0.16) !important; }
          .bubble-state {
            font-size: 13px !important; font-weight: 500;
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_stats_recent_run_distance
        name: 4 weken
        icon: mdi:calendar-month
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set dv = states('sensor.strava_rob_sonke_stats_recent_run_distance') | float(-1) -%}
          {%- set cv = states('sensor.strava_rob_sonke_stats_recent_run_count') -%}
          {{ ('—' if dv < 0 else ('%.0f' | format(dv)) ~ ' km') ~ ((' · ' ~ cv ~ 'x') if cv not in ['unknown','unavailable',''] else '') }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state {
            font-size: 13px !important; font-weight: 500;
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_stats_ytd_run_distance
        name: Dit jaar
        icon: mdi:calendar-star
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set dv = states('sensor.strava_rob_sonke_stats_ytd_run_distance') | float(-1) -%}
          {%- set cv = states('sensor.strava_rob_sonke_stats_ytd_run_count') -%}
          {{ ('—' if dv < 0 else ('%.0f' | format(dv)) ~ ' km') ~ ((' · ' ~ cv ~ 'x') if cv not in ['unknown','unavailable',''] else '') }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state {
            font-size: 13px !important; font-weight: 500;
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_rob_sonke_stats_all_run_distance
        name: Totaal
        icon: mdi:infinity
        card_layout: large
        tap_action: { action: more-info }
        state_content: >-
          {%- set dv = states('sensor.strava_rob_sonke_stats_all_run_distance') | float(-1) -%}
          {%- set cv = states('sensor.strava_rob_sonke_stats_all_run_count') -%}
          {{ ('—' if dv < 0 else ('%.0f' | format(dv)) ~ ' km') ~ ((' · ' ~ cv ~ ' runs') if cv not in ['unknown','unavailable',''] else '') }}
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
          .bubble-state {
            font-size: 13px !important; font-weight: 500;
          }
      # sixth tile so the 2-column grid fills three clean rows
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.strava_recent_run_average
        name: Gem. per run
        icon: mdi:chart-line
        card_layout: large
        tap_action: { action: more-info }
        styles: |
          .bubble-button-background { opacity: 1 !important; background-color: rgba(255,255,255,0.05) !important; }
  # Progress bars for the two periods that reset — the maxima are personal
  # targets, not data: ~80 km/week and ~300 km/month.
  - type: custom:bar-card
    width: 60%
    height: 2em
    decimal: 0
    unit_of_measurement: km
    positions: { icon: outside, indicator: 'off', name: outside }
    entity_row: true
    entities:
      - entity: sensor.strava_run_week
        name: Deze week
        icon: mdi:run
        max: 80
      - entity: sensor.strava_run_month
        name: Deze maand
        icon: mdi:calendar-today
        max: 300
  # Kilometers per week: a statistics-graph on the ALL-TIME total, not an apexcharts state-history
  # chart — recorder purges after 10 days, but long-term stats never expire. stat_types: change +
  # period: week gives the weekly delta, sourced from the Strava total, not the resettable utility_meter sensor.
  - type: statistics-graph
    title: Kilometers per week
    chart_type: bar
    period: week
    days_to_show: 365
    stat_types:
      - change
    entities:
      - entity: sensor.strava_rob_sonke_stats_all_run_distance
        name: Hardlopen

  # ── materiaal ─────────────────────────────────────────────────────
  # Mileage per pair of shoes — handy to see when a pair is worn out (Brooks rates ~800 km).
  - type: custom:bubble-card
    card_type: separator
    name: Schoenen & fiets
  - type: entities
    entities:
      - entity: sensor.strava_rob_sonke_brooks_hyperion_elite_4_wit_rood_geel_distance
        name: Brooks Hyperion Elite 4
        icon: mdi:shoe-sneaker
      - entity: sensor.strava_rob_sonke_brooks_glycerin_oranje_distance
        name: Brooks Glycerin
        icon: mdi:shoe-sneaker
      - entity: sensor.strava_rob_sonke_brooks_ghost_all_old_shoes_distance
        name: Brooks Ghost (alle oude)
        icon: mdi:shoe-print
      - entity: sensor.strava_rob_sonke_scott_scale_900_pro_distance
        name: Scott Scale 900 Pro
        icon: mdi:bike

  # ── fietsen & records ─────────────────────────────────────────────
  - type: custom:bubble-card
    card_type: separator
    name: Fietsen & records
  - type: entities
    entities:
      - entity: sensor.strava_rob_sonke_ride
        name: Laatste rit
        icon: mdi:bike-fast
      - entity: sensor.strava_rob_sonke_ride_distance
        name: Afstand
        icon: mdi:map-marker-distance
      - entity: sensor.strava_rob_sonke_stats_ytd_ride_distance
        name: Fietsen dit jaar
        icon: mdi:calendar-star
      - entity: sensor.strava_rob_sonke_stats_all_ride_distance
        name: Fietsen totaal
        icon: mdi:infinity
      - entity: sensor.strava_rob_sonke_stats_biggest_ride_distance
        name: Langste rit
        icon: mdi:trophy
      - entity: sensor.strava_rob_sonke_stats_biggest_climb_elevation_gain
        name: Grootste klim
        icon: mdi:image-filter-hdr
