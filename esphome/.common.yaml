wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${ip}
    gateway: 192.168.0.1
    subnet: 255.255.255.0

# No `captive_portal:` here: unreachable without an `ap:` block, so it only
# wasted flash on the tightest (1MB) nodes. Re-add both together if ever needed.

api:
  encryption:
    key: !secret api_key

# `encryption:` with no key inherits the api key above, making it required
# (replaces `password:`, which ESPHome now flags as wasting flash/RAM). One-way
# per device: pre-2026.9 firmware has no OTA encryption, so flash it first.
ota:
  platform: esphome
  encryption:

web_server:
  port: 80
  version: 3
  # `ota: false` closes web_server's separate, unauthenticated /update endpoint
  # (otherwise OTA encryption above is pointless). Rest of the web UI still has
  # no auth; that needs a separate `auth:` block.
  ota: false

time:
  - platform: homeassistant
    id: homeassistant_time

logger:
  level: INFO
