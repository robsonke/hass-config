# RETIRED 2026-09-19. Superseded by esphome/s3-pool-lights.yaml, which moved
# this node's RS-485 control of the Duratech PLP-REM-350 from this M5StickC +
# RS485 HAT onto an M5Stack AtomS3 + ATOM Tail485 at 192.168.0.112.
#
# Kept because the comments below are the record of how this protocol was
# worked out - the new file carries them forward, but this is where the pin,
# framework and framing decisions were actually paid for.
#
# To put the StickC back in service: `git mv esphome/archive/pool-lights.yaml
# esphome/` and point packages/pkg_pool.yaml + the two "Zwembad -
# (Vorig|Volgend) lichtprogramma" automations back at esphome.pool_lights_* and
# switch.m5stickc_pool_lights_pool_lights.

substitutions:
  devicename: "pool-lights"
  ip: !secret m5stickc_pool_lights_ip

esphome:
  name: ${devicename}
  friendly_name: ${devicename}
  comment: "RS485 Pool light control"

esp32:
  board: m5stick-c
  framework:
    # esp-idf, matching esphome/archive/pool-fairland-heatpump.yaml - the same
    # M5StickC + RS485 HAT, same GPIO0/GPIO26, same 9600 8N1, which worked.
    # 2751642c switched this to arduino on 2026-08-14 in the same blind commit
    # that also swapped the uart pins; GPIO0 is an ESP32 strapping pin and the
    # two frameworks do not set it up identically, so keep this on esp-idf
    # unless there is a concrete reason not to.
    type: esp-idf

# `packages:` rather than a `<<` merge key: `<<` does not merge nested
# sections - the first definition wins and the rest is dropped, which is how
# device-level api:/ota:/logger: blocks silently discarded the shared ones.
packages:
  common: !include .common.yaml

logger:
  baud_rate: 0
  # DEBUG is the minimum level at which the uart debug block below actually
  # emits frames (UARTDebug::log_string uses ESP_LOGD). At INFO the debug block
  # is configured but silent, which is why the bus looked like a black box.
  # Drop back to INFO once the protocol is settled.
  level: DEBUG
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key
  # The PLP-REM-350 takes plain ASCII strings over RS-485 (9600 8N1), not
  # Modbus - see the command table in the LINK Driver manual. These two generic
  # pass-throughs are what packages/pkg_pool.yaml drives light.pool_light with:
  # PDxxx for brightness, PCrrrgggbbb for colour, PSxx for a program (01-14).
  # Exposed in HA as esphome.pool_lights_* (the node is named pool-lights).
  # Both hand off to script.send_plp rather than touching the bus directly -
  # see that script for why the pacing matters. They are otherwise identical;
  # there are two names only because pkg_pool.yaml already calls both.
  services:
    - service: set_color
      variables:
        color: string
      then:
        - script.execute:
            id: send_plp
            cmd: !lambda 'return color;'
    - service: send_uart_command
      variables:
        command: string
      then:
        - script.execute:
            id: send_plp
            cmd: !lambda 'return command;'

# https://community.home-assistant.io/t/working-esphome-yaml-for-m5stickc/538050
# https://shop.m5stack.com/products/m5stickc-rs485-hat-aoz1282ci
# TX = GPIO0, RX = GPIO26. M5Stack's own HAT example is the authority here:
#   Serial2.begin(115200, SERIAL_8N1, 26, 0);   // begin(baud, cfg, rx, tx)
# so rx=26, tx=0 - matching the m5-docs pinmap table and the ESPHome examples.
# The 8 "received" bytes seen under tx=26/rx=0 were NOT an echo: they logged as
# "parse failed", i.e. garbage, which is crosstalk on a floating RX pin from the
# driven line beside it. Do not swap these back on the strength of that.
# This controls the Duratech PLP-REM-350
# https://www.duratech.be/en/controller/plp-rem-350
uart:
  id: mod_bus
  tx_pin: GPIO0
  rx_pin: GPIO26
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  debug:
    direction: BOTH
    dummy_receiver: false
    # Was `delimiter: "\n"`, which never fires: the PLP-REM-350 command set has
    # no terminator and the controller never replies, so frames just queued up
    # and flushed together as one blob ("PS01PL1PS01"). Flush on a short idle
    # gap instead, so each command is its own timestamped line.
    after:
      timeout: 30ms
      bytes: 64
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

# Every RS-485 write in this file goes through script.send_plp; nothing writes
# to mod_bus directly any more. send_plp only *enqueues* - the interval below
# is what puts bytes on the wire, exactly one command per 80ms tick.
#
# Why a paced queue at all:
#   Framing. The PLP-REM command set has no terminator and no length field, so
#   the only frame boundary the controller has is an idle gap on the bus.
#   Driven straight from HA the log showed the switch and both services
#   arriving as one concatenated blob ("PS01PL1PS01") - to the controller that
#   is a single unparseable frame, which is why nothing happened even though
#   the bytes themselves were right. Pacing also fixes ordering: a
#   light.pool_light that fires turn_on + set_level + set_rgb in one tick can
#   no longer interleave them mid-command.
#   80ms is the figure from phendrickx/duratech_PLP-REM_RS485, which paces its
#   own PL1 -> PDxxx -> PCrrrgggbbb the same way and is the only known working
#   implementation of this protocol.
#
# Why a coalescing queue rather than `script: mode: queued`:
#   Bubble Card's slider calls the service straight out of its pointermove
#   handler when slider_live_update is set - checked in
#   www/community/Bubble-Card/bubble-card.js, `sliderLiveUpdate && J(e, o)`,
#   with no throttle on that branch. A drag can therefore emit tens of
#   light.turn_on calls a second, and the pop-up slider for this light does set
#   slider_live_update. A queued script would need `max_runs` (ESPHome rejects
#   0 for queued mode) and drops the *newest* run on overflow - i.e. exactly
#   the final value you wanted to keep, leaving the light on some stale
#   brightness. Coalescing instead means a drag collapses to one PD per tick
#   and the last value always lands.
globals:
  - id: plp_queue
    type: std::vector<std::string>
    restore_value: no

script:
  - id: send_plp
    # No delay in the body, so this always runs to completion inside the
    # caller's tick and can never be "already running" - mode is moot.
    mode: single
    parameters:
      cmd: string
    then:
      - lambda: |-
          auto &q = id(plp_queue);
          // PD/PC/PT each carry one absolute value, so a copy still sitting in
          // the queue is worthless the moment a newer value for the same
          // command shows up - overwrite it in place rather than sending both.
          // Everything else appends: PL1/PL0 and PRA1/PRA0 are edges, and two
          // PSxx in a row is a real request to change program twice.
          if (cmd.size() >= 2) {
            std::string key = cmd.substr(0, 2);
            if (key == "PD" || key == "PC" || key == "PT") {
              for (auto &pending : q) {
                if (pending.compare(0, 2, key) == 0) {
                  pending = cmd;
                  return;
                }
              }
            }
          }
          q.push_back(cmd);

# The drain. One command per tick and nothing else touches the bus, so every
# frame is guaranteed its idle gap - a 11-byte command at 9600 8N1 takes ~11ms,
# leaving ~69ms of silence behind it. That is also what makes the uart debug
# block above readable: with 80ms spacing its 30ms idle flush gives one
# timestamped line per command instead of a run-together blob.
interval:
  - interval: 80ms
    then:
      - lambda: |-
          auto &q = id(plp_queue);
          if (q.empty())
            return;
          std::string cmd = q.front();
          q.erase(q.begin());
          id(mod_bus).write_str(cmd.c_str());

# No modbus/modbus_controller here on purpose. The controller does not speak
# Modbus - it answers nothing, so every poll logged "Stop waiting for response
# from 1" and the 8 bytes that came back were our own request echoed by the
# auto-direction RS485 HAT. Everything below writes ASCII commands instead.

switch:
  # optimistic: the controller sends no replies at all, so there is no state to
  # read back. The real on/off feedback comes from the Shelly power sensor that
  # packages/pkg_pool.yaml watches.
  - platform: template
    id: pool_lights
    name: Pool Lights
    optimistic: true
    turn_on_action:
      - script.execute:
          id: send_plp
          cmd: 'PL1'
    turn_off_action:
      - script.execute:
          id: send_plp
          cmd: 'PL0'

  - platform: template
    id: pool_aux_relay_a
    name: Pool Controller Auxiliary Relay A
    optimistic: true
    turn_on_action:
      - script.execute:
          id: send_plp
          cmd: 'PRA1'
    turn_off_action:
      - script.execute:
          id: send_plp
          cmd: 'PRA0'

# No *program* select here. Program choice is owned by light.pool_light in
# packages/pkg_pool.yaml, whose effect_list comes from
# input_select.pool_light_program_options ("01. Deep Blue Sea" ... "14. Sun
# White") and which sends PS + the leading two digits. That numbering already
# matches the manual's PSxx range of 01-14; the modbus optionsmap that used to
# sit here was 0-10 and disagreed with both.
#
# Colour temperature is different: there is no HA-side helper for it and the
# template light has nowhere to put it, so it lives on the node.
select:
  - platform: template
    id: pool_light_color_temp
    name: Pool Light Color Temperature
    # optimistic: same reason as the switches - the controller answers nothing,
    # so the only state is what we last asked for.
    optimistic: true
    options:
      - 500K
      - 1000K
      - 1500K
      - 2000K
      - 2500K
      - 3000K
      - 3500K
    set_action:
      - script.execute:
          id: send_plp
          cmd: !lambda |-
            // PTxxx carries Kelvin/100, zero-padded to three digits, and the
            // manual's range is PT005-PT035 in 500K steps: "500K" -> PT005,
            // "3500K" -> PT035. atoi stops at the K, so no stripping needed.
            char buf[6];
            snprintf(buf, sizeof(buf), "PT%03d", atoi(x.c_str()) / 100);
            return std::string(buf);

button:
  # Tells the controller to re-sync its lamps. Note the case: it really is
  # capital-P, lowercase-s, capital-S - not a typo for PSS or PsS's siblings
  # PsU/PsD (next/previous program), which we deliberately do not use because
  # HA owns the program list and addressing PSxx directly keeps the two in
  # lockstep instead of chasing a remote cursor nothing reports back.
  - platform: template
    name: Pool Light Sync
    on_press:
      - script.execute:
          id: send_plp
          cmd: 'PsS'

light:
  # Built-in Red Status LED Light. See https://esphome.io/components/light/status_led.html
  - platform: status_led
    name: "LED Light"
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO10
      inverted: true

# Built-in buttons. See https://esphome.io/components/button/
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    id: button_a
    name: Button A
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: button_b
    name: Button B

# Built-in infrared transmitter. See https://esphome.io/components/remote_transmitter.html
# and https://m5stack.hackster.io/alessandro-polselli/turn-m5stickc-into-universal-ir-remote-home-automation-d3ec0d
remote_transmitter:
  pin: GPIO9
  carrier_duty_percent: 50%

# grab the power sensor from HA to track if lights are on/off
# since we have no state
sensor:
  - platform: homeassistant
    name: "Power Usage Pool Lights"
    entity_id: sensor.pool_shelly_3em_active_power_phase_c
    id: "pool_shelly_3em_active_power_phase_c"

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO15

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: True

# Fonts
font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 12

# builtin 80x160 TFT
display:
  # Migrated off the deprecated st7735 platform. Mapping used:
  #   model: INITR_MINI160X80  ->  model: ST7735 + dimensions: 160x80
  #   device_width/device_height -> dimensions
  #   col_start: 1  ->  offset_width: 1
  #   row_start: 1  ->  offset_height: 1
  # The old platform folded panel quirks into its model name; mipi_spi wants
  # them stated. If the image sits shifted, the offsets are the knob (this
  # 0.96" 160x80 panel is commonly 24/0 or 26/1 rather than 1/1), and if the
  # colours come out negative, flip invert_colors.
  - platform: mipi_spi
    model: ST7735
    cs_pin: GPIO5
    dc_pin: GPIO23
    reset_pin: GPIO18
    color_order: bgr
    invert_colors: true
    rotation: 270°
    update_interval: 2s
    lambda: |-
      it.print(80, 0, id(roboto), TextAlign::TOP_CENTER, "M5Stick Pool Lights");
