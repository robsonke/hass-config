# RS-485 control of Duratech PLP-REM-350; AtomS3+Tail485 replacement for the
# StickC node `pool-lights` - protocol/queue/comments carried over verbatim.
# Deliberately dropped as unused (do not re-add): status_led, Button A/B, remote_transmitter, i2c.

substitutions:
  devicename: "s3-pool-lights"
  ip: !secret s3_pool_lights_ip

esphome:
  name: ${devicename}
  # Entity ids are derived from this, not from `name`: "S3 Pool Lights" ->
  # switch.s3_pool_lights_pool_lights, and the generated API actions become
  # esphome.s3_pool_lights_*. packages/pkg_pool.yaml and the two "Zwembad -
  # (Vorig|Volgend) lichtprogramma" automations address exactly those names, so
  # changing this string silently breaks the pool light in HA.
  friendly_name: S3 Pool Lights
  comment: "RS485 Pool light control"
  min_version: 2026.4.0

esp32:
  board: m5stack-atoms3
  # ESPHome's schema defaults flash_size to 4MB and the board entry does not
  # raise it, so without this line half the flash on an ESP32-S3FN8 (the FN8
  # suffix *is* 8MB embedded flash) goes unused and the partition table is cut
  # to match. No `psram:` block and no `variant:`: this is the plain AtomS3, not
  # the AtomS3R, and the variant is already implied by the board.
  flash_size: 8MB
  framework:
    # Same reasoning as on the StickC: esp-idf is the framework this protocol
    # has been proven on. The StickC also had a concrete extra reason - its TX
    # sat on GPIO0, a strapping pin the two frameworks do not set up
    # identically - which no longer applies here, but there is nothing to gain
    # from switching either.
    type: esp-idf

# `packages:` rather than a `<<` merge key: `<<` does not merge nested
# sections - the first definition wins and the rest is dropped, which is how
# device-level api:/ota:/logger: blocks silently discarded the shared ones.
packages:
  common: !include .common.yaml

logger:
  # DEBUG is needed for the uart debug block below to actually emit (ESP_LOGD);
  # INFO stays silent. No baud_rate/hardware_uart override needed: logging uses
  # USB-CDC, which shares no pins with the Tail485 UART.
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  # Plain ASCII over RS-485 (9600 8N1), not Modbus - see LINK Driver manual.
  # pkg_pool.yaml drives light.pool_light via these: PDxxx (brightness),
  # PCrrrgggbbb (colour), PSxx (program 01-14) - both hand off to send_plp.
  services:
    - service: set_color
      variables:
        color: string
      then:
        - script.execute:
            id: send_plp
            cmd: !lambda 'return color;'
    - service: send_uart_command
      variables:
        command: string
      then:
        - script.execute:
            id: send_plp
            cmd: !lambda 'return command;'

# ATOM Tail485 uses the Grove port: AtomS3 yellow=G2(TX), white=G1(RX)
# (confirmed via M5's Grove pin table). Don't copy G5/G6 from other guides -
# that's the Atomic RS485 Base; unlike the StickC's GPIO0, neither pin here is a strapping pin.
uart:
  id: mod_bus
  tx_pin: GPIO2
  rx_pin: GPIO1
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  debug:
    direction: BOTH
    dummy_receiver: false
    # Was `delimiter: "\n"`, which never fires: the PLP-REM-350 command set has
    # no terminator and the controller never replies, so frames just queued up
    # and flushed together as one blob ("PS01PL1PS01"). Flush on a short idle
    # gap instead, so each command is its own timestamped line.
    after:
      timeout: 30ms
      bytes: 64
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

# script.send_plp enqueues; the interval below writes one command per 80ms
# tick, avoiding frames merging into one unparseable blob (no terminator in
# this protocol). Coalescing, not `script: mode: queued`, keeps the latest value from a fast slider drag.
globals:
  - id: plp_queue
    type: std::vector<std::string>
    restore_value: no

script:
  - id: send_plp
    # No delay in the body, so this always runs to completion inside the
    # caller's tick and can never be "already running" - mode is moot.
    mode: single
    parameters:
      cmd: string
    then:
      - lambda: |-
          auto &q = id(plp_queue);
          // PD/PC/PT each carry one absolute value, so a copy still sitting in
          // the queue is worthless the moment a newer value for the same
          // command shows up - overwrite it in place rather than sending both.
          // Everything else appends: PL1/PL0 and PRA1/PRA0 are edges, and two
          // PSxx in a row is a real request to change program twice.
          if (cmd.size() >= 2) {
            std::string key = cmd.substr(0, 2);
            if (key == "PD" || key == "PC" || key == "PT") {
              for (auto &pending : q) {
                if (pending.compare(0, 2, key) == 0) {
                  pending = cmd;
                  return;
                }
              }
            }
          }
          q.push_back(cmd);

# The drain. One command per tick and nothing else touches the bus, so every
# frame is guaranteed its idle gap - a 11-byte command at 9600 8N1 takes ~11ms,
# leaving ~69ms of silence behind it. That is also what makes the uart debug
# block above readable: with 80ms spacing its 30ms idle flush gives one
# timestamped line per command instead of a run-together blob.
interval:
  - interval: 80ms
    then:
      - lambda: |-
          auto &q = id(plp_queue);
          if (q.empty())
            return;
          std::string cmd = q.front();
          q.erase(q.begin());
          id(mod_bus).write_str(cmd.c_str());

# No modbus/modbus_controller here on purpose. The controller does not speak
# Modbus - it answers nothing, so every poll logged "Stop waiting for response
# from 1" and the 8 bytes that came back were our own request echoed by the
# auto-direction RS485 HAT. Everything below writes ASCII commands instead.

switch:
  # optimistic: the controller sends no replies at all, so there is no state to
  # read back. The real on/off feedback comes from the Shelly power sensor that
  # packages/pkg_pool.yaml watches.
  - platform: template
    id: pool_lights
    name: Pool Lights
    optimistic: true
    turn_on_action:
      - script.execute:
          id: send_plp
          cmd: 'PL1'
    turn_off_action:
      - script.execute:
          id: send_plp
          cmd: 'PL0'

  - platform: template
    id: pool_aux_relay_a
    name: Pool Controller Auxiliary Relay A
    optimistic: true
    turn_on_action:
      - script.execute:
          id: send_plp
          cmd: 'PRA1'
    turn_off_action:
      - script.execute:
          id: send_plp
          cmd: 'PRA0'

# No program select: light.pool_light in pkg_pool.yaml owns program choice via
# input_select.pool_light_program_options, sending PS+two digits (01-14).
# Colour temperature has no HA-side helper, so it lives on the node instead.
select:
  - platform: template
    id: pool_light_color_temp
    name: Pool Light Color Temperature
    # optimistic: same reason as the switches - the controller answers nothing,
    # so the only state is what we last asked for.
    optimistic: true
    options:
      - 500K
      - 1000K
      - 1500K
      - 2000K
      - 2500K
      - 3000K
      - 3500K
    set_action:
      - script.execute:
          id: send_plp
          cmd: !lambda |-
            // PTxxx carries Kelvin/100, zero-padded to three digits, and the
            // manual's range is PT005-PT035 in 500K steps: "500K" -> PT005,
            // "3500K" -> PT035. atoi stops at the K, so no stripping needed.
            char buf[6];
            snprintf(buf, sizeof(buf), "PT%03d", atoi(x.c_str()) / 100);
            return std::string(buf);

button:
  # Tells the controller to re-sync its lamps. Note the case: it really is
  # capital-P, lowercase-s, capital-S - not a typo for PSS or PsS's siblings
  # PsU/PsD (next/previous program), which we deliberately do not use because
  # HA owns the program list and addressing PSxx directly keeps the two in
  # lockstep instead of chasing a remote cursor nothing reports back.
  - platform: template
    name: Pool Light Sync
    on_press:
      - script.execute:
          id: send_plp
          cmd: 'PsS'

# The AtomS3's front face is one big button. Exposed for parity with the
# StickC's Button A/B; nothing in HA consumes it.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    id: button_face
    name: Button

# No local on/off state; the Shelly clamp on the lights' phase (same signal
# pkg_pool.yaml trusts) is the only honest "is it on" source - unlike the
# StickC config, which imported a long-unavailable sensor alias that fed nothing.
sensor:
  - platform: homeassistant
    name: "Power Usage Pool Lights"
    entity_id: sensor.pool_shelly_3em_phase_c_power
    id: pool_lights_power

spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 14

# Built-in 0.85" 128x128 IPS panel, GC9107 controller.
# Use `model: GC9107`, NOT M5STACK-ATOMS3R-GC9107 - that preset is for the
# AtomS3R (wrong pins, requires psram); the generic GC9107 fits this board.
display:
  - platform: mipi_spi
    model: GC9107
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    # Start true: ESPHome's generic GC9107 leaves this false, but its
    # M5STACK-ATOMS3R-GC9107 preset - the same 0.85" panel - sets it true.
    invert_colors: true
    # First-boot unknowns (need board in hand): rotation, invert_colors,
    # color_order (bgr default), offset_width/offset_height (GC9107 preset vs
    # M5GFX geometry disagree). Blank screen = known bug esphome#18815; test with show_test_card first.
    rotation: 0°
    update_interval: 2s
    lambda: |-
      it.printf(64, 4, id(roboto), TextAlign::TOP_CENTER, "Pool Lights");
      it.printf(64, 48, id(roboto), TextAlign::TOP_CENTER, "%s",
                id(pool_lights).state ? "ON" : "OFF");
      if (id(pool_lights_power).has_state()) {
        it.printf(64, 80, id(roboto), TextAlign::TOP_CENTER, "%.1f W",
                  id(pool_lights_power).state);
      } else {
        it.printf(64, 80, id(roboto), TextAlign::TOP_CENTER, "-- W");
      }

light:
  # The panel backlight. Not a status light - it is here so the screen can be
  # switched off from HA without taking the node down.
  - platform: monochromatic
    output: lcd_backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: GPIO16
    id: lcd_backlight
    # GPIO16 gates an SGM2578 charge pump rather than driving the LEDs
    # directly. M5Stack: "The PWM signal frequency for the LCD backlight driver
    # is recommended to be 500Hz. A frequency that is too high may cause
    # abnormal brightness adjustment." ESPHome's ledc default is 1000Hz, so
    # this has to be said out loud.
    frequency: 500Hz
