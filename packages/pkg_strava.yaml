# Author: Rob Sonke — https://github.com/robsonke/hass-config
# ha_strava only exposes `recent`/`ytd`/`all`; `recent` means the LAST FOUR WEEKS, not this week, so this package
# derives a real weekly figure. utility_meter has no reload service — a changed meter needs a full restart. Meters don't
# read ha_strava directly: it blips unavailable ~8s before every refresh, dropping utility_meter's last_valid_state and
# re-baselining to 0 each time; sensor.strava_run_total is a trigger-based mirror that never goes unavailable.

utility_meter:
  # Both meters accumulate deltas of the all-time total; `last_period` holds the previous
  # period's total for free, shown next to the current one in the pop-up.
  # `strava_run_month` is a CALENDAR month (resets on the 1st) — NOT the pop-up's "4 weken"
  # tile, which is Strava's own rolling four-week `recent` window; both are shown deliberately.
  strava_run_week:
    name: Strava run week
    source: sensor.strava_run_total
    cycle: weekly
  strava_run_month:
    name: Strava run month
    source: sensor.strava_run_total
    cycle: monthly
  # Steffi has her own ha_strava account entry (strava_steffi_berks_*). Her
  # helpers carry a _steffi suffix; Rob's keep the original unsuffixed names on
  # purpose - renaming his would mint new utility_meter entities and throw away
  # the accumulated totals, which would then need calibrating all over again.
  strava_run_week_steffi:
    name: Strava run week Steffi
    source: sensor.strava_run_total_steffi
    cycle: weekly
  strava_run_month_steffi:
    name: Strava run month Steffi
    source: sensor.strava_run_total_steffi
    cycle: monthly

template:
  # Blip-proof mirror of ha_strava's all-time run total (see note above); `homeassistant: start` is NOT decoration — a
  # fresh trigger-based sensor sits `unknown` until the next run, which would otherwise become the meter's zero baseline
  # (how Steffi's 18.7 km run went missing). The condition is the safety rail: without it, a start while ha_strava is
  # still unavailable would write 0, and the next real reading would look like a +7000 km delta.
  - trigger:
      - trigger: state
        entity_id: sensor.strava_rob_sonke_stats_all_run_distance
        not_to:
          - unknown
          - unavailable
      - trigger: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ has_value('sensor.strava_rob_sonke_stats_all_run_distance') }}"
    sensor:
      - unique_id: strava_run_total
        name: Strava Run Total
        icon: mdi:run
        device_class: distance
        state_class: total
        unit_of_measurement: km
        # states() not trigger.to_state, so the start trigger works too
        state: "{{ states('sensor.strava_rob_sonke_stats_all_run_distance') | float(0) }}"

  - trigger:
      - trigger: state
        entity_id: sensor.strava_steffi_berks_stats_all_run_distance
        not_to:
          - unknown
          - unavailable
      - trigger: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ has_value('sensor.strava_steffi_berks_stats_all_run_distance') }}"
    sensor:
      - unique_id: strava_run_total_steffi
        name: Strava Run Total Steffi
        icon: mdi:run
        device_class: distance
        state_class: total
        unit_of_measurement: km
        state: "{{ states('sensor.strava_steffi_berks_stats_all_run_distance') | float(0) }}"

  - sensor:
    # Strava gives pace as a decimal (5.914 min/km); runners read 5:55 /km.
    # Converted via total seconds so a fractional part that rounds up to 60
    # carries into the minutes instead of rendering "5:60".
    - unique_id: strava_last_run_pace
      name: Strava Last Run Pace
      icon: mdi:speedometer
      availability: "{{ has_value('sensor.strava_rob_sonke_run_pace') }}"
      state: >
        {% set secs = (states('sensor.strava_rob_sonke_run_pace') | float(0) * 60) | round(0) | int %}
        {%- if secs > 0 -%}
          {{ secs // 60 }}:{{ '%02d' % (secs % 60) }}
        {%- else -%}
          —
        {%- endif %}

    # Moving time in seconds (8492) -> 2:21
    - unique_id: strava_last_run_duration
      name: Strava Last Run Duration
      icon: mdi:timer-outline
      availability: "{{ has_value('sensor.strava_rob_sonke_run_moving_time') }}"
      state: >
        {% set s = states('sensor.strava_rob_sonke_run_moving_time') | int(0) %}
        {{ s // 3600 }}:{{ '%02d' % ((s % 3600) // 60) }}

    # Average km per run over Strava's 4-week window — a fairer "form" number
    # than a single run, and it needs no extra plumbing.
    - unique_id: strava_recent_run_average
      name: Strava Recent Run Average
      unit_of_measurement: km
      icon: mdi:chart-line
      availability: >
        {{ has_value('sensor.strava_rob_sonke_stats_recent_run_distance')
           and states('sensor.strava_rob_sonke_stats_recent_run_count') | int(0) > 0 }}
      state: >
        {{ (states('sensor.strava_rob_sonke_stats_recent_run_distance') | float(0)
            / states('sensor.strava_rob_sonke_stats_recent_run_count') | int(1)) | round(1) }}

    # ── Steffi, same three derived values ────────────────────────────────
    - unique_id: strava_last_run_pace_steffi
      name: Strava Last Run Pace Steffi
      icon: mdi:speedometer
      availability: "{{ has_value('sensor.strava_steffi_berks_run_pace') }}"
      state: >
        {% set secs = (states('sensor.strava_steffi_berks_run_pace') | float(0) * 60) | round(0) | int %}
        {%- if secs > 0 -%}
          {{ secs // 60 }}:{{ '%02d' % (secs % 60) }}
        {%- else -%}
          —
        {%- endif %}

    - unique_id: strava_last_run_duration_steffi
      name: Strava Last Run Duration Steffi
      icon: mdi:timer-outline
      availability: "{{ has_value('sensor.strava_steffi_berks_run_moving_time') }}"
      state: >
        {% set s = states('sensor.strava_steffi_berks_run_moving_time') | int(0) %}
        {{ s // 3600 }}:{{ '%02d' % ((s % 3600) // 60) }}

    - unique_id: strava_recent_run_average_steffi
      name: Strava Recent Run Average Steffi
      unit_of_measurement: km
      icon: mdi:chart-line
      availability: >
        {{ has_value('sensor.strava_steffi_berks_stats_recent_run_distance')
           and states('sensor.strava_steffi_berks_stats_recent_run_count') | int(0) > 0 }}
      state: >
        {{ (states('sensor.strava_steffi_berks_stats_recent_run_distance') | float(0)
            / states('sensor.strava_steffi_berks_stats_recent_run_count') | int(1)) | round(1) }}
