# Bed
#
# Author: Rob Sonke
# https://github.com/robsonke/hass-config
#

# POST /api/cbu/motor/extended controls the bed, GET /api/config reads it; both need the X-Key header.
# CBU: 0=synced, 1=left, 2=right side (1=Steffi, 2=Rob).
# Action 0/1/2 = stop/up/down, Time sets the duration until stop; this bed uses motor 2.

rest_command:
  auping_bed:
    url: !secret auping_url
    method: post
    content_type: "application/json"
    headers:
      X-Key: !secret auping_key
      accept: "application/json"
    timeout: 15
    payload: '{"CBU":{{ cbu }},"motor_1":{"Action":{{ motor_1_action }},"TimeInMs": {{ motor_1_time }} },"motor_2":{"Action":{{ motor_2_action }},"TimeInMs": {{ motor_2_time }} },"motor_3":{"Action":{{ motor_3_action }},"TimeInMs": {{ motor_3_time }} }}'

# There used to be a `script.auping_bed` retry wrapper here that called itself instead of
# `rest_command.auping_bed`; `mode: restart` killed each call before the POST reached the bed.
# Removed — covers and dashboard now call rest_command.auping_bed directly; don't reintroduce a same-named wrapper.

template:
  - cover:
    - unique_id: bed_rob
      device_class: shutter
      optimistic: false
      open_cover:
      - action: rest_command.auping_bed
        data:
          cbu: 2
          motor_1_action: 0
          motor_1_time: 0
          motor_2_action: 1
          motor_2_time: 30000
          motor_3_action: 0
          motor_3_time: 0
      close_cover:
      - action: rest_command.auping_bed
        data:
          cbu: 2
          motor_1_action: 0
          motor_1_time: 0
          motor_2_action: 2
          motor_2_time: 30000
          motor_3_action: 0
          motor_3_time: 0
      stop_cover:
      - action: rest_command.auping_bed
        data:
          cbu: 2
          motor_1_action: 0
          motor_1_time: 0
          motor_2_action: 0
          motor_2_time: 0
          motor_3_action: 0
          motor_3_time: 0
      default_entity_id: cover.bed_rob
      icon: mdi:bed-double
      name: Bed Rob
  - cover:
    - unique_id: bed_steffi
      device_class: shutter
      optimistic: false
      open_cover:
      - action: rest_command.auping_bed
        data:
          cbu: 1
          motor_1_action: 0
          motor_1_time: 0
          motor_2_action: 1
          motor_2_time: 30000
          motor_3_action: 0
          motor_3_time: 0
      close_cover:
      - action: rest_command.auping_bed
        data:
          cbu: 1
          motor_1_action: 0
          motor_1_time: 0
          motor_2_action: 2
          motor_2_time: 30000
          motor_3_action: 0
          motor_3_time: 0
      stop_cover:
      - action: rest_command.auping_bed
        data:
          cbu: 1
          motor_1_action: 0
          motor_1_time: 0
          motor_2_action: 0
          motor_2_time: 0
          motor_3_action: 0
          motor_3_time: 0
      default_entity_id: cover.bed_steffi
      icon: mdi:bed-double
      name: Bed Steffi
