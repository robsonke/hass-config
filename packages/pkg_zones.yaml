# Author: Rob Sonke
# https://github.com/robsonke/hass-config

zone:
  - name: Home
    latitude: !secret latitude_coordinate
    longitude: !secret longitude_coordinate
    radius: 75
    icon: mdi:home
  - name: !secret work_rob_name
    latitude: !secret work_rob_latitude_coordinate
    longitude: !secret work_rob_longitude_coordinate
    radius: 75
    icon: mdi:briefcase
  - name: !secret work_steffi_name
    latitude: !secret work_steffi_latitude_coordinate
    longitude: !secret work_steffi_longitude_coordinate
    radius: 75
    icon: mdi:briefcase

# Kept as `customize:` deliberately - the zone integration has an `icon:` option
# but no picture field, so there is no native alternative. The person pictures
# that used to sit alongside this moved onto the person integration itself
# (see pkg_persons.yaml); this one has nowhere better to live.
homeassistant:
  customize:
    zone.home:
      entity_picture: "/local/images/huis_langeweide_icon.png"
