# Author: Rob Sonke
# https://github.com/robsonke/hass-config

input_boolean:
  enable_automatic_lights:
    name: Enable Lights Automation
    icon: mdi:weather-sunset-down
  enable_automatic_garden_lights:
    name: Enable Garden Lights Automation
    icon: mdi:weather-sunset-down
  # Flags purely for the timeline in the light pop-ups: they mark the periods
  # where the lights were on because the darkness automations put them there,
  # so a manual switch-on does not show up as "automatisch aan". Set by the
  # scripts/automations themselves - never by a template - so the recorded
  # history is the automation's own truth. Nothing reads these as a condition.
  lights_downstairs_auto_dark:
    name: Beneden automatisch aan (donker)
    icon: mdi:weather-night
  lights_garden_auto_dark:
    name: Tuin automatisch aan (donker)
    icon: mdi:weather-night
  # Season switch for light.kerst_binnen/buiten: those groups sit on sockets unplugged outside
  # December, so they're unavailable most of the year.
  # The dusk/evening automations used to drive them anyway, logging "Referenced entities ...
  # are missing" every time; all actions on those groups now gate on this.
  kerstverlichting:
    name: Kerstverlichting
    icon: mdi:pine-tree

light:
  - platform: group
    name: Kerst binnen
    unique_id: kerst_binnen
    entities:
      - light.socket4_light_spare2
  - platform: group
    name: Kerst buiten
    unique_id: kerst_buiten
    entities:
      - light.shelly_plug_s_10_relay
      #- light.shelly_plugs_gen3_1_switch
      - light.socket3_light_spare1

  - platform: group
    name: Woonkamer
    unique_id: woonkamer
    entities:
      - light.livingback_light
      - light.livingfront_light
  - platform: group
    name: Keuken
    unique_id: keuken
    entities:
      - light.kitchen_light
      - light.kitchencabin_light

  - platform: group
    name: Benedenverdieping
    unique_id: lights_downstairs
    entities:
      - light.livingback_light
      - light.livingfront_light
      - light.socket2_light_couch
      - light.socket1_light_corner
      - light.ledstrip_tv
      - light.toilet_downstairs_light
      - light.dining_light
      - light.eva_corridor_light
      - light.ledstrip_book
      - light.diningtable_light
      - light.kitchen_light
      - light.kitchencabin_light
      - light.kitchendesk_light
      - light.office_light
      - light.ledstrip_office
      - light.dimmer_hall

  - platform: group
    name: Bovenverdieping
    unique_id: lights_upstairs
    entities:
      - light.dimmer_masterbath
      - light.dimmer_bathroom
      - light.dimmer_masterbed
      - light.dimmer_mastercloset
      - light.dimmer_guestroom
      - light.dimmer_corridor
      - light.dimmer_noa
      - light.dimmer_eva
      - light.toilet_upstairs_light
      - light.bedroom_sonos_light

  # Single source of truth for "tuinverlichting": the dashboard tile and #verlichting-tuin
  # pop-up both count `on` members off this group's entity_id attribute — keep it complete.
  # It used to be missing 3 lanterns + shed_light_back, so the tile read "1 aan" while 4 lights
  # were burning. Deliberately excluded: floodlights (motion security, would flicker the tile)
  # and pool_light (own controls).
  - platform: group
    name: Tuin
    unique_id: lights_garden
    entities:
      - light.garden_light
      - light.veranda_light
      - light.lights_wall_shed
      - light.roofceiling_table_light
      - light.roofceiling_garden_light
      - light.hue_lily_light_fence_1
      - light.hue_lily_light_fence_2
      - light.hue_lily_light_fence_3
      - light.hue_lily_light_tree_1
      - light.hue_lily_light_tree_2
      - light.woodshed_light
      - light.palm1_light
      - light.palm2_light
      - light.pool_terrace_light1
      - light.pool_terrace_light2
      - light.garden_lantern_light1
      - light.garden_lantern_light2
      - light.garden_lantern_light3
      - light.shed_light_back
      - light.shed_light_front

  - platform: group
    name: Tuin Hue
    unique_id: hue_lights_garden
    entities:
      - light.hue_lily_light_fence_1
      - light.hue_lily_light_fence_2
      - light.hue_lily_light_fence_3
      - light.hue_lily_light_tree_1
      - light.hue_lily_light_tree_2
      - light.palm1_light
      - light.palm2_light
      - light.pool_terrace_light1
      - light.pool_terrace_light2

  - platform: group
    name: Benedenverdieping aanwezig
    unique_id: lights_downstairs_present
    entities:
      - light.livingfront_light
      - light.socket2_light_couch
      - light.socket1_light_corner
      - light.ledstrip_tv
      - light.dining_light
      - light.eva_corridor_light
      - light.ledstrip_book
      - light.kitchen_light
      - light.kitchencabin_light
      - light.ledstrip_office
  - platform: group
    name: Benedenverdieping afwezig
    unique_id: lights_downstairs_away
    entities:
      - light.socket2_light_couch
      - light.socket1_light_corner
      - light.ledstrip_tv
      - light.dining_light
      - light.ledstrip_book
      - light.ledstrip_office
