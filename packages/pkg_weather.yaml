template:
  - weather:
    - name: Weather Langeweide Ecowitt
      unique_id: langeweide_ecowitt
      #attribution_template: Local Ecowitt Weatherstation on our roof
      condition_template: "{{ states('weather.home') }}"
      temperature_template: "{{ states('sensor.temp') | float(default=states('sensor.kloetinge_temperature') | float(default=0)) }}"
      wind_bearing_template: "{{ states('sensor.winddir') | float(default=states('sensor.kloetinge_wind_direction') | float(default=0)) }}"
      wind_speed_template: "{{ states('sensor.windspeed') | float(default=states('sensor.kloetinge_wind_speed') | float(default=0)) }}"
      humidity_template: "{{ states('sensor.humidity') | float(default=states('sensor.kloetinge_humidity') | float(default=0)) }}"
      forecast_daily_template: "{{ state_attr('sensor.today_maximum_temperature', 'forecast') }}"
      pressure_template: "{{ state_attr('weather.home', 'pressure') }}"
      temperature_unit: °C
      visibility_unit: km
      wind_speed_unit: km/h
      pressure_unit: hPa
      precipitation_unit: mm

  - trigger:
    - platform: state
      entity_id: weather.home
    action:
      - action: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.home
        response_variable: forecast_daily
    sensor:
      - name: "Today Maximum Temperature"
        icon: mdi:thermometer
        unique_id: today_maximum_temperature
        state: "{{ forecast_daily['weather.home'].forecast[0].temperature }}"
        attributes:
          forecast: "{{ forecast_daily['weather.home'].forecast }}"
      - name: Weather Forecast Langeweide Daily
        unique_id: weather_langeweide_ecowitt_forecast_daily
        state: "{{ now().isoformat() }}"
        icon: mdi:hours-24
        attributes:
          forecast: "{{ forecast_daily['weather.home'].forecast }}"

  - trigger:
      - platform: time_pattern
        minutes: /10
    action:
      - action: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.home
        response_variable: forecast_hourly
    sensor:
      - name: Weather Forecast Langeweide Hourly
        unique_id: weather_langeweide_ecowitt_forecast_hourly
        state: "{{ now().isoformat() }}"
        icon: mdi:hours-24
        attributes:
          forecast: "{{ forecast_hourly['weather.home'].forecast }}"

  - sensor:
    # - name: "Today Maximum Temperature"
    #   icon: mdi:thermometer
    #   unique_id: today_maximum_temperature
    #   state: >
    #     {{ states('sensor.openweathermap_forecast_temperature') | float(default=20) }}
    - name: "Wind Force"
      icon: mdi:weather-windy
      unique_id: wind_force
      state: >
        {% set wind = states('sensor.kloetinge_wind_speed')|float %}
        {% set wind_round = wind|round(1) %}
        {% if wind <= 1 %}0 Bft
        {% elif wind <= 5 %}1 Bft
        {% elif wind <= 11 %}2 Bft
        {% elif wind <= 20 %}3 Bft
        {% elif wind <= 28 %}4 Bft
        {% elif wind <= 39 %}5 Bft
        {% elif wind <= 50 %}6 Bft
        {% elif wind <= 62 %}7 Bft
        {% elif wind <= 75 %}8 Bft
        {% elif wind <= 89 %}9 Bft
        {% elif wind <= 103 %}10 Bft
        {% elif wind <= 117 %}11 Bft
        {% else %} > 117 %}12 Bft
        {%- endif %}

  - binary_sensor:
    # Single source of truth for "it is raining RIGHT NOW", from the Ecowitt
    # piezo rain gauge. Consumers previously each re-derived this:
    #   * the screens close automations compared `sensor.rate_rain_piezo` to the
    #     STRING '0.0' — fragile, since the gauge only has to report "0" or
    #     "0.00" once for the guard to silently stop blocking
    #   * the screens open automations used numeric_state above 0 for 10s
    #   * the weather card's rain chip used its own numeric_state condition
    #
    # Deliberately NOT derived from weather.weather_langeweide_ecowitt: that
    # entity reports `rainy` from the forecast even when nothing is falling
    # (observed 2026-07-26: state `rainy` while the gauge read 0.0 mm/h).
    #
    # delay_on 10s  — matches the confirmation the open automations used, so a
    #                 single spurious tick cannot raise the screens.
    # delay_off 2m  — a shower's rate momentarily dips to 0 between bursts;
    #                 without this the sensor (and the card chip) would flap.
    #                 For "has it rained recently" use sensor.hourly_rain_piezo,
    #                 not a longer delay_off here — this sensor stays honest
    #                 about the present.
    - name: Rain Detected
      unique_id: rain_detected
      device_class: moisture
      icon: mdi:weather-pouring
      # Unavailable (not "dry") when the gauge itself is missing, so a dead
      # sensor cannot read as "safe to close the screens".
      availability: "{{ has_value('sensor.rate_rain_piezo') }}"
      state: "{{ states('sensor.rate_rain_piezo') | float(0) > 0 }}"
      delay_on: "00:00:10"
      delay_off: "00:02:00"
      attributes:
        rate: "{{ states('sensor.rate_rain_piezo') }}"
