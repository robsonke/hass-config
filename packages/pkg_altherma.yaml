climate:
  # https://github.com/zacs/ha-dualmodegeneric
  - platform: dualmode_generic
    name: Warmtepomp
    unique_id: daikin_climate_control
    target_sensor: sensor.indoor_temperature
    min_temp: 19
    # 24 so the summer/cooling target (input_number.hvac_summer_target_temperature
    # = 24) is accepted. The old 23 ceiling was a winter/heating-era limit and
    # made "HVAC - Check and reset the target temp of heat pump" fail every run
    # with "Provided temperature 24.0 is not valid. Accepted range is 19.0 to 23.0".
    max_temp: 24
    heater: input_boolean.heating_downstairs
    cooler: input_boolean.cooling_downstairs
    target_temp: 21
    target_temp_high: 23
    target_temp_low: 19
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    precision: 0.5
    initial_hvac_mode: "off"
    min_cycle_duration:
      minutes: 5

# 30-minute run for the bathroom towel heaters. `restore: true` so the run
# survives an HA restart: "Heating - Control heaters bathrooms" used to hold the
# 30 minutes in an in-line `delay:`, and a restart mid-delay left both heaters
# switched on indefinitely. Same reasoning as timer.alarm_pause in pkg_alarm.yaml.
timer:
  bathroom_heaters:
    name: Badkamer verwarming
    icon: mdi:radiator
    restore: true
    duration: "00:30:00"

input_boolean:
  enable_automatic_hvac:
    name: Enable HVAC Automation
    icon: mdi:hvac
  # These are fake heatpump devices to fool the thermostat entity
  heating_downstairs:
    name: Heating downstairs
    icon: mdi:radiator
  cooling_downstairs:
    name: Cooling downstairs
    icon: mdi:fan
  # Hoofdschakelaar voor de tapwater-zonnesturing. sensor.dhw_target_setpoint
  # test op `not is_state(..., 'on')` en niet op `is_state(..., 'off')`: als
  # deze helper ontbreekt of unavailable is, moet het systeem terugvallen op
  # het normale setpoint in plaats van door te lopen naar de planlogica.
  dhw_solar_scheduling:
    name: Tapwater zonnesturing
    icon: mdi:solar-power-variant

input_number:
  # Controls the hvac operation mode (cooling/heating/off)
  hvac_heating_limit:
    name: Minimale HVAC temperatuur
    icon: mdi:fire-circle
    min: 10
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
  hvac_cooling_limit:
    name: Maximale HVAC temperatuur
    icon: mdi:air-conditioner
    min: 10
    max: 30
    step: 0.5
    unit_of_measurement: "°C"

  hvac_winter_target_temperature:
    name: Winter temperatuur
    icon: mdi:snowflake-thermometer
    min: 10
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
  hvac_summer_target_temperature:
    name: Zomer temperatuur
    icon: mdi:sun-thermometer
    min: 10
    max: 30
    step: 0.5
    unit_of_measurement: "°C"

  # De drie fasen van het tapwater-setpoint. De Daikin bijverwarmt rond 4 K
  # onder het setpoint (gemeten: aanslag rond 40-41 bij setpoint 45), dus
  # deze waarden bepalen indirect ook de bijverwarmdrempels.
  #
  # Opwarmen start op 52 en niet op 55, zodat er ruimte is om op te schalen nadat
  # twee weken gemeten is. De bovengrens 58 is bewust hoger dan veldinstelling
  # [6-0E] op de unit; sensor.dhw_target_setpoint klemt alsnog op max_temp.
  dhw_setpoint_charge:
    name: Tapwater opwarmsetpoint
    icon: mdi:thermometer-high
    min: 45
    max: 58
    step: 1
    unit_of_measurement: "°C"
  # Niet onder 38 zetten: de unit verwarmt zelf bij op ~4 K hieronder, en dat is
  # het vangnet dat koud water onmogelijk maakt.
  dhw_setpoint_coast:
    name: Tapwater afkoelsetpoint
    icon: mdi:thermometer-low
    min: 38
    max: 45
    step: 1
    unit_of_measurement: "°C"
  dhw_setpoint_normal:
    name: Tapwater normaal setpoint
    icon: mdi:thermometer
    min: 40
    max: 50
    step: 1
    unit_of_measurement: "°C"
  # Vanaf welke Solcast-dagprognose we op zon plannen in plaats van op prijs.
  dhw_solar_threshold:
    name: Tapwater zonnedrempel
    icon: mdi:weather-sunny
    min: 0
    max: 40
    step: 1
    unit_of_measurement: kWh
  dhw_charge_duration:
    name: Tapwater opwarmduur
    icon: mdi:timer-sand
    min: 30
    max: 240
    step: 15
    unit_of_measurement: min

input_datetime:
  # Wordt elke nacht om 00:15 herschreven door "DHW - Plan het opwarmvenster".
  dhw_charge_start:
    name: Tapwater opwarmstart
    icon: mdi:clock-start
    has_date: false
    has_time: true
  # Het ochtendvenster waarin een te koud vat voorrang krijgt op de opwarmfase,
  # zodat de ochtenddouche gedekt is. Gemeten ochtendcluster: 06:30-09:00.
  dhw_morning_start:
    name: Tapwater ochtendvenster start
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
  dhw_morning_end:
    name: Tapwater ochtendvenster eind
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true


# No `homeassistant: customize:` block for the two Riemann-sum sensors below:
# since 2021.9 the `integration` platform derives device_class energy, unit kWh
# (from unit_prefix: k on a W source) and state_class total by itself. The block
# only ever overrode its native `total` with `total_increasing`; both record
# `sum` statistics, so dropping it is compatible.

utility_meter:
  altherma_heatpump_daily:
    source: sensor.altherma_energy_usage
    cycle: daily

sensor:
  - platform: min_max
    name: Downstairs Temperature
    unique_id: downstairs_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.climate_sensor_kitchen_temperature
      - sensor.climate_sensor_living_temperature
      - sensor.climate_sensor_office_temperature
      - sensor.climate_sensor_evadownstairs_temperature
      - sensor.indoor_temperature
  - platform: min_max
    name: Upstairs Temperature
    unique_id: upstairs_temperature
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.climate_sensor_masterbedroom_temperature
      - sensor.climate_sensor_eva_temperature
      - sensor.climate_sensor_noa_temperature
      - sensor.climate_sensor_guestroom_temperature
  - platform: integration
    source: sensor.altherma_power_usage
    name: Altherma Energy Usage
    unique_id: altherma_energy_usage
    method: left
    unit_prefix: k
    round: 2
  - platform: integration
    source: sensor.altherma_power_usage_secundary
    name: Altherma Energy Usage Secundary
    unique_id: altherma_energy_usage_secundary
    method: left
    unit_prefix: k
    round: 2

template:
  - sensor:
    # altherma sensor values
    - unique_id: altherma_operation_mode
      name: Altherma Operation Mode
      state: "{{ state_attr('sensor.althermasensors', 'Operation Mode') }}"
      icon: >
        {% if is_state("sensor.altherma_operation_mode", "Heating") %}
          mdi:hvac
        {% elif is_state("sensor.altherma_operation_mode", "Cooling") %}
          mdi:hvac-off
        {% else %}
          mdi:fan
        {% endif %}
    - unique_id: altherma_inv_primary_current
      name: Altherma INV primary current
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      state: "{{ state_attr('sensor.althermasensors', 'INV primary current (A)') | float(default=0) }}"
      icon: mdi:current-ac
    - unique_id: altherma_inv_secundary_current
      name: Altherma INV secundary current
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      state: "{{ state_attr('sensor.althermasensors', 'INV secondary current (A)') | float(default=0) }}"
      icon: mdi:current-ac
    - unique_id: altherma_voltage_n_phase
      name: Altherma Voltage N-phase
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      state: "{{ state_attr('sensor.althermasensors', 'Voltage (N-phase) (V)') | int(default=0) }}"
      icon: mdi:power-socket-eu
    - unique_id: altherma_flow_sensor
      name: Altherma Flow Sensor
      state_class: measurement
      unit_of_measurement: l/min
      state: "{{ state_attr('sensor.althermasensors', 'Flow sensor (l/min)') | float(default=0) }}"
      icon: mdi:waves-arrow-left
    - unique_id: altherma_leaving_water_temp_before_buh_r1t
      name: Altherma Leaving water temp. before BUH (R1T)
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
      state: "{{ state_attr('sensor.althermasensors', 'Leaving water temp. before BUH (R1T)') | float(default=0) }}"
      icon: mdi:thermometer
    - unique_id: altherma_leaving_water_temp_after_buh_r1t
      name: Altherma Leaving water temp. after BUH (R2T)
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
      state: "{{ state_attr('sensor.althermasensors', 'Leaving water temp. after BUH (R2T)') | float(default=0) }}"
      icon: mdi:thermometer
    - unique_id: altherma_inlet_water_temp
      name: Altherma Inlet water temp.(R4T)
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
      state: "{{ state_attr('sensor.althermasensors', 'Inlet water temp.(R4T)') | float(default=0) }}"
      icon: mdi:thermometer
    - unique_id: altherma_power_usage
      name: Altherma Power Usage
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      state: "{{ states('sensor.altherma_inv_primary_current') | float(default=0) * states('sensor.altherma_voltage_n_phase') | int(default=0) }}"
      icon: mdi:flash
    - unique_id: altherma_power_usage_secundary
      name: Altherma Power Usage Secundary
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      state: "{{ states('sensor.altherma_inv_secundary_current') | float(default=0) * states('sensor.altherma_voltage_n_phase') | int(default=0) }}"
      icon: mdi:flash
    # COP = thermal output / electrical input, from the same flow/dT pair.
    # COP uses the primary inverter current; COP2 the secondary, divided by 3
    # for the three phases.
    #
    # These used to emit `0` whenever the pump was not heating, and to divide by
    # a raw current * voltage product with no guard - which raised
    # `ZeroDivisionError: float division by zero` (seen in home-assistant.log.old)
    # whenever the mode read Heating while the current had not caught up yet.
    #
    # `availability` instead of a `0` state: state_class measurement means every
    # idle reading lands in long-term statistics, and a stream of zeros makes the
    # recorded COP mean meaningless. Unavailable costs gaps in the graph and keeps
    # the statistic honest. The availability guard is also what makes the division
    # safe - the state template only renders once the denominator is non-zero.
    - unique_id: altherma_cop
      name: Altherma COP
      unit_of_measurement: 'COP'
      state_class: measurement
      availability: >
        {{ is_state('sensor.altherma_operation_mode', 'Heating')
           and has_value('sensor.altherma_flow_sensor')
           and has_value('sensor.altherma_leaving_water_temp_before_buh_r1t')
           and has_value('sensor.altherma_inlet_water_temp_r4t')
           and states('sensor.altherma_inv_primary_current') | float(0) > 0
           and states('sensor.altherma_voltage_n_phase') | float(0) > 0 }}
      state: >
        {% set thermal = states('sensor.altherma_flow_sensor') | float(0) * 0.06 * 1.16
           * (states('sensor.altherma_leaving_water_temp_before_buh_r1t') | float(0)
              - states('sensor.altherma_inlet_water_temp_r4t') | float(0)) %}
        {% set electrical = states('sensor.altherma_inv_primary_current') | float(0)
           * states('sensor.altherma_voltage_n_phase') | float(0) / 1000 %}
        {{ (thermal / electrical) | round(2) }}
    - unique_id: altherma_cop2
      name: Altherma COP2
      unit_of_measurement: 'COP'
      state_class: measurement
      availability: >
        {{ is_state('sensor.altherma_operation_mode', 'Heating')
           and has_value('sensor.altherma_flow_sensor')
           and has_value('sensor.altherma_leaving_water_temp_before_buh_r1t')
           and has_value('sensor.altherma_inlet_water_temp_r4t')
           and states('sensor.altherma_inv_secundary_current') | float(0) > 0
           and states('sensor.altherma_voltage_n_phase') | float(0) > 0 }}
      state: >
        {% set thermal = states('sensor.altherma_flow_sensor') | float(0) * 0.06 * 1.16
           * (states('sensor.altherma_leaving_water_temp_before_buh_r1t') | float(0)
              - states('sensor.altherma_inlet_water_temp_r4t') | float(0)) %}
        {% set electrical = states('sensor.altherma_inv_secundary_current') | float(0) / 3
           * states('sensor.altherma_voltage_n_phase') | float(0) / 1000 %}
        {{ (thermal / electrical) | round(2) }}

    # In welke fase de tapwatersturing op dit moment staat. Dit is de BRON van
    # de beslislogica; dhw_target_setpoint hieronder vertaalt de fase alleen nog
    # naar een temperatuur. Die scheiding voorkomt dat dezelfde venster- en
    # ochtendlogica op twee plekken staat en uit elkaar groeit.
    #
    # Vier fasen:
    #   uit       - hoofdschakelaar niet aan; gedrag van voor deze constructie
    #   ochtend   - vat te koud vlak voor de ochtenddouche; vangnet gaat voor
    #   opwarmen  - binnen het zonne- of prijsvenster
    #   afkoelen  - erbuiten; het vat leeft op opgeslagen warmte
    #
    # De afkoelfase is het werkzame bestanddeel: laat je het setpoint na de
    # opwarming hoog staan, dan verwarmt de unit bij vanaf ~4 K eronder en ben je
    # slechter af dan zonder deze hele constructie.
    #
    # De test is `not is_state(..., 'on')` en NIET `is_state(..., 'off')`:
    # ontbreekt de helper of is hij unavailable, dan valt het systeem terug
    # op gewoon gedrag in plaats van door te lopen naar de planlogica.
    #
    # De tanktemperatuur is bewust een ongedekte `| float`: die hoort via
    # `availability` afgevangen te worden, niet via een stille default die een
    # verkeerde fase zou opleveren.
    - unique_id: dhw_phase
      name: DHW phase
      icon: >
        {% if is_state('sensor.dhw_phase', 'opwarmen') %}
          mdi:water-plus
        {% elif is_state('sensor.dhw_phase', 'afkoelen') %}
          mdi:water-minus
        {% elif is_state('sensor.dhw_phase', 'ochtend') %}
          mdi:weather-sunset-up
        {% else %}
          mdi:water-off
        {% endif %}
      availability: >
        {{ has_value('sensor.domestichotwatertank_tank_temperature') }}
      state: >
        {% set tank = states(
             'sensor.domestichotwatertank_tank_temperature') | float %}
        {% set normal = states('input_number.dhw_setpoint_normal')
             | float(45) %}
        {% set start = today_at(states('input_datetime.dhw_charge_start')) %}
        {% set stop = start + timedelta(
             minutes=states('input_number.dhw_charge_duration') | int(120)) %}
        {% set mstart = today_at(states('input_datetime.dhw_morning_start')) %}
        {% set mstop = today_at(states('input_datetime.dhw_morning_end')) %}
        {%- if not is_state('input_boolean.dhw_solar_scheduling', 'on') -%}
          uit
        {%- elif mstart <= now() < mstop and tank < normal - 3 -%}
          ochtend
        {%- elif start <= now() < stop -%}
          opwarmen
        {%- else -%}
          afkoelen
        {%- endif -%}

    # Welk setpoint bij de huidige fase hoort. Bewust dom: geen eigen logica,
    # alleen een vertaling van sensor.dhw_phase naar een temperatuur, geklemd op
    # wat de unit accepteert.
    #
    # `| min` tegen max_temp is niet cosmetisch: staat veldinstelling [6-0E] op
    # de unit op 48, dan weigert de integratie een opdracht van 52 en zou de
    # schrijfautomation stil niets doen.
    #
    # De `else`-tak vangt uit, ochtend en elke onverwachte fasewaarde af op het
    # normale setpoint - de veilige kant.
    - unique_id: dhw_target_setpoint
      name: DHW target setpoint
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      icon: mdi:thermostat-box
      availability: >
        {{ has_value('sensor.dhw_phase')
           and has_value('water_heater.domestic_hot_water_tank') }}
      state: >
        {% set maxt = state_attr('water_heater.domestic_hot_water_tank',
                                 'max_temp') | float(48) %}
        {% if is_state('sensor.dhw_phase', 'opwarmen') %}
          {% set want = states('input_number.dhw_setpoint_charge')
               | float(52) %}
        {% elif is_state('sensor.dhw_phase', 'afkoelen') %}
          {% set want = states('input_number.dhw_setpoint_coast')
               | float(40) %}
        {% else %}
          {% set want = states('input_number.dhw_setpoint_normal')
               | float(45) %}
        {% endif %}
        {# `| float` voor `| round` houdt de uitvoer van dit template zelf
           consistent: bij de default-tak van een helper levert `| float(52)`
           een int, en dan rendert het template "52" in plaats van "52.0". HA
           normaliseert de sensorstate daarna alsnog naar "52", dus dit is puur
           voor de testbaarheid buiten HA om. #}
        {{ [want, maxt] | min | float | round(0) }}

  - binary_sensor:
    - unique_id: altherma_main_pump
      name: Altherma Main pump
      state: >
        {{ is_state_attr('sensor.althermasensors', 'Main pump', 'ON') }}
