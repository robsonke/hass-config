input_boolean:
  guest_mode:
    name: Guest Mode
    icon: mdi:account-group
  alarm_active:
    name: Alarm actief
    icon: mdi:alarm-light

# Manual 2-hour alarm pause (triggered by the physical button).
# These replace two in-line `delay:` steps in "Alarm - Disable alarm manually".
# An in-flight delay is lost on an HA restart, which meant the alarm was silently
# never re-armed; `restore: true` timers survive a restart and keep counting.
# Two timers so the 5-minute spoken warning stays independent of the re-arm.
timer:
  alarm_pause:
    name: Alarm pauze
    icon: mdi:shield-off-outline
    restore: true
    duration: "02:00:00"
  alarm_pause_warning:
    name: Alarm pauze waarschuwing
    icon: mdi:shield-alert-outline
    restore: true
    duration: "01:55:00"

template:
  - sensor:
    - unique_id: open_windows_and_doors_upstairs
      name: Open windows and doors upstairs
      state: >
        {{ expand('binary_sensor.doors_and_windows_upstairs') | selectattr('state', 'in', ['on']) | list | count }}
    - unique_id: open_windows_and_doors_downstairs
      name: Open windows and doors downstairs
      state: >
        {{ expand('binary_sensor.doors_and_windows_downstairs') | selectattr('state', 'in', ['on']) | list | count }}
    - unique_id: open_windows_and_doors_garden
      name: Open windows and doors garden
      state: >
        {{ expand('binary_sensor.doors_and_windows_garden') | selectattr('state', 'in', ['on']) | list | count }}
    - unique_id: open_windows_and_doors
      name: Open windows and doors
      state: >
        {{ states('sensor.open_windows_and_doors_upstairs') | int(default=0) + states('sensor.open_windows_and_doors_downstairs') | int(default=0) + states('sensor.open_windows_and_doors_garden') | int(default=0) }}

  - binary_sensor:
    - unique_id: people_home_and_awake
      name: People home and awake
      state: >
        {{ ( states('zone.home') | int(default=0) > 0 or is_state('input_boolean.guest_mode', 'on') )
            and is_state('alarm_control_panel.alarmo', 'disarmed') }}
