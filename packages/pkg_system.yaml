# Author: Rob Sonke
# https://github.com/robsonke/hass-config

# These includes are for editor/UI support
scene: !include ../scenes.yaml
automation: !include ../automations.yaml
script: !include ../scripts.yaml

shell_command:
  convert_lovelace: "python /config/utils/json2yaml.py /config/.storage/lovelace /config/lovelace-ui.yaml"
  refresh_lovelace: "touch /config/dashboards/bubble-dashboard.yaml /config/dashboards/backdoor-dashboard.yaml"
  prune_message_snapshots: "find /config/www/messages -name evabed_*.jpg -mmin +120 -delete"

logger:
  default: info
  logs:
    homeassistant.components.calendar: error
    homeassistant.components.websocket_api: error
    homeassistant.components.camera: error
    homeassistant.components.mqtt: warn
    gql: warning

# No `tts:` block: the legacy google_translate YAML platform existed only to
# provide `tts.google_translate_say` for script.googlehome_say, which nothing
# called - both removed 2026-08-23. Live TTS is Piper, via
# media-source://tts/tts.piper in scripts.yaml. If google_translate is ever
# wanted again, add it through Settings > Devices & Services and call tts.speak.

ios:
  actions:
    - name: good_night
      background_color: "#9e9e9e"
      label:
        text: "Weltruste"
        color: "#ffffff"
      icon:
        icon: weather_night
        color: "#d9d441"
      show_in_carplay: false
      show_in_watch: true
    - name: open_frontdoor
      background_color: "#9e9e9e"
      label:
        text: "Voordeur openen"
        color: "#ffffff"
      icon:
        icon: door-open
        color: "#d9d441"
      show_in_carplay: true
      show_in_watch: true

input_text:
  camera_analysis:
    name: Camera Event Analysis
  unavailable_entities_temp_state:
    name: Temp variable used in an automation

# Custom homekit config currently not supported by the integration page
homekit:
  - name: Home Assistant Bridge
    filter:
      include_entities:
        - cover.front_door
        - input_boolean.guest_mode
        - light.dimmer_hall
        - light.keuken
        - light.kitchendesk_light
        - light.office_light
        - light.socket1_light_corner
        - light.socket2_light_couch
        - light.dining_light
        - light.diningtable_light
        - light.livingback_light
        - light.livingfront_light
        - light.woonkamer
        - light.dimmer_masterbed
        - light.eva_corridor_light
        - media_player.office
        - media_player.living_room
        - media_player.eetkamer
        - media_player.tv_room
        - alarm_control_panel.alarmo
        - binary_sensor.people_home_and_awake

frontend:
  themes: !include_dir_merge_named ../themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

binary_sensor:

  # monitor addons
  - platform: group
    unique_id: important_addons
    name: "Important Addons"
    device_class: running
    entities:
      - binary_sensor.zigbee2mqtt_running
      - binary_sensor.esphome_running
      - binary_sensor.mariadb_running
      - binary_sensor.mosquitto_broker_running
      - binary_sensor.frigate_nvr_running
      - binary_sensor.home_assistant_addon_ecowitt2mqtt_running
      - binary_sensor.appdaemon_running

  - platform: group
    unique_id: doors_and_windows_upstairs
    name: All doors and windows upstairs
    device_class: opening
    entities:
      - binary_sensor.window_noaroom_openclose_contact
      - binary_sensor.window_eva_openclose_contact
      - binary_sensor.window_masterbed_1_openclose_contact
      - binary_sensor.window_masterbed_2_openclose_contact
      - binary_sensor.window_guestroom_openclose_contact
  - platform: group
    unique_id: doors_and_windows_garden
    name: All doors and windows garden
    device_class: opening
    entities:
      - binary_sensor.sheddoor_openclose_contact
      - binary_sensor.cabindoor_openclose_contact
  # The full outer shell = exactly the union of downstairs + upstairs + garden below; that
  # equality is the only rule this group has.
  # Used to be wrong: included door_hallcloset (an interior door, now in
  # interior_doors_downstairs) and missed door_terrace, which Alarmo does monitor.
  - platform: group
    unique_id: doors_and_windows
    name: All doors and windows
    device_class: opening
    entities:
      # beneden (7)
      - binary_sensor.backdoor_sensor_contact
      - binary_sensor.frontdoor_openclose_contact
      - binary_sensor.door_terrace_sensor_contact
      - binary_sensor.windowdoor_ground_1_openclose_contact
      - binary_sensor.windowdoor_ground_2_openclose_contact
      - binary_sensor.windowdoor_ground_3_openclose_contact
      - binary_sensor.window_office_openclose_contact
      # boven (5)
      - binary_sensor.window_noaroom_openclose_contact
      - binary_sensor.window_eva_openclose_contact
      - binary_sensor.window_masterbed_1_openclose_contact
      - binary_sensor.window_masterbed_2_openclose_contact
      - binary_sensor.window_guestroom_openclose_contact
      # tuin (2)
      - binary_sensor.sheddoor_openclose_contact
      - binary_sensor.cabindoor_openclose_contact
  # The downstairs outer shell: these seven are exactly the doors/windows Alarmo monitors
  # downstairs, so "all closed" here really means "ready to arm". Interior doors don't
  # belong here — see interior_doors_downstairs.
  - platform: group
    unique_id: doors_and_windows_downstairs
    name: All doors and windows downstairs
    device_class: opening
    entities:
      - binary_sensor.backdoor_sensor_contact
      - binary_sensor.frontdoor_openclose_contact
      - binary_sensor.door_terrace_sensor_contact
      - binary_sensor.windowdoor_ground_1_openclose_contact
      - binary_sensor.windowdoor_ground_2_openclose_contact
      - binary_sensor.windowdoor_ground_3_openclose_contact
      - binary_sensor.window_office_openclose_contact
  # Interior doors — deliberately separate: they say nothing about whether the house is
  # shut, and Alarmo ignores them. They have their own card in the doors pop-up but don't
  # count toward its header.
  - platform: group
    unique_id: interior_doors_downstairs
    name: All interior doors downstairs
    device_class: opening
    entities:
      - binary_sensor.hallwaydoor_sensor_contact
      - binary_sensor.door_hallcloset_openclose_contact
      - binary_sensor.toiletdoordownstairs_sensor_contact

group:
  # https://www.home-assistant.io/integrations/group/#old-style-groups
  # but no alternative yet

  # monitored entities to check if they are online
  monitored_entities:
    name: Monitored Entities
    entities:
      - binary_sensor.backdoor_sensor_contact
      - binary_sensor.frontdoor_openclose_contact
      - binary_sensor.door_terrace_sensor_contact
      - binary_sensor.windowdoor_ground_1_openclose_contact
      - binary_sensor.windowdoor_ground_2_openclose_contact
      - binary_sensor.windowdoor_ground_3_openclose_contact
      - sensor.light_sensor_garden_illuminance
      - binary_sensor.hallwaydoor_sensor_contact
      - binary_sensor.window_eva_openclose_contact
      - binary_sensor.window_noaroom_openclose_contact
      - sensor.climate_sensor_eva_temperature
      - sensor.climate_sensor_evadownstairs_temperature
      - sensor.climate_sensor_noa_temperature
      - sensor.climate_sensor_guestroom_temperature
      - sensor.climate_sensor_masterbedroom_temperature
      - binary_sensor.motion_sensor_toiletdownstairs_occupancy
      - binary_sensor.toiletdoorupstairs_openclose_contact
      - binary_sensor.toiletdoordownstairs_sensor_contact
      - binary_sensor.hue_motion_sensor_toiletupstairs_occupancy
      - binary_sensor.hue_motion_sensor_corridor1_occupancy
      - binary_sensor.hue_motion_sensor_shed_occupancy
      - binary_sensor.hue_motion_sensor_shower_occupancy
      - sensor.energy_consumed_tariff_1
      - sensor.energy_consumed_tariff_2
      - sensor.climate_sensor_kitchen_temperature
      - sensor.climate_sensor_living_temperature
      - binary_sensor.window_masterbed_1_openclose_contact
      - binary_sensor.window_masterbed_2_openclose_contact
      - binary_sensor.window_guestroom_openclose_contact
      - sensor.today_maximum_temperature
      - sensor.hue_motion_sensor_hall_illuminance
      - binary_sensor.hue_motion_sensor_hall_occupancy
      - binary_sensor.window_office_openclose_contact
      - sensor.light_sensor_living_illuminance

  ignored_entities:
    entities:
      - sensor.althermasensors

template:
  # important entities
  - sensor:
    - unique_id: unavailable_entities
      name: Unavailable Entities
      attributes:
        last_update: "{{ now() }}"
        names: "{{ expand('group.monitored_entities') | rejectattr('state', 'equalto', '') | selectattr('state', 'in', ['unavailable', 'unknown', 'none']) | join(', ', attribute='attributes.friendly_name') | truncate(252) or 'Online' }}"
        count: "{{ expand('group.monitored_entities') | rejectattr('state', 'equalto', '') | selectattr('state', 'in', ['unavailable', 'unknown', 'none']) | list | count }}"
      state_class: measurement
      unit_of_measurement: entities
      state: "{{ expand('group.monitored_entities') | rejectattr('state', 'equalto', '') | selectattr('state', 'in', ['unavailable', 'unknown', 'none']) | list | count }}"

    - unique_id: evabed_sound_level_alert_threshold
      name: Evabed Sound Level Alert Threshold
      unit_of_measurement: dB
      state_class: measurement
      # Rolling mean + 2.5σ, floored at -50 dB — never lower, so it never fires on cars/rustling that push measured
      # ambient to -66..-62 dB. -50 keeps ~10 dB over measured quiet-room peaks (9-13 Aug: -59..-66 quiet nights,
      # -43..-54 many evenings); lower toward -55/-60 if a real event is ever missed. Floor only desensitises the
      # generic "unusually loud" trigger — Frigate's crying/scream/yell/cough classifiers are separate and unaffected.
      state: >
        {% set mean = states('sensor.evabed_sound_level_mean') | float(default=-70) %}
        {% set sd = states('sensor.evabed_sound_level_std_dev') | float(default=5) %}
        {{ [ mean + 2.5 * sd, -50 ] | max | round(2) }}

  # all unavailable entities
  - trigger:
    - trigger: time_pattern
      minutes: "/5"
    sensor:
      # Counts entities that look like a REAL fault, not merely unset: `unavailable` counts in ANY domain;
      # `unknown`/`none` count ONLY in domains meant to hold a value (whitelist below) —
      # button/event/notify/stt/tts/text/scene/Zigbee-config never hold a state until first use. IGNORE_RE also drops
      # expected-absent entities (plate sensors, laptop_firefox, BBQ probes/Inkbird, seasonal lights, spare sockets).
      # NOT ignored: ESPHome voice satellites — down means a real fault.
      - unique_id: all_unavailable_entities
        name: All Unavailable Entities
        unit_of_measurement: entities
        state: >
          {% set ignore_time = 15 %}
          {% set value_domains = ['sensor','binary_sensor','climate','cover','light','switch',
             'lock','media_player','device_tracker','person','alarm_control_panel','vacuum',
             'fan','water_heater','humidifier','weather','calendar'] %}
          {% set ignore_re = '(_last_recognized_plate$|laptop_firefox|probe_[0-9]|tuin_bbq|inkbird|^light\\.kerst_|_spare[0-9])' %}
          {% set ignored = state_attr('group.ignored_entities','entity_id') or [] %}
          {% set ns = namespace(n=0) %}
          {% for s in states if s.domain != 'group'
                and s.entity_id not in ignored
                and not (s.entity_id is search(ignore_re)) %}
            {% if s.last_changed.timestamp() < now().timestamp() - ignore_time %}
              {% if s.state == 'unavailable'
                    or (s.state in ['unknown','none'] and s.domain in value_domains) %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        # Split out so the number is diagnosable at a glance instead of one opaque total.
        # These two MUST apply the same filters as the state above (15s `last_changed` grace,
        # `group` exclusion for `unavailable` only) or they won't add up to it — keep all
        # three in step.
        attributes:
          unavailable: >
            {% set ignore_re = '(_last_recognized_plate$|laptop_firefox|probe_[0-9]|tuin_bbq|inkbird|^light\\.kerst_|_spare[0-9])' %}
            {% set ignored = state_attr('group.ignored_entities','entity_id') or [] %}
            {{ states | rejectattr('domain','eq','group')
               | selectattr('state','eq','unavailable')
               | selectattr('last_changed','lt', now() - timedelta(seconds=15))
               | rejectattr('entity_id','in',ignored)
               | rejectattr('entity_id','search',ignore_re) | list | count }}
          unknown: >
            {% set value_domains = ['sensor','binary_sensor','climate','cover','light','switch',
               'lock','media_player','device_tracker','person','alarm_control_panel','vacuum',
               'fan','water_heater','humidifier','weather','calendar'] %}
            {% set ignore_re = '(_last_recognized_plate$|laptop_firefox|probe_[0-9]|tuin_bbq|inkbird|^light\\.kerst_|_spare[0-9])' %}
            {% set ignored = state_attr('group.ignored_entities','entity_id') or [] %}
            {{ states | selectattr('state','in',['unknown','none'])
               | selectattr('domain','in',value_domains)
               | selectattr('last_changed','lt', now() - timedelta(seconds=15))
               | rejectattr('entity_id','in',ignored)
               | rejectattr('entity_id','search',ignore_re) | list | count }}
  # Storage for Bubble Card Modules
  - trigger:
      - trigger: event
        event_type: bubble_card_update_modules
    sensor:
      - name: "Bubble Card Modules"
        unique_id: bubble_card_modules
        state: "saved"
        icon: "mdi:puzzle"
        attributes:
          modules: "{{ trigger.event.data.modules }}"
          last_updated: "{{ trigger.event.data.last_updated }}"
  # Count of available updates, consumed as a plain number by the #updates pop-up header and dashboard chip
  # (bpp_update.yaml, bubble-dashboard.yaml). No trigger needed: referencing `states.update` registers a listener on the
  # whole domain, so this re-renders on actual changes instead of every minute, and is correct immediately after a
  # restart.
  - sensor:
    - unique_id: ha_all_updates
      name: All Updates
      icon: mdi:update
      state: >
        {{ expand(states.update) | selectattr('state', 'in', ['on']) | list | count }}
      unit_of_measurement: "Update(s)"

sensor:
  - platform: rest
    name: hass_release_notes
    unique_id: hass_release_notes
    resource: https://api.github.com/repos/home-assistant/core/releases/latest
    value_template: >
      {{ value_json.name }}
    json_attributes:
      - body
    scan_interval: 21600

  - platform: rest
    name: hass_release_notes_rc
    unique_id: hass_release_notes_rc
    resource: https://api.github.com/repos/home-assistant/core/releases?per_page=1
    value_template: >
      {% if value_json and value_json|length > 0 %}
        {{ value_json[0].name }}
      {% endif %}
    json_attributes:
      - body
    scan_interval: 21600

  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'

  - platform: statistics
    unique_id: evabed_sound_level_mean
    name: Evabed Sound Level Mean
    entity_id: sensor.evabed_sound_level
    state_characteristic: mean
    max_age:
      minutes: 20
    sampling_size: 500

  - platform: statistics
    unique_id: evabed_sound_level_std_dev
    name: Evabed Sound Level Std Dev
    entity_id: sensor.evabed_sound_level
    state_characteristic: standard_deviation
    max_age:
      minutes: 20
    sampling_size: 500
