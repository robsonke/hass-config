# These includes are for editor/UI support
scene: !include ../scenes.yaml
automation: !include ../automations.yaml
script: !include ../scripts.yaml

shell_command:
  convert_lovelace: "python /config/utils/json2yaml.py /config/.storage/lovelace /config/lovelace-ui.yaml"
  # Touching a YAML dashboard file makes HA re-read it (and its !includes).
  # main-dashboard.yaml was removed from this list when that dashboard was
  # retired — `touch` would otherwise have recreated it as an empty file.
  refresh_lovelace: "touch /config/dashboards/bubble-dashboard.yaml /config/dashboards/backdoor-dashboard.yaml"

logger:
  default: info
  logs:
    homeassistant.components.calendar: error
    homeassistant.components.websocket_api: fatal
    homeassistant.components.camera: fatal
    homeassistant.components.mqtt: warn
    bleak_retry_connector: debug

tts:
  - platform: google_translate
    language: 'nl'

ios:
  actions:
    - name: good_night
      background_color: "#9e9e9e"
      label:
        text: "Weltruste"
        color: "#ffffff"
      icon:
        icon: weather_night
        color: "#d9d441"
      show_in_carplay: false
      show_in_watch: true
    - name: open_frontdoor
      background_color: "#9e9e9e"
      label:
        text: "Voordeur openen"
        color: "#ffffff"
      icon:
        icon: door-open
        color: "#d9d441"
      show_in_carplay: true
      show_in_watch: true

input_text:
  camera_analysis:
    name: Camera Event Analysis
  unavailable_entities_temp_state:
    name: Temp variable used in an automation

# Custom homekit config currently not supported by the integration page
homekit:
  - name: Home Assistant Bridge
    filter:
      include_entities:
        - cover.front_door
        - input_boolean.guest_mode
        - light.dimmer_hall
        - light.keuken
        - light.kitchendesk_light
        - light.office_light
        - light.socket1_light_corner
        - light.socket2_light_couch
        - light.dining_light
        - light.diningtable_light
        - light.livingback_light
        - light.livingfront_light
        - light.woonkamer
        - light.dimmer_masterbed
        - light.eva_corridor_light
        - media_player.office
        - media_player.living_room
        - media_player.eetkamer
        - media_player.tv_room
        - alarm_control_panel.alarmo
        - binary_sensor.people_home_and_awake

frontend:
  themes: !include_dir_merge_named ../themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

