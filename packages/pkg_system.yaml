    device_class: running
    entities:
      - binary_sensor.zigbee2mqtt_running
      - binary_sensor.esphome_running
      - binary_sensor.mariadb_running
      - binary_sensor.mosquitto_broker_running
      - binary_sensor.frigate_nvr_running
      - binary_sensor.home_assistant_addon_ecowitt2mqtt_running
      - binary_sensor.appdaemon_running

  - platform: group
    unique_id: doors_and_windows_upstairs
    name: All doors and windows upstairs
    device_class: opening
    entities:
      - binary_sensor.window_noaroom_openclose_contact
      - binary_sensor.window_eva_openclose_contact
      - binary_sensor.window_masterbed_1_openclose_contact
      - binary_sensor.window_masterbed_2_openclose_contact
      - binary_sensor.window_guestroom_openclose_contact
  - platform: group
    unique_id: doors_and_windows_garden
    name: All doors and windows garden
    device_class: opening
    entities:
      - binary_sensor.sheddoor_openclose_contact
      - binary_sensor.cabindoor_openclose_contact
  - platform: group
    unique_id: doors_and_windows
    name: All doors and windows
    device_class: opening
    entities:
      - binary_sensor.backdoor_sensor_contact
      - binary_sensor.frontdoor_openclose_contact
      - binary_sensor.sheddoor_openclose_contact
      - binary_sensor.cabindoor_openclose_contact
      - binary_sensor.windowdoor_ground_1_openclose_contact
      - binary_sensor.windowdoor_ground_2_openclose_contact
      - binary_sensor.windowdoor_ground_3_openclose_contact
      - binary_sensor.window_office_openclose_contact
      - binary_sensor.door_hallcloset_openclose_contact
      - binary_sensor.window_noaroom_openclose_contact
      - binary_sensor.window_eva_openclose_contact
      - binary_sensor.window_masterbed_1_openclose_contact
      - binary_sensor.window_masterbed_2_openclose_contact
      - binary_sensor.window_guestroom_openclose_contact
  - platform: group
    unique_id: doors_and_windows_downstairs
    name: All doors and windows downstairs
    device_class: opening
    entities:
      - binary_sensor.backdoor_sensor_contact
      - binary_sensor.frontdoor_openclose_contact
      - binary_sensor.door_terrace_sensor_contact
      - binary_sensor.windowdoor_ground_1_openclose_contact
      - binary_sensor.windowdoor_ground_2_openclose_contact
      - binary_sensor.windowdoor_ground_3_openclose_contact
      - binary_sensor.window_office_openclose_contact

group:
  # https://www.home-assistant.io/integrations/group/#old-style-groups
  # but no alternative yet

  # monitored entities to check if they are online
  monitored_entities:
    name: Monitored Entities
    entities:
      - binary_sensor.backdoor_sensor_contact
      - binary_sensor.frontdoor_openclose_contact
      - binary_sensor.door_terrace_sensor_contact
      - binary_sensor.windowdoor_ground_1_openclose_contact
      - binary_sensor.windowdoor_ground_2_openclose_contact
      - binary_sensor.windowdoor_ground_3_openclose_contact
      - sensor.light_sensor_garden_illuminance
      - binary_sensor.hallwaydoor_sensor_contact
      - binary_sensor.window_eva_openclose_contact
      - binary_sensor.window_noaroom_openclose_contact
      - sensor.climate_sensor_eva_temperature
      - sensor.climate_sensor_evadownstairs_temperature
      - sensor.climate_sensor_noa_temperature
      - sensor.climate_sensor_guestroom_temperature
      - sensor.climate_sensor_masterbedroom_temperature
      - binary_sensor.motion_sensor_toiletdownstairs_occupancy
      - binary_sensor.toiletdoorupstairs_openclose_contact
      - binary_sensor.toiletdoordownstairs_sensor_contact
      - binary_sensor.hue_motion_sensor_toiletupstairs_occupancy
      - binary_sensor.hue_motion_sensor_corridor1_occupancy
      - binary_sensor.hue_motion_sensor_shed_occupancy
      - binary_sensor.hue_motion_sensor_shower_occupancy
      - sensor.energy_consumed_tariff_1
      - sensor.energy_consumed_tariff_2
      - sensor.climate_sensor_kitchen_temperature
      - sensor.climate_sensor_living_temperature
      - binary_sensor.window_masterbed_1_openclose_contact
      - binary_sensor.window_masterbed_2_openclose_contact
      - binary_sensor.window_guestroom_openclose_contact
      - sensor.today_maximum_temperature
      - sensor.hue_motion_sensor_hall_illuminance
      - binary_sensor.hue_motion_sensor_hall_occupancy
      - binary_sensor.window_office_openclose_contact

  ignored_entities:
    entities:
      - sensor.althermasensors

template:
  # important entities
  - sensor:
    - unique_id: unavailable_entities
      name: Unavailable Entities
      attributes:
        last_update: "{{ now() }}"
        names: "{{ expand('group.monitored_entities') | rejectattr('state', 'equalto', '') | selectattr('state', 'in', ['unavailable', 'unknown', 'none']) | join(', ', attribute='attributes.friendly_name') | truncate(252) or 'Online' }}"
        count: "{{ expand('group.monitored_entities') | rejectattr('state', 'equalto', '') | selectattr('state', 'in', ['unavailable', 'unknown', 'none']) | list | count }}"
      state_class: measurement
      unit_of_measurement: entities
      state: "{{ expand('group.monitored_entities') | rejectattr('state', 'equalto', '') | selectattr('state', 'in', ['unavailable', 'unknown', 'none']) | list | count }}"

    - unique_id: evabed_sound_level_alert_threshold
      name: Evabed Sound Level Alert Threshold
      unit_of_measurement: dB
      state_class: measurement
      # Rolling mean + 2.5σ, but never below an absolute floor.
      #
      # WHY THE FLOOR: in a silent room the 20-minute mean settles around
      # -70 dB with σ ≈ 2, so mean + 2.5σ lands at ≈ -65 — and measured
      # baseline noise in Eva's room routinely spikes to -66/-65/-64 and
      # occasionally -62 with nothing happening. The adaptive threshold
      # therefore collapsed to just ~5 dB above ambient and fired on passing
      # cars and rustling. The floor keeps ~7 dB of headroom over those peaks.
      #
      # This only desensitises the generic "unusually loud" trigger. Frigate's
      # audio classifiers (crying / scream / yell / cough) are separate triggers
      # on the same automation and are unaffected, so real distress is still
      # caught by the classifier even when it stays under -55 dB.
      #
      # Raise the floor toward -50 if it is still twitchy; lower it toward -60
      # if a real event is ever missed.
      state: >
        {% set mean = states('sensor.evabed_sound_level_mean') | float(default=-70) %}
        {% set sd = states('sensor.evabed_sound_level_std_dev') | float(default=5) %}
        {{ [ mean + 2.5 * sd, -55 ] | max | round(2) }}

  # all unavailable entities
  - trigger:
    - trigger: time_pattern
      minutes: "/5"
    sensor:
      # Counts entities that look like a REAL fault, not every entity that
      # happens not to hold a value. The old version counted any
      # unavailable/unknown/none and reported ~465, of which ~180 were entities
      # that are `unknown` by design — whole domains (button, event, notify,
      # stt/tts, text, scene, plus Zigbee config selects/numbers) never hold a
      # state until first use, so they can never become "available" and only
      # drowned the signal.
      #
      # Two rules now:
      #   * `unavailable` counts in ANY domain — the integration or device is
      #     genuinely not answering.
      #   * `unknown`/`none` count ONLY in domains that are supposed to hold a
      #     value (whitelist below), so by-design domains are ignored.
      #
      # IGNORE_RE additionally drops things that are expected to be absent most
      # of the time, and which otherwise permanently inflate the number:
      # Frigate's plate sensors (populated only on a read), the stale
      # laptop_firefox browser_mod registration, the BBQ probes and Inkbird
      # (Bluetooth, only live while grilling), seasonal Christmas lights and the
      # unused spare sockets. Deliberately NOT ignored: the ESPHome voice
      # satellites — when those are down that IS the fault worth reporting.
      - unique_id: all_unavailable_entities
        name: All Unavailable Entities
        unit_of_measurement: entities
        state: >
          {% set ignore_time = 15 %}
          {% set value_domains = ['sensor','binary_sensor','climate','cover','light','switch',
             'lock','media_player','device_tracker','person','alarm_control_panel','vacuum',
             'fan','water_heater','humidifier','weather','calendar'] %}
          {% set ignore_re = '(_last_recognized_plate$|laptop_firefox|probe_[0-9]|tuin_bbq|inkbird|^light\\.kerst_|_spare[0-9])' %}
          {% set ignored = state_attr('group.ignored_entities','entity_id') or [] %}
          {% set ns = namespace(n=0) %}
          {% for s in states if s.domain != 'group'
                and s.entity_id not in ignored
                and not (s.entity_id is search(ignore_re)) %}
            {% if s.last_changed.timestamp() < now().timestamp() - ignore_time %}
              {% if s.state == 'unavailable'
                    or (s.state in ['unknown','none'] and s.domain in value_domains) %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        # Split out so the number is diagnosable at a glance instead of being a
        # single opaque total.
        attributes:
          unavailable: >
            {% set ignore_re = '(_last_recognized_plate$|laptop_firefox|probe_[0-9]|tuin_bbq|inkbird|^light\\.kerst_|_spare[0-9])' %}
            {% set ignored = state_attr('group.ignored_entities','entity_id') or [] %}
            {{ states | selectattr('state','eq','unavailable')
               | rejectattr('entity_id','in',ignored)
               | rejectattr('entity_id','search',ignore_re) | list | count }}
          unknown: >
            {% set value_domains = ['sensor','binary_sensor','climate','cover','light','switch',
               'lock','media_player','device_tracker','person','alarm_control_panel','vacuum',
               'fan','water_heater','humidifier','weather','calendar'] %}
            {% set ignore_re = '(_last_recognized_plate$|laptop_firefox|probe_[0-9]|tuin_bbq|inkbird|^light\\.kerst_|_spare[0-9])' %}
            {% set ignored = state_attr('group.ignored_entities','entity_id') or [] %}
            {{ states | selectattr('state','in',['unknown','none'])
               | selectattr('domain','in',value_domains)
               | rejectattr('entity_id','in',ignored)
               | rejectattr('entity_id','search',ignore_re) | list | count }}
  # Storage for Bubble Card Modules
  - trigger:
      - trigger: event
        event_type: bubble_card_update_modules
    sensor:
      - name: "Bubble Card Modules"
        state: "saved"
        icon: "mdi:puzzle"
        attributes:
          modules: "{{ trigger.event.data.modules }}"
          last_updated: "{{ trigger.event.data.last_updated }}"
  # count all possible updates to one sensor
  - trigger:
    - trigger: time_pattern
      minutes: "*"
    sensor:
    - unique_id: ha_all_updates
      name: All Updates
      attributes:
        updates: >
          <ul>
          {%- for entity in expand(states.update) %}
            {%- if is_state(entity.entity_id, 'on') %}
              <li>
                {%- if state_attr(entity.entity_id, 'release_url') is not none %}
                <b><a href="#" onclick="window.open('{{ state_attr(entity.entity_id, 'release_url') }}');">{{ state_attr(entity.entity_id, 'friendly_name') }}</a></b>
                {%- else %}
                <b>{{ state_attr(entity.entity_id, 'friendly_name') }}</b>
                {%- endif %}
                {{ state_attr(entity.entity_id, 'installed_version') }} &#10142; {{ state_attr(entity.entity_id, 'latest_version') }}
                <ha-icon-button onclick="cardTools.hass.callService('browser_mod', 'close_popup', {}); cardTools.moreInfo('{{ entity.entity_id }}')"><ha-state-icon style="--mdc-icon-size: 24px; vertical-align: 100%;" icon="mdi:cloud-download"></ha-state-icon></ha-icon-button>
              </li>
            {%- endif %}
          {%- endfor %}
          </ul>
      icon: mdi:update
      state: >
        {{ expand(states.update) | selectattr('state', 'in', ['on']) | list | count }}
      unit_of_measurement: "Update(s)"

sensor:
  - platform: rest
    name: hass_release_notes
    resource: https://api.github.com/repos/home-assistant/core/releases/latest
    value_template: >
      {{ value_json.name }}
    json_attributes:
      - body
    scan_interval: 21600

  - platform: rest
    name: hass_release_notes_rc
    resource: https://api.github.com/repos/home-assistant/core/releases?per_page=1
    value_template: >
      {% if value_json and value_json|length > 0 %}
        {{ value_json[0].name }}
      {% endif %}
    json_attributes:
      - body
    scan_interval: 21600

  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'

  - platform: statistics
    unique_id: evabed_sound_level_mean
    name: Evabed Sound Level Mean
    entity_id: sensor.evabed_sound_level
    state_characteristic: mean
    max_age:
      minutes: 20
    sampling_size: 500

  - platform: statistics
    unique_id: evabed_sound_level_std_dev
    name: Evabed Sound Level Std Dev
    entity_id: sensor.evabed_sound_level
    state_characteristic: standard_deviation
    max_age:
      minutes: 20
    sampling_size: 500
