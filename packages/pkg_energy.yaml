# All-in markup on top of the Nordpool spot price (energy tax + ODE + VAT + the
# supplier's fee). Was hardcoded as `0.1108` in 8 templates across this file and
# pkg_energy_stats.yaml, so a tariff change meant finding all eight.
#
# Every consumer reads it as `| float(0.1108)`, so the previous value stays the
# fallback if the helper is ever missing. It is NOT declared with `initial:` -
# that would override state restore and make the value unchangeable from the UI -
# which means a freshly created helper starts at its minimum. Set it to 0.1108
# once after the restart that creates it.
input_number:
  energy_markup:
    name: Energie opslag (all-in)
    icon: mdi:cash-plus
    min: 0
    max: 0.5
    step: 0.0001
    mode: box
    unit_of_measurement: "EUR/kWh"

