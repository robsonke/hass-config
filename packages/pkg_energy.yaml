utility_meter:
  daily_energy_offpeak:
    source: sensor.energy_consumed_tariff_1
    cycle: daily
  daily_energy_peak:
    source: sensor.energy_consumed_tariff_2
    cycle: daily
  monthly_energy_offpeak:
    source: sensor.energy_consumed_tariff_1
    cycle: monthly
  monthly_energy_peak:
    source: sensor.energy_consumed_tariff_2
    cycle: monthly
  yearly_energy_offpeak:
    source: sensor.energy_consumed_tariff_1
    cycle: yearly
  yearly_energy_peak:
    source: sensor.energy_consumed_tariff_2
    cycle: yearly

  shelly_plug_douche_verwarming_energy_daily:
    source: sensor.shelly_plug_douche_verwarming_energy_usage
    cycle: daily
  shelly_plug_badkamer_verwarming_energy_daily:
    source: sensor.shelly_plug_badkamer_verwarming_energy_usage
    cycle: daily
  eurom_alutherm_energy_daily:
    source: sensor.eurom_alutherm_energy
    cycle: daily

template:
  - sensor:
    - unique_id: daily_consumption_energy
      name: "Daily Consumption Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ states('sensor.daily_energy_offpeak')|float(0) + states('sensor.daily_energy_peak')|float(0) }}"
    - unique_id: monthly_consumption_energy
      name: "Monthly Consumption Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ states('sensor.monthly_energy_offpeak')|float(0) + states('sensor.monthly_energy_peak')|float(0) }}"
    - unique_id: yearly_consumption_energy
      name: "Yearly Consumption Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ states('sensor.yearly_energy_offpeak')|float(0) + states('sensor.yearly_energy_peak')|float(0) }}"
    # Grid import/export in kW, summed from the three phases. These exist because the aggregate
    # power_consumed/power_produced carry an ESPHome `delta: 1` filter on a kW sensor (slimmelezer-p1.yaml
    # ~78) — a 1000 W deadband that froze them for 40 min at a time. Use these anywhere a single grid
    # entity is needed; the phase sensors are throttled to 5s with no deadband.
    - unique_id: grid_power_in
      name: "Grid power in"
      icon: mdi:transmission-tower-export
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
      availability: >
        {{ ['sensor.power_consumed_phase_1', 'sensor.power_consumed_phase_2',
            'sensor.power_consumed_phase_3'] | select('has_value') | list | count == 3 }}
      state: >
        {{ (['sensor.power_consumed_phase_1', 'sensor.power_consumed_phase_2',
             'sensor.power_consumed_phase_3'] | map('states') | map('float', 0) | sum) | round(3) }}

    - unique_id: grid_power_out
      name: "Grid power out"
      icon: mdi:transmission-tower-import
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
      availability: >
        {{ ['sensor.power_produced_phase_1', 'sensor.power_produced_phase_2',
            'sensor.power_produced_phase_3'] | select('has_value') | list | count == 3 }}
      state: >
        {{ (['sensor.power_produced_phase_1', 'sensor.power_produced_phase_2',
             'sensor.power_produced_phase_3'] | map('states') | map('float', 0) | sum) | round(3) }}

    - unique_id: net_power_consumption
      name: "Net Power Consumption"
      # Top-level key, not an `attributes:` entry - as an attribute it set nothing.
      icon: mdi:home-lightning-bolt-outline
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
      # Home load = grid import - export + solar. Solar is AC, not DC: DC is pre-inverter and would overstate
      # the home load by ~1.5% of production. Grid comes from the deadband-free helpers defined above.
      availability: >
        {{ has_value('sensor.grid_power_in') and has_value('sensor.grid_power_out')
           and has_value('sensor.solaredge_ac_power') }}
      state: >
        {{ (states('sensor.grid_power_in') | float(0) - states('sensor.grid_power_out') | float(0)
            + states('sensor.solaredge_ac_power') | float(0) / 1000) | round(3) }}
    # convert the uptime one to a real value
    - unique_id: ha_uptime
      name: 'HA uptime minutes'
      icon: mdi:arrow-up-circle-outline
      state: >
        {{ (as_timestamp(now()) - as_timestamp(states('sensor.uptime'), 0)) / 60 }}

    - name: "Current Price Electricity"
      unique_id: current_price_electricity
      unit_of_measurement: "EUR/kWh"
      state_class: measurement
      attributes:
        avg_price: >
          {{ state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'average') + (states('input_number.energy_markup') | float(0.1108)) }}
      state: >
        {{ states('sensor.nordpool_kwh_nl_eur_3_10_021') | float(default=0.3) + (states('input_number.energy_markup') | float(0.1108)) }}
    # Tibber charges 2,48 ct/kWh (incl. btw) for the return energy
    - name: "Current Price Electricity Return"
      unique_id: current_price_electricity_return
      unit_of_measurement: "EUR/kWh"
      attributes:
        avg_price: >
          {{ state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'average') + (states('input_number.energy_markup') | float(0.1108)) - (0.0248) }}
      state: >
        {{ states('sensor.nordpool_kwh_nl_eur_3_10_021') | float(default=0.3) + (states('input_number.energy_markup') | float(0.1108)) - (0.0248) }}

    - name: "Electricity Cost Today"
      unique_id: electricity_cost_today
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.accumulated_cost_langeweide') | float - states('sensor.accumulated_reward_langeweide') | float }}

    - name: "Energy Price Level"
      unique_id: energy_price_level
      attributes:
        percentage: >
          {{ states('sensor.current_price_electricity') | float(default=0.3) / state_attr('sensor.current_price_electricity','avg_price') | float(default=0.3) * 100 }}
      state: >
        {% set percentage = states('sensor.current_price_electricity') | float(default=0.3) / state_attr('sensor.current_price_electricity','avg_price') | float(default=0.3) * 100 %}
        {# In case it's less then 20 cents, we still consider it cheap #}
        {% if states('sensor.current_price_electricity') | float(default=0.3) < 0.1 %}
          {{ "very_cheap" }}
        {% elif percentage <= 60 %}
          {{ "very_cheap" }}
        {% elif percentage <= 90 and percentage > 60 %}
          {{ "cheap" }}
        {% elif percentage <= 115 and percentage > 90 %}
          {{ "normal" }}
        {% elif percentage <= 140 and percentage > 115 %}
          {{ "expensive" }}
        {% elif percentage > 140 %}
          {{ "very_expensive" }}
        {% else %}
          {{ "normal" }}
        {% endif %}
    - name: Average price today
      unique_id: average_price_today
      icon: mdi:lightning-bolt
      state: >-
        {{ ((state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') | sum(attribute='value') / state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') | count) + (states('input_number.energy_markup') | float(0.1108))) | round(2, 'floor') }}
    - name: Average price tomorrow
      unique_id: average_price_tomorrow
      icon: mdi:lightning-bolt
      state: >-
        {% set sumTomorrow = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_tomorrow') | sum(attribute='value') | float(default=0) %}
        {% set countTomorrow = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_tomorrow') | count %}
        {% if countTomorrow == 0 %}
          {{ "-" }}
        {% else %}
          {{ ((sumTomorrow / countTomorrow) + (states('input_number.energy_markup') | float(0.1108))) | round(2, 'floor') }}
        {% endif %}
    # Cheapest contiguous dhw_charge_duration block within 00:00-16:00 (covers the evening tap), for days with no
    # solar. Slot count comes from `raw_today | count`, not a fixed 24 — NL moved to 15-min slots in Oct 2025, which
    # broke this; cheapest_16_hours_24h is too coarse for a 2h window. entity_id derives from `name`, not
    # `unique_id`: a Dutch name here produced sensor.dhw_goedkoopste_laadstart — keep English names.
    - name: DHW cheapest charge start
      unique_id: dhw_cheapest_charge_start
      icon: mdi:cash-clock
      availability: >-
        {{ has_value('sensor.nordpool_kwh_nl_eur_3_10_021')
           and (state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today')
                | default([], true) | count) > 0 }}
      state: >-
        {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021',
                                'raw_today') %}
        {% set per_hour = ((raw | count) / 24) | round(0) | int %}
        {% set n = ((states('input_number.dhw_charge_duration') | int(120) / 60)
                    * per_hour) | round(0) | int %}
        {% set last = (16 * per_hour) - n %}
        {% set ns = namespace(best=99999, idx=0) %}
        {% for i in range(0, last + 1) %}
          {% set blk = raw[i:i + n] | map(attribute='value') | sum %}
          {% if blk < ns.best %}
            {% set ns.best = blk %}{% set ns.idx = i %}
          {% endif %}
        {% endfor %}
        {{ (raw[ns.idx].start | as_datetime | as_local).strftime('%H:%M:%S') }}

  - binary_sensor:
    # Is the current price slot among the cheapest 16 of today? Gates the master-bedroom heat (automations.yaml
    # ~1987/2024/2259). Slot count derives from `raw_today | count`, not a fixed 24, so this works whether nordpool
    # publishes 24 hourly or 96 quarter-hourly slots (NL moved to 15-min pricing Oct 2025). Unavailable, not `off`,
    # when nordpool has no data — `off` would silently block heat as "too expensive".
    - name: Cheapest 16 Hours 24h
      unique_id: cheapest_16_hours_24h
      availability: >
        {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') %}
        {{ has_value('sensor.nordpool_kwh_nl_eur_3_10_021')
           and (raw | default([], true) | count) > 0 }}
      state: >
        {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') %}
        {% set slots = ((16 * (raw | count)) / 24) | round(0) | int %}
        {% set threshold = (raw | map(attribute='value') | sort | list)[slots - 1] %}
        {{ states('sensor.nordpool_kwh_nl_eur_3_10_021') | float(999) <= threshold }}
      attributes:
        threshold: >
          {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') %}
          {% set slots = ((16 * (raw | count)) / 24) | round(0) | int %}
          {{ (raw | map(attribute='value') | sort | list)[slots - 1] | round(4) }}

  # Residual load: whole-house power minus every device the Energy Dashboard tracks. The dashboard shows this
  # gap as an unnamed grey bar; as a live sensor it is something you can hunt with — flip a breaker, watch it
  # drop. Measured 2026-09: ~185 W overnight, ~345 W evening.
  - trigger:
      # Polled rather than state-driven: the P1 meter updates ~1 Hz, and a state trigger would write ~86k
      # recorder rows a day for this one sensor. 10s is responsive enough for breaker hunting.
      - platform: time_pattern
        seconds: /10
    variables:
      # Both lists must stay in step with the Energy Dashboard's device_consumption list (.storage/energy),
      # which is edited in the UI and not in this repo — a device added there but not here inflates the residual.
      measured:
        - sensor.office_power
        - sensor.shelly_plug_kachel_slaapkamer_power
        - sensor.shelly_plug_s_6_meterkast1_power
        - sensor.shelly_plug_s_7_meterkast2_power
        - sensor.shelly_plug_s_8_fridge1_power
        - sensor.shelly_plug_koelkast_power
        - sensor.shelly_plug_droger_power
        - sensor.easee_sonke_power
        - sensor.shelly_plug_douche_verwarming_power
        - sensor.shelly_plug_badkamer_verwarming_power
        - sensor.pool_shelly_3em_phase_a_power
        - sensor.pool_shelly_3em_phase_b_power
        - sensor.pool_shelly_3em_phase_c_power
        - sensor.shelly_warmtepomp_meter_total_active_power
        - sensor.winecooler_switch_power
        - sensor.shellyplugsg3_e4b063e46a84_power
        - sensor.wasmachine_switch_power
        - sensor.infrarood_noa_switch_power
        - sensor.infrarood_eva_power
      # Powercalc models, not measurements. Kept separate so their ~115 W overnight share of the subtraction
      # stays visible: model error lands in the residual and would otherwise read as a phantom mystery load.
      estimated:
        - sensor.all_light_power
        - sensor.all_housekeeping_entities_power
        - sensor.all_media_player_power
      # Home load comes from sensor.net_power_consumption (kW, defined earlier in this file): it already sums
      # the grid phases and adds AC solar. One definition rather than two that drift apart, and its own
      # availability guard covers the phase and solar dropouts on this sensor's behalf. x1000 for kW -> W.
      house_w: "{{ states('sensor.net_power_consumption') | float(0) * 1000 }}"
      measured_w: "{{ measured | map('states') | map('float', 0) | sum }}"
      estimated_w: "{{ estimated | map('states') | map('float', 0) | sum }}"
    sensor:
      - name: Unmeasured power
        unique_id: unmeasured_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        # Unavailable rather than wrong: without grid or solar the house total is meaningless. Device sensors
        # fall back to 0 instead, and `unavailable_inputs` counts them so a dropout shows up instead of hiding.
        availability: "{{ has_value('sensor.net_power_consumption') }}"
        # Deliberately not clamped at zero: a negative residual means over-subtraction — powercalc running hot,
        # or a device counted twice — which is worth seeing rather than hiding behind a max(0).
        state: >
          {{ ((house_w | float(0)) - (measured_w | float(0)) - (estimated_w | float(0))) | round(1) }}
        attributes:
          house_w: "{{ house_w | float(0) | round(1) }}"
          measured_w: "{{ measured_w | float(0) | round(1) }}"
          estimated_w: "{{ estimated_w | float(0) | round(1) }}"
          unavailable_inputs: >
            {{ (measured + estimated) | select('is_state', 'unavailable') | list | count }}
