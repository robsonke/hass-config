utility_meter:
  daily_energy_offpeak:
    source: sensor.energy_consumed_tariff_1
    cycle: daily
  daily_energy_peak:
    source: sensor.energy_consumed_tariff_2
    cycle: daily
  monthly_energy_offpeak:
    source: sensor.energy_consumed_tariff_1
    cycle: monthly
  monthly_energy_peak:
    source: sensor.energy_consumed_tariff_2
    cycle: monthly
  yearly_energy_offpeak:
    source: sensor.energy_consumed_tariff_1
    cycle: yearly
  yearly_energy_peak:
    source: sensor.energy_consumed_tariff_2
    cycle: yearly

  shelly_plug_douche_verwarming_energy_daily:
    source: sensor.shelly_plug_douche_verwarming_energy_usage
    cycle: daily
  shelly_plug_badkamer_verwarming_energy_daily:
    source: sensor.shelly_plug_badkamer_verwarming_energy_usage
    cycle: daily
  eurom_alutherm_energy_daily:
    source: sensor.eurom_alutherm_energy
    cycle: daily

template:
  - sensor:
    - unique_id: daily_consumption_energy
      name: "Daily Consumption Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ states('sensor.daily_energy_offpeak')|float(0) + states('sensor.daily_energy_peak')|float(0) }}"
    - unique_id: monthly_consumption_energy
      name: "Monthly Consumption Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ states('sensor.monthly_energy_offpeak')|float(0) + states('sensor.monthly_energy_peak')|float(0) }}"
    - unique_id: yearly_consumption_energy
      name: "Yearly Consumption Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ states('sensor.yearly_energy_offpeak')|float(0) + states('sensor.yearly_energy_peak')|float(0) }}"
    - unique_id: net_power_consumption
      name: "Net Power Consumption"
      # Top-level key, not an `attributes:` entry - as an attribute it set nothing.
      icon: mdi:home-lightning-bolt-outline
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.solaredge_dc_power')|float(default=0) / 1000 - states('sensor.power_produced')|float(default=0) + states('sensor.power_consumed')|float(default=0) }}"
    # convert the uptime one to a real value
    - unique_id: ha_uptime
      name: 'HA uptime minutes'
      icon: mdi:arrow-up-circle-outline
      state: >
        {{ (as_timestamp(now()) - as_timestamp(states('sensor.uptime'), 0)) / 60 }}

    - name: "Current Price Electricity"
      unique_id: current_price_electricity
      unit_of_measurement: "EUR/kWh"
      state_class: measurement
      attributes:
        avg_price: >
          {{ state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'average') + (states('input_number.energy_markup') | float(0.1108)) }}
      state: >
        {{ states('sensor.nordpool_kwh_nl_eur_3_10_021') | float(default=0.3) + (states('input_number.energy_markup') | float(0.1108)) }}
    # Tibber charges 2,48 ct/kWh (incl. btw) for the return energy
    - name: "Current Price Electricity Return"
      unique_id: current_price_electricity_return
      unit_of_measurement: "EUR/kWh"
      attributes:
        avg_price: >
          {{ state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'average') + (states('input_number.energy_markup') | float(0.1108)) - (0.0248) }}
      state: >
        {{ states('sensor.nordpool_kwh_nl_eur_3_10_021') | float(default=0.3) + (states('input_number.energy_markup') | float(0.1108)) - (0.0248) }}

    - name: "Electricity Cost Today"
      unique_id: electricity_cost_today
      unit_of_measurement: "EUR"
      state: >
        {{ states('sensor.accumulated_cost_langeweide') | float - states('sensor.accumulated_reward_langeweide') | float }}

    - name: "Energy Price Level"
      unique_id: energy_price_level
      attributes:
        percentage: >
          {{ states('sensor.current_price_electricity') | float(default=0.3) / state_attr('sensor.current_price_electricity','avg_price') | float(default=0.3) * 100 }}
      state: >
        {% set percentage = states('sensor.current_price_electricity') | float(default=0.3) / state_attr('sensor.current_price_electricity','avg_price') | float(default=0.3) * 100 %}
        {# In case it's less then 20 cents, we still consider it cheap #}
        {% if states('sensor.current_price_electricity') | float(default=0.3) < 0.1 %}
          {{ "very_cheap" }}
        {% elif percentage <= 60 %}
          {{ "very_cheap" }}
        {% elif percentage <= 90 and percentage > 60 %}
          {{ "cheap" }}
        {% elif percentage <= 115 and percentage > 90 %}
          {{ "normal" }}
        {% elif percentage <= 140 and percentage > 115 %}
          {{ "expensive" }}
        {% elif percentage > 140 %}
          {{ "very_expensive" }}
        {% else %}
          {{ "normal" }}
        {% endif %}
    - name: Average price today
      unique_id: average_price_today
      icon: mdi:lightning-bolt
      state: >-
        {{ ((state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') | sum(attribute='value') / state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') | count) + (states('input_number.energy_markup') | float(0.1108))) | round(2, 'floor') }}
    - name: Average price tomorrow
      unique_id: average_price_tomorrow
      icon: mdi:lightning-bolt
      state: >-
        {% set sumTomorrow = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_tomorrow') | sum(attribute='value') | float(default=0) %}
        {% set countTomorrow = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_tomorrow') | count %}
        {% if countTomorrow == 0 %}
          {{ "-" }}
        {% else %}
          {{ ((sumTomorrow / countTomorrow) + (states('input_number.energy_markup') | float(0.1108))) | round(2, 'floor') }}
        {% endif %}
    # Starttijd van het goedkoopste aaneengesloten blok van dhw_charge_duration
    # binnen 00:00-16:00, voor "DHW - Plan het opwarmvenster" op dagen zonder zon.
    #
    # De bovengrens 16:00 garandeert dat de avondtapping gedekt is; een blok mag
    # daar precies op eindigen, niet overheen lopen. Een blok 's nachts is
    # prima: bij een stilstandsverlies van 0,22 K/u kost opwarmen om 03:00 in
    # plaats van 13:00 maar ~2 K extra.
    #
    # Het aantal slots per uur komt uit `raw_today | count` en staat niet op 24
    # vast - NL ging in oktober 2025 over op kwartierprijzen, en precies die
    # aanname brak de vorige versie van cheapest_16_hours_24h hieronder.
    #
    # binary_sensor.cheapest_16_hours_24h is hier niet bruikbaar: 16 van de 24
    # uur is veel te grof om een venster van twee uur mee te kiezen.
    # De entity_id komt van `name`, NIET van `unique_id` - een Nederlandse naam
    # gaf hier sensor.dhw_goedkoopste_laadstart. De rest van dit bestand
    # gebruikt Engelse sensornamen, dus die lijn hier ook aanhouden.
    - name: DHW cheapest charge start
      unique_id: dhw_cheapest_charge_start
      icon: mdi:cash-clock
      availability: >-
        {{ has_value('sensor.nordpool_kwh_nl_eur_3_10_021')
           and (state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today')
                | default([], true) | count) > 0 }}
      state: >-
        {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021',
                                'raw_today') %}
        {% set per_hour = ((raw | count) / 24) | round(0) | int %}
        {% set n = ((states('input_number.dhw_charge_duration') | int(120) / 60)
                    * per_hour) | round(0) | int %}
        {% set last = (16 * per_hour) - n %}
        {% set ns = namespace(best=99999, idx=0) %}
        {% for i in range(0, last + 1) %}
          {% set blk = raw[i:i + n] | map(attribute='value') | sum %}
          {% if blk < ns.best %}
            {% set ns.best = blk %}{% set ns.idx = i %}
          {% endif %}
        {% endfor %}
        {{ (raw[ns.idx].start | as_datetime | as_local).strftime('%H:%M:%S') }}

  - binary_sensor:
    # Is the current price slot among the cheapest 16 hours of today?
    #
    # Gates the master-bedroom heat (automations.yaml ~1987 / 2024 / 2259).
    #
    # The nordpool sensor's STATE already *is* the current slot's price, so there
    # is no need to locate "now" inside raw_today - only to work out what the
    # 16th-cheapest hour costs and compare against it. Deriving the slot count
    # from `raw_today | count` keeps this correct whether nordpool publishes 24
    # hourly or 96 quarter-hourly entries (NL moved to 15-minute slots in
    # Oct 2025), which is what broke the previous version.
    #
    # That version called `dict.from_keys` - not a method, so the template raised
    # every render (`fromkeys` is the real one, and it would have keyed on
    # (hour, price) tuples and then sorted by None). It also looped
    # `range(0, 23)`, dropping an index, and read raw_today[0..22] as if the
    # indices were hours - which under 15-minute slots covers 00:00-05:45. It
    # could not produce a usable state.
    #
    # Unavailable rather than `off` when nordpool has no data: `off` reads as
    # "too expensive" to the heating automations and would silently block heat.
    #
    # The 8-hour and 12-hour variants were removed - nothing in the config
    # referenced either of them.
    #
    # `threshold` is exposed so this can be sanity-checked from the states panel
    # without writing a template in Developer Tools.
    - name: Cheapest 16 Hours 24h
      unique_id: cheapest_16_hours_24h
      availability: >
        {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') %}
        {{ has_value('sensor.nordpool_kwh_nl_eur_3_10_021')
           and (raw | default([], true) | count) > 0 }}
      state: >
        {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') %}
        {% set slots = ((16 * (raw | count)) / 24) | round(0) | int %}
        {% set threshold = (raw | map(attribute='value') | sort | list)[slots - 1] %}
        {{ states('sensor.nordpool_kwh_nl_eur_3_10_021') | float(999) <= threshold }}
      attributes:
        threshold: >
          {% set raw = state_attr('sensor.nordpool_kwh_nl_eur_3_10_021', 'raw_today') %}
          {% set slots = ((16 * (raw | count)) / 24) | round(0) | int %}
          {{ (raw | map(attribute='value') | sort | list)[slots - 1] | round(4) }}
