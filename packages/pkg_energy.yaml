# Author: Rob Sonke
# https://github.com/robsonke/hass-config

# All-in markup on top of the Nordpool spot price (tax + ODE + VAT + supplier fee); replaces
# `0.1108` previously hardcoded in 8 templates here and in pkg_energy_stats.yaml.
# Every consumer reads it as `| float(0.1108)` as a fallback. No `initial:` — that would override
# state restore, so a fresh helper starts at its minimum; set it to 0.1108 once after creation.
input_number:
  energy_markup:
    name: Energie opslag (all-in)
    icon: mdi:cash-plus
    min: 0
    max: 0.5
    step: 0.0001
    mode: box
    unit_of_measurement: "EUR/kWh"

sensor:
  # Disabled: legacy "Meter readings" group sensor (type: last) over old DSMR entity names.
  # Most of its member entities (power_consumption*, gas_consumption*, power_tariff,
  # *_power_failure_count) no longer exist anywhere in this config.
  # Do not blindly re-enable — rebuild the entity list against current sensors first.

  - platform: integration
    source: sensor.shelly_plug_office_power
    name: Shelly Plug Office Energy Usage
    unique_id: shelly_plug_office_energy_usage
    method: left
    unit_prefix: k
    round: 2
  - platform: integration
    source: sensor.shelly_plug_droger_power
    name: Shelly Plug Droger Energy Usage
    unique_id: shelly_plug_droger_energy_usage
    method: left
    unit_prefix: k
    round: 2
  - platform: integration
    source: sensor.shelly_plug_douche_verwarming_power
    name: Shelly Plug Douche Verwarming Energy Usage
    unique_id: shelly_plug_douche_verwarming_energy_usage
    method: left
    unit_prefix: k
    round: 2
  - platform: integration
