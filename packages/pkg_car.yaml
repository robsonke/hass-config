# Car (BMW iX3) helpers.
# cardata exposes ix3_service_next_inspection_date as a raw string ("01.06.2027 00:00:00 UTC"),
# parsed via strptime and re-emitted as dd-mm-yyyy since a device_class: date sensor would render raw ISO.
template:
  - sensor:
      - name: "iX3 Next inspection date"
        unique_id: ix3_next_inspection_date_short
        icon: mdi:calendar-wrench
        state: >
          {% set d = strptime(states('sensor.ix3_service_next_inspection_date'),
                              '%d.%m.%Y %H:%M:%S %Z', none) %}
          {{ d.strftime('%d-%m-%Y') if d else 'onbekend' }}

  - binary_sensor:
      # Recreates binary_sensor.ix3_windows — never existed, so "Car - Alert when car windows open too long" could never
      # fire; cardata exposes one sensor per window + sunroof. Tests `not in` (not `== 'OPEN'`) since BMW also reports
      # tilted/partially-open as open; sunroof included deliberately. `availability` guards against a cardata dropout
      # reading every source as not-CLOSED and firing the rain alert on every API hiccup.
      - name: iX3 Windows
        unique_id: ix3_windows
        device_class: opening
        icon: mdi:car-door
        availability: >
          {{ has_value('sensor.ix3_front_driver_side_window_status')
             and has_value('sensor.ix3_front_passenger_side_window_status')
             and has_value('sensor.ix3_rear_driver_side_window_status')
             and has_value('sensor.ix3_rear_passenger_side_window_status')
             and has_value('sensor.ix3_sunroof_status') }}
        state: >
          {{ states('sensor.ix3_front_driver_side_window_status') != 'CLOSED'
             or states('sensor.ix3_front_passenger_side_window_status') != 'CLOSED'
             or states('sensor.ix3_rear_driver_side_window_status') != 'CLOSED'
             or states('sensor.ix3_rear_passenger_side_window_status') != 'CLOSED'
             or states('sensor.ix3_sunroof_status') != 'CLOSED' }}
        attributes:
          open_parts: >
            {% set parts = {
                 'voor links': 'sensor.ix3_front_driver_side_window_status',
                 'voor rechts': 'sensor.ix3_front_passenger_side_window_status',
                 'achter links': 'sensor.ix3_rear_driver_side_window_status',
                 'achter rechts': 'sensor.ix3_rear_passenger_side_window_status',
                 'dak': 'sensor.ix3_sunroof_status' } %}
            {% set ns = namespace(open=[]) %}
            {% for label, eid in parts.items() %}
              {% if states(eid) != 'CLOSED' %}
                {% set ns.open = ns.open + [label] %}
              {% endif %}
            {% endfor %}
            {{ ns.open | join(', ') }}
